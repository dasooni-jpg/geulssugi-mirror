function applyOffline(){
  const dt = Math.min(offlineCapH()*3600e3, Math.max(0, now() - (S.lastSave||now())));
  if(dt < 120e3) return;
  const kps = 1.6;
  const s = S.stage, w = 5;
  const rw = {
    blood: eBlood(s,w)*ST.bloodMul*kps*(dt/1000)*0.42,
    gold:  eGold(s,w)*ST.goldMul*kps*(dt/1000)*0.42 + goldPerTick()*(dt/5000)*0.5,
    exp:   eExp(s,w)*ST.expMul*kps*(dt/1000)*0.30,
  };
  S.blood += rw.blood; S.gold += rw.gold;
  gainExp(rw.exp);
  offlineModal(dt, rw);
}
function boot(hot){
  let loaded = false;
  if(hot && hot.save){ loaded = loadSave(hot.save); }
  if(!loaded){ try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) loaded = loadSave(raw); }catch(e){} }
  S.sessions = (S.sessions||0) + 1;
  recalc();
  if(window.__relicMigrated) setTimeout(()=>toast('유물 개편 — 공용 조각은 「유물 가루」가 됨. 유물 탭에서 원하는 유물 조각으로 바꿀 수 있음','gold'), 1600);
  resize(); initEmbers(); resetRun(); drawFace();
  if(loaded) applyOffline(); else toast('핏빛 성역에 오신 것을 환영함','gold');
  P.hp = ST.maxHp;
  syncHud();
  setTimeout(()=>toast('조작: 방향키·WASD 또는 화면을 끌면 바로 내가 움직임 — 오른쪽 버튼으로 자동/수동 전환', 'gold'), 1600);
  requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(frame); });
}
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(()=>({save: JSON.stringify(S)}));
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data||{});
  } else boot({});
}catch(e){ boot({}); }

<script>
"use strict";
/* ============================ 절전모드 ============================
   - 조작이 없으면 게임 루프를 멈추고 화면을 어둡게 함 (배터리·발열 절약)
   - 멈춘 동안의 시간은 게임의 방치 보상(applyOffline)으로 그대로 환산됨
   - 화면을 누르면 루프를 재개하고 그 사이 보상을 지급함
   =============================================================== */
(function(){
  const veil = $('#sleepVeil'), inner = $('#sleepInner');
  const elTime = $('#sleepTime'), elDate = $('#sleepDate'), elElapsed = $('#sleepElapsed');
  const DAYS = ['일','월','화','수','목','금','토'];
  const MINS = [3,5,10,20,30];
  let idleTimer = null, clockTimer = null, driftTimer = null;
  let startMs = 0, baseSave = 0, lastArm = 0;

  function paint(){
    const d = new Date(), h = d.getHours(), m = d.getMinutes();
    elTime.textContent = (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + (m < 10 ? '0' + m : m);
    elDate.textContent = d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
    const el = Date.now() - startMs;
    elElapsed.textContent = el < 120000
      ? '2분이 지나면 사냥 결과가 쌓임'
      : hms(Math.min(el, offlineCapH()*3600e3)) + ' 분량 사냥 중 · 최대 '+offlineCapH()+'시간';
  }
  /* 같은 자리에 오래 머무르지 않도록 천천히 이동함(화면 번짐 방지) */
  function drift(){
    inner.style.left = (30 + Math.random()*40) + '%';
    inner.style.top  = (30 + Math.random()*40) + '%';
  }

  function enter(){
    if(window.__sleepOn) return;
    closeSheet(); closeModal();
    saveNow();                       /* 방치 보상의 기준 시각을 기록함 */
    baseSave = S.lastSave;
    startMs = Date.now();
    window.__sleepOn = true;         /* 다음 프레임에서 게임 루프가 멈춤 */
    paint(); drift();
    veil.classList.add('on');
    clockTimer = setInterval(paint, 10000);
    driftTimer = setInterval(drift, 60000);
    clearTimeout(idleTimer); idleTimer = null;
  }

  function exit(){
    if(!window.__sleepOn) return;
    window.__sleepOn = false;
    veil.classList.remove('on');
    clearInterval(clockTimer); clockTimer = null;
    clearInterval(driftTimer); driftTimer = null;
    S.lastSave = baseSave;           /* 절전 중 자동 저장이 끼어들어도 기준 시각을 지킴 */
    lastT = performance.now();       /* 멈춘 시간이 한 프레임에 몰리지 않게 함 */
    requestAnimationFrame(frame);    /* 게임 루프 재개 */
    applyOffline();                  /* 자리를 비운 사이 보상 (2분 이상일 때 지급) */
    arm();
  }

  function arm(){
    clearTimeout(idleTimer);
    if(window.__sleepOn) return;
    const mins = MINS.indexOf(S.opt.sleepMin) >= 0 ? S.opt.sleepMin : 10;
    idleTimer = setTimeout(function(){
      if(S.opt.sleep) enter(); else arm();
    }, mins * 60000);
  }

  /* 조작 감지 — 끌기 중에도 부담이 없도록 2초에 한 번만 갱신함 */
  const ACT = ['pointerdown','pointermove','keydown','wheel','touchstart'];
  for(const t of ACT){
    addEventListener(t, function(){
      if(window.__sleepOn) return;
      const n = Date.now();
      if(n - lastArm < 2000) return;
      lastArm = n; arm();
    }, {passive:true, capture:true});
  }

  /* 절전 화면에서의 첫 입력은 복귀에만 쓰고 게임에 전달하지 않음 */
  function swallow(ev){
    if(!window.__sleepOn) return;
    ev.preventDefault(); ev.stopPropagation();
    exit();
  }
  veil.addEventListener('pointerdown', swallow, true);
  veil.addEventListener('touchstart', swallow, {capture:true, passive:false});
  addEventListener('keydown', function(ev){ if(window.__sleepOn){ ev.preventDefault(); ev.stopPropagation(); exit(); } }, true);

  window.__sleepEnter = enter;
  window.__sleepExit = exit;
  arm();
})();
</script>
</body>
</html>
