function damageEnemy(e, dmg, crit){
  dmg = capNum(dmg, STAT_CAP, 0);
  if(!(e.hp <= FOE_CAP)) e.hp = FOE_CAP;        /* 망가진 체력(∞·NaN) 복구 */
  e.hp -= dmg; e.flash = .12; S.stats.dmg += dmg;
  if(!(e.hp > 0)) e.hp = 0;                     /* NaN 이면 처치로 처리 */
  addText(e.x, e.y-e.r-6, '-'+fmt(dmg), crit?'#ffd34d':'#ffffff', crit?17:13, crit?1.0:.8);
  if(ST.vamp > 0) P.hp = Math.min(ST.maxHp, P.hp + dmg*ST.vamp);
  burst(e.x, e.y, '#d4213f', crit?7:3);
  if(e.hp <= 0) killEnemy(e);
}
/* 처치 시 폭발 — 연쇄가 무한히 이어지지 않도록 한 겹만 터뜨림 */
let boomDepth = 0;
function killBoom(src){
  if(!(ST.boom > 0) || boomDepth > 0) return;
  boomDepth++;
  const R = 140, dmg = ST.atk * ST.boom/100 * (BUFF.t > 0 ? 1.8 : 1);
  fx.push({t:'ring', x:src.x, y:src.y, life:0, max:.34, r0:6, r1:R, c:'#ff9a3c'});
  burst(src.x, src.y, '#ff9a3c', 8, 1.1);
  for(const o of enemies){
    if(o.dead || o === src) continue;
    if(Math.hypot(o.x-src.x, o.y-src.y) > R) continue;
    damageEnemy(o, dmg, false);
  }
  boomDepth--;
}
function killEnemy(e){
  e.dead = true;
  burst(e.x, e.y, e.m.body, e.boss?26:9, e.boss?1.8:1);
  burst(e.x, e.y, '#d4213f', e.boss?18:5, e.boss?1.6:1);
  fx.push({t:'ring', x:e.x, y:e.y, life:0, max:e.boss?.6:.32, r0:e.r, r1:e.boss?150:44, c:'#ff7a8c'});
  const exp = e.exp*ST.expMul, gold = e.gold*ST.goldMul, blood = e.blood*ST.bloodMul;
  const n = e.boss ? 10 : 1;
  for(let i=0;i<n;i++){ addOrb(e.x,e.y,'exp',exp/n); addOrb(e.x,e.y,'gold',gold/n); addOrb(e.x,e.y,'blood',blood/n); }
  S.stats.kills++;
  killBoom(e);
  if(ST.killHeal > 0 && P.deadT <= 0){
    const h = ST.maxHp * ST.killHeal/100 * (e.boss ? 6 : 1);
    P.hp = Math.min(ST.maxHp, P.hp + h);
  }
  sfx(e.boss?'boss':'kill');
  if(e.boss){
    S.stats.bosses++; G.boss = null;
    const [bmin, bmax] = RELIC_CFG.bossPieces;
    const d = dropRelicPieces(rint(bmin, bmax));
    addText(e.x, e.y - e.r*2.4, d.r.n + ' 조각 +' + d.amt, RAR[relicRank(d.r)].c, 14, 1.4);
    if(G.mode === 'tower') towerClear();
    else {
      S.stage++; S.wave = 1; S.waveKills = 0; G.bossQueued = false;
      if(S.stage > S.maxStage) S.maxStage = S.stage;
      toast('스테이지 '+S.stage+' — '+stageName(S.stage)+' 진입', 'good');
      G.newStage = true;
    }
  } else if(G.mode === 'field'){
    S.waveKills++;
    if(S.waveKills >= KILLS_PER_WAVE){
      S.waveKills = 0;
      if(Math.random() < RELIC_CFG.wavePieceChance){
        const d = dropRelicPieces(1);
        addText(e.x, e.y - e.r*2.2, d.r.n + ' 조각 +1', RAR[relicRank(d.r)].c, 12, 1.2);
      }
      if(S.wave >= WAVES_PER_STAGE){ G.bossQueued = true; openGate(); }
      else { S.wave++; toast(S.wave+'웨이브', 'good'); }
    }
  }
  markDirty();
}
function playerAttack(){
  const cand = [];
  for(const e of enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x-P.x, e.y-P.y);
    if(d > ST.range) continue;
    if(!hasLOS(P.x, P.y-10, e.x, e.y-e.r*.3)) continue;
    cand.push({e,d});
  }
  if(!cand.length) return false;
  cand.sort((a,b)=>a.d-b.d);
  const rage = BUFF.t > 0 ? 1.8 : 1;
  /* 관통 — 뒤에 선 적까지 꿰뚫음 (소수점은 확률로 처리) */
  let pierce = Math.floor(ST.pierce || 0);
  if(Math.random() < (ST.pierce||0) - pierce) pierce++;
  const n = Math.min(ST.proj + pierce, cand.length);
  for(let i=0;i<n;i++){
    const e = cand[i].e;
    const crit = Math.random()*100 < ST.crit;
    let dmg = ST.atk * rage * (crit ? ST.cdmg/100 : 1);
    if(e.boss) dmg *= ST.bossDmg;
    dmg *= rnd(.94,1.06);
    fx.push({t:'beam', x1:P.x, y1:P.y-12, x2:e.x, y2:e.y-e.r*.3, life:0, max:.16, crit});
    fx.push({t:'hit', x:e.x, y:e.y-e.r*.3, life:0, max:.24, crit});
    damageEnemy(e, dmg, crit);
    const a = Math.atan2(e.y-P.y, e.x-P.x);
    const kb = e.boss ? .14 : 1;
    e.kx += Math.cos(a)*(crit?60:28)*kb; e.ky += Math.sin(a)*(crit?60:28)*kb;
  }
  sfx(Math.random()<.3 ? 'crit' : 'hit');
  return true;
}
function hurtPlayer(dmg){
  if(P.deadT > 0) return;
  if(Math.random()*100 < ST.dodge){ addText(P.x, P.y-34, 'MISS', '#9adcff', 12, .7); return; }
  if(ST.dr > 0) dmg *= 1 - ST.dr/100;
  dmg = capNum(dmg, ST.maxHp, 0);               /* 한 번에 최대 체력 이상은 깎이지 않음 */
  if(!(P.hp <= ST.maxHp)) P.hp = ST.maxHp;      /* 망가진 체력(∞·NaN) 복구 */
  P.hp -= dmg; P.hurtT = .22;
  addText(P.x+rnd(-8,8), P.y-34, '-'+fmt(dmg), '#ff7a8c', 12, .7);
  if(P.hp <= 0){
    P.hp = 0; P.deadT = 2.4 * (1 - ST.revive/100);
    burst(P.x, P.y, '#d4213f', 22, 1.4);
    addText(P.x, P.y-40, '쓰러짐', '#ff5470', 16, 1.3);
    if(G.mode === 'field') S.waveKills = Math.max(0, S.waveKills-3);
  }
}
function spawnMinion(b){
  /* 보스 소환은 상한이 없으면 긴 싸움에서 끝없이 쌓여 화면이 마비됨 */
  const alive = enemies.reduce((n,e)=>n+(e.dead?0:1), 0);
  if(alive >= (G.mode === 'tower' ? 14 : maxEnemies() + 6)) return;
  const a = Math.random()*6.28, d = rnd(70, 160);
  let x = b.x + Math.cos(a)*d, y = b.y + Math.sin(a)*d;
  if(b.home){ x = clamp(x, b.home.x0, b.home.x1); y = clamp(y, b.home.y0, b.home.y1); }
  const e = spawnEnemy(false, {x, y});
  if(e){
    e.hp *= .45; e.maxHp *= .45;
    fx.push({t:'ring', x, y, life:0, max:.45, r0:4, r1:56, c:'#c56bf0'});
  }
}
/* 보스 패턴: 돌진 · 충격파 · 소환 + 체력 구간별 격노 */
function bossBrain(e, dt){
  const p = e.pat;
  if(!p) return false;
  const hpf = e.hp / e.maxHp;
  const want = hpf <= .33 ? 2 : hpf <= .66 ? 1 : 0;
  if(want > e.rage){
    e.rage = want; e.spd *= 1.2; p.cd = Math.min(p.cd, 1.1);
    G.shake = Math.max(G.shake, .45);
    fx.push({t:'ring', x:e.x, y:e.y, life:0, max:.65, r0:e.r, r1:220, c:'#ff5470'});
    addText(e.x, e.y - e.r*1.9, '격노!', '#ff8a9a', 19, 1.3);
    sfx('boss');
  }
  if(p.st === 'idle'){
    p.cd -= dt;
    if(p.cd <= 0){
      p.kind = pick(e.rage >= 1 ? ['charge','shock','summon','charge'] : ['charge','shock','summon']);
      p.st = 'tele'; p.hit = false;
      p.tmax = p.kind === 'charge' ? .85 : p.kind === 'shock' ? .75 : .6;
      p.t = p.tmax;
    }
    return false;
  }
  if(p.st === 'tele'){
    p.t -= dt;
    if(p.t <= 0){
      p.st = 'act';
      if(p.kind === 'charge'){
        const a = Math.atan2(P.y-e.y, P.x-e.x);
        p.dx = Math.cos(a); p.dy = Math.sin(a); p.t = .55; sfx('crit');
      } else if(p.kind === 'shock'){
        p.t = .4;
        fx.push({t:'ring', x:e.x, y:e.y, life:0, max:.45, r0:e.r*.6, r1:320, c:'#ff9a3c'});
        if(Math.hypot(P.x-e.x, P.y-e.y) < 310) hurtPlayer(e.dmg*1.7);
        G.shake = Math.max(G.shake, .4); sfx('boss');
      } else {
        p.t = .3;
        for(let i=0; i<3+e.rage; i++) spawnMinion(e);
        sfx('gate');
      }
    }
    return true;
  }
  p.t -= dt;
  if(p.kind === 'charge'){
    slide(e, p.dx*780*dt, p.dy*780*dt, e.r*.72);
    burst(e.x, e.y, '#ff5470', 2, .5);
    if(!p.hit && Math.hypot(P.x-e.x, P.y-e.y) < e.r + P.r + 12){
      p.hit = true; hurtPlayer(e.dmg*2.2); G.shake = Math.max(G.shake, .35);
    }
  }
  if(p.t <= 0){
    p.st = 'idle';
    p.cd = (e.rage >= 2 ? 3.3 : e.rage >= 1 ? 4.3 : 5.6) + rnd(-.4, .7);
  }
  return true;
}
function gainExp(v){
  S.exp = capNum(S.exp + v, FOE_CAP, 0);
  let need = expNeed(S.lv), up = 0;
  while(S.exp >= need && up < 200){ S.exp -= need; S.lv++; up++; need = expNeed(S.lv); }
  if(up){ recalc(); P.hp = ST.maxHp; showLevelBanner(); sfx('lvup'); markDirty(); }
}

/* ---------- 첨탑 ---------- */
function towerEnter(){
  G.mode = 'tower'; G.towerT = 75; resetRun(); recalc(); P.hp = ST.maxHp;
  spawnEnemy(true);
  toast('피의 첨탑 '+S.tower.floor+'층 — 75초 제한', 'gold');
}
function towerExit(){ G.mode = 'field'; resetRun(); recalc(); P.hp = ST.maxHp; initEmbers(); }
function towerClear(){
  const f = S.tower.floor;
  const rw = {gem: 3 + Math.floor(f/2), shard: 4 + f*2, gold: eGold(S.maxStage,8)*300*ST.goldMul};
  S.gem += rw.gem; S.shard += rw.shard; S.gold += rw.gold;
  const tp = dropRelicPieces(RELIC_CFG.towerPieces);
  G.towerT = 999;
  S.tower.floor++; if(S.tower.floor-1 > S.tower.best) S.tower.best = S.tower.floor-1;
  toast(f+'층 돌파! 젬 +'+rw.gem+' · 유물 가루 +'+rw.shard+' · '+tp.r.n+' 조각 +'+tp.amt, 'gold');
  markDirty(); saveNow();
  setTimeout(()=>{ if(G.mode==='tower'){ G.towerT = 75; resetRun(); P.hp = ST.maxHp; spawnEnemy(true); } }, 900);
}
function towerFail(){
  toast('시간 초과 — '+S.tower.floor+'층 재도전', 'bad');
  G.towerT = 75; resetRun(); P.hp = ST.maxHp; spawnEnemy(true);
}
</script>

<script>
"use strict";
/* ============================ 업데이트 ============================ */
function nearestEnemy(){
  let best = null, bd = 1e18;
  for(const e of enemies){
    if(e.dead) continue;
    const d = (e.x-P.x)**2 + (e.y-P.y)**2;
    if(d < bd){ bd = d; best = e; }
  }
  return best ? {e:best, d:Math.sqrt(bd)} : null;
}
function pickGoal(){
  /* 보스가 이미 나타났는지 / 문이 열려 보스를 기다리는 중인지 */
  const bossNow  = (G.boss && !G.boss.dead) ? G.boss : null;
  const bossWait = G.mode === 'field' && G.bossQueued && MAP.gateOpen && MAP.bossRoom && !bossNow;
  /* 1순위 — 체력이 위태로우면 피의 제단 */
  if(P.hp < ST.maxHp*0.45){
    let best = null, bd = 1e18;
    for(const a of MAP.altars){
      if(a.type !== 'blood' || a.charge < .2) continue;
      const d = Math.hypot(a.x-P.x, a.y-P.y);
      if(d < bd){ bd = d; best = a; }
    }
    if(best) return {kind:'altar', cx:best.cx, cy:best.cy, obj:best};
  }
  /* 2순위 — 보스가 나타났으면 무조건 보스부터.
     (제단·잡몹만 계속 좇느라 보스에게 가지 않아 스테이지가 영영 안 넘어가던 문제) */
  if(bossNow) return {kind:'enemy', cx:Math.floor(bossNow.x/CELL), cy:Math.floor(bossNow.y/CELL),
                      obj:bossNow, d:Math.hypot(bossNow.x-P.x, bossNow.y-P.y)};
  /* 3순위 — 충전된 영혼 제단이 가깝고 버프가 없으면 (보스를 기다리는 중이면 건너뜀) */
  if(BUFF.t <= 0 && !bossWait){
    for(const a of MAP.altars){
      if(a.type !== 'soul' || a.charge < 1) continue;
      if(Math.hypot(a.x-P.x, a.y-P.y) < 900) return {kind:'altar', cx:a.cx, cy:a.cy, obj:a};
    }
  }
  /* 4순위 — 미개봉 상자 (보스를 기다리는 중이면 바로 옆의 것만) */
  const box = nearestChest();
  const ne0 = nearestEnemy();
  if(box){
    const bd = Math.hypot(box.x-P.x, box.y-P.y);
    if(bossWait ? bd < 420 : (bd < 1500 || !ne0))
      return {kind:'chest', cx:box.cx, cy:box.cy, obj:box};
  }
  /* 5순위 — 문이 열렸으면 보스 방으로. 잡몹보다 먼저 가야 보스가 나타남 */
  if(bossWait) return {kind:'boss', cx:MAP.bossRoom.cx, cy:MAP.bossRoom.cy};
  /* 6순위 — 적 */
  const ne = ne0;
  if(ne) return {kind:'enemy', cx:Math.floor(ne.e.x/CELL), cy:Math.floor(ne.e.y/CELL), obj:ne.e, d:ne.d};
  /* 7순위 — 문이 열렸으면 보스 방 */
  if(MAP.gateOpen && MAP.bossRoom && G.mode === 'field')
    return {kind:'boss', cx:MAP.bossRoom.cx, cy:MAP.bossRoom.cy};
  /* 8순위 — 방 순회 */
  if(!G.wander || G.wanderT <= 0){
    G.wander = pick(MAP.rooms); G.wanderT = 8;
  }
  return {kind:'wander', cx:G.wander.cx, cy:G.wander.cy};
}
function update(dt){
  T += dt;
  S.stats.playtime += dt;
  clampNums();
  if(!(P.hp >= 0) || P.hp > ST.maxHp) P.hp = ST.maxHp;   /* ∞·NaN 으로 굳은 체력 되돌림 */
  if(BUFF.t > 0) BUFF.t -= dt;

  /* 흐름장 갱신 */
  fieldPT -= dt; fieldGT -= dt;
  if(fieldPT <= 0 || !fieldP){
    const pc = cellOf(P.x, P.y);
    fieldP = walkable(pc.cx, pc.cy) ? bfsField([gi(pc.cx, pc.cy)]) : fieldP;
    fieldPT = .22;
  }

  /* 스폰 */
  if(G.mode === 'field'){
    if(G.bossQueued && !G.boss && MAP.gateOpen){
      const bc = roomCenter(MAP.bossRoom);
      if(Math.hypot(P.x-bc.x, P.y-bc.y) < 620) spawnEnemy(true);
    }
    G.spawnT -= dt;
    const alive = enemies.reduce((n,e)=>n+(e.dead?0:1), 0);
    if(G.spawnT <= 0 && alive < maxEnemies() && !(G.bossQueued && G.boss)){
      const n = alive < 7 ? 4 : 2;
      for(let i=0;i<n;i++) spawnEnemy(false);
      G.spawnT = G.bossQueued ? 1.5 : .45;
    }
  } else {
    G.towerT -= dt;
    if(G.towerT <= 0) towerFail();
  }

  /* 제단 */
  for(const a of MAP.altars){
    a.pulse += dt;
    if(a.charge < 1) a.charge = Math.min(1, a.charge + dt/a.recharge);
    const d = Math.hypot(P.x-a.x, P.y-a.y);
    a.near = d < a.r;
    if(!a.near || P.deadT > 0) continue;
    if(a.type === 'blood'){
      if(P.hp < ST.maxHp && a.charge > 0){
        const heal = Math.min(ST.maxHp - P.hp, ST.maxHp*0.30*dt);
        P.hp += heal; a.charge = Math.max(0, a.charge - dt/7);
        if(Math.random() < dt*7) addText(P.x+rnd(-14,14), P.y-36, '+'+fmt(heal*7), '#7dffb0', 12, .7);
        if(Math.random() < dt*3) sfx('altar');
      }
    } else if(a.charge >= 1){
      a.charge = 0; BUFF.t = 25 * (1 + (ST.buffDur||0)/100); sfx('altar');
      fx.push({t:'ring', x:a.x, y:a.y, life:0, max:.7, r0:10, r1:180, c:'#c56bf0'});
      addText(P.x, P.y-42, '광폭화!', '#e0a8ff', 17, 1.2);
      toast('영혼 제단 — ' + Math.round(BUFF.t) + '초간 공격력 ×1.8, 공격 속도 +30%', 'gold');
    }
  }

  /* 상자 */
  for(const c of MAP.chests){
    if(c.opened) continue;
    c.pulse += dt;
    if(P.deadT <= 0 && Math.hypot(P.x-c.x, P.y-c.y) < c.r*.55) openChest(c);
  }

  /* 플레이어 */
  if(P.deadT > 0){
    P.deadT -= dt;
    if(P.deadT <= 0){
      P.hp = ST.maxHp;
      const s = roomCenter(MAP.start); P.x = s.x; P.y = s.y;
      addText(P.x, P.y-30, '부활', '#7dffb0', 16, 1.2);
    }
  } else {
    P.hp = Math.min(ST.maxHp, P.hp + ST.maxHp*ST.regen*dt);
    let tx = 0, ty = 0, has = false, mag = 1;
    if(P.manual > 0) P.manual -= dt;
    const inp = inputDir();
    if(inp){
      /* 사람 조작이 최우선. 손을 뗀 뒤 2.5초 동안은 자동이 끼어들지 않음 */
      P.manual = 2.5; P.mx = inp.x; P.my = inp.y;
      tx = inp.x; ty = inp.y; mag = inp.m; has = true;
    } else if(S.opt.autoMove && P.manual <= 0){
      G.wanderT -= dt;
      const goal = pickGoal();
      const key = gi(goal.cx, goal.cy);
      if(goal.kind === 'enemy' && goal.d <= ST.range*0.8 && hasLOS(P.x, P.y-10, goal.obj.x, goal.obj.y)){
        const a = Math.atan2(goal.obj.y-P.y, goal.obj.x-P.x);
        if(goal.d < ST.range*0.42){ tx = -Math.cos(a); ty = -Math.sin(a); }
        else { tx = Math.cos(a+Math.PI/2)*.7; ty = Math.sin(a+Math.PI/2)*.7; }
        has = true;
      } else {
        if((key !== goalKey && fieldGT <= 0) || !fieldG){
          goalKey = key; fieldGT = .12;
          fieldG = walkable(goal.cx, goal.cy) ? bfsField([key]) : null;
        }
        const dir = fieldG ? flowDir(fieldG, P.x, P.y) : null;
        if(dir){ tx = dir.x; ty = dir.y; has = true; }
        else {
          const c = centerOf(goal.cx, goal.cy);
          const a = Math.atan2(c.y-P.y, c.x-P.x);
          tx = Math.cos(a); ty = Math.sin(a); has = true;
        }
        if(goal.kind === 'altar' && Math.hypot(goal.obj.x-P.x, goal.obj.y-P.y) < goal.obj.r*.45) has = false;
        if(goal.kind === 'chest' && goal.obj.opened) fieldG = null;
      }
    }
    const sp = ST.move * (BUFF.t > 0 ? 1.12 : 1) * mag;
    P.vx = lerp(P.vx, has ? tx*sp : 0, Math.min(1, dt*9));
    P.vy = lerp(P.vy, has ? ty*sp : 0, Math.min(1, dt*9));
    slide(P, P.vx*dt, P.vy*dt, P.r);
    if(Math.abs(P.vx) > 6) P.face = P.vx > 0 ? 1 : -1;

    P.atkT -= dt;
    const aspd = ST.aspd * (BUFF.t > 0 ? 1.3 : 1);
    if(P.atkT <= 0){ P.atkT = playerAttack() ? 1/aspd : .1; }
  }
  P.wingT += dt;
  if(P.hurtT > 0) P.hurtT -= dt;

  /* 카메라 */
  cam.x = lerp(cam.x, P.x, Math.min(1, dt*5));
  cam.y = lerp(cam.y, P.y - 40, Math.min(1, dt*5));

  /* 적 */
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.flash > 0) e.flash -= dt;
    if(e.dead){ e.dieT += dt; if(e.dieT > .3) enemies.splice(i,1); continue; }
    e.bob += dt*6;
    const dx = P.x-e.x, dy = P.y-e.y, d = Math.hypot(dx,dy)||1;
    const touch = e.r + P.r + 4;
    const busy = e.boss ? bossBrain(e, dt) : false;
    if(!busy && d > touch){
      let mx = 0, my = 0;
      if(d < 300 && hasLOS(e.x, e.y, P.x, P.y)){ mx = dx/d; my = dy/d; }
      else {
        const dir = fieldP ? flowDir(fieldP, e.x, e.y) : null;
        if(dir){ mx = dir.x; my = dir.y; } else { mx = dx/d; my = dy/d; }
      }
      const wob = Math.sin(T*2 + e.wob*9)*.18;
      const esp = e.spd * (1 - ST.slow/100);
      slide(e, (mx - my*wob)*esp*dt, (my + mx*wob)*esp*dt, e.r*.72);
    }
    if(e.kx || e.ky){
      slide(e, e.kx*dt, e.ky*dt, e.r*.72);
      e.kx *= Math.pow(.0008, dt); e.ky *= Math.pow(.0008, dt);
      if(Math.abs(e.kx) < 1) e.kx = 0;
      if(Math.abs(e.ky) < 1) e.ky = 0;
    }
    if(e.home){
      e.x = clamp(e.x, e.home.x0, e.home.x1);
      e.y = clamp(e.y, e.home.y0, e.home.y1);
    }
    e.atkT -= dt;
    if(!busy && d <= touch+6 && e.atkT <= 0 && P.deadT <= 0){
      e.atkT = 1.0; hurtPlayer(e.dmg);
    }
    /* 길을 잃었거나 너무 멀면 재배치 */
    if(!e.boss && (d > 2200 || (fieldP && fieldP[gi(clamp(Math.floor(e.x/CELL),0,MAP.w-1), clamp(Math.floor(e.y/CELL),0,MAP.h-1))] < 0))){
      const spot = findSpawnSpot();
      if(spot){ e.x = spot.x; e.y = spot.y; e.kx = e.ky = 0; }
    }
  }

  if(G.newStage){ G.newStage = false; resetRun(); initEmbers(); return; }

  /* 오브 */
  const pr = ST.pick;
  for(let i=orbs.length-1;i>=0;i--){
    const o = orbs[i]; o.t += dt;
    const dx = P.x-o.x, dy = P.y-o.y, d = Math.hypot(dx,dy)||1;
    if(o.t < .35 && !o.got){ o.x += o.vx*dt; o.y += o.vy*dt; o.vy += 260*dt; }
    if(d < pr || o.got){
      o.got = true;
      const sp = 260 + (1-clamp(d/pr,0,1))*760;
      o.x += (dx/d)*sp*dt; o.y += (dy/d)*sp*dt;
      if(d < 22){
        orbs.splice(i,1);
        if(o.kind === 'exp'){ gainExp(o.val); addText(P.x+rnd(-16,16), P.y-18, fmt(o.val)+' EXP', 'rgba(220,230,255,.75)', 11, .7); }
        else if(o.kind === 'gold'){ S.gold += o.val; if(Math.random()<.25) sfx('coin'); }
        else S.blood += o.val;
        markDirty();
      }
    }
    if(o.t > 26) orbs.splice(i,1);
  }

  /* FX · 텍스트 · 불티 */
  for(let i=fx.length-1;i>=0;i--){
    const f = fx[i]; f.life += dt;
    if(f.t === 'p'){ f.x += f.vx*dt; f.y += f.vy*dt; f.vy += 320*dt; f.vx *= Math.pow(.05,dt); }
    if(f.life >= f.max) fx.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){
    const t2 = texts[i]; t2.life += dt;
    t2.x += t2.vx*dt; t2.y += t2.vy*dt; t2.vy += 52*dt;
    if(t2.life >= t2.max) texts.splice(i,1);
  }
  for(const em of embers){
    em.y -= em.v*dt; em.x += Math.sin(T*0.8+em.p)*6*dt;
    if(em.y < -8){ em.y = H+8; em.x = Math.random()*W; }
  }

  /* 화면 흔들림 */
  if(G.shake > 0){
    G.shake = Math.max(0, G.shake - dt*1.7);
    const a = G.shake*15;
    SH.x = rnd(-a, a); SH.y = rnd(-a, a);
  } else { SH.x = 0; SH.y = 0; }

  /* 금화 자동 수급 */
  G.gtT += dt;
  if(G.gtT >= 5){ G.gtT -= 5; S.gold += goldPerTick(); markDirty(); }

  checkQuest();
}
</script>

<script>
"use strict";
/* ============================ 렌더 — 지형 ============================ */
function rr(g,x,y,w,h,r){
  g.beginPath();
  const rad = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  g.moveTo(x+rad,y); g.arcTo(x+w,y,x+w,y+h,rad); g.arcTo(x+w,y+h,x,y+h,rad);
  g.arcTo(x,y+h,x,y,rad); g.arcTo(x,y,x+w,y,rad); g.closePath();
}
function shadowEll(g,x,y,rx,ry,a){
  g.fillStyle = 'rgba(0,0,0,'+(a||.34)+')';
  g.beginPath(); g.ellipse(x,y,rx,ry,0,0,6.2832); g.fill();
}
/* 방/복도 구획 색인 */
function buildTint(){
  const t = new Uint8Array(MAP.w*MAP.h);
  if(MAP.roomMask){ for(let k=0;k<t.length;k++) t[k] = MAP.roomMask[k]; }
  else MAP.rooms.forEach((r, i) => {
    for(let j=r.y;j<r.y+r.h;j++) for(let i2=r.x;i2<r.x+r.w;i2++)
      if(inMap(i2,j)) t[gi(i2,j)] = 1;
  });
  MAP.tint = t;
}

/* Cached, world-anchored terrain: generated once per biome, never per frame. */
const terrainCache = new Map();
function terrainMaterial(th){
  if(terrainCache.has(th.n)) return terrainCache.get(th.n);
  let seed = 71237 + STAGES.indexOf(th)*9137;
  const rand = () => { seed = (Math.imul(seed,1664525)+1013904223)|0; return (seed>>>0)/4294967296; };
  const natural = !/성채|왕좌|수도원|시계탑|신전|심장/.test(th.n);
  const wet = /늪|수몰/.test(th.n), cold = /북부|수정|유리/.test(th.n);
  const earth = wet?'#343e31':cold?'#39414b':/협곡|용암/.test(th.n)?'#584035':natural?'#494536':th.flr;
  function surface(wall){
    const c=document.createElement('canvas'); c.width=c.height=768;
    const g=c.getContext('2d'); g.fillStyle=wall?th.wallTop:earth; g.fillRect(0,0,768,768);
    // Wrap soft deposits across the texture boundaries to avoid tile seams.
    for(let i=0;i<180;i++){
      const x=rand()*768,y=rand()*768,r=24+rand()*104;
      const color=i%3===0?'104,114,65':i%3===1?'166,143,104':'9,13,15';
      for(let dx=-768;dx<=768;dx+=768) for(let dy=-768;dy<=768;dy+=768){
        if(x+dx+r<0||x+dx-r>768||y+dy+r<0||y+dy-r>768) continue;
        const a=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
        a.addColorStop(0,'rgba('+color+','+(wall?.12:.16)+')');a.addColorStop(1,'rgba('+color+',0)');
        g.fillStyle=a;g.fillRect(x+dx-r,y+dy-r,r*2,r*2);
      }
    }
    for(let i=0;i<26000;i++){
      const x=rand()*768,y=rand()*768,v=rand();
      g.fillStyle=v<.5?'rgba(0,0,0,.10)':'rgba(229,211,171,.09)';
      g.fillRect(x,y,.5+rand()*1.5,.5+rand()*1.1);
    }
    if(!wall&&!natural){
      // Uneven, worn flagstones only in architectural biomes.
      for(let row=0;row<12;row++)for(let col=-1;col<13;col++){
        const x=col*64+(row%2)*32,y=row*64;
        g.beginPath();g.moveTo(x+3,y+4);g.lineTo(x+59,y+2);g.lineTo(x+62,y+57);g.lineTo(x+5,y+61);g.closePath();
        g.fillStyle='rgba(160,167,180,'+(.015+rand()*.06)+')';g.fill();
        g.strokeStyle='rgba(5,8,12,.30)';g.lineWidth=2;g.stroke();
        g.beginPath();g.moveTo(x+6,y+5);g.lineTo(x+57,y+3);g.strokeStyle='rgba(218,211,192,.10)';g.lineWidth=1;g.stroke();
      }
    }
    for(let i=0;i<(wall?420:850);i++){
      const x=rand()*768,y=rand()*768,r=wall?3+rand()*16: .7+rand()*3;
      g.beginPath();g.ellipse(x+1,y+2,r*1.3,r*.65,0,0,Math.PI*2);g.fillStyle='rgba(0,0,0,.22)';g.fill();
      g.beginPath();g.moveTo(x-r,y);g.lineTo(x-r*.5,y-r*.55);g.lineTo(x+r*.6,y-r*.4);g.lineTo(x+r,y+r*.3);g.lineTo(x,y+r*.65);g.closePath();
      g.fillStyle=wall?'rgba(107,108,105,.13)':'rgba(176,165,137,'+(.12+rand()*.2)+')';g.fill();
      g.strokeStyle='rgba(212,206,178,.10)';g.lineWidth=.7;g.stroke();
    }
    if(!wall&&natural&&!/협곡/.test(th.n))for(let i=0;i<1100;i++){
      const x=rand()*768,y=rand()*768;
      if(Math.sin(x*.018)+Math.cos(y*.023)<.35)continue;
      g.strokeStyle=cold?'rgba(155,175,190,.22)':'rgba(113,129,67,.35)';g.lineWidth=.8;
      g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-2,y-3,x-3+rand()*6,y-3-rand()*5);g.stroke();
    }
    return cx.createPattern(c,'repeat');
  }
  const mat={floor:surface(false),wall:surface(true),natural};terrainCache.set(th.n,mat);return mat;
}
function terrainPatch(pattern,x,y,w,h,ox,oy){
  cx.save();cx.translate(ox,oy);cx.fillStyle=pattern;cx.fillRect(x-ox,y-oy,w,h);cx.restore();
}
function drawGround(){
  const th = themeOf(G.mode === 'tower' ? 8 : S.stage);
  if(!MAP.tint) buildTint();
  const material = terrainMaterial(th);
  cx.fillStyle = '#07040a'; cx.fillRect(0,0,W,H);
  const ox = -cam.x + W/2 + SH.x, oy = -cam.y + H/2 + SH.y;
  const c0 = Math.max(0, Math.floor((cam.x - W/2)/CELL) - 1);
  const c1 = Math.min(MAP.w-1, Math.ceil((cam.x + W/2)/CELL) + 1);
  const r0 = Math.max(0, Math.floor((cam.y - H/2)/CELL) - 1);
  const r1 = Math.min(MAP.h-1, Math.ceil((cam.y + H/2)/CELL) + 2);
  /* 지도 바깥도 암반으로 이어 그림 */
  const u0 = Math.floor((cam.x - W/2)/CELL) - 1, u1 = Math.ceil((cam.x + W/2)/CELL) + 1;
  const v0 = Math.floor((cam.y - H/2)/CELL) - 1, v1 = Math.ceil((cam.y + H/2)/CELL) + 2;
  const isWall = (a,b) => !inMap(a,b) || MAP.g[gi(a,b)] === WALL;
  const B = MAP.bossRoom;

  /* 1) 바닥 */
  for(let cy=r0; cy<=r1; cy++) for(let cxx=c0; cxx<=c1; cxx++){
    const v = MAP.g[gi(cxx,cy)];
    if(v === WALL) continue;
    const x = Math.round(cxx*CELL + ox), y = Math.round(cy*CELL + oy);
    const room = MAP.tint[gi(cxx,cy)];
    const inBoss = B && cxx>=B.x && cxx<B.x+B.w && cy>=B.y && cy<B.y+B.h;
    terrainPatch(material.floor,x,y,CELL+1,CELL+1,ox,oy);
    if(inBoss){cx.fillStyle='rgba(90,24,49,.13)';cx.fillRect(x,y,CELL+1,CELL+1);}
    // Contact shadows anchor the floor to its surrounding rock.
    for(let side=0;side<4;side++){
      if(!isWall(cxx+[0,1,0,-1][side],cy+[-1,0,1,0][side])) continue;
      const x1=side===1?x+CELL:x,y1=side===2?y+CELL:y;
      const x2=x1+(side===1?-26:side===3?26:0),y2=y1+(side===0?26:side===2?-26:0);
      const shade=cx.createLinearGradient(x1,y1,x2,y2);shade.addColorStop(0,'rgba(4,8,6,.58)');shade.addColorStop(1,'rgba(4,8,6,0)');
      cx.fillStyle=shade;cx.fillRect(side===1?x+CELL-26:x,side===2?y+CELL-26:y,side%2?26:CELL,side%2?CELL:26);
    }
  }
  /* 2) 벽 그림자 (바닥 위) */
  for(let cy=v0; cy<=v1; cy++) for(let cxx=u0; cxx<=u1; cxx++){
    if(!isWall(cxx,cy) || isWall(cxx,cy+1)) continue;
    const x = Math.round(cxx*CELL + ox), y = Math.round((cy+1)*CELL + oy);
    const g = cx.createLinearGradient(0, y, 0, y+18);
    g.addColorStop(0,'rgba(0,0,0,.42)'); g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle = g; cx.fillRect(x, y, CELL+1, 18);
  }
  /* 3) 벽 블록 */
  for(let cy=v0; cy<=v1; cy++) for(let cxx=u0; cxx<=u1; cxx++){
    if(!isWall(cxx,cy)) continue;
    const x = Math.round(cxx*CELL + ox), y = Math.round(cy*CELL + oy);
    terrainPatch(material.wall,x,y,CELL+1,CELL+1,ox,oy);
    /* Fractured strata replace the uniform brick grid. */
    const hash=((cxx*73856093)^(cy*19349663))>>>0;
    cx.beginPath();cx.moveTo(x+8,y+23+hash%20);cx.lineTo(x+34,y+39);cx.lineTo(x+58,y+29);cx.lineTo(x+86,y+55);
    cx.strokeStyle='rgba(0,0,0,.24)';cx.lineWidth=1.4;cx.stroke();
    /* 바닥과 맞닿는 면 — 두께감 */
    if(!isWall(cxx,cy+1)){
      const face=cx.createLinearGradient(0,y+CELL-21,0,y+CELL);
      face.addColorStop(0,'#45443d');face.addColorStop(.2,th.wallTop);face.addColorStop(1,th.wall);
      cx.fillStyle=face;cx.fillRect(x,y+CELL-21,CELL+1,22);
      for(let k=0;k<7;k++){cx.fillStyle='rgba(7,9,8,.35)';cx.fillRect(x+k*15+(hash%5),y+CELL-18,2,12+(k%3)*3);}
      cx.fillStyle = 'rgba(255,255,255,.09)'; cx.fillRect(x, y+CELL-18, CELL+1, 2);
    }
    /* 상단 모서리 하이라이트 */
    if(!isWall(cxx,cy-1)){
      cx.fillStyle = 'rgba(255,255,255,.10)'; cx.fillRect(x, y, CELL+1, 4);
    }
    if(!isWall(cxx-1,cy)){
      cx.fillStyle = 'rgba(0,0,0,.22)'; cx.fillRect(x, y, 4, CELL+1);
    }
  }
  /* 4) 보스 문 */
  for(const c of MAP.gateCells){
    const cxx = c % MAP.w, cy = (c - cxx)/MAP.w;
    if(cxx<c0-1 || cxx>c1+1 || cy<r0-1 || cy>r1+1) continue;
    const x = Math.round(cxx*CELL + ox), y = Math.round(cy*CELL + oy);
    if(MAP.gateOpen){
      cx.fillStyle = 'rgba(247,179,60,.16)'; cx.fillRect(x, y, CELL+1, CELL+1);
      cx.fillStyle = '#f7b33c';
      cx.fillRect(x, y, 5, CELL+1); cx.fillRect(x+CELL-4, y, 5, CELL+1);
    } else {
      cx.fillStyle = '#2a0c16'; cx.fillRect(x, y, CELL+1, CELL+1);
      cx.fillStyle = '#8a2044';
      for(let i=0;i<4;i++) cx.fillRect(x+8+i*18, y, 9, CELL+1);
      cx.fillStyle = '#c93055'; cx.fillRect(x, y+CELL/2-5, CELL+1, 10);
      cx.globalAlpha = .35 + Math.sin(T*3)*.18;
      cx.fillStyle = '#ff5470'; cx.fillRect(x, y, CELL+1, CELL+1);
      cx.globalAlpha = 1;
    }
  }
}
/* ---------- 제단 ---------- */
function drawAltars(){
  for(const a of MAP.altars){
    if(Math.abs(a.x-cam.x) > W*0.8 + 220 || Math.abs(a.y-cam.y) > H*0.8 + 220) continue;
    const isB = a.type === 'blood';
    const hue = isB ? '#d4213f' : '#9b6cf0';
    const glow = isB ? '#ff5470' : '#c56bf0';
    /* 상호작용 원 */
    cx.setLineDash([12,10]); cx.lineWidth = 3;
    cx.strokeStyle = a.near ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.38)';
    cx.beginPath(); cx.arc(a.x, a.y, a.r, 0, 6.2832); cx.stroke();
    cx.setLineDash([]);
    /* 받침 */
    shadowEll(cx, a.x, a.y+16, 52, 20, .4);
    for(let i=3;i>=1;i--){
      cx.fillStyle = i===3 ? '#3a2c34' : i===2 ? '#4a3944' : '#5a4654';
      cx.beginPath(); cx.ellipse(a.x, a.y+8-i*3, 16+i*12, 7+i*5, 0, 0, 6.2832); cx.fill();
    }
    /* 웅덩이 */
    const pul = .5 + Math.sin(a.pulse*2)*.5;
    cx.fillStyle = hue;
    cx.beginPath(); cx.ellipse(a.x, a.y-2, 24, 11, 0, 0, 6.2832); cx.fill();
    cx.globalAlpha = .35 + pul*.35 * (a.charge>0?1:.25);
    cx.fillStyle = glow;
    cx.beginPath(); cx.ellipse(a.x, a.y-2, 30+pul*5, 14+pul*3, 0, 0, 6.2832); cx.fill();
    cx.globalAlpha = 1;
    /* 기둥 */
    cx.fillStyle = '#2a1f28';
    rr(cx, a.x-9, a.y-52, 18, 44, 5); cx.fill();
    cx.fillStyle = a.charge >= 1 ? glow : '#4a3a46';
    cx.beginPath(); cx.arc(a.x, a.y-56, 9, 0, 6.2832); cx.fill();
    if(a.charge >= 1){
      cx.globalAlpha = .3 + pul*.4;
      cx.beginPath(); cx.arc(a.x, a.y-56, 15+pul*4, 0, 6.2832); cx.fill();
      cx.globalAlpha = 1;
    }
    /* 이름 · 충전 게이지 */
    cx.textAlign = 'center';
    cx.font = '700 12px Noto Sans KR, sans-serif';
    cx.lineWidth = 3.2; cx.strokeStyle = 'rgba(0,0,0,.75)';
    cx.strokeText(a.name, a.x, a.y+42); cx.fillStyle = '#ffe2e8'; cx.fillText(a.name, a.x, a.y+42);
    const bw = 62, bx = a.x-bw/2, by = a.y+48;
    cx.fillStyle = 'rgba(8,4,8,.8)'; rr(cx, bx-1.5, by-1.5, bw+3, 9, 4.5); cx.fill();
    cx.fillStyle = a.charge >= 1 ? glow : '#7a5a68';
    rr(cx, bx, by, bw*a.charge, 6, 3); cx.fill();
  }
}
/* ---------- 보물 상자 ---------- */
function drawChests(){
  for(const c of MAP.chests){
    if(Math.abs(c.x-cam.x) > W*0.8 + 220 || Math.abs(c.y-cam.y) > H*0.8 + 220) continue;
    const sec = c.secret;
    const trim = sec ? '#c56bf0' : '#f7b33c';
    const wood = sec ? '#3a2058' : '#7a4a1e';
    const dark = sec ? '#22113a' : '#4a2c10';
    shadowEll(cx, c.x, c.y + 12, 23, 8, .4);
    if(c.opened){
      cx.save(); cx.translate(c.x, c.y); cx.globalAlpha = .5;
      cx.fillStyle = dark; rr(cx, -18, -8, 36, 18, 4); cx.fill();
      cx.fillStyle = wood;
      cx.beginPath(); cx.moveTo(-18,-8); cx.quadraticCurveTo(-27,-27,-7,-25);
      cx.lineTo(1,-11); cx.closePath(); cx.fill();
      cx.globalAlpha = 1; cx.restore();
      continue;
    }
    const bob = Math.sin(c.pulse*2.2)*2;
    cx.setLineDash([9,8]); cx.lineWidth = 2.5;
    cx.strokeStyle = sec ? 'rgba(197,107,240,.55)' : 'rgba(247,179,60,.5)';
    cx.beginPath(); cx.arc(c.x, c.y, c.r, 0, 6.2832); cx.stroke(); cx.setLineDash([]);
    cx.save(); cx.translate(c.x, c.y + bob);
    cx.globalAlpha = .22 + Math.sin(c.pulse*3)*.16;
    cx.fillStyle = trim;
    cx.beginPath(); cx.ellipse(0, -16, 22, 13, 0, 0, 6.2832); cx.fill();
    cx.globalAlpha = 1;
    cx.fillStyle = wood; rr(cx, -18, -10, 36, 20, 4); cx.fill();
    cx.fillStyle = dark; rr(cx, -18, 2, 36, 8, 3); cx.fill();
    cx.fillStyle = wood;
    cx.beginPath(); cx.moveTo(-19, -10); cx.quadraticCurveTo(0, -31, 19, -10); cx.closePath(); cx.fill();
    cx.strokeStyle = trim; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(-19, -10); cx.quadraticCurveTo(0, -31, 19, -10); cx.stroke();
    cx.fillStyle = trim;
    rr(cx, -20, -12, 40, 4, 2); cx.fill();
    rr(cx, -4.5, -15, 9, 13, 2); cx.fill();
    cx.fillStyle = dark; cx.beginPath(); cx.arc(0, -7.5, 2.2, 0, 6.2832); cx.fill();
    cx.restore();
    cx.textAlign = 'center'; cx.font = '700 11px Noto Sans KR, sans-serif';
    cx.lineWidth = 3.2; cx.strokeStyle = 'rgba(0,0,0,.78)';
    const nm = sec ? '비밀 상자' : '보물 상자';
    cx.strokeText(nm, c.x, c.y + 30);
    cx.fillStyle = sec ? '#e0b8ff' : '#ffd98a';
    cx.fillText(nm, c.x, c.y + 30);
  }
}
/* ---------- 보스 패턴 예고 ---------- */
function drawBossTele(){
  const e = G.boss;
  if(!e || e.dead || !e.pat || e.pat.st !== 'tele') return;
  const p = e.pat, k = 1 - p.t/p.tmax, a = .22 + k*.6;
  if(p.kind === 'charge'){
    const an = Math.atan2(P.y-e.y, P.x-e.x);
    const x2 = e.x + Math.cos(an)*660, y2 = e.y + Math.sin(an)*660;
    const g = cx.createLinearGradient(e.x, e.y, x2, y2);
    g.addColorStop(0, 'rgba(255,60,90,'+a+')');
    g.addColorStop(1, 'rgba(255,60,90,0)');
    cx.strokeStyle = g; cx.lineWidth = 10 + k*18; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(e.x, e.y); cx.lineTo(x2, y2); cx.stroke();
  } else if(p.kind === 'shock'){
    cx.strokeStyle = 'rgba(255,154,60,'+a+')'; cx.lineWidth = 4;
    cx.setLineDash([11,9]);
    cx.beginPath(); cx.arc(e.x, e.y, 310*k, 0, 6.2832); cx.stroke();
    cx.setLineDash([]);
  } else {
    cx.strokeStyle = 'rgba(197,107,240,'+a+')'; cx.lineWidth = 3;
    for(let i=0;i<4;i++){
      const an = i*1.5708 + T*1.6;
      cx.beginPath(); cx.arc(e.x+Math.cos(an)*95, e.y+Math.sin(an)*95, 13+k*11, 0, 6.2832); cx.stroke();
    }
  }
}
/* ---------- 오브 ---------- */
function drawOrb(o){

function drawEnemyHp(e){
  if(e.dead || e.boss) return;
  const f = e.hp/e.maxHp; if(f >= .999) return;

/* ---------- 미니맵 ---------- */
let miniCv = null, miniCx = null;
function drawMini(){

  for(let cy=0;cy<MAP.h;cy++) for(let cxx=0;cxx<n;cxx++){
    const v = MAP.g[gi(cxx,cy)];

    const inBoss = B && cxx>=B.x && cxx<B.x+B.w && cy>=B.y && cy<B.y+B.h;
    g.fillStyle = v === GATE ? (MAP.gateOpen ? '#f7b33c' : '#c93055')
                : inBoss ? '#6a1030'

  }

  }

  }

    g.fillRect(e.x/CELL*px-1, e.y/CELL*px-1, e.boss?4:2.2, e.boss?4:2.2);
  }

  const pxp = clamp(P.x/CELL*px, rr2, miniCv.width-rr2), pyp = clamp(P.y/CELL*px, rr2, miniCv.height-rr2);
  g.strokeStyle = '#fff'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(pxp, pyp, rr2, 0, 6.2832); g.stroke();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(pxp, pyp, px*.8, 0, 6.2832); g.fill();
}
/* ---------- 루프 ---------- */
let lastT = performance.now(), uiAcc = 0, miniAcc = 0, saveAcc = 0;
function frame(ts){
  if(window.__sleepOn) return;   /* 절전모드 — 게임 루프를 멈춰 배터리를 아낌 */
  const dt = Math.min(.05, (ts-lastT)/1000); lastT = ts;
  update(dt);
  render();
  uiAcc += dt;   if(uiAcc > .1){ uiAcc = 0; syncHud(); }
  miniAcc += dt; if(miniAcc > .25){ miniAcc = 0; drawMini(); }
  saveAcc += dt; if(saveAcc > 8){ saveAcc = 0; saveNow(); }
  requestAnimationFrame(frame);
}

<script>

/* ---------- 첫 안내 — 처음 세 판 동안 한 번에 하나씩 짚어 줌 ---------- */
const TUT = [
  {id:'move',    first:true, sel:null,          when:()=>true,
   t:'적은 저절로 공격함. 화면을 끌면 내가 직접 움직이고, 손을 떼면 다시 알아서 사냥함.'},

   t:'소환권이 있음. 장비에서 소환하면 장비가 저절로 착용됨.'},
  {id:'gift',    first:true, sel:'#btnGift',    when:()=>canAttend() || MAILS.some(m => mailReady(m)),
   t:'보상함에서 매일 출석 보상과 무료 선물을 받을 수 있음.'},

   t:'유물 조각이 생겼음. 유물을 깨우면 크게 강해짐.'},
  {id:'tower',   first:false, sel:'#btnTower',  when:()=>S.maxStage >= 3 && !S.tower.best,
   t:'피의 첨탑에서 유물 가루와 조각을 모을 수 있음.'},
  {id:'math',    first:false, sel:'#btnMath',   when:()=>S.stats.kills >= 40 && !S.math.total,
   t:'수학 시련에서 6학년 수학 문제를 풀면 유물 상자를 받을 수 있음.'},
  {id:'rebirth', first:false, sel:'#btnMap',    when:()=>S.maxStage >= REBIRTH.minStage && !S.rebirth.count,
   t:'환생이 열렸음. 월드 맵에서 핏빛 인장을 얻고 더 강하게 다시 시작할 수 있음.'},
];
let tutCur = null, tutAcc = 0;
function tutDone(id){ S.tut[id] = 1; markDirty(); tutCur = null; const b = $('#tutBox'); if(b) b.remove(); }
function tutTick(){
  if(!S.tut) return;

  let box = $('#tutBox');
  if(busy){ if(box) box.style.display = 'none'; return; }

    if(!tutCur) return;

    box = document.createElement('div'); box.id = 'tutBox';
    box.innerHTML = `<div class="tut-ring"></div><div class="tut-tip"><p></p><button type="button">알겠음</button></div>`;
    $('#frame').appendChild(box);

  }

    ring.style.width = (r.width + 12)+'px'; ring.style.height = (r.height + 12)+'px';
    const below = r.top - fr.top < fr.height/2;

    tip.style.bottom = below ? '' : (fr.bottom - r.top + 14)+'px';

function setDot(sel, on){ const d=$(sel); if(d) d.classList.toggle('hide', !on); }
function syncMoveBtn(){

  const l = $('#mmMode'); if(l) l.textContent = S.opt.autoMove ? '자동' : '수동';
}

/* ============================ 비용 계산 ============================ */
function isMaxed(def, lv){ return def.max != null && lv >= def.max; }
function costFor(def, lv, n){
  const c0 = def.base * Math.pow(def.g, lv);
  if(def.g === 1) return c0*n;
  return c0 * (Math.pow(def.g, n) - 1) / (def.g - 1);
}
function buyCount(def, lv, budget){
  if(buyMulti !== 'MAX'){
    let n = buyMulti;
    if(def.max != null) n = Math.min(n, def.max - lv);
    return Math.max(0, n);
  }
  let lo = 0, hi = 1;
  while(costFor(def, lv, hi) <= budget && hi < 1e6) hi *= 2;
  while(lo < hi){ const mid = Math.ceil((lo+hi)/2); if(costFor(def, lv, mid) <= budget) lo = mid; else hi = mid-1; }
  if(def.max != null) lo = Math.min(lo, def.max - lv);
  return Math.max(0, lo);
}

/* ============================ 퀘스트/미션/보상 ============================ */
function checkQuest(){
  const q = questDef(S.quest);
  if(q.get() >= q.need){
    S.blood += q.rw.blood; S.gem += q.rw.gem; S.quest++;
    toast('임무 완료 — 피 +'+fmt(q.rw.blood)+' · 젬 +'+q.rw.gem, 'gold');
    markDirty();
  }
}
function mailReady(m){ return now() - (S.mail[m.id]||0) >= m.cd; }
function mailLeft(m){ return Math.max(0, m.cd - (now() - (S.mail[m.id]||0))); }
function hms(ms){
  const s = Math.ceil(ms/1000), h = Math.floor(s/3600), mi = Math.floor(s%3600/60), se = s%60;
  return (h?h+'시간 ':'') + (h||mi?mi+'분 ':'') + (h?'':se+'초');
}
function grant(o){
  if(o.gem) S.gem += o.gem;
  if(o.gold) S.gold += o.gold;
  if(o.blood) S.blood += o.blood;
  if(o.ticket) S.ticket += o.ticket;
  if(o.shard) S.shard += o.shard;
  if(o.relicBox){ const res = openRelicBox(o.relicBox, 'free'); if(res) relicBoxModal(res, o.relicBox, 'free'); }
  markDirty();
}
function grantText(o){
  const p = [];
  if(o.gem) p.push('젬 +'+fmt(o.gem));
  if(o.ticket) p.push('소환권 +'+fmt(o.ticket));
  if(o.shard) p.push('유물 가루 +'+fmt(o.shard));
  if(o.relicBox) p.push('유물 상자 '+o.relicBox+'회');
  if(o.blood) p.push('피 +'+fmt(o.blood));
  if(o.gold) p.push('금화 +'+fmt(o.gold));
  return p.join(' · ');
}
/* ============================ 장비 ============================ */
function rollRarity(){
  const lk = clamp((S.maxStage-1)*0.06 + (ST.luck||0)/100, 0, 2.6);
  const w = [46/(1+lk*1.6), 26, 16+lk*5, 8+lk*7, 3+lk*5, 0.9+lk*2.6];
  let tot = w.reduce((a,b)=>a+b,0), r = Math.random()*tot;
  for(let i=0;i<w.length;i++){ r -= w[i]; if(r <= 0) return i; }
  return 0;
}
function makeItem(rarity, slotId){
  const sl = slotId ? SLOTMAP[slotId] : pick(SLOTS);
  const r = rarity != null ? rarity : rollRarity();
  return { id:S.nextItemId++, s:sl.id, r, lv:0, isNew:true, nm: sl.base[Math.min(r, sl.base.length-1)] };
}
function itemScore(it){ const p = itemPower(it); return p.atk*3 + p.hp; }
function itemName(it){ return RAR[it.r].k + ' ' + it.nm; }
function summon(n, payGold){
  const cost = payGold ? summonGoldCost()*n : 0;
  if(payGold){ if(S.gold < cost){ toast('금화가 부족함','bad'); return; } S.gold -= cost; }
  else { if(S.ticket < n){ toast('소환권이 부족함','bad'); return; } S.ticket -= n; }
  let best = null;
  for(let i=0;i<n;i++){
    const it = makeItem();
    S.inv.push(it); S.stats.summons++;
    if(!best || it.r > best.r) best = it;
  }
  if(S.opt.autoEquip) autoEquip();
  sfx('buy');
  toast(n+'회 소환 — 최고 '+RAR[best.r].k+' '+best.nm, best.r>=3?'gold':'good');
  recalc(); markDirty();
}
function summonGoldCost(){ return Math.max(800, eGold(S.maxStage, 5) * 90); }
function autoEquip(){
  for(const sl of SLOTS){
    let best = S.equip[sl.id] || null;
    for(const it of S.inv){ if(it.s !== sl.id) continue; if(!best || itemScore(it) > itemScore(best)) best = it; }
    if(best && best !== S.equip[sl.id]){
      const old = S.equip[sl.id];
      S.inv = S.inv.filter(i=>i.id !== best.id);
      if(old) S.inv.push(old);
      S.equip[sl.id] = best; best.isNew = false;
    }
  }
  recalc();
}
function equipItem(it){
  const old = S.equip[it.s];
  S.inv = S.inv.filter(i=>i.id !== it.id);
  if(old) S.inv.push(old);
  S.equip[it.s] = it; it.isNew = false;
  recalc(); markDirty(); sfx('buy');
}
function itemUpCost(it){ return 260 * RAR[it.r].p * Math.pow(1.17, it.lv); }
function upgradeItem(it, times){
  let n = 0;
  for(let i=0;i<times;i++){
    const c = itemUpCost(it);
    if(!isFinite(c) || S.gold < c) break;   /* 레벨 상한 없음 — 금화가 닿는 데까지 */
    S.gold -= c; it.lv++; n++;
  }
  if(n){ recalc(); markDirty(); if(times > 10) toast('강화 +'+n+' — 현재 +'+it.lv, 'gold'); sfx('buy'); }
  else toast('금화가 부족함','bad');
  return n;
}
function salvage(it){
  const sh = Math.max(1, Math.round(RAR[it.r].p * 1.6));
  S.inv = S.inv.filter(i=>i.id !== it.id);
  S.shard += sh; toast('분해 — 유물 가루 +'+sh, 'good'); markDirty();
}
function mergeAll(){
  let made = 0;
  for(let pass=0; pass<6; pass++){
    let did = false;
    for(const sl of SLOTS){
      for(let r=0; r<RAR.length-1; r++){
        let pool = S.inv.filter(i=>i.s===sl.id && i.r===r && i.lv===0);
        while(pool.length >= 3){
          const use = pool.splice(0,3).map(i=>i.id);
          S.inv = S.inv.filter(i=>!use.includes(i.id));
          S.inv.push(makeItem(r+1, sl.id)); made++; did = true;
        }
      }
    }
    if(!did) break;
  }
  if(made){ if(S.opt.autoEquip) autoEquip(); toast('합성 완료 — 상위 장비 '+made+'개 제작','good'); sfx('buy'); recalc(); markDirty(); }
  else toast('합성할 장비가 부족함 (동일 부위·등급 3개 필요)','bad');
}
/* ============================ 유물 ============================ */
function relicStar(id){ return (S.relics[id]||{}).star || 0; }
function relicPc(id){ return (S.relics[id]||{}).pc || 0; }
function relicSlot(id){ return S.relics[id] || (S.relics[id] = {star:0, pc:0}); }
/* star 성에 오르는 데 드는 그 유물의 조각 수 */
function relicNeed(r, star){ const t = RELIC_CFG.pieces[r.rare] || RELIC_CFG.pieces['희귀']; return t[star] || 0; }
function canBreak(id){
  const r = RELICMAP[id], st = relicStar(id);
  if(st >= 5) return false;
  return relicPc(id) >= relicNeed(r, st+1) && S.gold >= RELIC_GOLD[st+1];
}
/* 유물 등급 → 장비 등급표(RAR)의 색을 그대로 씀 */
const RELIC_RANK = {'일반':0,'고급':1,'희귀':2,'영웅':3,'전설':4,'신화':5};
function relicRank(r){ return RELIC_RANK[r.rare] != null ? RELIC_RANK[r.rare] : 2; }
function hexA(h, a){ const n = parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function rcVars(c){ return `--rc:${c};--rd:${hexA(c,.35)};--rg:${hexA(c,.45)}`; }
function relicVars(r){ return rcVars(RAR[relicRank(r)].c); }
/* 효과 한 줄의 값 — 0성이면 1성 값을 미리 보여 줌 */
function relicVal(e, st){ const s = Math.max(st,1); return e.t==='mul' ? '×'+(1+e.v*s).toFixed(2) : '+'+(e.v*s).toFixed(1)+'%'; }

/* ---------- 조각 얻기 ---------- */
function addRelicPieces(id, n){ relicSlot(id).pc += n; markDirty(); }
/* 등급 뽑기 — 소환 행운이 높을수록 전설·신화 비율이 늘어남 */
function rollRelicRar(){
  const W = RELIC_CFG.box.weight, luck = 1 + (ST.luck||0)/100;
  const w = {}; let tot = 0;
  for(const k in W){ w[k] = W[k] * (k==='전설'||k==='신화' ? luck : 1); tot += w[k]; }
  let x = Math.random()*tot;
  for(const k in w){ x -= w[k]; if(x <= 0) return k; }
  return '희귀';
}
function randomRelicOf(rar){
  const L = RELICS.filter(r => r.rare === rar), list = L.length ? L : RELICS;
  const w = list.map(r => relicStar(r.id) ? 1 : RELIC_CFG.newBias);
  let x = Math.random() * w.reduce((a,b)=>a+b,0);
  for(let i = 0; i < list.length; i++){ x -= w[i]; if(x <= 0) return list[i]; }
  return list[list.length-1];
}
/* 무작위 유물 조각 — 보스·첨탑 전리품 */
function dropRelicPieces(n){ const r = randomRelicOf(rollRelicRar()); addRelicPieces(r.id, n); return {r, amt:n}; }
/* 5성까지 더 필요한 조각 수 · 그보다 많이 가진 '남는 조각' */
function relicRemain(r){ let t = 0; for(let k = relicStar(r.id)+1; k <= 5; k++) t += relicNeed(r, k); return t; }
function relicSurplus(r){ return Math.max(0, relicPc(r.id) - relicRemain(r)); }
function surplusDust(r, n){ return Math.floor(n * (RELIC_CFG.dustPerPiece[r.rare]||12) * RELIC_CFG.dustBack); }
function surplusAll(){ let n = 0, d = 0; for(const r of RELICS){ const k = relicSurplus(r); n += k; d += surplusDust(r, k); } return {n, d}; }
/* 남는 조각만 분해 — 5성까지 필요한 조각은 절대 건드리지 않음 */
function dismantleSurplus(id){
  let n = 0, d = 0;
  for(const r of (id ? [RELICMAP[id]] : RELICS)){
    const k = relicSurplus(r); if(!k) continue;
    relicSlot(r.id).pc -= k; n += k; d += surplusDust(r, k);
  }
  if(!n){ toast('남는 조각이 없음','bad'); return; }
  S.shard += d; sfx('coin'); markDirty();
  toast('남는 조각 '+fmt(n)+'개 분해 — 유물 가루 +'+fmt(d), 'good');
}
/* 유물 가루로 원하는 유물 조각 만들기 */
function craftPieces(id, n){
  const r = RELICMAP[id], per = RELIC_CFG.dustPerPiece[r.rare] || 5, cost = per*n;
  if(n <= 0 || S.shard < cost){ toast('유물 가루가 부족함','bad'); return false; }
  S.shard -= cost; addRelicPieces(id, n); sfx('buy');
  toast(r.n+' 조각 +'+n+' (유물 가루 -'+fmt(cost)+')','good');
  return true;
}
/* 유물 상자 — pay: 'gem' | 'dust' */
function openRelicBox(count, pay){
  const B = RELIC_CFG.box;
  const price = pay === 'gem' ? (count === 10 ? B.gem10 : B.gem1*count) : (count === 10 ? B.dust10 : B.dust1*count);
  if(pay === 'gem'){ if(S.gem < price){ toast('젬이 부족함','bad'); return null; } S.gem -= price; }
  else if(pay === 'dust'){ if(S.shard < price){ toast('유물 가루가 부족함','bad'); return null; } S.shard -= price; }
  /* pay === 'free' — 보상함 무료 상자 */
  const res = [];
  for(let i = 0; i < count; i++){
    S.relicPity = (S.relicPity||0) + 1;
    const rar = S.relicPity >= B.pity ? '신화' : rollRelicRar();
    if(rar === '신화') S.relicPity = 0;
    res.push({rar});
  }
  /* 10회 뽑기 보장 — 기준 등급 이상이 하나도 없으면 마지막 하나를 올려 줌 */
  if(count >= 10 && !res.some(x => RELIC_RANK[x.rar] >= RELIC_RANK[B.tenFloor])){
    res[res.length-1].rar = B.tenFloor;
    if(B.tenFloor === '신화') S.relicPity = 0;
  }
  for(const x of res){
    const [a, b] = B.amount[x.rar] || [1,2];
    x.r = randomRelicOf(x.rar); x.amt = rint(a, b);
    addRelicPieces(x.r.id, x.amt);
  }
  S.stats.relicBox = (S.stats.relicBox||0) + count;
  sfx('buy'); markDirty();
  return res;
}
/* 돌파 — 그 유물의 조각 + 금화 */
function breakRelic(id){
  const r = RELICMAP[id], st = relicStar(id);
  if(st >= 5 || !canBreak(id)) return false;
  const sl = relicSlot(id);
  sl.pc -= relicNeed(r, st+1); S.gold -= RELIC_GOLD[st+1]; sl.star = st+1;
  recalc(); markDirty(); sfx('lvup');
  toast(r.n + (st ? ' '+(st+1)+'성 돌파!' : ' 활성화!'), 'gold');
  if(relicRank(r) >= 5 || st+1 === 5) showBanner(r.n, st ? (st+1)+'성 돌파' : '각성');
  return true;
}
/* 모두 돌파 — 금화가 싼 단계부터 하나씩 올림. 그래서 안 깬 유물이 먼저 깨어나고 고르게 오름 */
function breakAllRelics(){
  let n = 0, woke = 0;
  for(let guard = 0; guard < 300; guard++){
    let best = null;
    for(const r of RELICS){
      if(!canBreak(r.id)) continue;
      const nx = relicStar(r.id) + 1;
      if(!best || RELIC_GOLD[nx] < RELIC_GOLD[best.nx] || (RELIC_GOLD[nx] === RELIC_GOLD[best.nx] && relicRank(r) > relicRank(best.r))) best = {r, nx};
    }
    if(!best) break;
    const sl = relicSlot(best.r.id);
    sl.pc -= relicNeed(best.r, best.nx); S.gold -= RELIC_GOLD[best.nx]; sl.star = best.nx;
    n++; if(best.nx === 1) woke++;
  }
  if(n){ recalc(); markDirty(); sfx('lvup'); toast('유물 '+n+'번 돌파'+(woke?' · 새로 깨운 유물 '+woke+'개':''), 'gold'); }
  else toast('돌파할 수 있는 유물이 없음','bad');
}
/* 도감 — 받을 수 있는 보상 */
function codexClaimable(){ const a = relicAwake(); return CODEX.map((c,i)=>i).filter(i => a >= CODEX[i].need && !S.codex[i]); }
function claimCodex(){

/* 착용 장비 고르게 강화 — 다음 강화가 가장 싼 장비부터 금화가 닿는 데까지 */
function upgradeEquippedEven(){
  const eq = SLOTS.map(sl => S.equip[sl.id]).filter(Boolean);
  if(!eq.length){ toast('착용한 장비가 없음','bad'); return; }
  let n = 0, spent = 0;
  for(let guard = 0; guard < 1e5; guard++){
    let best = null, bc = Infinity;
    for(const it of eq){ const c = itemUpCost(it); if(c < bc){ bc = c; best = it; } }
    if(!best || !isFinite(bc) || S.gold < bc) break;
    S.gold -= bc; best.lv++; n++; spent += bc;
  }
  if(n){ recalc(); markDirty(); sfx('buy'); toast('착용 장비 '+n+'번 강화 · 금화 -'+fmt(spent), 'gold'); }
  else toast('금화가 부족함','bad');
}

/* 지금 푸는 문제 {unit, ti, seed, q, vals, done, ok, box, mode, wid}

  S.math.wrong.unshift({id: newSeed().toString(36), u: MQ.unit, ti: MQ.ti, seed: MQ.seed, at: now(), tries: 1});

/* ---------- 저장 코드 (다른 기기로 옮기기) ---------- */
function b64enc(bytes){ let s = ''; for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s); }
function b64dec(str){ const bin = atob(str), out = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function makeSaveCode(){
  saveNow();
  const slim = JSON.parse(JSON.stringify(S));
  const cut = it => { if(it){ delete it.nm; delete it.isNew; } };
  (slim.inv||[]).forEach(cut); for(const k in (slim.equip||{})) cut(slim.equip[k]);
  const raw = new TextEncoder().encode(JSON.stringify(slim));
  if(window.CompressionStream){
    try{
      const z = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
      return 'BMZ1:' + b64enc(z);
    }catch(e){}
  }
  return 'BMJ1:' + b64enc(raw);
}

  if(tag === 'BMZ1:'){
    if(!window.DecompressionStream) throw new Error('이 브라우저는 압축된 코드를 못 읽음');
    bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  } else if(tag !== 'BMJ1:') throw new Error('블러드문 저장 코드가 아님');
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if(!o || typeof o !== 'object' || !(o.lv >= 1) || !o.relics) throw new Error('저장 내용이 올바르지 않음');
  const fix = it => { if(it && !it.nm && SLOTMAP[it.s]){ const b = SLOTMAP[it.s].base; it.nm = b[Math.min(it.r||0, b.length-1)]; } };
  (o.inv||[]).forEach(fix); for(const k in (o.equip||{})) fix(o.equip[k]);
  return o;
}
/* QR 그리기 — 코드가 너무 길면(QR 최대 용량 초과) 안내만 함 */
function drawSaveQr(code){
  const box = $('#saveQrBox'); if(!box) return;
  if(typeof qrcode !== 'function'){ box.innerHTML = ''; return; }
  let q;
  try{ q = qrcode(0, 'L'); q.addData(code); q.make(); }
  catch(e){ box.innerHTML = '<div class="tiny">진행이 커서 QR 한 장에 다 담기지 않음 — 코드 복사를 쓸 것.</div>'; return; }
  const n = q.getModuleCount(), cell = Math.max(4, Math.ceil(600 / (n + 8))), size = (n + 8) * cell;   /* 크게 그리고 화면에서는 줄여 보임 — 카메라가 읽기 쉽게 */
  const cv = document.createElement('canvas'); cv.width = cv.height = size; cv.id = 'saveQr';
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) g.fillRect((c+4)*cell, (r+4)*cell, cell, cell);
  box.innerHTML = ''; box.appendChild(cv);
  box.insertAdjacentHTML('beforeend', `<div class="tiny" style="text-align:center;margin:6px 0 0">다른 기기에서 <b>설정 → 저장 코드로 불러오기 → QR 찍기</b>로 읽음</div>`);
}
function saveCodeModal(){
  openModal(`<div class="rl-m" style="${rcVars('#38bdf8')}">
    <div class="rl-rib">저장 코드</div><button class="rl-x" data-act="closeModal" aria-label="닫기">✕</button>
    <h3>다른 기기로 옮기기</h3>
    <div class="tiny" style="margin:0 0 8px">아래 코드를 복사해 두었다가, 다른 기기에서 <b>설정 → 저장 코드로 불러오기</b>에 붙여넣으면 이어서 할 수 있음.</div>
    <div id="saveQrBox" class="qr-box"><div class="tiny">QR 만드는 중…</div></div>
    <textarea id="saveCodeOut" class="bm-code" readonly>만드는 중…</textarea>
    <button class="cta" data-act="copySaveCode">코드 복사하기</button>
  </div>`);
  makeSaveCode().then(c => { const t = $('#saveCodeOut'); if(t) t.value = c; drawSaveQr(c); });
}
function loadCodeModal(){
  openModal(`<div class="rl-m" style="${rcVars('#fb923c')}">
    <div class="rl-rib">불러오기</div><button class="rl-x" data-act="closeModal" aria-label="닫기">✕</button>
    <h3>저장 코드로 불러오기</h3>
    <div class="tiny" style="margin:0 0 8px">지금 이 기기의 진행은 <b>코드의 진행으로 바뀜</b>. 필요하면 먼저 지금 것을 복사해 둘 것.</div>
    <textarea id="saveCodeIn" class="bm-code" placeholder="BMZ1: 로 시작하는 코드를 붙여넣기"></textarea>
    <button class="cta ghost" data-act="scanQr" style="height:42px;font-size:13px">📷 QR 찍어서 넣기</button>
    <div id="qrCam" class="qr-cam" hidden><video playsinline muted></video><div class="tiny" style="text-align:center">QR을 네모 안에 비추기</div></div>
    <button class="cta" data-act="applySaveCode">불러오기</button>
  </div>`);
}
let qrStream = null;
function stopQrScan(){ if(qrStream){ qrStream.getTracks().forEach(t => t.stop()); qrStream = null; } const c = $('#qrCam'); if(c) c.hidden = true; }
async function startQrScan(){
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices){
    toast('이 브라우저는 QR 읽기를 지원하지 않음 — 휴대폰 카메라로 QR을 찍어 나온 글자를 복사해 붙여넣을 것','bad'); return;
  }
  let det;
  try{ det = new BarcodeDetector({formats:['qr_code']}); }catch(e){ toast('QR 읽기를 켤 수 없음','bad'); return; }
  try{ qrStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ toast('카메라를 쓸 수 없음 — 카메라 허용을 확인할 것','bad'); return; }
  const cam = $('#qrCam'), v = cam && cam.querySelector('video');
  if(!v){ stopQrScan(); return; }
  cam.hidden = false; v.srcObject = qrStream; await v.play().catch(()=>{});
  const tick = async () => {
    if(!qrStream || !$('#qrCam')) { stopQrScan(); return; }
    try{
      const found = await det.detect(v);
      const hit = found.find(f => /^BM[ZJ]1:/.test(f.rawValue||''));
      if(hit){ const t = $('#saveCodeIn'); if(t) t.value = hit.rawValue; stopQrScan(); sfx('coin'); toast('QR을 읽었음 — 불러오기를 누를 것','good'); return; }
    }catch(e){}
    setTimeout(tick, 250);
  };
  tick();
}
</script>

function drawDungeonMap(){
  const el = $('#dgCv');
  if(!el || !MAP.g) return;
  const g = el.getContext('2d'), n = MAP.w, px = el.width/n;
  const th = themeOf(G.mode === 'tower' ? 8 : S.stage);
  if(!MAP.tint) buildTint();
  g.fillStyle = '#151019'; g.fillRect(0,0,el.width,el.height);
  const B = MAP.bossRoom;
  for(let cy=0;cy<MAP.h;cy++) for(let cxx=0;cxx<n;cxx++){
    const v = MAP.g[gi(cxx,cy)];
    if(v === WALL) continue;
    const inB = B && cxx>=B.x && cxx<B.x+B.w && cy>=B.y && cy<B.y+B.h;
    g.fillStyle = v === GATE ? (MAP.gateOpen ? '#f7b33c' : '#c93055')
                : inB ? '#6a1030'
                : MAP.tint[gi(cxx,cy)] ? th.flr : th.fl;
    g.fillRect(cxx*px, cy*px, px+.5, px+.5);
  }
  /* 방 테두리 */
  g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1;
  for(const r of MAP.rooms) g.strokeRect(r.x*px, r.y*px, r.w*px, r.h*px);
  /* 라벨 */
  g.textAlign = 'center'; g.font = '700 11px Noto Sans KR, sans-serif';
  const tag = (r, txt, col) => {
    if(!r) return;
    g.fillStyle = 'rgba(0,0,0,.62)';
    const w = g.measureText(txt).width + 10;
    g.fillRect((r.cx+.5)*px - w/2, (r.cy+.5)*px - 8, w, 15);
    g.fillStyle = col; g.fillText(txt, (r.cx+.5)*px, (r.cy+.5)*px + 3.5);
  };
  tag(MAP.start, '시작', '#9adcff');
  tag(MAP.bossRoom, MAP.gateOpen ? '보스' : '봉인', MAP.gateOpen ? '#f7b33c' : '#ff8a9a');
  for(const c of MAP.chests){
    if(c.secret && !c.opened) continue;
    const w = Math.min(px*1.5, 13);
    g.fillStyle = c.opened ? 'rgba(150,124,86,.7)' : (c.secret ? '#c56bf0' : '#f7b33c');
    g.fillRect((c.cx+.5)*px - w/2, (c.cy+.5)*px - w/2, w, w);
    g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1.2;
    g.strokeRect((c.cx+.5)*px - w/2, (c.cy+.5)*px - w/2, w, w);
    if(!c.opened) tag({cx:c.cx, cy:c.cy+1.6}, c.secret ? '비밀 상자' : '보물 상자', c.secret ? '#e0b8ff' : '#ffd98a');
  }
  for(const a of MAP.altars){
    g.fillStyle = a.type === 'blood' ? '#ff5470' : '#c56bf0';
    g.beginPath(); g.arc((a.cx+.5)*px, (a.cy+.5)*px, Math.min(px*1.05, 9), 0, 6.2832); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1.3; g.stroke();
    tag({cx:a.cx, cy:a.cy+2.2}, a.name, a.type === 'blood' ? '#ffb0bc' : '#e0c0ff');
  }
  g.fillStyle = 'rgba(255,90,110,.9)';
  for(const e of enemies){ if(!e.dead) g.fillRect(e.x/CELL*px-1.5, e.y/CELL*px-1.5, e.boss?6:3, e.boss?6:3); }
  const pxp = P.x/CELL*px, pyp = P.y/CELL*px;
  g.fillStyle = '#fff'; g.beginPath(); g.arc(pxp, pyp, 5, 0, 6.2832); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(pxp, pyp, 12, 0, 6.2832); g.stroke();
}

    ['공격 속도', ST.aspd.toFixed(2)+'회/초'], ['동시 공격', ST.proj+'체'], ['공격 사거리', Math.round(ST.range)+'m'],
    ['치명타 확률', pct(ST.crit)], ['치명타 피해', Math.round(ST.cdmg)+'%'],
    ['흡혈', pct(ST.vamp*100)], ['체력 재생', pct(ST.regen*100)+'/초'], ['회피 확률', pct(ST.dodge)],
    ['이동 속도', Math.round(ST.move)], ['획득 범위', Math.round(ST.pick)+'m'],
    ['금화 획득', mul(ST.goldMul)], ['피 획득', mul(ST.bloodMul)], ['경험치 획득', mul(ST.expMul)],
    ['보스 추가 피해', mul(ST.bossDmg)],
  ];
  if(ST.dr > 0)       rows.push(['피해 감소', pct(ST.dr)]);
  if(ST.slow > 0)     rows.push(['적 이동 감속', pct(ST.slow)]);
  if(ST.killHeal > 0) rows.push(['처치 시 회복', pct(ST.killHeal)+'/체']);
  if(ST.revive > 0)   rows.push(['부활 속도', pct(ST.revive)]);
  if(ST.pierce > 0)   rows.push(['투사체 관통', pct(ST.pierce*100)]);
  if(ST.boom > 0)     rows.push(['처치 시 폭발', pct(ST.boom)+' 피해']);
  if(ST.buffDur > 0)  rows.push(['광폭화 시간', pct(ST.buffDur)]);
  if(ST.luck > 0)     rows.push(['소환 행운', pct(ST.luck)]);
  const life = [
    ['총 처치', fmt(S.stats.kills)], ['보스 처치', fmt(S.stats.bosses)],
    ['누적 피해', fmt(S.stats.dmg)], ['소환 횟수', fmt(S.stats.summons)],
    ['최고 스테이지', S.maxStage], ['최고 첨탑', S.tower.best+'층'],
    ['플레이 시간', Math.floor(S.stats.playtime/3600)+'시간 '+Math.floor(S.stats.playtime%3600/60)+'분'],
    ['다음 레벨까지', fmt(Math.max(0, expNeed(S.lv)-S.exp))+' EXP'],
    ['발견한 비밀 상자', Object.keys(S.secret||{}).length+' 곳'],
    ['유물 상자', fmt(S.stats.relicBox||0)+'회'],
    ['환생', S.rebirth.count+'번 · 인장 '+fmt(S.rebirth.seals)],
    ['출석', S.attend.day+'일'],
  ];
  const box = arr => `<div class="statgrid">${arr.map(([k,v])=>`<div class="sbox"><s>${k}</s><b>${v}</b></div>`).join('')}</div>`;
  /* 유물 도감 · 등급 세트 보너스 — 어디서 얼마나 붙는지 따로 보여 줌 */
  const awake = relicAwake();
  const codexRows = CODEX.map(c => `<div class="rl-cx${awake>=c.need?' done':''}"><span class="n">${awake>=c.need?'✓ ':''}${c.need}개</span><span class="e">${c.k} ${relicVal(c,1)}</span></div>`).join('');
  const setRows = Object.keys(CODEX_SET).map(k => {
    const e = CODEX_SET[k], L = RELICS.filter(r=>r.rare===k), have = L.filter(r=>relicStar(r.id)>0).length;
    return `<div class="rl-cx${have===L.length?' done':''}"><span class="n" style="color:${RAR[RELIC_RANK[k]].c}">${have===L.length?'✓ ':''}${k} ${have}/${L.length}</span><span class="e">${e.k} ${relicVal(e,1)}</span></div>`;
  }).join('');
  const relicBox = `<div class="sheet-title" style="margin:12px 0 6px"><h2 style="font-size:14px">유물 보너스</h2>
      <span class="sub">깨운 유물 ${awake} / ${RELICS.length} · 성급 ${relicStars()} / ${RELICS.length*5}</span></div>
    <div class="tiny" style="margin:0 2px 4px">도감 단계 (켜진 것은 초록)</div>${codexRows}
    <div class="tiny" style="margin:10px 2px 4px">등급 세트 — 한 등급을 모두 깨우면</div>${setRows}`;
  const links = `<button class="cta ghost" data-open="rebirth" style="height:40px;font-size:13px;margin:0 0 10px">환생 · 핏빛 인장 ${fmt(S.rebirth.seals)}</button>`;
  return {sub:`LV.${S.lv}`, html: links + box(rows) + relicBox + `<div class="sheet-title" style="margin:12px 0 6px"><h2 style="font-size:14px">기록</h2></div>` + box(life)};
}
/* ---------- 임무 목록 ---------- */
function renderQuest(){
  let html = '';
  for(let i = S.quest; i < S.quest+8; i++){
    const q = questDef(i), cur = i===S.quest ? Math.min(q.get(), q.need) : 0;
    html += `<div class="mrow">
      <div class="ic" style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#5e2c4c,#2a1020);border:1.5px solid #7a3a5c">${icon('questsword','style="width:24px;height:24px"')}</div>
      <div class="mi"><b>${i+1}. ${q.n} <span style="color:#b596a8;font-size:11px">${fmt(q.need)}${q.unit}</span></b>
        <div class="mtrack"><div class="mfill" style="width:${i===S.quest?clamp(cur/q.need,0,1)*100:0}%"></div></div>
        <div class="rw"><span>${icon('blood')}${fmt(q.rw.blood)}</span><span>${icon('gem')}${q.rw.gem}</span></div></div>
    </div>`;
  }
  return {sub:'순서대로 자동 완료됨', html};
}
/* ---------- 설정 ---------- */
function renderSettings(){
  const sw = (id,on,label,desc) => `<div class="optrow"><span>${label}<br><span style="font-size:10.5px;color:#b596a8;font-weight:500">${desc}</span></span>
    <button class="sw ${on?'on':''}" data-act="opt" data-id="${id}" aria-pressed="${on}"></button></div>`;
  const html = sw('sfx', S.opt.sfx, '효과음', '타격·획득·레벨업 사운드')
    + sw('fx', S.opt.fx, '입자 효과', '끄면 저사양 기기에서 더 부드러움')
    + sw('autoEquip', S.opt.autoEquip, '자동 장착', '더 강한 장비를 얻으면 즉시 교체')
    + sw('autoMove', S.opt.autoMove, '자동 이동', '켜 둬도 조작하면 바로 내가 움직임. 끄면 손을 뗐을 때 그 자리에 섬')
    + sw('sleep', S.opt.sleep, '절전모드', '조작이 없으면 화면을 끄고 사냥만 계속함')
    + `<div class="optrow"><span>절전 대기 시간<br><span style="font-size:10.5px;color:#b596a8;font-weight:500">누르면 3 · 5 · 10 · 20 · 30분 순으로 바뀜</span></span>
        <button data-act="sleepMin" style="padding:7px 14px;border-radius:11px;background:linear-gradient(180deg,#3a1d30,#221020);border:1.5px solid #7a3a5c;font-family:var(--ff-n);font-weight:700;font-size:13px;color:#f6e9df">${S.opt.sleepMin}분</button></div>
       <button class="cta ghost" data-act="sleepNow" style="margin-top:10px">지금 절전모드 켜기</button>
       <button class="cta ghost" data-act="save" style="margin-top:8px">지금 저장하기</button>
       <div class="save-note">진행은 <em>이 기기(브라우저)에만</em> 저장됨. 다른 기기로 옮기거나 백업하려면 아래 저장 코드를 쓸 것.</div>
       <div class="ctarow">
         <button class="cta ghost" data-act="saveCode" style="margin-top:8px;font-size:13px">저장 코드 복사하기</button>
         <button class="cta ghost" data-act="loadCode" style="margin-top:8px;font-size:13px">저장 코드로 불러오기</button>
       </div>
       <button class="cta ghost" data-act="tutReset" style="margin-top:8px;font-size:13px">처음 안내 다시 보기</button>
       <button class="cta" data-act="reset" style="margin-top:8px;background:linear-gradient(180deg,#e05a6a,#8a1226);border-color:#ffb0bc;color:#fff;box-shadow:0 4px 0 #500a16">${armed('reset') ? '정말 초기화하려면 한 번 더 누르기' : '모든 진행 초기화'}</button>
       <div class="tiny">진행 상황은 이 브라우저에 자동 저장됨(약 8초마다). 시크릿 창이나 저장소 삭제 시 사라짐.<br>
       조작: 방향키 또는 WASD, 화면을 끌면 그 방향으로 이동함. 공격은 항상 자동임.<br>
       자동이 켜져 있어도 조작하면 곧바로 내 뜻대로 움직이고, 손을 뗀 뒤 2.5초가 지나면 다시 스스로 사냥함.<br>
       완전히 직접 몰고 싶으면 화면 오른쪽 <b>자동</b> 버튼을 눌러 <b>수동</b>으로 바꾸면 됨.</div>`;
  return {sub:'v1.0', html};
}
</script>

<script>
"use strict";
/* ============================ 모달 ============================ */
function openModal(html){ $('#modalCard').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); if(typeof stopQrScan === 'function') stopQrScan(); }
function findItem(id){
  id = +id;
  for(const sl of SLOTS){ const it = S.equip[sl.id]; if(it && it.id === id) return it; }
  return S.inv.find(i=>i.id === id) || null;
}
function itemModal(id){
  const it = findItem(id); if(!it) { closeModal(); return; }
  it.isNew = false;
  const r = RAR[it.r], sl = SLOTMAP[it.s], p = itemPower(it);
  const equipped = S.equip[it.s] && S.equip[it.s].id === it.id;
  const up = itemUpCost(it);
  openModal(`
    <div class="cap" style="background:linear-gradient(180deg,${r.c},#000a)">${r.k}</div>
    <div class="cbody">
      <h3>${it.nm}</h3>
      <div class="stars" style="justify-content:center;margin:0 0 10px">
        <span style="width:62px;height:62px;display:grid;place-items:center;border-radius:12px;border:2px solid ${r.c};background:radial-gradient(circle at 50% 120%,${r.c}66,transparent 65%)">${icon(sl.ic,'style="width:40px;height:40px"')}</span>
      </div>
      <div class="sect"><h4>부위 · ${sl.name} · 강화 +${it.lv}</h4>
        <div class="line"><span>공격력</span><b>×${(1+p.atk).toFixed(3)}</b></div>
        <div class="line"><span>최대 체력</span><b>×${(1+p.hp).toFixed(3)}</b></div>
        <div class="line"><span>종합 전투력</span><b>${fmt(itemScore(it)*1000)}</b></div>
      </div>
      <div class="ctarow" style="margin-top:12px">
        ${equipped ? `<button class="cta ghost" disabled style="opacity:.6">착용 중</button>`
                   : `<button class="cta" data-act="equip" data-id="${it.id}">장착</button>`}
        <button class="cta ${S.gold>=up?'':'off'}" data-act="itemup" data-id="${it.id}" data-n="1">강화 +1<br><span style="font-size:10px">${icon('coin','style="width:11px;height:11px;vertical-align:-1px"')} ${fmt(up)}</span></button>
      </div>
      <div class="ctarow" style="margin-top:8px">
        <button class="cta ghost" data-act="itemup" data-id="${it.id}" data-n="10">강화 +10</button>
        <button class="cta ghost" data-act="itemup" data-id="${it.id}" data-n="MAX">강화 MAX<br><span style="font-size:10px">금화가 닿는 데까지</span></button>
      </div>
      ${equipped ? '' : `<button class="cta ghost" data-act="salvage" data-id="${it.id}" style="margin-top:8px">분해</button>`}
      <button class="cta ghost" data-act="closeModal" style="margin-top:8px">닫기</button>
    </div>`);
}
function relicModal(id, fx){
  const r = RELICMAP[id], st = relicStar(id), nxt = st+1, maxed = st >= 5;
  const pc = relicPc(id), need = maxed ? 0 : relicNeed(r, nxt), showNext = st > 0 && !maxed;
  const line = e => `<div class="line"><span>${e.k}</span><b>${relicVal(e, st)}${showNext?`<span class="rl-nx">→ ${relicVal(e, nxt)}</span>`:''}</b></div>`;
  let foot = '';
  if(maxed) foot = `<div class="rl-foot">최고 단계에 이른 유물임.</div>`;
  else {
    const needG = RELIC_GOLD[nxt], lackP = Math.max(0, need - pc), lackG = Math.max(0, needG - S.gold);
    const cost = `<div class="rl-cost">
        <span class="${lackP?'no':'ok'}">${icon(r.ic)} ${fmt(pc)} / ${fmt(need)}</span>
        <span class="${lackG?'no':'ok'}">${icon('coin')} ${fmt(S.gold)} / ${fmt(needG)}</span></div>`;
    const verb = st ? '돌파' : '활성화';
    if(!lackP && !lackG) foot = `<button class="cta" data-act="break" data-id="${id}">${st ? nxt+'성 돌파하기' : '활성화하기'}</button>` + cost;
    else if(lackP && !lackG) foot = `<div class="rl-foot">조각을 <em>${fmt(lackP)}</em>개 모아 ${verb}하세요.</div>` + cost;
    else if(!lackP && lackG) foot = `<div class="rl-foot">금화 <em>${fmt(lackG)}</em>이 더 있어야 ${verb}할 수 있음.</div>` + cost;
    else foot = `<div class="rl-foot">조각 <em>${fmt(lackP)}</em>개와 금화 <em>${fmt(lackG)}</em>이 더 필요함.</div>` + cost;
    /* 모자란 조각을 유물 가루로 채우기 */
    if(lackP){
      const per = RELIC_CFG.dustPerPiece[r.rare] || 5, can = Math.min(lackP, Math.floor(S.shard / per));
      foot += `<button class="cta ${can?'ghost':'off'}" data-act="craft" data-id="${id}" data-n="${can||lackP}" style="height:44px;font-size:13px">
        유물 가루로 조각 ${fmt(can||lackP)}개 만들기 · ${icon('relicgem','style="width:12px;height:12px;vertical-align:-1px"')} ${fmt((can||lackP)*per)}</button>`;
    }
  }
  const sur = relicSurplus(r);
  if(sur) foot += `<button class="cta ghost" data-act="dismantle" data-id="${id}" style="height:40px;font-size:12.5px">남는 조각 ${fmt(sur)}개 분해 → 유물 가루 +${fmt(surplusDust(r, sur))}</button>`;
  const starRow = [1,2,3,4,5].map(i => `<span${fx && i===st ? ' class="pop"' : ''}>${icon(i<=st?'star':'starOff')}</span>`).join('');
  openModal(`
    <div class="rl-m${fx?' fx':''}" style="${relicVars(r)}">
      <div class="rl-rib">${r.rare}</div>
      <button class="rl-x" data-act="closeModal" aria-label="닫기">✕</button>
      <h3>${r.n}</h3>
      <div class="rl-row">
        <div class="rl-thumb">
          ${fx ? '<span class="rl-rays"></span><span class="rl-burst"></span>' : ''}
          <div class="rl-box${st?'':' off'}">${icon(r.ic)}</div>
          <div class="rl-pc">${icon(r.ic)} ${maxed ? fmt(pc) : fmt(pc)+' / '+fmt(need)}</div>
        </div>
        <div class="rl-lore">${r.lore}</div>
      </div>
      <div class="rl-lv"><span class="stars">${starRow}</span>${st} / 5 단계</div>
      <div class="sect"><h4>◈ 기본 능력${st?'':' (1성 기준)'}</h4>${r.base.map(line).join('')}</div>
      <div class="sect"><h4>◈ 특수 능력</h4>${line(r.sp)}</div>
      ${foot}
    </div>`);
}
function relicBoxModal(res, n, pay){
  const best = res.reduce((m,x) => Math.max(m, RELIC_RANK[x.rar]), 2), c = RAR[best].c, B = RELIC_CFG.box;
  const myth = res.filter(x => x.rar === '신화');
  const again = pay === 'free' ? 'gem' : pay;
  const loot = res.map((x,i) => {
    const rc = RAR[RELIC_RANK[x.rar]].c, m = x.rar === '신화';
    /* 신화는 다른 카드가 다 나온 뒤 마지막에 따로 등장 */
    const delay = m ? res.length*0.06 + 0.35 : i*0.06;
    return `<div class="lt${RELIC_RANK[x.rar]>=4?' hi':''}${m?' myth':''}" style="${rcVars(rc)};animation-delay:${delay.toFixed(2)}s">${icon(x.r.ic)}<b>${x.r.n}</b><span>+${x.amt}</span></div>`;
  }).join('');
  openModal(`
    <div class="rl-m${myth.length?' myth':''}" style="${rcVars(c)}">
      <div class="rl-rib">${myth.length ? '신화 획득!' : RAR[best].k}</div>
      <button class="rl-x" data-act="closeModal" aria-label="닫기">✕</button>
      <h3>${pay === 'free' ? '무료 유물 상자' : '유물 상자 '+n+'회'}</h3>
      <div class="rl-loot">${loot}</div>
      <div class="tiny" style="text-align:center">신화 확정까지 ${Math.max(1, B.pity - (S.relicPity||0))}번 남음</div>
      <div class="ctarow">
        <button class="cta" data-act="rbox" data-n="${n===10?10:1}" data-id="${again}">한 번 더 (${again==='gem'?'젬 '+(n===10?B.gem10:B.gem1):'가루 '+(n===10?B.dust10:B.dust1)})</button>
        <button class="cta ghost" data-act="closeModal">확인</button>
      </div>
    </div>`);
  if(myth.length){
    const names = [...new Set(myth.map(x => x.r.n))].join(' · ');
    setTimeout(() => { showBanner('신화 유물', names); sfx('boss'); }, 450);
  }
}
function relicOddsModal(){
  const B = RELIC_CFG.box, W = B.weight, tot = Object.values(W).reduce((a,b)=>a+b,0);
  const rows = Object.keys(W).reverse().map(k => {
    const [a,b] = B.amount[k];
    return `<div class="line"><span style="color:${RAR[RELIC_RANK[k]].c}">${k}</span><b>${(W[k]/tot*100).toFixed(1)}% · 조각 ${a}~${b}개</b></div>`;
  }).join('');
  openModal(`
    <div class="rl-m" style="${rcVars('#c56bf0')}">
      <div class="rl-rib">확률 공개</div>
      <button class="rl-x" data-act="closeModal" aria-label="닫기">✕</button>
      <h3>유물 상자</h3>
      <div class="sect"><h4>◈ 한 번 뽑을 때</h4>${rows}</div>
      <div class="sect"><h4>◈ 보장</h4>
        <div class="line"><span>10회 뽑기</span><b>${B.tenFloor} 이상 1개</b></div>
        <div class="line"><span>천장</span><b>${B.pity}번 안에 신화 확정</b></div>
        <div class="line"><span>소환 행운</span><b>전설·신화 비율 +${fmt(ST.luck||0)}%</b></div></div>
      <div class="tiny">같은 등급 안에서는 모든 유물이 같은 확률로 나옴.</div>
    </div>`);
}
function codexModal(){
  const awake = relicAwake();
  const rows = CODEX.map((c,i) => `<div class="rl-cx${awake>=c.need?' done':''}${S.codex[i]?' got':''}">
      <span class="n">${awake>=c.need?'✓ ':''}${c.need}개</span><span class="e">${c.k} ${relicVal(c,1)}</span><span class="g">젬 ${c.gem}</span></div>`).join('');
  const sets = Object.keys(CODEX_SET).map(k => {
    const e = CODEX_SET[k], L = RELICS.filter(r=>r.rare===k), have = L.filter(r=>relicStar(r.id)>0).length;
    return `<div class="rl-cx${have===L.length?' done':''}"><span class="n" style="color:${RAR[RELIC_RANK[k]].c}">${k} ${have}/${L.length}</span><span class="e">${e.k} ${relicVal(e,1)}</span></div>`;
  }).join('');
  openModal(`
    <div class="rl-m" style="${rcVars('#c56bf0')}">
      <div class="rl-rib">유물 도감</div>
      <button class="rl-x" data-act="closeModal" aria-label="닫기">✕</button>
      <h3>깨운 유물 ${awake} / ${RELICS.length}</h3>
      <div class="sect"><h4>◈ 수집 단계 (영구 보너스 · 젬 1회)</h4>${rows}</div>
      <div class="sect"><h4>◈ 등급 세트 — 한 등급을 모두 깨우면</h4>${sets}</div>
      ${codexClaimable().length ? '<button class="cta" data-act="codexClaim">도감 보상 받기</button>' : ''}
    </div>`);
}

/* ============================ 이벤트 ============================ */
function act(el){
  const a = el.dataset.act, id = el.dataset.id, n = +(el.dataset.n||1);
  switch(a){
    case 'buyUpg': {
      const def = UPGMAP[id], lv = S.up[id]||0, cost = costFor(def, lv, n);
      if(S.blood < cost || n <= 0) { toast('피가 부족함','bad'); break; }
      S.blood -= cost; S.up[id] = lv + n; recalc(); markDirty(); sfx('buy'); break;
    }
    case 'buyAlch': {
      const def = ALCHMAP[id], lv = S.alch[id]||0, cost = costFor(def, lv, n);
      if(S.gold < cost || n <= 0) { toast('금화가 부족함','bad'); break; }
      S.gold -= cost; S.alch[id] = lv + n; recalc(); markDirty(); sfx('buy'); break;
    }
    case 'summon1': summon(1,false); break;
    case 'summon10': summon(10,false); break;
    case 'summonG': summon(1,true); break;
    case 'merge': mergeAll(); break;
    case 'autoeq': autoEquip(); markDirty(); toast('가장 강한 장비로 교체함','good'); break;
    case 'salvageAll': {
      const targets = S.inv.filter(i=>i.r <= 2 && i.lv === 0);
      if(!targets.length){ toast('분해할 희귀 이하 장비가 없음','bad'); break; }
      let sh = 0; for(const it of targets) sh += Math.max(1, Math.round(RAR[it.r].p*1.6));
      S.inv = S.inv.filter(i=>!(i.r <= 2 && i.lv === 0));
      S.shard += sh; toast(targets.length+'개 분해 — 유물 가루 +'+sh, 'good'); markDirty(); break;
    }
    case 'item': itemModal(id); break;
    case 'equip': equipItem(findItem(id)); itemModal(id); break;
    case 'itemup': { const it = findItem(id); if(it){ upgradeItem(it, el.dataset.n === 'MAX' ? 1e5 : n); itemModal(id);} break; }
    case 'salvage': { const it = findItem(id); if(it){ salvage(it); closeModal(); } break; }
    case 'relic': relicModal(id); break;
    case 'break': { const ok = breakRelic(id); relicModal(id, ok); break; }
    case 'breakAll': breakAllRelics(); break;
    case 'craft': craftPieces(id, n); relicModal(id); break;
    case 'dismantle': dismantleSurplus(id || null); if(id) relicModal(id); break;
    case 'rbox': { const cnt = n === 10 ? 10 : 1, res = openRelicBox(cnt, id); if(res) relicBoxModal(res, cnt, id); break; }
    case 'rboxOdds': relicOddsModal(); break;
    case 'codexList': codexModal(); break;
    case 'codexClaim': claimCodex(); if($('#modal').classList.contains('on')) codexModal(); break;
    case 'eqUpAll': upgradeEquippedEven(); break;
    case 'shop': {
      const s = SHOP.find(x=>x.id===id);
      if(S.gem < s.cost){ toast('젬이 부족함','bad'); break; }
      S.gem -= s.cost; const g = s.give(); grant(g); sfx('buy');
      toast(s.n+' 구매 — '+grantText(g), 'gold'); break;
    }
    case 'mail': {
      const m = MAILS.find(x=>x.id===id);
      if(!mailReady(m)) { toast(hms(mailLeft(m))+' 후에 수령 가능','bad'); break; }
      S.mail[m.id] = now(); const g = m.give(); grant(g); sfx('coin');
      toast(m.n+' — '+grantText(g), 'gold'); break;
    }
    case 'mclaim': {
      const m = MISSIONS.find(x=>x.id===id), t = missionTier(m.id);
      if(t >= m.steps.length || m.get() < m.steps[t]){ toast('아직 조건을 달성하지 못함','bad'); break; }

      sfx('lvup'); toast(m.n+' '+(t+1)+'단계 — '+grantText(rw), 'gold'); break;
    }
    case 'go': {
      const s = +id;

      S.stage = s; S.wave = 1; S.waveKills = 0; G.bossQueued = false;
      resetRun(); initEmbers(); markDirty();
      toast(s+'. '+stageName(s)+'(으)로 이동함','good'); closeSheet(); break;
    }
    case 'tower': {
      if(G.mode === 'tower'){ towerExit(); toast('필드로 복귀함'); }
      else { towerEnter(); closeSheet(); }

    }
    case 'opt': S.opt[id] = !S.opt[id]; if(id==='autoEquip' && S.opt.autoEquip) autoEquip(); markDirty(); break;
    case 'save': saveNow(); toast('저장 완료','good'); break;
    case 'reset': {
      if(armed('reset')){
        /* 초기화 뒤 곧바로 자동 저장·허브 저장이 옛 진행을 다시 써넣지 않게 막고 다시 시작함 */
        window.__bmResetting = true;

    case 'sleepMin': { const L=[3,5,10,20,30], i=L.indexOf(S.opt.sleepMin); S.opt.sleepMin = L[(i+1)%L.length]; markDirty(); break; }
    case 'sleepNow': if(window.__sleepEnter) window.__sleepEnter(); break;
    case 'closeModal': closeModal(); break;
    case 'attend': claimAttend(); break;
    case 'sealBuy': buySeal(id); break;
    case 'mathSel': S.math.sel = id; break;
    case 'mathStart': mathStart(); break;
    case 'mathCheck': mathCheck(); break;
    case 'mathBox': claimMathBox(); break;
    case 'mathRetry': mathRetry(id, false); break;
    case 'mathSimilar': mathRetry(id, true); break;
    case 'rebirth': {
      if(armed('rebirth')){ armAct = {k:'', t:0}; if(doRebirth()) closeSheet(); }
      else arm('rebirth');
      break;

    case 'saveCode': saveCodeModal(); break;
    case 'scanQr': startQrScan(); break;
    case 'loadCode': loadCodeModal(); break;
    case 'copySaveCode': {
      const t = $('#saveCodeOut'); if(!t) break;
      const done = () => toast('저장 코드를 복사함 — 메모장 등에 붙여넣어 보관할 것','good');
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, () => { t.select(); document.execCommand('copy'); done(); });
      else { t.select(); document.execCommand('copy'); done(); }

    case 'applySaveCode': {
      const t = $('#saveCodeIn'); if(!t) break;
      if(!el.dataset.sure){ el.dataset.sure = '1'; el.textContent = '지금 진행이 바뀜 — 한 번 더 누르면 불러옴'; break; }
      readSaveCode(t.value).then(o => {

        try{ localStorage.setItem(SAVE_KEY, JSON.stringify(o)); }catch(e){}
        toast('불러오기 완료 — 다시 시작함','good'); setTimeout(() => location.reload(), 600);
      }).catch(e => { toast('불러오지 못함 — '+e.message,'bad'); delete el.dataset.sure; el.textContent = '불러오기'; });
      break;
    }
    case 'tutReset': S.tut = {}; S.sessions = 1; tutCur = null; toast('처음 안내를 다시 보여 줌','good'); closeSheet(); break;
  }
}

/* ============================ 수동 조작 ============================ */
/* 키보드(WASD·방향키)와 화면 조이스틱. 누르고 있는 동안 계속 그 방향으로 걸어감. */
const KEYDIR = {
  KeyW:[0,-1], ArrowUp:[0,-1],   KeyS:[0,1],  ArrowDown:[0,1],
  KeyA:[-1,0], ArrowLeft:[-1,0], KeyD:[1,0],  ArrowRight:[1,0],
};
const heldKeys = new Set();
addEventListener('keydown', ev => {
  if(ev.ctrlKey || ev.altKey || ev.metaKey) return;
  if(ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if(!KEYDIR[ev.code]) return;
  heldKeys.add(ev.code); ev.preventDefault();
});
addEventListener('keyup', ev => { heldKeys.delete(ev.code); });
addEventListener('blur', () => heldKeys.clear());

/* 화면 아무 데나 누른 자리에 조이스틱이 생김 */
const STICK = {on:false, id:null, ax:0, ay:0, hx:0, hy:0, dx:0, dy:0, mag:0};
const STICK_R = 52, STICK_DEAD = 6;
function stickPt(ev){
  const r = cv.getBoundingClientRect();
  return {x: ev.clientX - r.left, y: ev.clientY - r.top};
}
function stickCalc(){
  let dx = STICK.hx - STICK.ax, dy = STICK.hy - STICK.ay;
  let L = Math.hypot(dx, dy);
  if(L > STICK_R){                       /* 멀리 끌면 받침이 따라옴 */
    STICK.ax = STICK.hx - dx/L*STICK_R;
    STICK.ay = STICK.hy - dy/L*STICK_R;
    L = STICK_R;
  }
  if(L < STICK_DEAD){ STICK.dx = 0; STICK.dy = 0; STICK.mag = 0; return; }
  STICK.dx = dx/(Math.hypot(dx,dy)||1); STICK.dy = dy/(Math.hypot(dx,dy)||1);
  STICK.mag = .45 + Math.min(1, (L-STICK_DEAD)/(STICK_R-STICK_DEAD))*.55;
}
function stickDown(ev){
  if(STICK.on) return;
  const p = stickPt(ev);
  STICK.on = true; STICK.id = ev.pointerId;
  STICK.ax = STICK.hx = p.x; STICK.ay = STICK.hy = p.y;
  STICK.dx = STICK.dy = STICK.mag = 0;
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
  ev.preventDefault();
}
function stickMove(ev){
  if(!STICK.on || ev.pointerId !== STICK.id) return;
  const p = stickPt(ev);
  STICK.hx = p.x; STICK.hy = p.y;
  stickCalc();
  ev.preventDefault();
}
function stickUp(ev){
  if(!STICK.on || (ev && ev.pointerId !== STICK.id)) return;
  STICK.on = false; STICK.id = null; STICK.dx = STICK.dy = STICK.mag = 0;
}
cv.addEventListener('pointerdown', stickDown);
cv.addEventListener('pointermove', stickMove);
addEventListener('pointerup', stickUp); addEventListener('pointercancel', stickUp);

/* 지금 사람이 넣고 있는 조작 방향 (없으면 null) */
function inputDir(){
  let kx = 0, ky = 0;
  for(const k of heldKeys){ const d = KEYDIR[k]; kx += d[0]; ky += d[1]; }
  if(kx || ky){ const L = Math.hypot(kx, ky); return {x:kx/L, y:ky/L, m:1}; }
  if(STICK.on && STICK.mag > 0) return {x:STICK.dx, y:STICK.dy, m:STICK.mag};
  return null;
}
