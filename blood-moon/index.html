<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0710">
<meta name="description" content="방치형 뱀파이어 서바이버 — 손으로 설계한 16개 던전, 보물·비밀 상자, 패턴을 쓰는 보스.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23120a10%22/%3E%3Cpath d=%22M16 5c4.6 5.4 7 9 7 12a7 7 0 1 1-14 0c0-3 2.4-6.6 7-12z%22 fill=%22%23d4213f%22/%3E%3C/svg%3E">
<title>핏빛 성역</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
  /* 아티팩트 호스트가 주입하던 기본값을 직접 포함함 */
  html{color-scheme:dark;-webkit-text-size-adjust:100%;height:100%;overscroll-behavior:none}
  body{margin:0;height:100%;overscroll-behavior:none}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<style>
/* Obsidian and aged brass finish */
#frame{box-shadow:0 0 0 1px #756249,0 30px 100px #0009,0 0 100px #30281f35}
.avatar,.pill,.gear,.rbtn{background:linear-gradient(155deg,rgba(43,42,40,.95),rgba(18,20,23,.94));border-color:#76634e;box-shadow:inset 0 1px 0 #dfc28d15,0 4px 12px #0006}
.questbar{background:linear-gradient(180deg,#262625ef,#141719f2);border-color:#7a684d}
.bbtn{background:linear-gradient(160deg,#3b3934,#1a1c20);border-color:#806b50;box-shadow:inset 0 1px 0 #e6ca9830,0 5px 15px #0008}
.bbtn.hot{background:linear-gradient(150deg,#74333b,#321b25);border-color:#b47b66}
.minimap{border-color:#847253;background:#10171be0}
.fieldinfo .chip{background:linear-gradient(180deg,#302c28ee,#181b1eef);border-color:#827051}
.rbtn em{color:#e7ddca}.topbar{padding-top:12px}
</style></head>
<body>
<style>
/* ============ 토큰: 단일 다크 테마(아케이드 스크린으로 의도적 고정) ============ */
:root{
  --void:#120a10; --pit:#1b0f18; --crypt:#24121f;
  --panel:#2a1524; --panel2:#3a1d30; --panel3:#48253c;
  --edge:#5c2a45; --edge2:#7a3a5c;
  --blood:#d4213f; --ichor:#ff5470; --blood-deep:#7a0f22;
  --gold:#f7b33c; --gold-deep:#a86a0c;
  --amethyst:#9b6cf0; --amethyst-deep:#4a2a8a;
  --jade:#3ddc84; --sky:#49b8f5;
  --bone:#f6e9df; --muted:#b596a8; --dim:#7c6070;
  --r-0:#8d93a6; --r-1:#4ade80; --r-2:#38bdf8; --r-3:#a855f7; --r-4:#fb923c; --r-5:#ef4444;
  --sh-hud:0 2px 0 rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.45);
  --ff-d:'Black Han Sans','Noto Sans KR',sans-serif;
  --ff-b:'Noto Sans KR',system-ui,sans-serif;
  --ff-n:'Chakra Petch','Noto Sans KR',monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:
    radial-gradient(120% 80% at 50% -10%, #3a1020 0%, #170a12 45%, #0a0509 100%);
  color:var(--bone); font-family:var(--ff-b);
  min-height:100svh; display:flex; align-items:center; justify-content:center;
  overflow:hidden; -webkit-tap-highlight-color:transparent;
  user-select:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* ============ 프레임 ============ */
#frame{
  position:relative; width:min(460px,100vw); height:min(100svh,980px);
  overflow:hidden; background:#0d0710;
  box-shadow:0 0 0 1px #4a2038, 0 30px 80px rgba(0,0,0,.7), 0 0 120px rgba(212,33,63,.10);
}
@media(min-width:520px) and (min-height:700px){ #frame{border-radius:20px} }
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
/* ============ 상단 재화 ============ */
.topbar{position:absolute;top:0;left:0;right:0;padding:10px 12px 0;display:flex;gap:6px;align-items:center}
.avatar{
  display:flex;align-items:center;gap:0;flex:0 0 auto;
  background:linear-gradient(180deg,#4a2340,#2a1128); border:1.5px solid var(--edge2);
  border-radius:9px; padding:2px 8px 2px 2px; box-shadow:var(--sh-hud);
}
.avatar .face{width:28px;height:28px;border-radius:6px;overflow:hidden;background:#1c0d18;flex:0 0 auto}
.avatar .lv{font-family:var(--ff-n);font-weight:700;font-size:14px;letter-spacing:.01em;margin-left:5px;
  color:#fff;text-shadow:0 1px 0 #000, 0 0 8px rgba(155,108,240,.6)}
.pills{display:flex;gap:5px;flex:1;min-width:0;flex-wrap:nowrap}
.pill{
  display:flex;align-items:center;gap:3px;min-width:0;flex:1 1 0;
  background:linear-gradient(180deg,#2c1526,#190b16); border:1.5px solid #6a3050;
  border-radius:9px;padding:3px 5px 3px 4px;box-shadow:var(--sh-hud);
}
.pill:active{transform:translateY(1px)}
.pill svg{width:16px;height:16px;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.pill b{font-family:var(--ff-n);font-weight:700;font-size:12px;letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffeede;font-variant-numeric:tabular-nums}
.gear{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(180deg,#3a1d30,#221020);border:1.5px solid var(--edge2);box-shadow:var(--sh-hud)}
.gear svg{width:20px;height:20px}
/* ============ 퀘스트 바 ============ */
.questbar{position:absolute;top:50px;left:60px;right:60px;
  background:linear-gradient(180deg,rgba(30,14,26,.92),rgba(16,8,14,.92));
  border:1.5px solid #6a3050;border-radius:11px;padding:5px 8px 6px 40px;box-shadow:var(--sh-hud)}
.questbar .qicon{position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;display:grid;place-items:center}
.questbar .qicon svg{width:40px;height:40px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.questbar .qtitle{font-size:11.5px;font-weight:700;line-height:1.25;color:#f0dcd0;
  display:flex;gap:4px;align-items:baseline}
.questbar .qtitle i{font-style:normal;color:var(--gold);font-family:var(--ff-n)}
.qtrack{margin-top:3px;height:11px;border-radius:6px;background:#150a12;border:1px solid #5a2743;
  position:relative;overflow:hidden}
.qfill{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#ffcf6a,#e8871a 60%,#b85c07);
  transition:width .35s cubic-bezier(.3,1,.5,1)}
.qtrack span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--ff-n);
  font-size:9.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
/* ============ 좌우 레일 ============ */
.rail{position:absolute;top:96px;display:flex;flex-direction:column;gap:7px;width:74px}
.rail.l{left:12px;align-items:flex-start}
.rail.r{right:12px;align-items:flex-end}
.rbtn{position:relative;width:66px;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:5px 2px 3px;border-radius:12px;
  background:linear-gradient(180deg,rgba(58,29,48,.85),rgba(26,12,22,.85));
  border:1.5px solid rgba(122,58,92,.9); box-shadow:var(--sh-hud)}
.rbtn:active{transform:translateY(1px)}
.rbtn svg{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.rbtn em{font-style:normal;font-size:10px;font-weight:700;line-height:1.15;text-align:center;color:#f0dcd0;
  text-shadow:0 1px 2px #000}
.dot{position:absolute;top:-4px;right:-3px;width:16px;height:16px;border-radius:50%;
  background:linear-gradient(180deg,#ff5a5a,#c01020);border:1.5px solid #fff2f2;color:#fff;
  font:900 11px/13px var(--ff-b);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.dot.hide{display:none}
/* 금화 타이머 */
.goldtimer{position:absolute;left:12px;bottom:214px;width:78px;display:flex;flex-direction:column;align-items:center;gap:2px}
.goldtimer .ring{width:66px;height:66px;position:relative;display:grid;place-items:center}
.goldtimer .ring>svg{position:absolute;inset:0;width:66px;height:66px;transform:rotate(-90deg)}
.goldtimer .ci{position:relative;z-index:1;width:34px;height:34px;display:block}
.goldtimer .ci svg{width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.goldtimer .ring b{font-family:var(--ff-n);font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.gt-lab{font-family:var(--ff-n);font-size:11.5px;font-weight:700;color:#ffd98a;
  background:rgba(16,8,14,.8);border:1px solid #6a4a20;border-radius:6px;padding:1px 6px}
/* 보스 배너 */
#bossbanner{position:absolute;left:0;right:0;top:33%;z-index:56;text-align:center;pointer-events:none;opacity:0;padding:0 16px}
#bossbanner b{display:block;font-family:var(--ff-d);font-size:clamp(20px,6.4vw,28px);letter-spacing:.05em;
  color:#ffd3d8;text-shadow:0 0 22px rgba(212,33,63,.95),0 3px 0 #000;text-wrap:balance}
#bossbanner s{display:block;text-decoration:none;font-size:11px;font-weight:700;color:#ffb0bc;
  margin-top:4px;letter-spacing:.22em}
#bossbanner.play{animation:bb 2.4s ease-out}
@keyframes bb{0%{opacity:0;transform:scale(1.28)}12%{opacity:1;transform:scale(1)}74%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
/* 미니맵 */
.minimap{position:absolute;left:14px;bottom:312px;width:104px;height:104px;border-radius:12px;
  background:rgba(10,5,10,.74);border:1.5px solid #7a3a5c;box-shadow:var(--sh-hud);overflow:hidden}
.minimap canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.mm-lab{position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 9.5px var(--ff-n);
  background:rgba(10,5,10,.82);color:#ffd0d8;padding:1px 0;letter-spacing:.03em}
/* 조작 모드 버튼 */
.movemode{position:absolute;right:12px;bottom:214px;width:66px;padding:5px 2px 4px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:linear-gradient(180deg,rgba(58,29,48,.85),rgba(26,12,22,.85));
  border:1.5px solid rgba(122,58,92,.9);box-shadow:var(--sh-hud)}
.movemode:active{transform:translateY(1px)}
.movemode svg{width:32px;height:32px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.movemode .mi{display:grid;place-items:center}
.movemode .mi.auto{display:none}
.movemode.on .mi.man{display:none}
.movemode.on .mi.auto{display:grid}
.movemode.on{border-color:#3ddc84;box-shadow:var(--sh-hud),0 0 12px rgba(61,220,132,.3)}
.movemode em{font-style:normal;font-size:10px;font-weight:900;line-height:1.15;color:#f0dcd0;text-shadow:0 1px 2px #000}
.movemode.on em{color:#a8ffd0}
/* 버프 */
.buffchip{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;display:flex;gap:7px;
  align-items:center;background:linear-gradient(180deg,rgba(92,42,142,.94),rgba(40,14,70,.94));
  border:1.5px solid #c56bf0;border-radius:9px;padding:3px 12px;box-shadow:var(--sh-hud)}
.buffchip b{font-size:11.5px;color:#eec8ff}
.buffchip i{font-style:normal;font-family:var(--ff-n);font-size:12px;color:#fff}
/* 던전 지도 */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:#d8bccb;font-weight:700}
.legend i{width:13px;height:13px;border-radius:3px;display:block;border:1px solid rgba(0,0,0,.45)}
#dgCv{width:100%;height:auto;display:block;border-radius:12px;border:1.5px solid #5c2a45;background:#0b0610}
/* 보스 바 */
.bossbar{position:absolute;top:96px;left:92px;right:92px;
  opacity:0;transition:opacity .25s;text-align:center}
.bossbar.on{opacity:1}
.bossbar .bn{font-family:var(--ff-d);font-size:14px;letter-spacing:.04em;color:#ffd3d8;
  text-shadow:0 2px 0 #000,0 0 12px rgba(212,33,63,.8)}
.bosstrack{height:13px;border-radius:7px;background:#140810;border:1.5px solid #8a2038;overflow:hidden;position:relative}
.bossfill{position:absolute;inset:0;width:100%;background:linear-gradient(180deg,#ff7a8c,#d4213f 55%,#7a0f22);
  transition:width .12s linear}
/* ============ 하단 ============ */
.bottombar{position:absolute;left:0;right:0;bottom:0;padding:0 10px 12px;display:flex;gap:8px;align-items:flex-end}
.bbtn{position:relative;flex:1 1 0;height:64px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  background:linear-gradient(180deg,#4a2340,#26101f);border:2px solid #7a3a5c;box-shadow:var(--sh-hud)}
.bbtn.hot{background:linear-gradient(180deg,#7a1830,#3a0c18);border-color:#c0304c}
.bbtn:active{transform:translateY(2px)}
.bbtn svg{width:30px;height:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.bbtn em{font-style:normal;font-size:11px;font-weight:900;color:#f6e9df;text-shadow:0 1px 2px #000}
/* 하단 좌측 상태 */
.fieldinfo{position:absolute;left:0;right:0;bottom:86px;display:flex;justify-content:center;pointer-events:none}
.fieldinfo .chip{font-family:var(--ff-n);font-size:12px;font-weight:700;color:#ffe6ea;
  background:linear-gradient(180deg,rgba(122,15,34,.92),rgba(50,6,16,.92));
  border:1.5px solid #b0203c;border-radius:9px;padding:3px 12px;box-shadow:var(--sh-hud);
  font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.fieldinfo .chip s{text-decoration:none;color:#ffb3be;font-size:11px}
/* ============ 바텀시트 ============ */
.sheet{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  background:rgba(8,4,8,.72);backdrop-filter:blur(3px)}
.sheet.on{display:flex}
.sheet-head{margin-top:auto;display:flex;align-items:flex-end;gap:4px;padding:0 10px}
.sheet-tab{flex:1 1 0;height:42px;border-radius:12px 12px 0 0;display:grid;place-items:center;
  font-weight:900;font-size:14px;color:#c8a8ba;background:linear-gradient(180deg,#2c1524,#1a0c16);
  border:1.5px solid #5c2a45;border-bottom:0}
.sheet-tab.on{color:#2a1200;background:linear-gradient(180deg,#ffd07a,#e8901c);border-color:#ffe3a8;height:48px}
.sheet-body{height:min(62%,600px);background:linear-gradient(180deg,#2a1524,#1a0c16 40%,#160a13);
  border-top:2px solid #7a3a5c;padding:12px 12px 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-title h2{margin:0;font-family:var(--ff-d);font-size:19px;letter-spacing:.03em;color:#ffe0c8;
  text-shadow:0 2px 0 #000}
.sheet-title .sub{font-size:11px;color:var(--muted);font-weight:500}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:14px;scrollbar-width:thin;
  scrollbar-color:#6a3050 transparent}
.scroll::-webkit-scrollbar{width:5px}
.scroll::-webkit-scrollbar-thumb{background:#6a3050;border-radius:3px}
.closex{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(180deg,#4a2340,#1f0d1a);border:2px solid #8a4468;display:grid;place-items:center;
  font:900 22px/1 var(--ff-b);color:#e8cddc;box-shadow:0 6px 18px rgba(0,0,0,.6);z-index:2}
.sheet-body.pad{padding-bottom:70px}
/* 리스트 행 */
.row{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px;margin-bottom:7px;
  background:linear-gradient(180deg,#3a1d30,#241220);border:1.5px solid #5c2a45}
.row .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:radial-gradient(circle at 35% 25%,#5e2c4c,#2a1020);border:1.5px solid #7a3a5c}
.row .ic svg{width:26px;height:26px}
.row .meta{flex:1;min-width:0}
.row .nm{font-size:13px;font-weight:900;color:#ffeede;display:flex;gap:6px;align-items:baseline}
.row .nm i{font-style:normal;font-family:var(--ff-n);font-size:11.5px;color:var(--amethyst);font-weight:700}
.row .ds{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
.row .ds b{color:var(--jade);font-family:var(--ff-n)}
.buy{flex:0 0 auto;min-width:88px;height:42px;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  background:linear-gradient(180deg,#ffd07a,#e8901c);border:1.5px solid #ffe9bd;color:#2e1400;
  box-shadow:0 3px 0 #8a5208}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5208}
.buy em{font-style:normal;font-size:9.5px;font-weight:900;opacity:.75;line-height:1}
.buy b{font-family:var(--ff-n);font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px}
.buy b svg{width:13px;height:13px}
.buy.off{background:linear-gradient(180deg,#5a4a52,#33262d);border-color:#6b5a63;color:#a8949f;box-shadow:0 3px 0 #1e1519}
.buy.max{background:linear-gradient(180deg,#5c2a45,#2c1020);border-color:#7a3a5c;color:#c9a3b8;box-shadow:none}
/* 구매 배수 토글 */
.multi{display:flex;gap:5px;margin-bottom:9px}
.multi button{flex:1;height:30px;border-radius:9px;font-size:12px;font-weight:900;color:#c8a8ba;
  background:#241220;border:1.5px solid #5c2a45}
.multi button.on{color:#2a1200;background:linear-gradient(180deg,#ffd07a,#e8901c);border-color:#ffe3a8}
/* 그리드(장비/유물) */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(180deg,#2e1526,#1a0c16);border:2px solid var(--rc,#8d93a6);overflow:hidden}
.cell::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 115%,var(--rc) 0%,transparent 62%);opacity:.5}
.cell svg{width:64%;height:64%;position:relative;z-index:1}
.cell .q{position:absolute;right:2px;bottom:1px;font-family:var(--ff-n);font-size:10.5px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px #000;z-index:2}
.cell .eq{position:absolute;left:2px;top:2px;font-size:8.5px;font-weight:900;background:var(--jade);color:#062;
  border-radius:4px;padding:0 3px;z-index:2}
.cell .new{position:absolute;left:1px;bottom:1px;font-size:8px;font-weight:900;background:#d4213f;color:#fff;
  border-radius:3px;padding:0 3px;z-index:2}
/* 장비 착용 슬롯 */
.gearbox{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.gcol{display:flex;flex-direction:column;gap:6px}
.gslot{position:relative;height:52px;border-radius:11px;display:flex;align-items:center;gap:6px;padding:0 7px;
  background:linear-gradient(180deg,#2e1526,#1a0c16);border:2px solid var(--rc,#5c2a45)}
.gslot .mini{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center}
.gslot .mini svg{width:100%;height:100%}
.gslot .gi{min-width:0;text-align:left}
.gslot .gi b{display:block;font-family:var(--ff-n);font-size:11.5px;color:#ffeede;font-weight:700}
.gslot .gi s{display:block;text-decoration:none;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{width:100%;max-width:360px;border-radius:16px;overflow:hidden;

.stars{display:flex;gap:2px;justify-content:center;margin:8px 0}
.stars svg{width:18px;height:18px}
.cta{display:block;width:100%;height:46px;border-radius:12px;margin-top:12px;font-size:15px;font-weight:900;
  background:linear-gradient(180deg,#ffd07a,#e8901c);border:2px solid #ffe9bd;color:#2e1400;box-shadow:0 4px 0 #8a5208}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5208}
.cta.off{background:linear-gradient(180deg,#5a4a52,#33262d);border-color:#6b5a63;color:#a8949f;box-shadow:0 4px 0 #1e1519}
.cta.ghost{background:linear-gradient(180deg,#4a2340,#26101f);border-color:#8a4468;color:#e8cddc;box-shadow:0 4px 0 #1a0a14}
.ctarow{display:flex;gap:8px}
/* 토스트 */
#toasts{position:absolute;left:0;right:0;top:140px;z-index:60;display:flex;flex-direction:column;
  align-items:center;gap:5px;pointer-events:none}
.toast{font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(180deg,rgba(60,20,40,.95),rgba(26,8,18,.95));

  animation:tin .3s cubic-bezier(.2,1.5,.4,1)}

.toast.gold{border-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
/* 레벨업 배너 */
#lvbanner{position:absolute;left:0;right:0;top:38%;z-index:55;text-align:center;pointer-events:none;opacity:0}
#lvbanner b{font-family:var(--ff-d);font-size:34px;letter-spacing:.06em;color:#ffe9a8;

@keyframes lvb{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.02) translateY(-18px)}}
/* 월드맵 */
.mapwrap{background:linear-gradient(180deg,#e8d5a8,#cbb083);border-radius:12px;padding:10px;
  border:2px solid #8a6a3a;position:relative;overflow:hidden}

             repeating-linear-gradient(90deg,transparent 0 23px,rgba(120,90,50,.18) 23px 24px)}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:7px;
  border-radius:10px;background:rgba(46,22,14,.86);border:2px solid #8a6a3a}
.node.locked{filter:grayscale(.7) brightness(.62)}
.node.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(247,179,60,.35)}
.node .thumb{width:62px;height:44px;border-radius:8px;flex:0 0 auto;overflow:hidden;position:relative}
.node .ni{flex:1;min-width:0;text-align:left}
.node .ni b{display:block;font-size:13px;font-weight:900;color:#ffeede}
.node .ni s{display:block;text-decoration:none;font-size:10.5px;color:#d6b89a;margin-top:2px}
.node .go{flex:0 0 auto;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:900;

/* 미션 */
.mrow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px;margin-bottom:7px;
  background:linear-gradient(180deg,#3a1d30,#241220);border:1.5px solid #5c2a45}
.mrow .mi{flex:1;min-width:0}

.mfill{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#7dffb0,#22a35a)}
.mrow .rw{font-family:var(--ff-n);font-size:11px;color:var(--gold);margin-top:3px;display:flex;gap:8px}
.mrow .rw span{display:flex;align-items:center;gap:3px}
.mrow .rw svg{width:12px;height:12px}
/* 첨탑 */
.tower-hero{border-radius:14px;padding:14px;text-align:center;margin-bottom:10px;
  background:radial-gradient(120% 90% at 50% 0%,#5a1030,#26081a 70%);border:2px solid #8a2044}
.tower-hero .fl{font-family:var(--ff-d);font-size:30px;color:#ffd0d8;text-shadow:0 0 16px rgba(212,33,63,.9),0 3px 0 #000}
.tower-hero .fs{font-size:11.5px;color:#e0a0b0;margin-top:2px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.sbox{background:linear-gradient(180deg,#3a1d30,#241220);border:1.5px solid #5c2a45;border-radius:10px;padding:7px 9px}
.sbox s{display:block;text-decoration:none;font-size:10px;color:var(--muted)}
.sbox b{display:block;font-family:var(--ff-n);font-size:14px;color:#ffeede;font-variant-numeric:tabular-nums}
/* 설정 */
.optrow{display:flex;align-items:center;justify-content:space-between;padding:11px 10px;border-radius:11px;
  margin-bottom:7px;background:linear-gradient(180deg,#3a1d30,#241220);border:1.5px solid #5c2a45;font-size:13px;font-weight:700}
.sw{width:50px;height:27px;border-radius:14px;background:#2a1020;border:1.5px solid #6a3050;position:relative;transition:.18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#8a7080;transition:.18s}
.sw.on{background:linear-gradient(180deg,#3ddc84,#18a35a);border-color:#a8ffd0}
.sw.on::after{left:26px;background:#fff}
.tiny{font-size:10.5px;color:var(--dim);line-height:1.6;margin:10px 2px 0}
/* 좁은 화면: 재화 바를 두 줄로 내려 숫자가 잘리지 않게 함 */

  .topbar{flex-wrap:wrap;row-gap:5px}

  .gear{order:2;margin-left:auto}
  .pills{order:3;flex:0 0 100%;width:100%}
  .pill b{font-size:13px}
  .questbar{top:84px}
  .rail{top:138px}
  .bossbar{top:138px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* ============ 유물 — 받침대 진열장 + 등급 띠지 상세창 ============ */
.rl-top{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.rl-sum{flex:1;display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.rl-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:#1b0f28;
  border:1px solid #4a2a6a;font-family:var(--ff-n);font-size:11.5px;font-weight:700;color:#ecdcf5;white-space:nowrap}
.rl-chip svg{width:14px;height:14px}
.rl-auto{flex:0 0 auto;min-width:92px;height:42px;padding:0 10px;border-radius:11px;font-size:13px;font-weight:900;line-height:1.15;
  color:#062812;background:linear-gradient(180deg,#8dffbc,#22b45a);border:2px solid #c8ffdc;box-shadow:0 3px 0 #0d5a2a}
.rl-auto small{display:block;font-size:9.5px;font-weight:800;opacity:.8}
.rl-auto:active{transform:translateY(2px);box-shadow:0 1px 0 #0d5a2a}
.rl-auto.off{background:linear-gradient(180deg,#5a4a52,#33262d);border-color:#6b5a63;color:#a8949f;box-shadow:0 3px 0 #1e1519}
.rl-sec{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-family:var(--ff-d);font-size:13px;letter-spacing:.06em;color:var(--rc)}
.rl-sec i{font-style:normal;font-family:var(--ff-n);font-size:11px;color:var(--muted)}
.rl-sec::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--rc),transparent)}
.rl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 7px}
.rl-cell{position:relative;display:flex;flex-direction:column;align-items:center;padding:0;margin:0;background:none;border:0;color:inherit;cursor:pointer}
.rl-stage{position:relative;width:100%;aspect-ratio:1/.9;display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(ellipse 62% 55% at 50% 84%,var(--rg),transparent 72%)}
.rl-ic{position:relative;z-index:2;width:60%;aspect-ratio:1;margin-bottom:17%;filter:drop-shadow(0 6px 5px rgba(0,0,0,.75));transition:transform .12s}
.rl-ic svg{width:100%;height:100%;display:block}
.rl-disc{position:absolute;z-index:1;left:13%;right:13%;bottom:9%;height:16%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.75) 0%,var(--rc) 32%,var(--rd) 100%);
  box-shadow:0 0 16px var(--rc),inset 0 -3px 0 rgba(0,0,0,.35)}
.rl-plinth{position:absolute;left:7%;right:7%;bottom:0;height:15%;border-radius:0 0 7px 7px;
  background:linear-gradient(180deg,#7a5440 0%,#4a2c1e 70%,#2e1a10 100%);box-shadow:inset 0 2px 0 rgba(255,220,180,.18)}
.rl-plate{position:relative;z-index:2;width:100%;margin-top:-1px;padding:4px 2px 5px;border-radius:7px;text-align:center;
  background:linear-gradient(180deg,#6247ad,#3b2677);border:2px solid #170d2a;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.rl-stars{display:flex;justify-content:center;gap:1px}
.rl-stars svg{width:12px;height:12px}
.rl-nm{display:block;margin-top:2px;font-size:10.5px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
.rl-cell.off .rl-ic{filter:grayscale(1) brightness(.42) drop-shadow(0 6px 5px rgba(0,0,0,.75))}
.rl-cell.off .rl-disc{opacity:.4;box-shadow:none}
.rl-cell.off .rl-stage{background:none}
.rl-cell:active .rl-ic{transform:scale(.92)}
.rl-up{position:absolute;right:1px;top:1px;z-index:3;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-size:13px;font-weight:900;color:#062812;background:linear-gradient(180deg,#8dffbc,#22b45a);border:2px solid #0d5a2a}
.rl-effh{margin:16px 0 8px}
/* 상세창 */
.rl-m{position:relative;padding:30px 14px 14px}
.rl-rib{position:absolute;left:50%;top:0;transform:translateX(-50%);padding:4px 34px 6px;white-space:nowrap;
  font-family:var(--ff-d);font-size:14px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6);
  background:linear-gradient(180deg,var(--rc),var(--rd));clip-path:polygon(0 0,100% 0,90% 100%,10% 100%)}
.rl-x{position:absolute;right:8px;top:7px;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.35);color:#fff;font-size:14px;line-height:1}
.rl-m h3{margin:4px 0 12px}
.rl-row{display:flex;gap:10px;align-items:stretch}
.rl-thumb{flex:0 0 94px}
.rl-box{width:94px;height:94px;border-radius:11px;border:3px solid var(--rc);display:grid;place-items:center;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.2),transparent 58%),radial-gradient(circle at 50% 115%,var(--rc),#1b0f28 72%);
  box-shadow:0 0 18px var(--rg)}
.rl-box svg{width:62px;height:62px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.6))}
.rl-box.off svg{filter:grayscale(1) brightness(.5)}
.rl-pc{margin-top:6px;height:24px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;border-radius:12px;
  background:#5a1320;border:2px solid #8e2233;font-family:var(--ff-n);font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.rl-pc svg{width:14px;height:14px}
.rl-lore{flex:1;font-size:11.5px;line-height:1.6;color:#dcc8ea;background:#1b0f28;border:1px solid #4a2a6a;border-radius:10px;padding:9px 10px}
.rl-lv{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0;font-size:11.5px;font-weight:800;color:#bcd0ff}
.rl-lv .stars{margin:0}
.rl-nx{margin-left:6px;color:#7ee08a}
.rl-foot{margin-top:12px;padding:12px 10px;border-radius:10px;background:#1b0f28;border:1px solid #4a2a6a;text-align:center;
  font-size:14px;font-weight:900;color:#fff;line-height:1.5}
.rl-foot em{font-style:normal;font-family:var(--ff-n);color:#ff5a6e}
.rl-cost{display:flex;justify-content:center;gap:12px;margin-top:7px;font-family:var(--ff-n);font-size:11.5px;font-weight:700}
.rl-cost span{display:inline-flex;align-items:center;gap:3px}
.rl-cost svg{width:13px;height:13px}
.rl-cost .ok{color:#4ade80}.rl-cost .no{color:#ff7a8c}
/* 칸 아래 조각 진행 막대 */
.rl-bar{display:block;height:4px;margin:3px 4px 0;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
.rl-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffd07a,#f7b33c)}
.rl-bar.full i{background:linear-gradient(90deg,#8dffbc,#22b45a)}
/* 상자 · 도감 카드 */
.rl-card{margin:10px 0 2px;padding:10px;border-radius:12px;background:linear-gradient(180deg,#2c1840,#1b0f28);border:1px solid #5a3a82}
.rl-card-h{display:flex;align-items:center;gap:9px}
.rl-card-h .ci{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;background:#12091c;border:1px solid #4a2a6a}
.rl-card-h .ci svg{width:28px;height:28px}
.rl-card-h b{display:block;font-family:var(--ff-d);font-size:15px;color:#ffe0c8;letter-spacing:.03em}
.rl-card-h s{display:block;text-decoration:none;font-size:10.5px;color:var(--muted);margin-top:1px}
.rl-card-h .grow{flex:1;min-width:0}
.rl-mini{flex:0 0 auto;height:28px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:800;color:#e8cddc;background:#3a1d30;border:1px solid #8a4468}
.rl-buy4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.rl-buy{height:46px;border-radius:10px;font-size:12px;font-weight:900;line-height:1.25;color:#2e1400;
  background:linear-gradient(180deg,#ffd07a,#e8901c);border:2px solid #ffe9bd;box-shadow:0 3px 0 #8a5208}
.rl-buy.dust{color:#f5e8ff;background:linear-gradient(180deg,#b27cf0,#6a36b8);border-color:#dcc0ff;box-shadow:0 3px 0 #34175e}
.rl-buy span{display:inline-flex;align-items:center;gap:2px;font-family:var(--ff-n);font-size:11px}
.rl-buy svg{width:12px;height:12px}
.rl-buy:active{transform:translateY(2px);box-shadow:0 1px 0 #3a2208}
.rl-buy.off{filter:grayscale(1) brightness(.6)}
.rl-prog{height:8px;margin-top:9px;border-radius:5px;background:#12091c;border:1px solid #4a2a6a;overflow:hidden}
.rl-prog i{display:block;height:100%;background:linear-gradient(90deg,#c56bf0,#ff5470)}
.rl-claim{width:100%;margin-top:8px;height:38px}
/* 도감 목록 */
.rl-cx{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-top:6px;border-radius:9px;background:#1b0f28;border:1px solid #4a2a6a;font-size:12px;font-weight:700}
.rl-cx .n{flex:0 0 58px;font-family:var(--ff-n);color:#bcd0ff}
.rl-cx .e{flex:1;color:#ecdcf5}
.rl-cx .g{font-family:var(--ff-n);color:#8adff5}
.rl-cx.done{border-color:#22b45a;background:#10241a}
.rl-cx.done .n{color:#7ee08a}
.rl-cx.got .g{color:#5c7a6a;text-decoration:line-through}
/* 뽑기 결과 */
.rl-loot{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.rl-loot .lt{position:relative;padding:6px 2px 5px;border-radius:9px;text-align:center;border:2px solid var(--rc);
  background:radial-gradient(circle at 50% 30%,var(--rg),#150b20 75%);animation:rlPop .38s cubic-bezier(.2,1.5,.4,1) both}
.rl-loot .lt svg{width:34px;height:34px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))}
.rl-loot .lt b{display:block;font-size:9.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-loot .lt span{font-family:var(--ff-n);font-size:11px;font-weight:700;color:#ffd07a}
.rl-loot .lt.hi{box-shadow:0 0 14px var(--rc)}
/* 신화 전용 — 화면 번쩍임 + 카드 둘레를 도는 불빛 */
.rl-m.myth::before{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.95),rgba(239,68,68,.75) 32%,transparent 72%);animation:rlMythFlash 1.1s ease-out .35s both}
@keyframes rlMythFlash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.rl-m.myth .rl-rib{animation:rlGlow 1.4s ease-out .4s both;background:linear-gradient(180deg,#ff6a5a,#8a0f1a)}
.rl-loot .lt.myth{overflow:hidden;isolation:isolate;background:none;box-shadow:0 0 18px #ef4444,0 0 36px rgba(239,68,68,.5);
  animation:rlMythIn .7s cubic-bezier(.2,1.6,.4,1) both}
.rl-loot .lt.myth::before{content:"";position:absolute;inset:-60%;z-index:-2;
  background:conic-gradient(from 0deg,transparent 0 50deg,#ff5a4d 80deg,transparent 110deg 230deg,#ffd07a 260deg,transparent 290deg);animation:rlSpin 1.8s linear infinite}
.rl-loot .lt.myth::after{content:"";position:absolute;inset:2px;z-index:-1;border-radius:7px;background:radial-gradient(circle at 50% 30%,rgba(239,68,68,.6),#150b20 75%)}
@keyframes rlSpin{to{transform:rotate(360deg)}}
@keyframes rlMythIn{0%{transform:scale(.2) rotate(-25deg);opacity:0;filter:brightness(4)}60%{transform:scale(1.18) rotate(4deg);opacity:1}100%{transform:scale(1);filter:none}}
@keyframes rlPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 돌파 성공 연출 */
.rl-thumb{position:relative}
.rl-box{position:relative}
.rl-burst{position:absolute;left:50%;top:47px;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;pointer-events:none;z-index:3;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,var(--rc) 28%,transparent 64%);animation:rlBurst .85s ease-out forwards}
.rl-rays{position:absolute;left:50%;top:47px;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;pointer-events:none;z-index:2;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0deg 7deg,transparent 7deg 30deg);
  -webkit-mask:radial-gradient(circle,transparent 22%,#000 26%,transparent 68%);mask:radial-gradient(circle,transparent 22%,#000 26%,transparent 68%);
  animation:rlRays 1.2s ease-out forwards}
@keyframes rlBurst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes rlRays{0%{transform:rotate(0) scale(.5);opacity:.95}100%{transform:rotate(70deg) scale(1.25);opacity:0}}
.rl-m.fx .rl-box{animation:rlShake .45s ease-out}
@keyframes rlShake{0%,100%{transform:none}25%{transform:scale(1.12) rotate(-3deg)}55%{transform:scale(.96) rotate(2deg)}}
.rl-lv .stars .pop{display:inline-flex;animation:rlStar .7s cubic-bezier(.2,1.7,.4,1) .3s both}
@keyframes rlStar{0%{transform:scale(0) rotate(-120deg);filter:brightness(3)}100%{transform:scale(1) rotate(0);filter:none}}
.rl-m.fx h3{animation:rlGlow 1.1s ease-out}
@keyframes rlGlow{0%{text-shadow:0 0 0 var(--rc)}35%{text-shadow:0 0 18px var(--rc),0 0 30px var(--rc)}100%{text-shadow:0 2px 0 #000}}
/* 장비 진열 — 유물과 같은 받침대 */
.rl-cell .rl-lvl{display:block;font-family:var(--ff-n);font-size:10.5px;font-weight:700;color:#ffd07a;line-height:1.1}
.rl-tag{position:absolute;top:1px;z-index:3;padding:1px 5px;border-radius:5px;font-size:9px;font-weight:900}
.rl-tag.eq{left:1px;background:var(--jade);color:#062812}
.rl-tag.new{right:1px;background:#d4213f;color:#fff}
</style>

<div id="frame">
  <canvas id="stage"></canvas>

  <div class="hud">
    <!-- 상단 재화 -->
    <div class="topbar">
      <div class="avatar">
        <canvas class="face" id="faceCv" width="60" height="60"></canvas>
        <span class="lv">LV.<b id="uiLv">1</b></span>
      </div>
      <div class="pills">
        <button class="pill" data-open="shop" aria-label="젬 — 상점 열기"><span data-ic="gem"></span><b id="uiGem">0</b></button>
        <button class="pill" data-open="upgrade" aria-label="피 — 업그레이드 열기"><span data-ic="blood"></span><b id="uiBlood">0</b></button>
        <button class="pill" data-open="alchemy" aria-label="금화 — 연금술 열기"><span data-ic="coin"></span><b id="uiGold">0</b></button>
        <button class="pill" data-open="gear" aria-label="소환권 — 장비 열기"><span data-ic="ticket"></span><b id="uiTicket">0</b></button>
      </div>
      <button class="gear" id="btnSettings" aria-label="설정"><span data-ic="gear"></span></button>
    </div>

    <!-- 퀘스트 -->
    <button class="questbar" id="btnQuest">
      <span class="qicon"><span data-ic="questsword"></span></span>
      <span class="qtitle"><i id="qIdx">1.</i><span id="qName">첫 사냥을 시작하기</span></span>
      <span class="qtrack"><span class="qfill" id="qFill"></span><span id="qNum">0/10</span></span>
    </button>

    <!-- 좌측 레일 -->
    <div class="rail l">
      <button class="rbtn" id="btnAlchemy"><span data-ic="flask"></span><em>연금술</em><span class="dot hide" id="dotAlchemy">!</span></button>
      <button class="rbtn" id="btnRelic"><span data-ic="relicgem"></span><em>유물</em><span class="dot hide" id="dotRelic">!</span></button>
      <button class="rbtn" id="btnGift"><span data-ic="gift"></span><em>보상함</em><span class="dot hide" id="dotGift">!</span></button>
    </div>

    <!-- 우측 레일 -->
    <div class="rail r">
      <button class="rbtn" id="btnMap"><span data-ic="map"></span><em>월드 맵</em></button>
      <button class="rbtn" id="btnMission"><span data-ic="clipboard"></span><em>미션 센터</em><span class="dot hide" id="dotMission">!</span></button>
      <button class="rbtn" id="btnStats"><span data-ic="scroll"></span><em>능력치</em></button>
    </div>

    <!-- 금화 타이머 -->
    <div class="goldtimer">
      <div class="ring">
        <svg viewBox="0 0 66 66" aria-hidden="true">
          <circle cx="33" cy="33" r="28" fill="rgba(20,10,16,.8)" stroke="#5c3a12" stroke-width="5"></circle>
          <circle id="gtArc" cx="33" cy="33" r="28" fill="none" stroke="#f7b33c" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="0"></circle>
        </svg>
        <i class="ci"><span data-ic="coinbig"></span></i>
      </div>
      <span class="gt-lab" id="gtLab">+0</span>
    </div>

    <!-- 조작 모드 -->
    <button class="movemode" id="btnMove" aria-label="조작 모드 바꾸기">
      <i class="mi man"><span data-ic="pad"></span></i>
      <i class="mi auto"><span data-ic="autoplay"></span></i>
      <em id="mmMode">수동</em>
    </button>

    <!-- 보스 -->
    <div class="bossbar" id="bossBar">
      <div class="bn" id="bossName">보스</div>
      <div class="bosstrack"><div class="bossfill" id="bossFill"></div></div>
    </div>

    <!-- 미니맵 -->
    <div class="minimap"><canvas id="miniCv" width="170" height="170"></canvas><span class="mm-lab" id="mmLab">1-1</span></div>

    <!-- 버프 -->
    <div class="buffchip" id="buffChip" hidden><b>광폭화</b><i id="buffT">25초</i></div>

    <!-- 필드 상태 -->
    <div class="fieldinfo"><div class="chip" id="fieldChip"><s id="fiStage">1-1</s><span id="fiKill">0 / 10</span></div></div>

    <!-- 하단 -->
    <div class="bottombar">
      <button class="bbtn" id="btnShop"><span data-ic="shop"></span><em>상점</em></button>
      <button class="bbtn" id="btnGear"><span data-ic="chest"></span><em>장비</em><span class="dot hide" id="dotGear">!</span></button>
      <button class="bbtn" id="btnTower"><span data-ic="tower"></span><em>피의 첨탑</em></button>
      <button class="bbtn hot" id="btnUpgrade"><span data-ic="upsword"></span><em>업그레이드</em><span class="dot hide" id="dotUp">!</span></button>
    </div>

    <div id="toasts"></div>
    <div id="lvbanner"><b>LEVEL UP!</b></div>
    <div id="bossbanner"><b id="bbName"></b><s id="bbSub"></s></div>
  </div>

  <!-- 바텀시트 -->
  <div class="sheet" id="sheet">
    <div class="sheet-head" id="sheetHead"></div>
    <div class="sheet-body pad">
      <div class="sheet-title"><h2 id="sheetTitle">제목</h2><span class="sub" id="sheetSub"></span></div>
      <div class="scroll" id="sheetScroll"></div>
    </div>
    <button class="closex" id="sheetClose" aria-label="닫기">✕</button>
  </div>

  <!-- 상세 모달 -->
  <div class="modal" id="modal">
    <div class="card" id="modalCard"></div>
  </div>
</div>

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const UNITS = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc','QiDc','SxDc','SpDc','OcDc','NoDc','Vg'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 0) return '-' + fmt(-n);
  if(n < 1000) return n < 10 ? String(Math.round(n*10)/10).replace(/\.0$/,'') : String(Math.floor(n));
  let t = Math.floor(Math.log10(n)/3);
  if(t >= UNITS.length){                       /* 단위표 밖의 수는 지수 표기 */
    const e = Math.floor(Math.log10(n));
    return (n/Math.pow(10,e)).toFixed(2) + 'e' + e;
  }
  const v = n / Math.pow(1000,t);
  return (v<10 ? v.toFixed(2) : v<100 ? v.toFixed(1) : String(Math.floor(v))) + UNITS[t];
}
function pct(v){ return (Math.round(v*10)/10) + '%'; }
function mul(v){ return '×' + (v<10 ? v.toFixed(2) : fmt(v)); }

const rnd = (a,b) => a + Math.random()*(b-a);
const rint = (a,b) => Math.floor(rnd(a,b+1));

<script>
"use strict";
/* ============================ 상태 & 저장 ============================ */
const SAVE_KEY = 'bloodmoon.sanctum.v1';
function freshState(){
  return {
    v:1, lv:1, exp:0,
    gem:40, blood:150, gold:500, ticket:12, shard:0,
    up:{}, alch:{}, relics:{}, inv:[], equip:{}, nextItemId:1, secret:{},
    stage:1, wave:1, waveKills:0, maxStage:1,
    quest:0, missions:{}, mail:{},
    tower:{floor:1, best:0},
    stats:{kills:0, bosses:0, summons:0, playtime:0, dmg:0},
    relicV:2, relicPity:0, codex:{},
    opt:{sfx:true, fx:true, autoEquip:true, sleep:true, sleepMin:10, autoMove:true}, optV2:1,
    lastSave:now(), firstSeen:now()
  };
}
let S = freshState();

function saveNow(){
  S.lastSave = now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadSave(raw){
  try{
    const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if(!o || typeof o !== 'object') return false;
    S = Object.assign(freshState(), o);
    S.opt = Object.assign({sfx:true,fx:true,autoEquip:true,sleep:true,sleepMin:10,autoMove:true}, o.opt||{});
    /* 수동이 기본이던 판을 한 번만 자동으로 되돌림 (수동은 화면 버튼으로 언제든) */
    if(!o.optV2){ S.opt.autoMove = true; S.optV2 = 1; }
    S.stats = Object.assign({kills:0,bosses:0,summons:0,playtime:0,dmg:0}, o.stats||{});
    S.tower = Object.assign({floor:1,best:0}, o.tower||{});
    /* 유물 개편 이전 — 성급은 그대로 두고, 공용 조각은 '유물 가루'로 이어 씀 */
    if(!S.codex || typeof S.codex !== 'object') S.codex = {};
    if(!(S.relicPity >= 0)) S.relicPity = 0;
    for(const k in S.relics){ const e = S.relics[k] || {}; S.relics[k] = {star: e.star||0, pc: e.pc||0}; }
    if(!o.relicV){ S.relicV = 2; window.__relicMigrated = true; }
    return true;
  }catch(e){ return false; }
}

/* ============================ 파생 능력치 ============================ */
const ST = {};   // 계산된 능력치

/* ---- 수치 폭주 방지 ----
   배수가 겹쳐 능력치가 무한대(Infinity)가 되면 무한대 - 무한대 = NaN 이 되어
   체력이 줄지도 늘지도 않고, 플레이어도 보스도 영원히 죽지 않는 상태가 됨.
   그래서 모든 수치를 유한한 상한 안에 묶어 둠. 적 상한을 낮게 두어
   끝까지 자란 캐릭터가 손해를 보지 않도록 함. */
const STAT_CAP = 1e150;   // 플레이어 능력치 상한
const FOE_CAP  = 1e120;   // 적 체력·피해 상한 (반드시 STAT_CAP 보다 낮게)
function capNum(v, cap, dflt){
  if(typeof v !== 'number' || v !== v) return dflt;   // NaN
  if(v > cap) return cap;                             // Infinity 포함
  return v < 0 ? 0 : v;
}
/* 저장값·진행 상태가 무한대나 NaN 으로 망가졌으면 되돌림 */
function clampNums(){
  for(const k of ['gem','blood','gold','ticket','shard']) S[k] = capNum(S[k], STAT_CAP, 0);
  /* 경험치는 한 번에 얻을 수 있는 최대치(FOE_CAP)까지만 쌓임.
     이보다 크게 쌓이면 레벨이 처치할 때마다 200씩 튀어 오름 */
  S.exp = capNum(S.exp, FOE_CAP, 0);
  S.stats.dmg = capNum(S.stats.dmg, STAT_CAP, 0);
  if(!(S.lv >= 1)) S.lv = 1;
  if(!(S.stage >= 1)) S.stage = 1;
  if(!(S.maxStage >= 1)) S.maxStage = 1;
}
function totalUpgLv(){ let t=0; for(const k in S.up) t+=S.up[k]; return t; }
function relicStars(){ let t=0; for(const k in S.relics) t+=(S.relics[k].star||0); return t; }
function expNeed(lv){
  /* 상한이 없으면 레벨 2700쯤부터 요구 경험치가 얻을 수 있는 최대치를 넘어가고,
     5600쯤에는 무한대가 되어 레벨업이 영영 불가능해짐. 그래서 유한하게 묶어 둠. */
  const v = Math.floor(28 * Math.pow(1.135, lv-1));
  return v > FOE_CAP || !(v > 0) ? FOE_CAP : v;
}

function applyRelicEff(e, star, acc){
  const v = e.v * star;
  switch(e.k){
    case '공격력':        acc.atkMul   *= 1+v; break;
    case '최대 체력':      acc.hpMul    *= 1+v; break;
    case '금화 획득':      acc.goldMul  *= 1+v; break;
    case '피 획득':        acc.bloodMul *= 1+v; break;
    case '경험치 획득':    acc.expMul   *= 1+v; break;
    case '치명타 확률':    acc.crit     += v;   break;
    case '치명타 피해':    acc.cdmg     += v;   break;
    case '공격 속도':      acc.aspdPct  += v;   break;
    case '이동 속도':      acc.movePct  += v;   break;
    case '흡혈':          acc.vamp     += v;   break;
    case '체력 재생':      acc.regenPct += v;   break;
    case '획득 범위':      acc.pickPct  += v;   break;
    case '회피 확률':      acc.dodge    += v;   break;
    case '모든 피해':      acc.allDmg   *= 1+v/100; break;
    case '보스 추가 피해':  acc.bossDmg  *= 1+v/100; break;
    case '투사체 관통':    acc.pierce   += v/100; break;
    case '처치 시 추가 피': acc.bloodMul *= 1+v/100; break;
    case '금화 자동 수급':  acc.goldTick += v/100; break;
    case '적재 한도':      acc.cap      *= 1+v; break;
    case '피해 감소':      acc.dr       += v;   break;
    case '공격 사거리':    acc.rangePct += v;   break;
    case '적 이동 감속':    acc.slow     += v;   break;
    case '부활 속도':      acc.revive   += v;   break;
    case '처치 시 회복':    acc.killHeal += v;   break;
    case '광폭화 시간':    acc.buffDur  += v;   break;
    case '소환 행운':      acc.luck     += v;   break;
    case '처치 시 폭발':    acc.boom     += v;   break;
  }
}
function itemPower(it){
  const sl = SLOTMAP[it.s], r = RAR[it.r];
  const scale = r.p * (1 + it.lv*0.075) * 0.30;
  return { atk: sl.aw*scale, hp: sl.hw*scale };
}
function recalc(){
  const L = id => S.up[id]||0, A = id => S.alch[id]||0;
  const acc = {atkMul:1,hpMul:1,goldMul:1,bloodMul:1,expMul:1,crit:0,cdmg:0,aspdPct:0,movePct:0,
               vamp:0,regenPct:0,pickPct:0,dodge:0,allDmg:1,bossDmg:1,pierce:0,goldTick:0,cap:1,
               dr:0,rangePct:0,slow:0,revive:0,killHeal:0,buffDur:0,luck:0,boom:0};
  /* 유물 */
  for(const r of RELICS){
    const st = (S.relics[r.id]||{}).star||0; if(!st) continue;
    for(const b of r.base) applyRelicEff(b, st, acc);
    applyRelicEff(r.sp, st, acc);
  }
  /* 유물 도감 · 등급 세트 */
  const awake = relicAwake();
  for(const c of CODEX) if(awake >= c.need) applyRelicEff(c, 1, acc);
  for(const k in CODEX_SET) if(codexSetDone(k)) applyRelicEff(CODEX_SET[k], 1, acc);
  /* 장비 */
  for(const sl of SLOTS){
    const it = S.equip[sl.id]; if(!it) continue;
    const p = itemPower(it);
    acc.atkMul *= 1 + p.atk; acc.hpMul *= 1 + p.hp;
  }
  /* 연금술 */
  acc.atkMul   *= 1 + A('a_atk')*0.25;
  acc.hpMul    *= 1 + A('a_hp')*0.30;
  acc.bloodMul *= 1 + A('a_blood')*0.35;
  acc.goldMul  *= 1 + A('a_gold')*0.35;
  acc.expMul   *= 1 + A('a_exp')*0.30;
  acc.aspdPct  += A('a_aspd')*6;

  const lvBonus = 1 + (S.lv-1)*0.035;
  ST.atk    = 26 * Math.pow(1.12, L('atk')) * lvBonus * acc.atkMul * acc.allDmg;
  ST.maxHp  = 160 * Math.pow(1.115, L('hp')) * lvBonus * acc.hpMul;
  ST.aspd   = (1.1 + L('aspd')*0.035) * (1 + acc.aspdPct/100);
  ST.crit   = clamp(5 + L('crit')*0.6 + acc.crit, 0, 92);
  ST.cdmg   = 150 + L('cdmg')*7 + acc.cdmg;
  ST.proj   = 1 + L('proj');
  ST.range  = (150 + L('range')*7) * (1 + acc.rangePct/100);
  ST.move   = 118 * (1 + L('move')*0.03 + acc.movePct/100);
  ST.regen  = (0.4 + L('regen')*0.18 + acc.regenPct)/100;
  ST.vamp   = (L('vamp')*0.35 + acc.vamp)/100;
  ST.goldMul= (1 + L('gold')*0.12) * acc.goldMul;
  ST.expMul = (1 + L('exp')*0.12) * acc.expMul;
  ST.pick   = (180 + L('pick')*14) * (1 + acc.pickPct/100);
  ST.dodge  = clamp(acc.dodge, 0, 60);
  ST.bossDmg= acc.bossDmg;
  ST.pierce = acc.pierce;
  ST.bloodMul = acc.bloodMul;
  ST.goldTick = acc.goldTick;
  ST.cap    = acc.cap;
  /* 무한대·NaN 방지 — 어떤 배수를 곱해도 유한하게 유지함 */
  ST.atk      = capNum(ST.atk,      STAT_CAP, 26);
  ST.maxHp    = capNum(ST.maxHp,    STAT_CAP, 160);
  ST.aspd     = capNum(ST.aspd,     1e4,  1.1);
  ST.cdmg     = capNum(ST.cdmg,     1e9,  150);
  ST.range    = capNum(ST.range,    1e5,  150);
  ST.move     = capNum(ST.move,     1e5,  118);
  ST.pick     = capNum(ST.pick,     1e5,  180);
  ST.goldMul  = capNum(ST.goldMul,  STAT_CAP, 1);
  ST.expMul   = capNum(ST.expMul,   STAT_CAP, 1);
  ST.bloodMul = capNum(ST.bloodMul, STAT_CAP, 1);
  ST.bossDmg  = capNum(ST.bossDmg,  1e6, 1);
  ST.vamp     = capNum(ST.vamp,     1,   0);
  ST.regen    = capNum(ST.regen,    1,   0);
  ST.dr       = clamp(acc.dr, 0, 70);        /* 받는 피해 감소 % */
  ST.slow     = clamp(acc.slow, 0, 55);      /* 적 이동 감속 % */
  ST.revive   = clamp(acc.revive, 0, 70);    /* 부활 대기 단축 % */
  ST.killHeal = acc.killHeal;                /* 처치당 최대 체력 % 회복 */
  ST.buffDur  = capNum(acc.buffDur, 400, 0); /* 광폭화 지속 시간 % 증가 */
  ST.luck     = capNum(acc.luck,    300, 0); /* 소환 등급 행운 */
  ST.boom     = capNum(acc.boom,   1e4, 0);  /* 처치 시 폭발 — 공격력 대비 % */
}

/* 스테이지 난이도 곡선 */
const themeOf = s => STAGES[(s-1) % STAGES.length];
const CYC = ['','','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
function stageName(s){ const c = Math.floor((s-1)/STAGES.length)+1; return themeOf(s).n + (c>1 ? ' '+(CYC[c]||c) : ''); }
function eHp(s,w){   return 58   * Math.pow(1.92, s-1) * Math.pow(1.12, w-1); }
function eDmg(s,w){  return 11   * Math.pow(1.86, s-1) * Math.pow(1.10, w-1); }
function eExp(s,w){  return 9    * Math.pow(1.80, s-1) * Math.pow(1.08, w-1); }
function eGold(s,w){ return 16   * Math.pow(1.74, s-1) * Math.pow(1.07, w-1); }
function eBlood(s,w){return 7    * Math.pow(1.80, s-1) * Math.pow(1.08, w-1); }
function goldPerTick(){ return eGold(S.maxStage, 6) * 14 * ST.goldMul * (1 + ST.goldTick); }

/* ============================ 퀘스트 체인 ============================ */
function questDef(i){
  const k = i % 5, t = Math.floor(i/5);
  const rw = { blood: Math.floor(90 * Math.pow(1.46, i)), gem: 1 + Math.floor(i/4) };
  switch(k){
    case 0: return {n:'적 처치하기', unit:'마리', need: 25 + i*22 + i*i*3, get:()=>S.stats.kills, rw};
    case 1: return {n:'캐릭터 레벨 달성하기', unit:'레벨', need: 4 + i*2 + t, get:()=>S.lv, rw};
    case 2: return {n:'업그레이드 총 레벨 달성하기', unit:'레벨', need: 10 + i*7, get:()=>totalUpgLv(), rw};
    case 3: return {n:'스테이지 도달하기', unit:'', need: 2 + Math.floor(i/4), get:()=>S.maxStage, rw};
    default:return {n:'장비 소환하기', unit:'회', need: 5 + i*4, get:()=>S.stats.summons, rw};
  }
}

/* ============================ 사운드 ============================ */
let AC = null;
function sfx(type){
  if(!S.opt.sfx) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const P2 = {
      hit:[180,90,.045,'square',.035], crit:[520,180,.09,'sawtooth',.05], kill:[120,46,.10,'triangle',.045],
      coin:[880,1320,.07,'sine',.035], lvup:[440,1320,.30,'triangle',.06], buy:[620,880,.08,'square',.04],
      boss:[90,40,.45,'sawtooth',.06], gate:[160,520,.35,'triangle',.055], altar:[330,990,.28,'sine',.05],
    }[type] || [300,200,.05,'sine',.03];
    o.type = P2[3];
    o.frequency.setValueAtTime(P2[0], t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,P2[1]), t+P2[2]);
    g.gain.setValueAtTime(P2[4], t);
    g.gain.exponentialRampToValueAtTime(.0001, t+P2[2]);
    o.start(t); o.stop(t+P2[2]+.02);
  }catch(e){}
}

const CELL = 96, WALL = 0, FLOOR = 1, GATE = 2;
const MAP = { w:30, h:30, g:null, rooms:[], start:null, bossRoom:null, altars:[], chests:[],
              gateOpen:false, gateCells:[], tint:null, roomMask:null, startAt:null, note:'' };
const M2PX = 4;                                   /* 4px = 1m */
const inMap = (cx,cy) => cx>=0 && cy>=0 && cx<MAP.w && cy<MAP.h;
const gi = (cx,cy) => cy*MAP.w + cx;
function walkable(cx,cy){
  if(!inMap(cx,cy)) return false;
  const v = MAP.g[gi(cx,cy)];
  return v === FLOOR || (v === GATE && MAP.gateOpen);
}
const solid = (cx,cy) => !walkable(cx,cy);
const cellOf = (x,y) => ({cx:Math.floor(x/CELL), cy:Math.floor(y/CELL)});
const centerOf = (cx,cy) => ({x:cx*CELL+CELL/2, y:cy*CELL+CELL/2});
const roomCenter = r => centerOf(r.cx, r.cy);

function carve(x,y,w,h){
  for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++)
    if(inMap(i,j)) MAP.g[gi(i,j)] = FLOOR;
}
function bfsField(cells){
  const n = MAP.w*MAP.h, dist = new Int32Array(n).fill(-1), q = new Int32Array(n);
  let head = 0, tail = 0;
  for(const c of cells){ if(c>=0 && c<n){ dist[c] = 0; q[tail++] = c; } }
  while(head < tail){
    const c = q[head++], cx = c % MAP.w, cy = (c - cx)/MAP.w, d = dist[c]+1;
    for(let k=0;k<4;k++){
      const nx = cx + [1,-1,0,0][k], ny = cy + [0,0,1,-1][k];
      if(!walkable(nx,ny)) continue;
      const ni = gi(nx,ny);
      if(dist[ni] !== -1) continue;
      dist[ni] = d; q[tail++] = ni;
    }
  }
  return dist;
}
function parseMap(rows){
  MAP.w = rows[0].length; MAP.h = rows.length;
  MAP.g = new Uint8Array(MAP.w*MAP.h);
  MAP.rooms = []; MAP.altars = []; MAP.chests = []; MAP.gateCells = []; MAP.gateOpen = false; MAP.tint = null;
  const roomMask = new Uint8Array(MAP.w*MAP.h), bossMask = new Uint8Array(MAP.w*MAP.h);
  const alt = [], box = []; let sx = 1, sy = 1;
  for(let y=0;y<MAP.h;y++) for(let x=0;x<MAP.w;x++){
    const ch = rows[y][x], k = gi(x,y);
    if(ch === '#'){ MAP.g[k] = WALL; continue; }
    if(ch === 'G'){ MAP.g[k] = GATE; MAP.gateCells.push(k); continue; }
    MAP.g[k] = FLOOR;
    if(ch === '.') continue;
    roomMask[k] = 1;
    if(ch === 'B') bossMask[k] = 1;
    else if(ch === 'S'){ sx = x; sy = y; }
    else if(ch === 'A') alt.push(['blood', x, y]);
    else if(ch === 'V') alt.push(['soul', x, y]);
    else if(ch === 'C') box.push([false, x, y]);
    else if(ch === 'X') box.push([true, x, y]);
  }
  /* 방 = 방 바닥의 연결 성분 */
  const seen = new Uint8Array(MAP.w*MAP.h), q = new Int32Array(MAP.w*MAP.h);
  for(let y=0;y<MAP.h;y++) for(let x=0;x<MAP.w;x++){
    const k0 = gi(x,y);
    if(!roomMask[k0] || seen[k0]) continue;
    let head = 0, tail = 0, x0 = x, x1 = x, y0 = y, y1 = y, isBoss = false;
    q[tail++] = k0; seen[k0] = 1;
    while(head < tail){
      const k = q[head++], ax = k % MAP.w, ay = (k-ax)/MAP.w;
      if(bossMask[k]) isBoss = true;
      if(ax < x0) x0 = ax; if(ax > x1) x1 = ax;
      if(ay < y0) y0 = ay; if(ay > y1) y1 = ay;
      for(let d=0;d<4;d++){
        const nx = ax + [1,-1,0,0][d], ny = ay + [0,0,1,-1][d];
        if(!inMap(nx,ny)) continue;
        const nk = gi(nx,ny);
        if(roomMask[nk] && !seen[nk]){ seen[nk] = 1; q[tail++] = nk; }
      }
    }
    const room = {x:x0, y:y0, w:x1-x0+1, h:y1-y0+1, cx:(x0+x1)>>1, cy:(y0+y1)>>1, boss:isBoss};
    MAP.rooms.push(room);
    if(isBoss) MAP.bossRoom = room;
  }
  MAP.roomMask = roomMask;
  MAP.start = MAP.rooms.find(r => sx>=r.x && sx<r.x+r.w && sy>=r.y && sy<r.y+r.h) || MAP.rooms[0];
  MAP.startAt = centerOf(sx, sy);
  if(!MAP.bossRoom) MAP.bossRoom = MAP.rooms[MAP.rooms.length-1];
  for(const a of alt) MAP.altars.push(makeAltar(a[0], a[1], a[2]));
  for(const c of box){
    const pt = centerOf(c[1], c[2]);
    MAP.chests.push({secret:c[0], cx:c[1], cy:c[2], x:pt.x, y:pt.y, r:76, opened:false, pulse:Math.random()*6.3});
  }
}
function genMap(stage, arena){
  if(arena){
    MAP.w = 30; MAP.h = 30;
    MAP.g = new Uint8Array(MAP.w*MAP.h);
    MAP.rooms = []; MAP.altars = []; MAP.chests = []; MAP.gateCells = []; MAP.gateOpen = true;
    MAP.tint = null; MAP.roomMask = null;
    const r = {x:7, y:7, w:16, h:16, cx:14, cy:14};
    carve(r.x, r.y, r.w, r.h);
    for(let j=r.y;j<r.y+r.h;j++) for(let i=r.x;i<r.x+r.w;i++)
      if(Math.hypot(i-14.5, j-14.5) > 7.6) MAP.g[gi(i,j)] = WALL;
    MAP.rooms = [r]; MAP.start = r; MAP.bossRoom = r;
    MAP.startAt = centerOf(14, 19);
    MAP.altars = [makeAltar('blood', 10, 14), makeAltar('blood', 19, 14)];
    MAP.note = '피의 첨탑 투기장';
    return;
  }
  const idx = (stage-1) % FIXED_MAPS.length;
  parseMap(FIXED_MAPS[idx]);
  MAP.note = MAP_NOTES[idx];
}
function makeAltar(type, cx, cy){
  const p = centerOf(cx, cy);

           name: type==='blood' ? '피의 제단' : '영혼 제단' };
}
function openGate(){
  if(MAP.gateOpen) return;
  MAP.gateOpen = true;
  for(const c of MAP.gateCells){
    MAP.g[c] = GATE;
    const ax = c % MAP.w, ay = (c - ax)/MAP.w, pt = centerOf(ax, ay);

function nearestChest(){

    const d = (c.x-P.x)**2 + (c.y-P.y)**2;

}

/* ---------- 충돌 · 시야 ---------- */
function hitsWall(x, y, r){
  const c0 = Math.floor((x-r)/CELL), c1 = Math.floor((x+r)/CELL);
  const r0 = Math.floor((y-r)/CELL), r1 = Math.floor((y+r)/CELL);
  for(let cy=r0; cy<=r1; cy++) for(let cx=c0; cx<=c1; cx++){
    if(walkable(cx,cy)) continue;
    const bx = cx*CELL, by = cy*CELL;
    const nx = clamp(x, bx, bx+CELL), ny = clamp(y, by, by+CELL);
    if((x-nx)*(x-nx) + (y-ny)*(y-ny) < r*r) return true;
  }
  return false;
}
function slide(o, dx, dy, r){
  if(!hitsWall(o.x+dx, o.y, r)) o.x += dx;
  if(!hitsWall(o.x, o.y+dy, r)) o.y += dy;
}
function hasLOS(x1,y1,x2,y2){
  const d = Math.hypot(x2-x1, y2-y1);
  const steps = Math.max(2, Math.ceil(d/(CELL*0.34)));
  for(let i=1;i<steps;i++){
    const t = i/steps, x = lerp(x1,x2,t), y = lerp(y1,y2,t);
    if(solid(Math.floor(x/CELL), Math.floor(y/CELL))) return false;
  }
  return true;
}
/* 흐름장: 낮은 쪽으로 내려가는 방향 */
function flowDir(field, x, y){
  const cx = Math.floor(x/CELL), cy = Math.floor(y/CELL);
  if(!inMap(cx,cy)) return null;
  const here = field[gi(cx,cy)];
  if(here < 0) return null;
  let best = here, bx = 0, by = 0;
  for(let k=0;k<8;k++){
    const ox = [1,-1,0,0,1,1,-1,-1][k], oy = [0,0,1,-1,1,-1,1,-1][k];
    const nx = cx+ox, ny = cy+oy;
    if(!walkable(nx,ny)) continue;
    if(ox && oy && (!walkable(cx+ox,cy) || !walkable(cx,cy+oy))) continue;
    const v = field[gi(nx,ny)];
    if(v >= 0 && v < best){ best = v; bx = ox; by = oy; }
  }
  if(!bx && !by) return null;
  const tc = centerOf(cx+bx, cy+by);
  const dx = tc.x-x, dy = tc.y-y, L = Math.hypot(dx,dy)||1;
  return {x:dx/L, y:dy/L};
}

function spawnEnemy(isBoss, at){
  const th = themeOf(G.mode === 'tower' ? 8 : S.stage);
  const m = MOBS[pick(th.mob)], type = Object.keys(MOBS).find(k=>MOBS[k]===m);
  const s = G.mode === 'tower' ? S.tower.floor : S.stage;
  const w = G.mode === 'tower' ? 10 : S.wave;
  let px, py;
  if(at){ px = at.x; py = at.y; }
  else if(isBoss){
    const c = roomCenter(MAP.bossRoom); px = c.x; py = c.y;
  } else {
    const spot = findSpawnSpot();
    if(!spot) return null;
    px = spot.x; py = spot.y;
  }
  const mulHp  = isBoss ? (G.mode==='tower' ? 26 : 15) : 1;
  const hp = capNum(eHp(s,w) * m.hp * mulHp * (G.mode==='tower' ? Math.pow(1.16, S.tower.floor-1) : 1), FOE_CAP, 1);
  const e = {
    type, m, boss:!!isBoss, x:px, y:py, hp, maxHp:hp,
    r:m.r*(isBoss?2.3:1), spd:m.spd*(isBoss?.62:rnd(.85,1.15)),
    dmg:capNum(eDmg(s,w)*m.dmg*(isBoss?2.4:1), FOE_CAP, 1), atkT:rnd(0,1), flash:0,
    bob:Math.random()*6.3, dieT:0, kx:0, ky:0, wob:rnd(-.5,.5),
    exp:capNum(eExp(s,w)*(isBoss?24:1), FOE_CAP, 1),
    gold:capNum(eGold(s,w)*(isBoss?30:1), FOE_CAP, 1),
    blood:capNum(eBlood(s,w)*(isBoss?28:1), FOE_CAP, 1)
  };
  if(isBoss){
    e.name = G.mode==='tower' ? (S.tower.floor+'층 수호자') : BOSSNAMES[(S.stage-1)%BOSSNAMES.length];
    const B = MAP.bossRoom;
    e.home = {x0:B.x*CELL+e.r, y0:B.y*CELL+e.r, x1:(B.x+B.w)*CELL-e.r, y1:(B.y+B.h)*CELL-e.r};
    e.pat = {cd:4.2, st:'idle', t:0, tmax:1, kind:null, dx:0, dy:0, hit:false};
    e.rage = 0;
    G.boss = e; sfx('boss');

    showBanner(e.name, G.mode === 'tower' ? '첨탑 수호자' : '지역 보스');
  }
  enemies.push(e);
  return e;
}
function findSpawnSpot(){
  for(let i=0;i<70;i++){
    const room = pick(MAP.rooms);
    if(MAP.bossRoom && room === MAP.bossRoom && !MAP.gateOpen) continue;
    const cxx = room.x + rint(0, room.w-1), cyy = room.y + rint(0, room.h-1);
    if(!walkable(cxx,cyy)) continue;
    const c = centerOf(cxx,cyy), d = Math.hypot(c.x-P.x, c.y-P.y);
    if(d < 230 || d > 1400) continue;
    if(fieldP && fieldP[gi(cxx,cyy)] < 0) continue;
    return c;
  }
  return null;
}
