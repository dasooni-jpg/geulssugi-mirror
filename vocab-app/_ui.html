<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>vocab UI 미리보기 (가짜 서버)</title>
<style>
  body{margin:0;font-family:sans-serif;background:#dfe6f0}
  .bar{padding:8px 14px;background:#23324a;color:#fff;font-size:13px;display:flex;gap:12px;align-items:center}
  .bar button{font:inherit;padding:4px 10px;border:none;border-radius:6px;cursor:pointer}
  iframe{display:block;width:100%;height:calc(100vh - 40px);border:none;background:#f3f6fb}
</style>
</head>
<body>
<div class="bar">
  <b>🔬 매일 어휘 40 — 배포 없이 미리보기</b>
  <span>가짜 D1 + 가짜 AI 위에서 실제 화면이 그대로 돌아갑니다</span>
  <button onclick="location.reload()">처음부터</button>
</div>
<iframe id="frame"></iframe>
<script type="module">
import worker from "./_worker.js";

// ── 가짜 D1 (＿test.html 과 동일) ──
class FakeD1 {
  constructor() { this.days = new Map(); this.students = new Map(); this.codes = new Map(); }
  prepare(sql) {
    const self = this;
    return {
      _args: [],
      bind(...a) { this._args = a; return this; },
      async run() {
        if (sql.startsWith("CREATE")) return { meta: {} };
        if (sql.includes("vocab_days")) {
          if (sql.startsWith("INSERT")) {
            const k = this._args[0] + "|" + this._args[1];
            if (self.days.has(k)) throw new Error("UNIQUE constraint failed");
            self.days.set(k, this._args[2]); return { meta: { changes: 1 } };
          }
        }
        if (sql.includes("vocab_codes")) {
          if (sql.startsWith("INSERT")) {
            const [code, section, id] = this._args;
            if (self.codes.has(code)) throw new Error("UNIQUE constraint failed");
            self.codes.set(code, { section, id }); return { meta: { changes: 1 } };
          }
        }
        if (sql.includes("vocab_students")) {
          if (sql.startsWith("INSERT OR REPLACE")) { self.students.set(this._args[0] + "|" + this._args[1], this._args[2]); return { meta: { changes: 1 } }; }
        }
        throw new Error("unknown sql: " + sql);
      },
      async first() {
        if (sql.includes("vocab_days")) { const d = self.days.get(this._args[0] + "|" + this._args[1]); return d ? { data: d } : null; }
        if (sql.includes("vocab_codes")) { const row = self.codes.get(this._args[0]); return row ? { section: row.section, id: row.id } : null; }
        if (sql.includes("vocab_students")) { const d = self.students.get(this._args[0] + "|" + this._args[1]); return d ? { data: d } : null; }
        return null;
      },
      async all() {
        if (sql.includes("vocab_days")) {
          const [section, limit] = this._args;
          const rows = [];
          for (const [k, data] of self.days) { const [day, sec] = k.split("|"); if (sec === section) rows.push({ day, data }); }
          rows.sort((a, b) => (a.day < b.day ? 1 : -1));
          return { results: rows.slice(0, limit) };
        }
        return { results: [] };
      },
    };
  }
}

// ── 가짜 Gemini AI: 실제 느낌이 나는 샘플 어휘 40개 반환 ──
const SAMPLE = {
  elem: [["성실","정성스럽고 참된 태도","그 학생은 성실 그 자체라서 숙제를 빼먹지 않는다.","근면","나태"],["배려","남을 도와주거나 보살펴 주려는 마음","친구를 위한 작은 배려 가 교실을 따뜻하게 만든다.","보살핌","무관심"],["관찰","사물이나 현상을 주의 깊게 살펴봄","과학 시간에 강낭콩의 싹을 관찰 하였다.","살핌",""],["요약","말이나 글의 중요한 점을 짧게 간추림","이 글의 내용을 세 문장으로 요약 해 보자.","간추림",""],["대비","앞으로 일어날 일에 미리 준비함","지진에 대비 하여 대피 훈련을 했다.","준비",""],["존중","높이어 귀중하게 대함","서로의 의견을 존중 하는 태도가 필요하다.","공경","무시"],["갈등","서로 생각이 달라 부딪치는 상태","두 인물 사이의 갈등 이 이야기의 중심이다.","다툼","화해"],["절약","함부로 쓰지 않고 아껴 씀","용돈 절약 을 위해 계획을 세웠다.","아낌","낭비"]],
  middle: [["개연성","그렇게 될 만한 가능성","소설의 사건 전개에 개연성 이 있어야 독자가 공감한다.","가능성",""],["관점","사물을 바라보는 태도나 방향","같은 사건도 관점 에 따라 다르게 보인다.","시각",""],["매체","정보를 전달하는 수단","영상 매체 는 청소년에게 큰 영향을 준다.","미디어",""],["타당성","이치에 맞아 옳은 성질","주장의 타당성 을 근거를 들어 검토했다.","합리성",""]],
  high: [["담론","어떤 주제를 둘러싼 사회적 논의","환경 문제에 관한 담론 이 활발하다.","논의",""],["통념","사회에 널리 퍼져 있는 일반적인 생각","이 글은 통념 을 뒤집는 주장으로 시작한다.","상식",""],["역설","겉보기에 모순되지만 진실을 담은 표현","느림의 미학이라는 역설 이 성립한다.","패러독스",""],["함의","말이나 글 속에 담긴 뜻","시어의 함의 를 파악해야 주제가 보인다.","속뜻",""]],
};
let seq = 0;
function fakeWords(section) {
  const base = SAMPLE[section] || SAMPLE.elem;
  const out = base.map(x => ({ word: x[0], meaning: x[1], example: x[2], synonym: x[3], antonym: x[4] }));
  while (out.length < 44) { seq++; const w = "표본어" + seq; out.push({ word: w, meaning: w + "의 뜻풀이 문장입니다", example: "예문 속에 " + w + " 가 자연스럽게 들어간다.", synonym: seq % 2 ? "비슷말" + seq : "", antonym: seq % 3 ? "" : "반대말" + seq }); }
  return out;
}
globalThis.fetch = (function (real) {
  return async (url, opt) => {
    if (typeof url === "string" && url.includes("generativelanguage.googleapis.com")) {
      const body = JSON.parse(opt.body);
      const secMatch = /대상: (6학년|중등|고등)/.exec(body.contents[0].parts[0].text);
      const section = secMatch ? { "6학년": "elem", "중등": "middle", "고등": "high" }[secMatch[1]] : "elem";
      await new Promise(r => setTimeout(r, 600)); // 생성 시간 흉내
      return new Response(JSON.stringify({ candidates: [{ content: { parts: [{ text: JSON.stringify({ words: fakeWords(section) }) }] }, finishReason: "STOP" }] }), { status: 200 });
    }
    return real(url, opt);
  };
})(globalThis.fetch.bind(globalThis));

const env = { DB: new FakeD1(), GEMINI_API_KEY: "fake-key" };
window.__route = async (url, opt) => {
  const u = new URL(url, "https://v.test");
  return worker.fetch(new Request(u.toString(), opt), env);
};

async function open(path) {
  const r = await worker.fetch(new Request("https://v.test" + path), env);
  let html = await r.text();
  // 화면의 fetch 를 워커로 연결 + localStorage 는 미리보기용으로 격리
  const shim = `<script>
    window.fetch = (u, o) => parent.__route(u, o);
    navigator.sendBeacon = () => true;
    const _ls = {};
    Object.defineProperty(window, "localStorage", { value: {
      getItem: k => (k in _ls ? _ls[k] : null),
      setItem: (k, v) => { _ls[k] = String(v); },
      removeItem: k => { delete _ls[k]; },
    }});
  <\/script>`;
  html = html.replace("<script>", shim + "<script>");
  const frame = document.getElementById("frame");
  frame.srcdoc = html;
}
open("/");
</script>
</body>
</html>
