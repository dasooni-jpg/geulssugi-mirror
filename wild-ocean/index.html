<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f6fae">
<title>WILD OCEAN · 뗏목 표류기</title>
<style>
/* ===== 기본 리셋 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#123a5c;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
canvas{display:block}
.hidden{display:none !important}

/* ===== 레이아웃 ===== */
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
#hud > *{pointer-events:auto}

/* ===== 상단 HUD ===== */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;gap:8px}
.logo{background:linear-gradient(180deg,#ffd257,#f5972a);border:3px solid #7a3c10;border-radius:14px;
  padding:6px 10px;box-shadow:0 4px 0 #7a3c10, 0 8px 12px rgba(0,0,0,.35);text-align:center;flex:0 0 auto}
.logo b{display:block;font-size:15px;line-height:1;color:#5a2a06;letter-spacing:.5px;
  text-shadow:0 1px 0 #ffe9a8}
.logo span{display:block;font-size:9px;color:#7a3c10;font-weight:700;margin-top:2px}
.logo.hell{background:linear-gradient(180deg,#ff8a4a,#c8281c);border-color:#5a0e08;box-shadow:0 4px 0 #5a0e08, 0 0 18px rgba(255,80,30,.55)}
.logo.hell b{color:#fff3d0;text-shadow:0 1px 0 #5a0e08}
.logo.hell span{color:#ffe0b0}
.res-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;
  width:min(252px,62vw);margin-left:auto}
.res{display:flex;align-items:center;gap:3px;background:rgba(10,30,50,.72);border:2px solid rgba(255,255,255,.22);
  border-radius:11px;padding:2px 4px 2px 3px;min-width:0;overflow:hidden;backdrop-filter:blur(3px);white-space:nowrap}
.res{cursor:pointer}
.res .ri{font-size:13px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.res .rn{font-size:8.5px;font-weight:800;opacity:.95;letter-spacing:-.2px}
.res .txt{display:flex;flex-direction:column;line-height:1.08;min-width:0;overflow:hidden}
.res b{font-size:11.5px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.res small{font-size:7.8px;opacity:.68;letter-spacing:-.3px}
.res.full b{color:#ff9a9a}

/* ===== 퀘스트 배너 ===== */
.questbar{margin:2px 10px 0;background:linear-gradient(180deg,rgba(18,48,76,.92),rgba(12,32,52,.92));
  border:2px solid rgba(255,255,255,.2);border-left:5px solid #ffd257;border-radius:12px;padding:6px 10px;
  max-width:330px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.questbar .qt{font-size:10px;color:#ffd257;font-weight:800;letter-spacing:.5px}
.questbar .qd{font-size:12.5px;font-weight:700;margin-top:1px}
.questbar .qbar{height:6px;background:rgba(0,0,0,.45);border-radius:4px;margin-top:5px;overflow:hidden}
.questbar .qbar i{display:block;height:100%;background:linear-gradient(90deg,#58e06a,#b6f36a);border-radius:4px;
  transition:width .3s}
.questbar .qr{font-size:10px;opacity:.8;margin-top:3px}
.questbar.ch2{background:linear-gradient(180deg,rgba(52,34,110,.94),rgba(30,20,70,.94));border-left-color:#c9a6ff;cursor:pointer}
.questbar.ch2 .qt{color:#d9c2ff}
.questbar.ch2 .qbar i{background:linear-gradient(90deg,#9a6fff,#e0c8ff)}
.mbox img.sart{display:block;width:220px;max-width:100%;height:auto;margin:2px auto 10px;border-radius:12px;
  border:2px solid rgba(255,255,255,.3);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.mbox p.ch2q{text-align:center;font-weight:800;color:#bff6ff;background:rgba(0,0,0,.2);border-radius:10px;padding:8px}
.questbar.done{border-left-color:#58e06a;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}

/* ===== 좌측 상태 스택 ===== */
/* 좌측 상태 스택 : 퀘스트 배너 아래에 자연스럽게 이어지도록 흐름 배치 */
.sidestack{margin:6px 0 0 10px;display:flex;flex-direction:column;gap:5px;width:136px;align-self:flex-start}
.chip{background:rgba(10,30,50,.75);border:2px solid rgba(255,255,255,.18);border-radius:10px;padding:4px 8px;
  font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px;
  flex-wrap:wrap;white-space:nowrap}
.chip span{opacity:.75;font-size:10px;white-space:nowrap}
.chip b{white-space:nowrap}
.chip.warn{border-color:#ff7b6b;background:rgba(90,20,20,.8);animation:pulse 1.2s infinite}
.chip.good{border-color:#58e06a}
.minibar{height:5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-top:3px;width:100%}
.minibar i{display:block;height:100%;border-radius:3px}

/* ===== 알림 토스트 ===== */
#toast{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:6px;align-items:center;pointer-events:none;z-index:40;width:min(92vw,380px)}
.toast{text-align:center}
.toast{background:rgba(8,24,40,.92);border:2px solid #ffd257;border-radius:12px;padding:7px 14px;font-size:13px;
  font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.45);animation:toastIn .3s ease-out}
.toast.bad{border-color:#ff7b6b}.toast.good{border-color:#58e06a}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}

/* ===== 하단 탭바 ===== */
.bottombar{margin-top:auto;display:flex;gap:5px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(6,22,38,0),rgba(6,22,38,.82) 35%)}
.tabbtn{flex:1;background:linear-gradient(180deg,#3f8fd0,#255f96);border:2px solid #16395c;border-radius:14px;
  padding:7px 2px 6px;text-align:center;box-shadow:0 4px 0 #113052, 0 6px 10px rgba(0,0,0,.3)}
.tabbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #113052}
.tabbtn em{display:block;font-size:19px;font-style:normal;line-height:1}
.tabbtn b{display:block;font-size:10.5px;font-weight:800;margin-top:2px}
.tabbtn.on{background:linear-gradient(180deg,#ffd257,#f0a02c);color:#5a2a06;border-color:#7a3c10;box-shadow:0 4px 0 #7a3c10}
.tabbtn .dot{position:absolute;margin-left:22px;margin-top:-6px;width:9px;height:9px;background:#ff5a5a;
  border:2px solid #fff;border-radius:50%}
.tabbtn{position:relative}

/* ===== 패널 ===== */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:76%;background:linear-gradient(180deg,#123a5c,#0c2740);
  border-top:4px solid #ffd257;border-radius:20px 20px 0 0;display:flex;flex-direction:column;z-index:30;
  box-shadow:0 -8px 26px rgba(0,0,0,.5);animation:slideUp .22s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.panel header{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid rgba(255,255,255,.12)}
.panel header h2{font-size:16px;flex:1}
.panel header .sub{font-size:11px;opacity:.7;font-weight:600}
.panel .close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);font-size:15px;font-weight:800}
.panel .body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:10px 12px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.panel .body::-webkit-scrollbar{width:5px}.panel .body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:3px}

/* ===== 카드/리스트 ===== */
.card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 11px;
  margin-bottom:8px;display:flex;gap:10px;align-items:center}
.card.locked{opacity:.5}
.card .ico{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:rgba(0,0,0,.28);display:flex;
  align-items:center;justify-content:center;font-size:24px}
.card .info{flex:1;min-width:0}
.card .info h3{font-size:13.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.card .info h3 .lv{font-size:10px;background:#ffd257;color:#5a2a06;border-radius:6px;padding:1px 5px;font-weight:900}
.card .info p{font-size:11px;opacity:.75;margin-top:2px;line-height:1.35}
.card .cost{font-size:11px;font-weight:800;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.card .cost span.no{color:#ff8a8a}
.btn{background:linear-gradient(180deg,#58e06a,#2fa844);border:2px solid #1d6b2c;border-radius:12px;padding:8px 12px;
  font-size:12.5px;font-weight:800;box-shadow:0 3px 0 #1d6b2c;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d6b2c}
.btn.blue{background:linear-gradient(180deg,#4fb0f0,#2477c4);border-color:#175a95;box-shadow:0 3px 0 #175a95}
.btn.gold{background:linear-gradient(180deg,#ffd257,#eda022);border-color:#8a5510;box-shadow:0 3px 0 #8a5510;color:#5a2a06}
.btn.red{background:linear-gradient(180deg,#ff7b6b,#d63d2c);border-color:#8e2318;box-shadow:0 3px 0 #8e2318}
.btn.grey{background:linear-gradient(180deg,#7e94a6,#526b7e);border-color:#3a4c5b;box-shadow:0 3px 0 #3a4c5b;opacity:.7}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:9px}
.row{display:flex;gap:6px;align-items:center}
.sectitle{font-size:12px;font-weight:800;opacity:.8;margin:12px 2px 6px;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px}
.sectitle:before{content:"";width:4px;height:13px;background:#ffd257;border-radius:2px;display:block}
.hintbox{background:rgba(255,210,87,.12);border:1px dashed rgba(255,210,87,.5);border-radius:10px;padding:7px 10px;
  font-size:11px;line-height:1.45;margin-bottom:9px}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tag{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;
  font-size:11px;font-weight:700}
.tag.on{background:#ffd257;color:#5a2a06;border-color:#8a5510}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 9px;font-size:11px}
.stat b{display:block;font-size:14px;margin-top:2px}

/* ===== 인구 뱃지(게임 내 말풍선) ===== */
.popbadge{position:absolute;pointer-events:none;transform:translate(-50%,-100%);z-index:5}
.bubble{background:linear-gradient(180deg,#67e07a,#2fa844);border:3px solid #fff;border-radius:14px;padding:4px 12px;
  font-size:17px;font-weight:900;text-shadow:0 2px 2px rgba(0,0,0,.35);box-shadow:0 4px 8px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:6px}
.bubble.red{background:linear-gradient(180deg,#ff8a7a,#d63d2c)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);
  border:9px solid transparent;border-top-color:#fff}

/* ===== 모달 ===== */
#modal{position:absolute;inset:0;background:rgba(3,12,22,.78);display:flex;align-items:center;justify-content:center;
  z-index:60;padding:20px;backdrop-filter:blur(4px)}
.mbox{background:linear-gradient(180deg,#1b4a72,#0d2b46);border:3px solid #ffd257;border-radius:20px;padding:16px;
  max-width:380px;width:100%;max-height:82%;overflow-y:auto;box-shadow:0 14px 40px rgba(0,0,0,.6);
  animation:toastIn .25s ease-out}
.mbox h2{font-size:18px;text-align:center;margin-bottom:4px}
.mbox .msub{font-size:11.5px;opacity:.75;text-align:center;margin-bottom:12px}
.mbox p{font-size:12.5px;line-height:1.55;margin-bottom:9px}
.mbox .mbtns{display:flex;gap:8px;margin-top:12px}
.mbox .mbtns .btn{flex:1;text-align:center;padding:11px}
.loot{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.loot .li{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 10px;
  font-size:12px;font-weight:800}

/* ===== 전투/이벤트 오버레이 ===== */
.eventbar{position:absolute;left:156px;right:10px;top:166px;background:rgba(120,18,18,.9);
  border:3px solid #ff7b6b;border-radius:14px;padding:7px 12px;text-align:center;z-index:20;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.eventbar b{font-size:14px;display:block}
.eventbar small{font-size:10.5px;opacity:.9}
.eventbar .ebar{height:7px;background:rgba(0,0,0,.45);border-radius:4px;margin-top:5px;overflow:hidden}
.eventbar .ebar i{display:block;height:100%;background:linear-gradient(90deg,#ff5a5a,#ffb15a)}
.eventbar.storm{background:rgba(24,44,96,.92);border-color:#7fb6ff}
.eventbar.trade{background:rgba(24,86,50,.92);border-color:#7fe0a0}

/* ===== 자원 획득 플로팅 텍스트는 캔버스에서 처리 ===== */
.fab{position:absolute;right:10px;bottom:74px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fabbtn{width:46px;height:46px;border-radius:14px;background:linear-gradient(180deg,#3f8fd0,#255f96);
  border:2px solid #16395c;box-shadow:0 3px 0 #113052;font-size:20px;display:flex;align-items:center;justify-content:center}
.fabbtn:active{transform:translateY(2px)}
.fabbtn.alert{background:linear-gradient(180deg,#ff8a7a,#d63d2c);border-color:#8e2318;box-shadow:0 3px 0 #8e2318;
  animation:pulse .8s infinite}
.speedlbl{font-size:10px;font-weight:900}

/* ===== 최종 보스 단계 전환 배너 ===== */
.phasebanner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;
  text-align:center;padding:14px 26px;border-radius:18px;background:rgba(20,8,44,.88);border:3px solid #c9a6ff;
  box-shadow:0 0 40px rgba(160,110,255,.6);transition:opacity .5s;animation:toastIn .35s ease-out;min-width:240px}
.phasebanner b{display:block;font-size:22px;color:#fff;letter-spacing:1px;text-shadow:0 0 12px #c9a6ff}
.phasebanner small{display:block;font-size:12px;color:#e0d4ff;margin-top:4px}

/* ===== 엔딩 ===== */
#ending{position:absolute;inset:0;z-index:80;background:#000}
#endCv{position:absolute;inset:0}
.endskip{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11px;opacity:.55;pointer-events:none}
.endcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,360px);text-align:center;
  background:rgba(8,20,40,.78);border:3px solid #ffd257;border-radius:22px;padding:22px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);animation:toastIn .6s ease-out;touch-action:pan-y}
.endtitle{font-size:40px;font-weight:900;letter-spacing:4px;color:#ffd257;text-shadow:0 0 22px rgba(255,210,87,.7)}
.endsub{font-size:14px;opacity:.9;margin:4px 0 10px}
.endcard .btn{padding:12px;font-size:14px}

/* ===== 주간 도전 · 반 기록판 ===== */
.inp{background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);border-radius:10px;color:#fff;padding:8px 10px;
  font-size:14px;font-family:inherit;font-weight:700;touch-action:auto;user-select:text;-webkit-user-select:text}
.inp:focus{outline:none;border-color:#ffd257}
.codebox{background:rgba(0,0,0,.4);border:2px dashed #9fe8ff;border-radius:10px;padding:9px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;font-weight:700;word-break:break-all;user-select:text;-webkit-user-select:text;touch-action:auto}
.rtable{width:100%;border-collapse:collapse;font-size:12px}
.rtable th{font-size:10.5px;opacity:.7;font-weight:700;padding:4px 3px;border-bottom:1px solid rgba(255,255,255,.2)}
.rtable td{text-align:center;padding:5px 3px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:700}
.rtable tr.me td{background:rgba(255,210,87,.18);color:#ffe7a8}

/* ===== 설정 : 볼륨 슬라이더 ===== */
input.vol{width:100%;margin-top:6px;accent-color:#ffd257;height:22px;touch-action:auto}
/* 모바일 : body 의 touch-action:none 때문에 패널 목록이 스크롤되지 않던 문제 방지 */
.panel .body, .mbox{touch-action:pan-y}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="logo"><b>WILD OCEAN</b><span>뗏목 표류기</span></div>
      <div class="res-grid" id="resBar"></div>
    </div>
    <div class="questbar" id="questBar"></div>
    <div class="sidestack" id="sideStack"></div>
    <div class="fab">
      <button class="fabbtn hidden" id="btnAbyss" title="무한 심연" style="background:linear-gradient(180deg,#8a5cff,#4a2aa8);border-color:#2a1660;box-shadow:0 3px 0 #2a1660">🌀</button>
      <button class="fabbtn" id="btnView" title="화면 보기">🧹</button>
      <button class="fabbtn" id="btnMute">🔊</button>
      <button class="fabbtn" id="btnSpeed"><span class="speedlbl">x1</span></button>
      <button class="fabbtn" id="btnCenter">🎯</button>
    </div>
    <div class="bottombar">
      <button class="tabbtn" data-tab="build"><em>🔨</em><b>건설</b></button>
      <button class="tabbtn" data-tab="people"><em>🧑‍🤝‍🧑</em><b>주민</b></button>
      <button class="tabbtn" data-tab="tech"><em>🔬</em><b>연구</b></button>
      <button class="tabbtn" data-tab="expo"><em>⛵</em><b>원정</b></button>
      <button class="tabbtn" data-tab="market"><em>🛒</em><b>교역</b></button>
      <button class="tabbtn" data-tab="more"><em>🏆</em><b>기록</b></button>
    </div>
  </div>

  <div class="popbadge hidden" id="popBadge"><div class="bubble" id="popBubble">👤 0/0</div></div>
  <div class="eventbar hidden" id="eventBar"></div>
  <div id="toast"></div>

  <div class="panel hidden" id="panel">
    <header><h2 id="panelTitle">패널</h2><span class="sub" id="panelSub"></span>
      <button class="close" id="panelClose">✕</button></header>
    <div class="body" id="panelBody"></div>
  </div>

  <div id="modal" class="hidden"></div>
</div>
<script>
"use strict";

/* ===== 02-data.js ===== */
/* =====================================================================
   WILD OCEAN · 뗏목 표류기
   02. 게임 데이터 정의 (자원 / 건물 / 기술 / 원정 / 퀘스트 / 업적 / 진주상점)
   ===================================================================== */

const GAME_VERSION = "1.0.0";
/* 지옥 모드 : 저장 칸을 따로 씀. 모드를 바꾸면 페이지를 다시 불러와 해당 칸으로 이어서 함 */
const MODE_KEY = "wildocean_mode_v1";
const HELL = (()=>{ try{ return localStorage.getItem(MODE_KEY)==="hell"; }catch(e){ return false; } })();
const SAVE_KEY = HELL? "wildocean_save_hell_v1" : "wildocean_save_v1";
const HELLX = { threat:1.8, storm:1.6, boss:1.8, food:1.35, floatGap:1.35, wood:0.75, raidGap:0.75, need:1.5, coin:2 };
function hx(k){ return HELL? HELLX[k] : 1; }

/* ---------- 자원 정의 ---------- */
const RES = {
  wood:  { name:"나무판자", short:"판자", icon:"🪵", col:"#d9a15c", cap:true,  order:1 },
  fish:  { name:"물고기",   short:"물고기", icon:"🐟", col:"#ff8fa3", cap:true,  order:2 },

/* ---------- 유틸 ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const chance=(p)=>Math.random()<p;
function fmt(n){
  n=Math.floor(n);
  if(n>=1e9) return (n/1e9).toFixed(2)+"B";
  if(n>=1e6) return (n/1e6).toFixed(2)+"M";
  if(n>=1e4) return (n/1e3).toFixed(1)+"K";
  return n.toLocaleString("ko-KR");
}
function fmtF(n){ return (Math.round(n*100)/100).toFixed(2); }
function fmtTime(s){
  s=Math.max(0,Math.ceil(s));
  const m=Math.floor(s/60), r=s%60;
  if(m>=60){ const h=Math.floor(m/60); return h+"시간 "+(m%60)+"분"; }
  return m>0? m+"분 "+r+"초" : r+"초";
}
const KEY=(x,y)=>x+","+y;

/* ---------- 아이소메트릭 좌표 ---------- */
const TW=120, TH=60;                     // 타일 가로/세로(월드 픽셀)
function iso(gx,gy){ return { x:(gx-gy)*TW/2, y:(gx+gy)*TH/2 }; }
function unIso(wx,wy){
  return { gx:(wx/(TW/2)+wy/(TH/2))/2, gy:(wy/(TH/2)-wx/(TW/2))/2 };
}

let PID=1;
function addPerson(s, opt){
  opt=opt||{};
  const home = randTilePos(s);
  const p = {
    id: PID++,
    name: pick(NAME_A)+" "+pick(NAME_B),
    job: "idle", bid: null,

    mood: 70, skill: 1 + Math.random()*0.35,
    x: home.x, y: home.y, tx: home.x, ty: home.y,
    spd: rnd(16,26), wait: rnd(0,3), dir: 1,
    hair: Math.floor(Math.random()*4), shirt: Math.floor(Math.random()*5),
    bob: Math.random()*6.28,
  };
  s.people.push(p);
  return p;
}
function randTilePos(s){
  const arr=[...s.tiles.values()];
  if(!arr.length) return {x:0,y:0};
  const t=pick(arr); const p=iso(t.x,t.y);
  return { x:p.x+rnd(-26,26), y:p.y+rnd(-12,12) };
}

/* ---------- 진주 특전 조회 ---------- */
function perkLv(s,id){ return (s.perks&&s.perks[id])||0; }

/* ---------- 자원 조작 ---------- */
function capOf(k){
  if(!RES[k].cap) return Infinity;
  let base = { wood:500, fish:200, food:150, water:150, scrap:120, parts:60 }[k] || 200;
  let add = 0;
  S.tiles.forEach(t=>{ if(t.b==="storage") add += BLD.storage.storage(t.lv); });
  let mul = 1;
  S.tech.forEach(id=>{ const e=TECH[id].eff; if(e.capMul && e.capMul[k]) mul += e.capMul[k]; });
  mul += 0.10*perkLv(S,"bigStore");
  return Math.floor((base+add)*mul);
}
function canPay(cost){ for(const k in cost){ if((S.res[k]||0) < cost[k]) return false; } return true; }
function pay(cost){ for(const k in cost){ S.res[k]-=cost[k]; } }
function gain(k,n,silent){
  if(!(n>0)) return 0;                       // NaN·음수 방어
  const c=capOf(k), before=S.res[k]||0;
  // 저장 한도가 줄어든 경우(창고 파손·철거)에도 보유량이 깎이지 않도록 before를 하한으로 둠
  S.res[k]=Math.max(before, Math.min(c, before+n));
  const got=Math.max(0, S.res[k]-before);
  if(k==="wood") S.stats.totWood+=got;
  if(k==="fish") S.stats.totFish+=got;
  if(k==="food") S.stats.totFood+=got;
  if(k==="parts") S.stats.totParts+=got;
  if(k==="coin") S.stats.totCoin+=got;
  return got;
}
function costStr(cost){
  return Object.keys(cost).filter(k=>cost[k]>0).map(k=>{
    const ok=(S.res[k]||0)>=cost[k];
    return `<span class="${ok?"":"no"}">${RES[k].icon}${fmt(cost[k])}</span>`;
  }).join("");
}

/* ---------- 바닥(타일) 확장 비용 ---------- */
function tileCost(){
  let base = 50 + Math.pow(Math.max(0,S.tiles.size-9), 1.32)*11;
  let cut = 0;
  S.tech.forEach(id=>{ const e=TECH[id].eff; if(e.tileCost) cut += e.tileCost; });
  return { wood: Math.max(25, Math.floor(base*(1+cut))) };
}

/* 현재 상태 → 저장 문자열 */
function saveString(){
  const o = JSON.parse(JSON.stringify({ ...S,
    tiles: [...S.tiles.values()],
    cache: undefined, log: undefined }));
  o.last = Date.now();
  return JSON.stringify(o);
}
function save(){
  try{
    // 무한 심연 도전 중에는 도전 전 상태(스냅숏)를 저장 — 창을 닫아도 원래 마을이 보존됨
    const str = (typeof ABYSS!=="undefined" && ABYSS && ABYSS.active)? ABYSS.snapshot : saveString();
    localStorage.setItem(SAVE_KEY, str);
    return true;
  }catch(e){ console.warn("저장 실패", e); return false; }
}
function load(){
  try{ return stateFromRaw(localStorage.getItem(SAVE_KEY)); }
  catch(e){ console.warn("불러오기 실패", e); return null; }
}
/* 저장 문자열 → 상태 객체 */
function stateFromRaw(raw){
  try{
    if(!raw) return null;
    const o = JSON.parse(raw);
    const s = newState();
    const defStats = { ...s.stats };
    Object.assign(s, o);
    s.stats = Object.assign(defStats, o.stats||{});   // 이전 버전 저장본에 없는 통계 항목 보충
    if(s.bossDay==null) s.bossDay = Math.max(6, (s.env&&s.env.day||1)+2);
    if(s.nextCrisis==null) s.nextCrisis = 380;
    if(s.bossN==null) s.bossN = 0;
    if(!DIFF[s.diff]) s.diff = "normal";
    if(s.finalStage==null) s.finalStage = 0;
    s.ch2 = Object.assign(newCh2(), o.ch2||{});
    s.ch3 = Object.assign(newCh2(), o.ch3||{});
    s.ch4 = Object.assign(newCh2(), o.ch4||{});
    s.ch5 = Object.assign(newCh2(), o.ch5||{});
    s.ch6 = Object.assign(newCh2(), o.ch6||{});
    s.hell = HELL;
    s.abyss = Object.assign(newAbyssRec(), o.abyss||{});
    if(s.boss && !BOSSES[s.boss.type]) s.boss = null;   // 알 수 없는 보스 상태는 버림
    s.tiles = new Map((o.tiles||[]).map(t=>[KEY(t.x,t.y), t]));
    s.cache = {}; s.log = [];
    PID = 1 + (s.people.reduce((m,p)=>Math.max(m,p.id),0));
    s.people.forEach(p=>{ if(p.x==null){ p.x=0;p.y=0;p.tx=0;p.ty=0; } });
    return s;
  }catch(e){ console.warn("불러오기 실패", e); return null; }
}

/* ---------- 오프라인 보상 ---------- */
function offlineGains(s, sec){
  const eff = 0.5 + 0.12*perkLv(s,"offline");
  const capped = Math.min(sec, 8*3600);          // 최대 8시간
  computeCache(s);
  const got = {};
  ["wood","fish","food","water","scrap","parts"].forEach(k=>{
    const r = (s.cache.net && s.cache.net[k]) || 0;
    if(r>0){ const n = Math.floor(r*capped*eff); if(n>0){ got[k]=gain(k,n); } }
  });
  // 오프라인 중 소비(식량/식수)는 절반만 반영
  return { got, sec:capped, eff };
}

  CAM.tx = -sx/n; CAM.ty = -sy/n;

}

let cv, ctx, DPR=1;
let PTR = { down:false, moved:false, sx:0, sy:0, lx:0, ly:0, t:0, pts:new Map(), pinch:0 };

function initCanvas(){
  cv = $("#game"); ctx = cv.getContext("2d");
  resize();
  window.addEventListener("resize", resize);
  cv.addEventListener("pointerdown", onDown);
  cv.addEventListener("pointermove", onMove);
  cv.addEventListener("pointerup", onUp);
  cv.addEventListener("pointercancel", onUp);
  // 캔버스 터치가 뒤늦게 만드는 가짜 click 을 없앰 (패널이 열리자마자 버튼이 눌리는 문제)
  cv.addEventListener("touchend", (e)=>{ if(e.cancelable) e.preventDefault(); }, { passive:false });
  cv.addEventListener("wheel", (e)=>{
    e.preventDefault();
    CAM.z = clamp(CAM.z * (e.deltaY>0?0.9:1.11), 0.42, 2.2);
  }, { passive:false });
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.floor(window.innerWidth*DPR);
  cv.height = Math.floor(window.innerHeight*DPR);
  cv.style.width = window.innerWidth+"px";
  cv.style.height = window.innerHeight+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function onDown(e){
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  PTR.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PTR.pts.size===2){ PTR.pinch = pinchDist(); PTR.pz = CAM.z; return; }
  PTR.down=true; PTR.moved=false;
  PTR.sx=e.clientX; PTR.sy=e.clientY; PTR.lx=e.clientX; PTR.ly=e.clientY; PTR.t=performance.now();
}
function pinchDist(){
  const a=[...PTR.pts.values()];
  return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
}
function onMove(e){
  if(PTR.pts.has(e.pointerId)) PTR.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PTR.pts.size===2){
    const d=pinchDist();
    if(PTR.pinch>0) CAM.z = clamp(PTR.pz * (d/PTR.pinch), 0.42, 2.2);
    PTR.moved=true; return;
  }
  if(!PTR.down) return;
  const dx=e.clientX-PTR.lx, dy=e.clientY-PTR.ly;
  if(Math.abs(e.clientX-PTR.sx)+Math.abs(e.clientY-PTR.sy) > 9) PTR.moved=true;
  if(PTR.moved){ CAM.x += dx/CAM.z; CAM.y += dy/CAM.z; CAM.tx=CAM.x; CAM.ty=CAM.y; }
  PTR.lx=e.clientX; PTR.ly=e.clientY;
}
function onUp(e){
  PTR.pts.delete(e.pointerId);
  if(PTR.pts.size<2) PTR.pinch=0;
  if(!PTR.down) return;
  PTR.down=false;
  if(!PTR.moved && performance.now()-PTR.t < 600){
    CANVAS_TAP_T=performance.now();
    if(PANEL){ closePanel(); return; }        // 패널이 열려 있으면 바다(패널 바깥)를 탭해 닫음
    handleTap(e.clientX, e.clientY);
  }
}

/* ---------- 발광 스프라이트 캐시 (방사형 그라디언트를 매 프레임 만들지 않음) ---------- */
const GLOW_CACHE = {};
function glowSprite(col){
  if(GLOW_CACHE[col]) return GLOW_CACHE[col];
  const c=document.createElement("canvas"); c.width=c.height=64;
  const g2=c.getContext("2d"), g=g2.createRadialGradient(32,32,1,32,32,32);
  g.addColorStop(0,col); g.addColorStop(1,"rgba(0,0,0,0)");
  g2.fillStyle=g; g2.fillRect(0,0,64,64);
  return (GLOW_CACHE[col]=c);
}

/* ---------- 기본 도형 ---------- */
function dia(cx,cy,w,h){ ctx.beginPath(); ctx.moveTo(cx,cy-h/2); ctx.lineTo(cx+w/2,cy);
  ctx.lineTo(cx,cy+h/2); ctx.lineTo(cx-w/2,cy); ctx.closePath(); }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function poly(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); }
function fillP(pts,c){ poly(pts); ctx.fillStyle=c; ctx.fill(); }
function shadowEllipse(cx,cy,rx,ry,a){ ctx.save(); ctx.globalAlpha=a||.22; ctx.fillStyle="#04263f";
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,6.2832); ctx.fill(); ctx.restore(); }

/* 아이소 박스 : 폭 w(가로 대각), 깊이 d, 높이 h — 상판/좌면/우면 */
function isoBox(cx,cy,w,d,h,cTop,cL,cR){
  const hw=w/2, hd=d/2;
  // 아랫면 중심 기준(cy = 바닥 중심)
  const bT=[cx, cy-hd*0.5-hw*0], bR=[cx+hw, cy+hw*0.5], bB=[cx, cy+hd], bL=[cx-hw, cy+hw*0.5];
  // 간단화: 정다이아 기반
  const top=[[cx,cy-h-d/2],[cx+w/2,cy-h],[cx,cy-h+d/2],[cx-w/2,cy-h]];
  fillP(top,cTop);
  fillP([[cx-w/2,cy-h],[cx,cy-h+d/2],[cx,cy+d/2],[cx-w/2,cy]],cL);
  fillP([[cx+w/2,cy-h],[cx,cy-h+d/2],[cx,cy+d/2],[cx+w/2,cy]],cR);
}
/* 천막 지붕 (사각뿔) */
function tarp(cx,cy,w,d,h,c1,c2){
  fillP([[cx,cy-h],[cx+w/2,cy],[cx,cy+d/2]],c2);
  fillP([[cx,cy-h],[cx-w/2,cy],[cx,cy+d/2]],c1);
}

let waveT=0;
function drawSea(dt){
  const W=cv.width/DPR, H=cv.height/DPR;
  waveT += dt;
  const g=ctx.createLinearGradient(0,0,0,H);
  const st = S.env.weather==="storm";
  g.addColorStop(0, st?"#1b4370":PAL.seaLite);
  g.addColorStop(.55, st?"#163a63":PAL.seaMid);
  g.addColorStop(1, st?"#0f2c4d":PAL.seaDeep);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 물결 패턴 (화면 고정, 살짝 흐름)
  ctx.save(); ctx.globalAlpha=.13; ctx.strokeStyle="#ffffff"; ctx.lineWidth=2;
  const step=46, off=(waveT*9)%step;
  for(let y=-step; y<H+step; y+=step){
    ctx.beginPath();
    for(let x=-20; x<W+20; x+=14){
      const yy = y+off + Math.sin((x*0.03)+(waveT*1.3)+(y*0.05))*4;
      x===-20? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  ctx.restore();

  // 반짝임
  ctx.save(); ctx.globalAlpha=.10; ctx.fillStyle="#fff";
  for(let i=0;i<26;i++){
    const x=((i*197)%W)+Math.sin(waveT*.6+i)*16, y=((i*127)%H)+Math.cos(waveT*.5+i)*10;
    ctx.fillRect(x,y,9,2);
  }
  ctx.restore();
}

/* 낮/밤 색조 */
function drawDayTint(){
  const W=cv.width/DPR, H=cv.height/DPR, t=S.env.time;
  let col=null, a=0;
  if(t<0.22){ col="#0a1a3a"; a=lerp(.55,.15,t/0.22); }          // 새벽
  else if(t<0.30){ col="#ff9a5a"; a=lerp(.22,0,(t-0.22)/0.08); } // 일출
  else if(t>0.78&&t<0.86){ col="#ff7a4a"; a=lerp(0,.28,(t-0.78)/0.08); } // 일몰
  else if(t>=0.86){ col="#0a1a3a"; a=lerp(.28,.6,(t-0.86)/0.14); }
  if(S.env.weather==="storm"){ col="#0b1e3a"; a=Math.max(a,.32); }
  if(S.boss && S.boss.type==="final"){ col=tskin(S.boss).sky; a=Math.max(a,.34); }      // 최종 보스 : 보랏빛 어둠
  if(ABYSS && ABYSS.active && !(S.boss && S.boss.type==="final")){ col="#16124a"; a=Math.max(a,.26); }   // 심연 : 환상의 바다
  if(col&&a>0){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=col;
    ctx.fillRect(0,0,W,H); ctx.restore(); }
}

/* 비 / 폭풍 */
let rainDrops=[], bolt=null;
function drawWeather(dt){
  const W=cv.width/DPR, H=cv.height/DPR;
  const w=S.env.weather;
  if(w!=="rain"&&w!=="storm"){ rainDrops.length=0; return; }
  const want = w==="storm"? 230 : 120;
  while(rainDrops.length<want) rainDrops.push({ x:Math.random()*W, y:Math.random()*H,
    v:rnd(680,1100), l:rnd(12,26), o:rnd(.22,.5) });
  while(rainDrops.length>want) rainDrops.pop();
  const slant = w==="storm"? 0.42 : 0.18;
  ctx.save(); ctx.strokeStyle="#dff0ff"; ctx.lineWidth= w==="storm"?1.6:1.2;
  // 성능 : 빗줄기를 투명도 3단계로 묶어 경로 3개로만 그림
  const buckets=[[],[],[]];
  rainDrops.forEach(d=>{
    d.y += d.v*dt; d.x += d.v*dt*slant;
    if(d.y>H){ d.y=-20; d.x=Math.random()*W*1.2-W*.1; }
    if(d.x>W+20) d.x=-20;
    buckets[d.o<0.32?0:d.o<0.42?1:2].push(d);
  });
  [0.26,0.37,0.47].forEach((a,i)=>{
    ctx.globalAlpha=a; ctx.beginPath();
    buckets[i].forEach(d=>{ ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-d.l*slant,d.y-d.l); });
    ctx.stroke();
  });
  ctx.restore();
  // 번개 : 화면 섬광 + 지그재그 번개 줄기(잔상 0.25초)
  if(w==="storm" && chance(dt*0.35)){
    const pts=[]; let x=rnd(W*0.1,W*0.9), y=-10;
    while(y<H*rnd(0.35,0.6)){ pts.push([x,y]); x+=rnd(-28,28); y+=rnd(18,40); }
    bolt={ pts, t:0.25, flash:rnd(.25,.5) }; sfx("thunder");
  }
  if(bolt){
    bolt.t-=dt;
    ctx.save();
    ctx.globalAlpha=Math.max(0,bolt.t/0.25)*bolt.flash; ctx.fillStyle="#cfe4ff"; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=Math.max(0,bolt.t/0.25);
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=3; ctx.shadowColor="#9fd0ff"; ctx.shadowBlur=18;
    ctx.beginPath(); bolt.pts.forEach((p,i)=> i? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.stroke();
    ctx.restore();
    if(bolt.t<=0) bolt=null;
  }
}

/* =====================================================================
   월드 렌더 (카메라 변환 적용 구간)
   ===================================================================== */
function drawWorld(dt){
  const W=cv.width/DPR, H=cv.height/DPR;
  ctx.save();
  const sh = SHAKE>0.3? SHAKE : 0;
  ctx.translate(W/2 + (sh? rnd(-sh,sh):0), H*0.46 + (sh? rnd(-sh,sh):0));
  ctx.scale(CAM.z, CAM.z);
  ctx.translate(CAM.x, CAM.y);

  // 1) 물 위의 떠다니는 오브젝트(뗏목보다 아래)
  S.floats.forEach(f=>drawFloat(f));
  drawWhale();
  S.sharks.forEach(s=>drawShark(s));
  S.boats.forEach(b=>drawBoat(b));
  drawBossWater();

  // 2) 뗏목 타일 (깊이 정렬)
  const tiles=[...S.tiles.values()].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  // 2-a) 뗏목 전체 그림자 + 가장자리 물거품
  tiles.forEach(t=>{ const p=iso(t.x,t.y); shadowEllipse(p.x,p.y+14,TW*.52,TH*.5,.16); });
  tiles.forEach(t=>drawFoam(t));
  // 2-b) 바닥
  tiles.forEach(t=>drawTile(t));
  // 2-c) 건물 + 주민을 깊이 섞어서
  const ents=[];
  tiles.forEach(t=>{ if(t.b){ const p=iso(t.x,t.y); ents.push({ d:t.x+t.y, z:p.y, f:()=>drawBuilding(t,p) }); } });
  // 원정 나간 주민은 뗏목에 그리지 않음
  visiblePeople().forEach(p=>{
    const g=unIso(p.x,p.y); ents.push({ d:g.gx+g.gy, z:p.y, f:()=>drawPerson(p) }); });
  bossEnts(ents);
  ents.sort((a,b)=>a.z-b.z||a.d-b.d);
  ents.forEach(e=>e.f());
  // 건물 이름표 (다른 그림에 가려지지 않게 맨 위에 그림)
  if(VIEW.labels && !S.boss) tiles.forEach(t=>{ if(t.b) drawBuildingLabel(t); });

  // 3) 건설 가능 위치 표시 (전투 중에는 숨김)
  if(!S.boss) drawGhosts();

  // 4) 파티클 · 이펙트
  drawParts();
  drawFX();

  ctx.restore();
}

/* ---------- 뗏목 바닥 타일 ---------- */
let TILE_SP=null;
/* 성능 : 바닥 판자(옆면·상판·결·못·테두리)는 모양이 고정이므로 한 번만 그려 스프라이트로 재사용함 */
function tileSprite(){
  if(TILE_SP) return TILE_SP;
  const R=3, w=TW+4, h=TH+14;
  const c=document.createElement('canvas'); c.width=w*R; c.height=h*R;
  const g=c.getContext('2d'); g.scale(R,R);
  const old=ctx; ctx=g;
  const p={ x:TW/2+2, y:TH/2+2 };
  // 옆면(두께)
  fillP([[p.x-TW/2,p.y],[p.x,p.y+TH/2],[p.x+TW/2,p.y],[p.x+TW/2,p.y+9],[p.x,p.y+TH/2+9],[p.x-TW/2,p.y+9]],PAL.plankDark);
  // 상판
  dia(p.x,p.y,TW,TH); ctx.fillStyle=PAL.plankTop; ctx.fill();
  // 판자 결 : 아이소 축(A,B)에 정렬된 널판 6장
  ctx.save(); dia(p.x,p.y,TW,TH); ctx.clip();
  const Ax=TW/2, Ay=TH/2, Bx=TW/2, By=-TH/2, N=6;
  const P=(s,t)=>[p.x+Ax*s+Bx*t, p.y+Ay*s+By*t];
  for(let i=0;i<N;i++){
    const t0=-0.5+i/N, t1=-0.5+(i+1)/N;
    fillP([P(-0.5,t0),P(0.5,t0),P(0.5,t1),P(-0.5,t1)], i%2? PAL.plankTop : PAL.plankTop2);
  }
  ctx.strokeStyle="rgba(140,95,52,.5)"; ctx.lineWidth=1.4;
  for(let i=1;i<N;i++){
    const t=-0.5+i/N, a=P(-0.5,t), b=P(0.5,t);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  // 널판 끝단 이음새
  ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.lineWidth=1;
  [-0.18,0.2].forEach(s=>{ const a=P(s,-0.5), b=P(s,0.5);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); });
  // 못
  ctx.fillStyle="rgba(90,60,30,.55)";
  [[-30,0],[30,0],[0,-14],[0,14]].forEach(o=>{ ctx.beginPath(); ctx.arc(p.x+o[0],p.y+o[1],1.7,0,6.283); ctx.fill(); });
  ctx.restore();
  // 테두리
  dia(p.x,p.y,TW,TH); ctx.strokeStyle="rgba(120,80,40,.6)"; ctx.lineWidth=1.4; ctx.stroke();
  ctx=old;
  return (TILE_SP={ c, ox:TW/2+2, oy:TH/2+2, w, h });
}
function drawTile(t){
  const p=iso(t.x,t.y);
  const hurt = S.hullDmg>0 ? clamp(S.hullDmg/Math.max(1,hullMax()),0,1) : 0;
  const sp=tileSprite();
  ctx.drawImage(sp.c, p.x-sp.ox, p.y-sp.oy, sp.w, sp.h);
  // 내구도 손상 : 부서진 판자 자국
  if(hurt>0.02){ ctx.save(); ctx.globalAlpha=hurt*0.5; ctx.fillStyle="#5a3520";
    for(let i=0;i<4;i++){ ctx.fillRect(p.x-40+i*22+((t.x*7+t.y*13)%9), p.y-8+((i*5+t.x)%16), 10, 3); } ctx.restore(); }

  // 가장자리 로프/타이어 (외곽 타일만)
  const edgeE = !S.tiles.has(KEY(t.x+1,t.y)), edgeS=!S.tiles.has(KEY(t.x,t.y+1));
  if(edgeE){ drawRail(p.x+TW/4,p.y+TH/4, 1); }
  if(edgeS){ drawRail(p.x-TW/4,p.y+TH/4, -1); }
  // 빈 타일 데코
  if(!t.b){
    if(t.deco===0) drawBarrelSmall(p.x-16,p.y+4);
    else if(t.deco===1) drawCrate(p.x+14,p.y-2, 0.8);
    else if(t.deco===2) drawLifeRing(p.x-2,p.y+8);
  }
}
function drawRail(cx,cy,dir){
  ctx.save(); ctx.strokeStyle=PAL.woodD; ctx.lineWidth=3.2;
  for(let i=-1;i<=1;i++){
    const ox=i*26*dir, oy=i*13;
    ctx.beginPath(); ctx.moveTo(cx+ox,cy+oy); ctx.lineTo(cx+ox,cy+oy-15); ctx.stroke();
  }
  ctx.strokeStyle=PAL.rope; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(cx-26*dir,cy-13-15+13); ctx.lineTo(cx+26*dir,cy+13-15+13*0);
  ctx.stroke(); ctx.restore();
}
function drawLifeRing(cx,cy){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,.55);
  ctx.lineWidth=5; ctx.strokeStyle="#f5f5f5"; ctx.beginPath(); ctx.arc(0,0,9,0,6.283); ctx.stroke();
  ctx.strokeStyle="#ff5a4a"; ctx.setLineDash([7,7]); ctx.beginPath(); ctx.arc(0,0,9,0,6.283); ctx.stroke();
  ctx.restore();
}
function drawBarrelSmall(cx,cy){
  ctx.save();
  shadowEllipse(cx,cy+2,9,4,.2);
  isoBox(cx,cy,16,10,16,"#5f86c9","#3f5f97","#4d72ad");
  ctx.fillStyle="rgba(255,255,255,.25)"; ctx.fillRect(cx-7,cy-11,3,10);
  ctx.restore();
}
function drawCrate(cx,cy,s){
  s=s||1; ctx.save(); shadowEllipse(cx,cy+2,11*s,5*s,.2);
  isoBox(cx,cy,20*s,13*s,14*s,"#d9a15c","#9d6c37","#b8834a");
  ctx.strokeStyle="#7d5327"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(cx-10*s,cy-7*s); ctx.lineTo(cx,cy-2*s); ctx.stroke();
  ctx.restore();
}

/* ---------- 뗏목 가장자리 물거품 (물 쪽 변마다 출렁이는 흰 거품선) ---------- */
function drawFoam(t){
  const p=iso(t.x,t.y);
  // 변: [이웃방향, 시작꼭짓점, 끝꼭짓점]  (꼭짓점: 위·오른·아래·왼)
  const V={ T:[p.x,p.y-TH/2], R:[p.x+TW/2,p.y], B:[p.x,p.y+TH/2], L:[p.x-TW/2,p.y] };
  const sides=[[[1,0],V.R,V.B],[[0,1],V.B,V.L],[[-1,0],V.L,V.T],[[0,-1],V.T,V.R]];
  ctx.save();
  sides.forEach(([d,a,b],si)=>{
    if(S.tiles.has(KEY(t.x+d[0],t.y+d[1]))) return;
    const back = si>=2;                       // 뒤쪽 변은 두께 없이 살짝만
    const oy = back? 2 : 11;
    const pulse = 0.35+Math.sin(waveT*2.4+t.x*1.3+t.y*0.9+si)*0.2;
    ctx.globalAlpha=pulse; ctx.strokeStyle="#f4fbff"; ctx.lineWidth=back?2:3.2; ctx.lineCap="round";
    ctx.beginPath();
    for(let i=0;i<=10;i++){
      const r=i/10, x=lerp(a[0],b[0],r), y=lerp(a[1],b[1],r)+oy+Math.sin(r*9+waveT*3+si)*1.8;
      i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
    if(!back){
      ctx.globalAlpha=pulse*0.45; ctx.lineWidth=1.4;
      ctx.beginPath();
      for(let i=0;i<=10;i++){
        const r=i/10, x=lerp(a[0],b[0],r), y=lerp(a[1],b[1],r)+oy+7+Math.sin(r*7-waveT*2.4)*2;
        i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
      }
      ctx.stroke();
    }
  });
  ctx.restore();
}

/* ---------- 밤 창문 불빛 / 펄럭이는 깃발 ---------- */
function windowLit(x,y,w,h){
  const night=!isDay();
  ctx.save();
  ctx.fillStyle = night? "#ffd97a" : "#7fd4ff";
  rrect(x,y,w,h,2); ctx.fill();
  if(night){
    ctx.globalAlpha=.28+Math.sin(waveT*2+x)*0.05;
    const r=w*2.6;
    ctx.drawImage(glowSprite("#ffcf6a"), x+w/2-r, y+h/2-r, r*2, r*2);
  } else {
    ctx.fillStyle="rgba(255,255,255,.5)"; ctx.fillRect(x+1.5,y+1.5,w*0.3,h-3);
  }
  ctx.restore();
}
function flag(x,y,col,h){
  h=h||26;
  ctx.save();
  ctx.strokeStyle="#6b4523"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-h); ctx.stroke();
  const wind = S.env.weather==="storm"? 2.2 : 1;
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(x,y-h);
  for(let i=0;i<=6;i++){ const r=i/6; ctx.lineTo(x+r*16*wind**0.3, y-h+Math.sin(waveT*6*wind+r*4)*2.5*r); }
  for(let i=6;i>=0;i--){ const r=i/6; ctx.lineTo(x+r*16*wind**0.3, y-h+9+Math.sin(waveT*6*wind+r*4)*2.5*r); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 건설 가능 고스트 ---------- */
let ghostPulse=0;
function drawGhosts(){
  ghostPulse+=0.03;
  const a=0.16+Math.sin(ghostPulse)*0.07;
  const seen=new Set();
  S.tiles.forEach(t=>{
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
      const k=KEY(t.x+d[0],t.y+d[1]);
      if(S.tiles.has(k)||seen.has(k)) return;
      seen.add(k);
      const p=iso(t.x+d[0],t.y+d[1]);
      ctx.save(); ctx.globalAlpha=a;
      dia(p.x,p.y,TW*.86,TH*.86); ctx.fillStyle="#ffffff"; ctx.fill();
      ctx.globalAlpha=a+0.25; ctx.strokeStyle="#ffd257"; ctx.lineWidth=2.4; ctx.setLineDash([9,7]);
      dia(p.x,p.y,TW*.86,TH*.86); ctx.stroke();
      ctx.restore();
      if(canPay(tileCost())){
        ctx.save(); ctx.globalAlpha=.75; ctx.fillStyle="#fff"; ctx.font="bold 15px sans-serif";
        ctx.textAlign="center"; ctx.fillText("＋", p.x, p.y+5); ctx.restore();
      }
    });
  });
}

   건물 그리기

function drawBuilding(t,p){
  const def=BLD[t.b]; if(!def) return;
  const lv=t.lv;
  shadowEllipse(p.x,p.y+6,34,16,.25);
  ctx.save();
  switch(def.art){
    case "tent": artTent(p.x,p.y,lv); break;
    case "hut": artHut(p.x,p.y,lv); break;
    case "lodge": artLodge(p.x,p.y,lv); break;
    case "fishdock": artFishdock(p.x,p.y,lv); break;
    case "sawmill": artSawmill(p.x,p.y,lv); break;
    case "salvager": artSalvager(p.x,p.y,lv); break;
    case "netpost": artNetpost(p.x,p.y,lv); break;
    case "kitchen": artKitchen(p.x,p.y,lv); break;
    case "raincol": artRaincol(p.x,p.y,lv); break;
    case "desal": artDesal(p.x,p.y,lv); break;
    case "workshop": artWorkshop(p.x,p.y,lv); break;
    case "solar": artSolar(p.x,p.y,lv); break;
    case "windmill": artWindmill(p.x,p.y,lv); break;
    case "storage": artStorage(p.x,p.y,lv); break;
    case "campfire": artCampfire(p.x,p.y,lv); break;
    case "lighthouse": artLighthouse(p.x,p.y,lv); break;
    case "starlight": artStarlight(p.x,p.y); break;
    case "lab": artLab(p.x,p.y,lv); break;
    case "dock": artDock(p.x,p.y,lv); break;
    case "market": artMarket(p.x,p.y,lv); break;
    case "radar": artRadar(p.x,p.y,lv); break;
    case "harpoon": artHarpoon(p.x,p.y,lv); break;
    case "barricade": artBarricade(p.x,p.y,lv); break;
    case "greenhouse": artGreenhouse(p.x,p.y,lv); break;
    case "smelter": artSmelter(p.x,p.y,lv); break;
    case "clinic": artClinic(p.x,p.y,lv); break;
    case "radio": artRadio(p.x,p.y,lv); break;
    case "cannon": artCannon(p.x,p.y,lv); break;
  }
  ctx.restore();
  // 최대 레벨 건물 : 반짝이는 별
  if(lv>=def.maxLv && !VIEW.clean){
    const tw=(waveT*1.6+t.x*0.7+t.y*1.3)%3;
    if(tw<0.6){ ctx.save(); ctx.globalAlpha=Math.sin(tw/0.6*Math.PI); ctx.fillStyle="#fff6c2";
      ctx.translate(p.x+18,p.y-58); starPath(5); ctx.fill(); ctx.restore(); }
  }
  // 일꾼 필요 표시
  if(!VIEW.clean && def.slots && t.w < def.slots(lv) && S.people.some(pp=>pp.job==="idle")){
    bubbleIcon(p.x, p.y-64, "👤+", "#ffd257");
  }
  // 레벨 배지
  if(lv>1 && !VIEW.clean) levelBadge(p.x+30,p.y-6,lv);
}
function levelBadge(x,y,lv){
  ctx.save(); ctx.globalAlpha=.88;
  ctx.fillStyle="#ffd257"; ctx.strokeStyle="#7a3c10"; ctx.lineWidth=1.6;
  rrect(x-8,y-8,17,13,4.5); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#5a2a06"; ctx.font="bold 9px sans-serif"; ctx.textAlign="center";
  ctx.fillText(lv, x+0.5, y+1.5);
  ctx.restore();
}
function bubbleIcon(x,y,txt,col){
  ctx.save();
  const w=Math.max(26, txt.length*9+12);
  ctx.fillStyle="rgba(10,30,50,.85)"; ctx.strokeStyle=col; ctx.lineWidth=2;
  rrect(x-w/2,y-13,w,21,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle=col; ctx.font="bold 12px sans-serif"; ctx.textAlign="center";
  ctx.fillText(txt,x,y+2); ctx.restore();
}

/* --- 텐트 --- */
function artTent(x,y,lv){
  const c1 = lv>=3? "#ffb04a" : "#ffd968";          // 밝은 면
  const c2 = lv>=3? "#e07a2a" : "#f0b13a";          // 그늘진 면
  // 바닥 받침
  fillP([[x-30,y],[x,y+15],[x+30,y],[x,y-15]],"#c9a170");
  // 삼각 텐트 (양면 모두 천막 색)
  fillP([[x-2,y-46],[x-32,y+4],[x-2,y+14]],c1);
  fillP([[x-2,y-46],[x+30,y+2],[x-2,y+14]],c2);
  // 천 주름
  ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(x-2,y-40); ctx.lineTo(x-20,y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-2,y-40); ctx.lineTo(x+18,y+4); ctx.stroke();
  // 입구 어둠
  fillP([[x-2,y-28],[x-16,y+6],[x-2,y+11]],"rgba(60,40,25,.75)");
  // 기둥/로프
  ctx.strokeStyle=PAL.woodD; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(x-2,y-48); ctx.lineTo(x-2,y+14); ctx.stroke();
  ctx.strokeStyle=PAL.rope; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(x-2,y-44); ctx.lineTo(x-34,y+8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-2,y-44); ctx.lineTo(x+32,y+6); ctx.stroke();
  if(lv>=2) drawCrate(x+22,y+6,.6);
  if(lv>=4) drawBarrelSmall(x-24,y+8);
}
/* --- 오두막 (원본 이미지의 A형 목조 오두막) --- */
function artHut(x,y,lv){
  // 받침 데크
  fillP([[x-34,y+2],[x,y+19],[x+34,y+2],[x,y-15]],"#cfa679");
  // A형 프레임 본체
  const h=52+lv*2;
  fillP([[x,y-h],[x+34,y-12],[x+34,y+6],[x,y+16]],"#d9a15c");       // 우측면
  fillP([[x,y-h],[x-34,y-12],[x-34,y+6],[x,y+16]],"#b9834a");       // 좌측면
  // 지붕 널
  ctx.save();
  poly([[x,y-h],[x+34,y-12],[x+34,y+6],[x,y+16]]); ctx.clip();
  ctx.strokeStyle="rgba(120,80,40,.45)"; ctx.lineWidth=2;
  for(let i=0;i<7;i++){ ctx.beginPath(); ctx.moveTo(x+i*5,y-h+i*7); ctx.lineTo(x+40,y-h+i*9+6); ctx.stroke(); }
  ctx.restore();
  // 입구(어두운 아치)
  fillP([[x,y-24],[x+17,y-4],[x+17,y+7],[x,y+15]],"rgba(60,35,18,.85)");
  // 천막 차양
  tarp(x-14,y-h+16,46,20,16, PAL.tarpY, "#f0c24a");
  // 기둥
  ctx.strokeStyle="#9fb0bd"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x-30,y-14); ctx.lineTo(x-22,y+8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+30,y-14); ctx.lineTo(x+22,y+8); ctx.stroke();
  // 소품
  drawBarrelSmall(x-26,y+6);
  if(lv>=2){ ctx.fillStyle="#e8e8e8"; rrect(x+16,y-2,10,8,2); ctx.fill(); }  // 의자
  if(lv>=4) drawCrate(x+28,y+4,.6);
  // 환기창 (밤에는 불빛)
  windowLit(x-4,y-h+22,9,7);
}
/* --- 공동 숙소 (2층) --- */
function artLodge(x,y,lv){
  fillP([[x-38,y+4],[x,y+23],[x+38,y+4],[x,y-15]],"#c49a6c");

/* --- 제재소 --- */
function artSawmill(x,y,lv){
  fillP([[x-32,y+2],[x,y+18],[x+32,y+2],[x,y-14]],"#c9a170");

  isoBox(x,y+4,40,24,14,"#d9a15c","#8d5f34","#b07f4a");

/* --- 조리대 --- */

}

/* =====================================================================
   주민 : 걷기(팔다리 스윙·방향) / 작업 모션(직업별 도구) / 수영 / 감정 / 질병
   ===================================================================== */
function onRaft(x,y){
  const g=unIso(x,y);
  return S.tiles.has(KEY(Math.round(g.gx),Math.round(g.gy)));
}
function drawPerson(p){
  const moving = Math.abs(p.tx-p.x)+Math.abs(p.ty-p.y) > 2;
  const t = waveT*11+p.bob;
  const x=p.x;
  // 물 위(구조 직후 헤엄쳐 오는 중)
  if(!onRaft(p.x,p.y)){ drawSwimmer(p); return; }

  const working = !moving && p.job!=="idle" && p.bid && S.tiles.has(p.bid);
  const hop = (p.emote>0 && p.emoteK==="heart")? Math.abs(Math.sin(waveT*9))*4 : 0;
  const bob = moving? Math.abs(Math.sin(t))*1.6 : Math.sin(waveT*2+p.bob)*0.6;
  const y=p.y - bob - hop;
  const dir = p.dir||1;
  const sw = moving? Math.sin(t) : 0;                // 걷기 스윙(-1~1)
  const sk=PAL.skin[p.id%4], hr=PAL.hair[p.hair];
  let sh=PAL.shirt[p.shirt];
  const sick = p.sick>0;

  shadowEllipse(x,p.y+2,8,4,.24);
  ctx.save();
  // 다리 (앞뒤로 교차)
  ctx.fillStyle="#3f5f97";
  ctx.save(); ctx.translate(x-2.4,y-8); ctx.rotate(sw*0.45); ctx.fillRect(-1.6,0,3.2,8); ctx.restore();
  ctx.save(); ctx.translate(x+2.6,y-8); ctx.rotate(-sw*0.45); ctx.fillRect(-1.6,0,3.2,8); ctx.restore();
  // 신발
  ctx.fillStyle="#2a2a2a";
  ctx.fillRect(x-4.4+sw*2.2, y-1, 4, 2); ctx.fillRect(x+0.8-sw*2.2, y-1, 4, 2);
  // 몸통
  ctx.fillStyle=sh; rrect(x-6,y-18,12,11,3.5); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.12)"; rrect(x-6,y-10,12,3,1.5); ctx.fill();
  // 뒷팔
  ctx.fillStyle=sk;
  ctx.save(); ctx.translate(x-6.6*dir,y-16.5); ctx.rotate(-sw*0.6); ctx.fillRect(-1.4,0,2.8,8); ctx.restore();
  // 머리
  const ht = working? Math.sin(waveT*3)*0.8 : 0;
  ctx.fillStyle=sk; ctx.beginPath(); ctx.arc(x,y-24+ht,7.2,0,6.283); ctx.fill();
  if(sick){ ctx.fillStyle="rgba(120,200,110,.35)"; ctx.beginPath(); ctx.arc(x,y-24+ht,7.2,0,6.283); ctx.fill(); }
  // 머리카락
  ctx.fillStyle=hr;
  ctx.beginPath(); ctx.arc(x,y-26+ht,7.2,Math.PI,0); ctx.fill();
  if(p.hair===0){ ctx.beginPath(); ctx.arc(x-6,y-24+ht,3.2,0,6.283); ctx.fill();
                  ctx.beginPath(); ctx.arc(x+6,y-24+ht,3.2,0,6.283); ctx.fill(); }
  if(p.hair===1){ ctx.fillRect(x-7.4,y-26+ht,14.8,5); }
  if(p.hair===3){ ctx.beginPath(); ctx.ellipse(x-5*dir,y-20+ht,3,6,0,0,6.283); ctx.fill(); }   // 묶은 머리
  // 눈 (진행 방향을 바라봄 + 가끔 깜빡임)
  const blink = ((waveT+p.bob)%5)<0.12;
  const ex = dir*1.2;
  ctx.fillStyle="#2a2a2a";
  if(blink){ ctx.fillRect(x-3.6+ex,y-23.5+ht,2.2,0.9); ctx.fillRect(x+1.6+ex,y-23.5+ht,2.2,0.9); }
  else { ctx.beginPath(); ctx.arc(x-2.6+ex,y-23.5+ht,1.15,0,6.283); ctx.fill();
         ctx.beginPath(); ctx.arc(x+2.6+ex,y-23.5+ht,1.15,0,6.283); ctx.fill(); }
  // 볼터치
  ctx.fillStyle="rgba(255,120,120,.35)";
  ctx.beginPath(); ctx.arc(x-4.4+ex,y-21+ht,1.6,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(x+4.4+ex,y-21+ht,1.6,0,6.283); ctx.fill();
  // 앞팔 + 작업 도구
  if(working) drawToolArm(p,x,y,dir,sk);
  else {
    ctx.fillStyle=sk;
    let armRot = sw*0.6;
    if(p.emote>0 && p.emoteK==="note") armRot = -2.4 + Math.sin(waveT*10)*0.4;   // 손 흔들기
    ctx.save(); ctx.translate(x+6.6*dir,y-16.5); ctx.rotate(armRot*dir); ctx.fillRect(-1.4,0,2.8,8); ctx.restore();
  }
  ctx.restore();

  // 감정 풍선
  if(p.emote>0 && !(p.hunger<35||p.thirst<35) && !(VIEW.clean && p.emoteK!=="sick")){
    const a=Math.min(1,p.emote*2);
    const ic={ heart:"♥", note:"♪", sad:"…", sick:"🤒" }[p.emoteK]||"♪";
    const col={ heart:"#ff6b8a", note:"#5ec3f0", sad:"#9fb3c4", sick:"#6fd06a" }[p.emoteK]||"#fff";
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle="rgba(255,255,255,.92)"; ctx.beginPath(); ctx.arc(x+9,y-40,8,0,6.283); ctx.fill();
    ctx.fillStyle=col; ctx.font="bold 11px sans-serif"; ctx.textAlign="center"; ctx.fillText(ic,x+9,y-36);
    ctx.restore();
  }
  // 아픔 표시
  if(sick && Math.sin(waveT*3+p.bob)>0.2){
    ctx.save(); ctx.fillStyle="#6fd06a"; ctx.font="bold 9px sans-serif"; ctx.textAlign="center";
    ctx.fillText("~", x-9, y-30-((waveT*12)%8)); ctx.restore();
  }
  // 배고픔/목마름 표시 (원본 이미지의 말풍선)
  if(p.hunger<35 || p.thirst<35){
    const need = p.hunger<=p.thirst? "🍖" : "💧";
    const blinkB = Math.sin(waveT*4+p.bob)>-0.3;
    if(blinkB){
      ctx.save();
      ctx.fillStyle="rgba(255,255,255,.92)"; ctx.strokeStyle="#ff7b6b"; ctx.lineWidth=1.6;
      rrect(x-11,y-46,22,17,7); ctx.fill(); ctx.stroke();
      fillP([[x-3,y-30],[x+3,y-30],[x,y-25]],"#fff");
      ctx.font="11px sans-serif"; ctx.textAlign="center"; ctx.fillText(need,x,y-34);
      ctx.restore();
    }
  }
}

/* 직업별 작업 모션 : 도구를 든 팔이 리듬에 맞춰 움직임 */
function drawToolArm(p,x,y,dir,sk){
  const ph = waveT*6+p.bob;
  const s = Math.sin(ph);
  ctx.save();
  ctx.translate(x+6*dir,y-16);
  ctx.scale(dir,1);
  switch(p.job){
    case "fisher": {           // 낚싯대 흔들기 + 찌
      ctx.rotate(-0.9+s*0.08);
      ctx.fillStyle=sk; ctx.fillRect(-1.4,0,2.8,7);
      ctx.strokeStyle="#8a5a2e"; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(0,6); ctx.lineTo(0,-22); ctx.stroke();
      ctx.restore(); ctx.save();
      ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=0.8;
      const tipX=x+6*dir+Math.sin(0.9)*22*dir, tipY=y-16-Math.cos(0.9)*22;
      ctx.beginPath(); ctx.moveTo(tipX,tipY); ctx.lineTo(tipX+10*dir,y+4+s*2); ctx.stroke();
      ctx.fillStyle="#ff5a5a"; ctx.beginPath(); ctx.arc(tipX+10*dir,y+4+s*2,1.8,0,6.283); ctx.fill();
      break; }
    case "lumber": {           // 망치질
      const a=-1.8+Math.max(0,s)*1.6;
      ctx.rotate(a);
      ctx.fillStyle=sk; ctx.fillRect(-1.4,0,2.8,7);
      ctx.fillStyle="#8a5a2e"; ctx.fillRect(-1,6,2,8);
      ctx.fillStyle="#8fa3b3"; ctx.fillRect(-4,13,8,4);
      if(s>0.95) emit(x+10*dir,y-4,"dust",2,{col:"#e6bb85"});
      break; }
    case "cook": {             // 프라이팬 뒤집기
      ctx.rotate(-0.6+s*0.35);
      ctx.fillStyle=sk; ctx.fillRect(-1.4,0,2.8,7);
      ctx.fillStyle="#2b2f33"; ctx.beginPath(); ctx.ellipse(2,9,6,2.6,0,0,6.283); ctx.fill();
      ctx.fillStyle="#ff8fa3"; ctx.beginPath(); ctx.ellipse(2,8-Math.max(0,s)*8,3,1.6,0,0,6.283); ctx.fill();
      break; }
    case "engineer": {         // 렌치 조이기 + 불꽃
      ctx.rotate(-0.5+s*0.5);
      ctx.fillStyle=sk; ctx.fillRect(-1.4,0,2.8,7);
      ctx.fillStyle="#b9c4cc"; ctx.fillRect(-1,6,2,8);
      ctx.beginPath(); ctx.arc(0,15,2.6,0,6.283); ctx.fill();
      if(s>0.9) emit(x+8*dir,y-2,"spark",1,{col:"#bfe8ff"});
      break; }
    case "guard": {            // 창을 들고 경계
      ctx.rotate(-0.15);
      ctx.fillStyle=sk; ctx.fillRect(-1.4,0,2.8,7);
      ctx.strokeStyle="#8a5a2e"; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.moveTo(1,12); ctx.lineTo(1,-20); ctx.stroke();
      ctx.fillStyle="#cfd8de"; ctx.beginPath(); ctx.moveTo(-2,-19); ctx.lineTo(1,-27); ctx.lineTo(4,-19); ctx.closePath(); ctx.fill();
      break; }
    case "farmer": {           // 물뿌리개
      ctx.rotate(-0.3+s*0.25);
      ctx.fillStyle=sk; ctx.fillRect(-1.4,0,2.8,7);
      ctx.fillStyle="#5ec3f0"; rrect(-3,6,8,6,2); ctx.fill();
      ctx.strokeStyle="#5ec3f0"; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(5,8); ctx.lineTo(10,5); ctx.stroke();
      if(s>0.6){ ctx.fillStyle="#9fe0ff"; ctx.fillRect(10,6+((waveT*40)%6),1.2,2); }
      break; }
    default: ctx.fillStyle=sk; ctx.fillRect(-1.4,0,2.8,8);
  }
  ctx.restore();
}

/* 헤엄치는 주민 : 머리와 팔만 물 위에 */
function drawSwimmer(p){
  const x=p.x, y=p.y+Math.sin(waveT*4+p.bob)*1.5, sk=PAL.skin[p.id%4];
  const st=Math.sin(waveT*8+p.bob);
  ctx.save();
  ctx.globalAlpha=.5; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.ellipse(x,y+1,13,5,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=sk;
  ctx.save(); ctx.translate(x-6,y-3); ctx.rotate(-1.2+st*0.9); ctx.fillRect(-1.3,0,2.6,8); ctx.restore();
  ctx.save(); ctx.translate(x+6,y-3); ctx.rotate(1.2-st*0.9); ctx.fillRect(-1.3,0,2.6,8); ctx.restore();
  ctx.beginPath(); ctx.arc(x,y-6,6.6,0,6.283); ctx.fill();
  ctx.fillStyle=PAL.hair[p.hair]; ctx.beginPath(); ctx.arc(x,y-8,6.6,Math.PI,0); ctx.fill();

  ctx.beginPath(); ctx.arc(x+2.3,y-5.5,1,0,6.283); ctx.fill();

}

        ctx.beginPath(); ctx.arc(f.x+Math.cos(a)*t*26, f.y+Math.sin(a)*t*13-t*8, 3*(1-t), 0, 6.283); ctx.fill(); }
    } else if(f.k==="r"){
      ctx.globalAlpha=(1-t)*.9; ctx.strokeStyle=f.col; ctx.lineWidth=3*(1-t)+1;
