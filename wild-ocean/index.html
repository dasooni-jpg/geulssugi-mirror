    }
    ctx.restore();
  });
}

/* ===== 045-fx.js ===== */
/* =====================================================================
   04-5. 파티클 시스템 : 불티·연기·먼지·별·폭죽·물방울·잉크·플랑크톤
         발사체(작살·포탄) / HUD로 날아가는 획득 아이콘 / 화면 흔들림
   ===================================================================== */

let SHAKE = 0;          // 화면 흔들림 세기(px)
let PARTS = [];         // 월드 좌표 파티클
let SHOTS = [];         // 발사체
let FLY = [];           // 화면 좌표 : 자원 칩으로 날아가는 아이콘
const PMAX = 700;

function windX(){ const w=S&&S.env.weather; return w==="storm"? 28 : w==="rain"? 8 : 3; }
function shake(n){ SHAKE = Math.max(SHAKE, n); }

/* ---------- 파티클 생성 ---------- */
function emit(x,y,k,n,o){
  o=o||{};
  for(let i=0;i<n;i++){
    if(PARTS.length>=PMAX) PARTS.shift();
    PARTS.push(mkPart(x+(o.spread?rnd(-o.spread,o.spread):0), y+(o.spread?rnd(-o.spread,o.spread)*0.5:0), k, o));
  }
}
function mkPart(x,y,k,o){
  const p={ k, x, y, vx:0, vy:0, g:0, life:1, t:0, s:3, col:o.col||"#fff", rot:rnd(0,6.28), vr:rnd(-5,5) };
  let a, v;
  switch(k){
    case "spark":
      p.vx=rnd(-14,14); p.vy=rnd(-60,-30); p.life=rnd(.5,1.1); p.s=rnd(1.2,2.4);
      p.col=o.col||pick(["#ffd257","#ff9a3a","#fff2a8"]); break;
    case "smoke":
      p.vx=rnd(-5,5)+windX(); p.vy=rnd(-24,-14); p.life=rnd(1.4,2.4); p.s=rnd(4,7);
      p.col=o.col||"#e8eef2"; break;
    case "dust":
      a=rnd(0,6.28); v=rnd(20,65); p.vx=Math.cos(a)*v; p.vy=Math.sin(a)*v*0.5-8;
      p.life=rnd(.5,.9); p.s=rnd(4,9); p.col=o.col||"#ead8b4"; break;
    case "star":
      a=rnd(0,6.28); v=rnd(40,120); p.vx=Math.cos(a)*v; p.vy=Math.sin(a)*v*0.6-50; p.g=140;
      p.life=rnd(.6,1.1); p.s=rnd(3,5.5); p.col=o.col||"#ffd257"; break;
    case "confetti":
      a=rnd(0,6.28); v=rnd(40,140); p.vx=Math.cos(a)*v; p.vy=-rnd(90,180); p.g=280;
      p.life=rnd(1,1.7); p.s=rnd(3,5.5);
      p.col=pick(["#ff6b6b","#ffd257","#5ec3f0","#8fe08a","#c9a6ff"]); break;
    case "drop":
      a=rnd(-2.7,-0.45); v=rnd(40,120); p.vx=Math.cos(a)*v; p.vy=Math.sin(a)*v; p.g=320;
      p.life=rnd(.45,.9); p.s=rnd(1.6,3.2); p.col=o.col||"#e4f5ff"; break;
    case "spray":
      a=rnd(-2.9,-0.25); v=rnd(80,200); p.vx=Math.cos(a)*v; p.vy=Math.sin(a)*v; p.g=380;
      p.life=rnd(.6,1.1); p.s=rnd(2.5,5); p.col=o.col||"#f2fbff"; break;
    case "ink":
      a=rnd(0,6.28); v=rnd(10,50); p.vx=Math.cos(a)*v; p.vy=Math.sin(a)*v*0.5;
      p.life=rnd(1.2,2); p.s=rnd(8,16); p.col=o.col||"#2a1640"; break;
    case "plankton":
      p.vx=rnd(-4,4); p.vy=rnd(-2,2); p.life=rnd(3,6); p.s=rnd(1.2,2.4);
      p.col=pick(["#9ff7ff","#b8ffda","#c9d8ff"]); break;
    case "ripple":
      p.life=rnd(.5,.9); p.s=rnd(5,9); p.col="#e8f6ff"; break;
    case "heart":
      p.vx=rnd(-8,8); p.vy=-rnd(22,34); p.life=1.4; p.s=10; p.col=o.col||"#ff6b8a"; p.txt=o.txt||"♥"; break;
  }
  return p;
}

/* ---------- 파티클 갱신 ---------- */
function updParts(dt){
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];
    p.t+=dt;
    if(p.t>=p.life){ PARTS.splice(i,1); continue; }
    p.vy += p.g*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.rot += p.vr*dt;
    if(p.k==="smoke"){ p.vx += windX()*dt*0.6; }
  }
  // 발사체
  for(let i=SHOTS.length-1;i>=0;i--){
    const s=SHOTS[i]; s.t+=dt;
    if(s.t>=s.dur){
      emit(s.x1,s.y1,"drop",7);
      emit(s.x1,s.y1,"ripple",1);
      if(s.k==="ball"){ emit(s.x1,s.y1,"dust",6,{col:"#c7d3dc"}); shake(2); }
      if(s.onHit) s.onHit();
      SHOTS.splice(i,1);
    }
  }
  // HUD 비행 아이콘
  for(let i=FLY.length-1;i>=0;i--){ const f=FLY[i]; f.t+=dt; if(f.t>=f.dur) FLY.splice(i,1); }
  SHAKE = Math.max(0, SHAKE - dt*22);
}

/* ---------- 파티클 그리기 (월드 변환 안에서 호출) ---------- */
function drawParts(){
  ctx.save();
  // 1단계 : 일반 파티클
  PARTS.forEach(p=>{
    if(p.k==="spark"||p.k==="plankton") return;
    const r=p.t/p.life, a=1-r;
    switch(p.k){
      case "smoke":
        ctx.globalAlpha=a*0.35; ctx.fillStyle=p.col;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.s*(1+r*1.8),0,6.283); ctx.fill(); break;
      case "dust": case "ink":
        ctx.globalAlpha=a*(p.k==="ink"?0.55:0.6); ctx.fillStyle=p.col;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.s*(0.6+r*0.8),0,6.283); ctx.fill(); break;
      case "star":
        ctx.globalAlpha=a; ctx.fillStyle=p.col;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); starPath(p.s); ctx.fill(); ctx.restore(); break;
      case "confetti":
        ctx.globalAlpha=Math.min(1,a*1.6); ctx.fillStyle=p.col;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); break;
      case "drop": case "spray":
        ctx.globalAlpha=a*0.9; ctx.fillStyle=p.col;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fill(); break;
      case "ripple":
        ctx.globalAlpha=a*0.55; ctx.strokeStyle=p.col; ctx.lineWidth=1.3;
        ctx.beginPath(); ctx.ellipse(p.x,p.y,p.s*(0.4+r*1.6),p.s*(0.2+r*0.8),0,0,6.283); ctx.stroke(); break;
      case "heart":
        ctx.globalAlpha=a; ctx.fillStyle=p.col; ctx.font="bold "+p.s+"px sans-serif"; ctx.textAlign="center";
        ctx.fillText(p.txt,p.x,p.y); break;
    }
  });
  // 2단계 : 발광 파티클(불티·플랑크톤) — 가산 합성을 한 번만 켜고 그림
  ctx.globalCompositeOperation="lighter";
  PARTS.forEach(p=>{
    if(p.k!=="spark" && p.k!=="plankton") return;
    const r=p.t/p.life, a=1-r;
    ctx.fillStyle=p.col;
    if(p.k==="spark"){
      ctx.globalAlpha=a;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s*(1+a*0.4),0,6.283); ctx.fill();
    } else {
      const al=Math.sin(r*Math.PI)*0.9;
      ctx.globalAlpha=al; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fill();
      ctx.globalAlpha=al*0.35; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*3,0,6.283); ctx.fill();
    }
  });
  ctx.restore();
  drawShots();
}
function starPath(s){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?s*0.45:s, a=i/10*6.283-1.5708;
    i? ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); }
  ctx.closePath();
}

/* ---------- 발사체 ---------- */
function shoot(x0,y0,x1,y1,k,onHit){
  const d=Math.hypot(x1-x0,y1-y0);
  SHOTS.push({ x0,y0,x1,y1,k, t:0, dur: clamp(d/(k==="ball"?420:620),0.18,0.9), onHit });
}
function drawShots(){
  SHOTS.forEach(s=>{
    const r=s.t/s.dur;
    const x=lerp(s.x0,s.x1,r), arc=Math.sin(r*Math.PI)*(s.k==="ball"?60:22);
    const y=lerp(s.y0,s.y1,r)-arc;
    ctx.save();
    if(s.k==="ball"){
      ctx.fillStyle="#2b2f33"; ctx.beginPath(); ctx.arc(x,y,5,0,6.283); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(x-1.5,y-1.5,1.6,0,6.283); ctx.fill();
      // 연기 꼬리
      if(chance(.12)) emit(x,y,"smoke",1,{col:"#cfd6dc"});   // 연속 사격 시 연기가 쌓여 시야를 가리지 않도록 적게
    } else {
      const nx=lerp(s.x0,s.x1,Math.min(1,r+0.05)), ny=lerp(s.y0,s.y1,Math.min(1,r+0.05))-Math.sin(Math.min(1,r+0.05)*Math.PI)*22;
      const ang=Math.atan2(ny-y,nx-x);
      ctx.translate(x,y); ctx.rotate(ang);
      ctx.strokeStyle="#8a5a2e"; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(4,0); ctx.stroke();
      ctx.fillStyle="#cfd8de"; ctx.beginPath(); ctx.moveTo(4,-3); ctx.lineTo(11,0); ctx.lineTo(4,3); ctx.closePath(); ctx.fill();
      // 로프
      ctx.strokeStyle="rgba(230,210,170,.6)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(-16,0); ctx.quadraticCurveTo(-30,6,-44,2); ctx.stroke();
    }
    ctx.restore();
  });
}

/* ---------- HUD로 날아가는 획득 아이콘 ---------- */
function flyToHud(wx,wy,k,n){
  const el=document.querySelector(`.res[title="${RES[k].name}"]`);
  if(!el) return;
  const r=el.getBoundingClientRect();
  const s=w2s(wx,wy);
  for(let i=0;i<Math.min(n||4,7);i++){
    FLY.push({ sx:s.x+rnd(-14,14), sy:s.y+rnd(-10,10), tx:r.left+12, ty:r.top+r.height/2,
               t:-i*0.05, dur:rnd(.55,.75), col:RES[k].col, k });
  }
  setTimeout(()=>{ el.style.transition="transform .12s"; el.style.transform="scale(1.12)";
    setTimeout(()=>{ el.style.transform=""; },130); }, 600);
}
function drawFly(){
  FLY.forEach(f=>{
    if(f.t<0) return;
    const r=clamp(f.t/f.dur,0,1), e=r*r*(3-2*r);
    // 위로 튀었다가 칩으로 빨려 들어가는 곡선
    const x=lerp(f.sx,f.tx,e), y=lerp(f.sy,f.ty,e) - Math.sin(r*Math.PI)*60;
    ctx.save();
    ctx.globalAlpha=1-r*0.3;
    ctx.fillStyle=f.col; ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,7*(1-r*0.35),0,6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.55)"; ctx.beginPath(); ctx.arc(x-2,y-2,2.2,0,6.283); ctx.fill();
    ctx.restore();
  });
}

/* ---------- 환경 파티클 자동 발생 ---------- */
let fxAcc = {};
function every(key, rate, dt){            // 초당 rate회 발생 여부
  fxAcc[key]=(fxAcc[key]||0)+rate*dt;
  if(fxAcc[key]>=1){ fxAcc[key]-=1; return true; }
  return false;
}
function updFxAmbient(dt){
  if(!S) return;
  const night = !isDay();
  // 건물별 연기·불티
  S.tiles.forEach(t=>{
    if(!t.b) return;
    const p=iso(t.x,t.y), key=t.x+","+t.y;
    switch(t.b){
      case "campfire":
        if(every(key+"s", 5+t.lv*2, dt)) emit(p.x+rnd(-5,5),p.y-14,"spark",1);
        if(every(key+"m", 1.2, dt)) emit(p.x,p.y-22,"smoke",1,{col:"#d9dde0"});
        break;
      case "kitchen":
        if(every(key, 1.4, dt)) emit(p.x-4,p.y-30,"smoke",1); break;
      case "smelter":
        if(every(key, 2.2, dt)) emit(p.x+14,p.y-62,"smoke",1,{col:"#8e959b"});
        if(every(key+"s", 3, dt)) emit(p.x-6,p.y-8,"spark",1); break;
      case "workshop":
        if(t.w>0 && every(key, 2, dt)) emit(p.x+14,p.y-14,"spark",1,{col:"#bfe8ff"}); break;
      case "desal":
        if(every(key, 1.2, dt)) emit(p.x+6,p.y-40,"smoke",1,{col:"#ffffff"}); break;
      case "lodge": case "hut":
        if(night && every(key, 0.5, dt)) emit(p.x+10,p.y-60,"smoke",1,{col:"#c8ced4"}); break;
    }
  });
  // 밤바다 발광 플랑크톤
  if(night && every("plk", 6, dt)){
    const c=raftCenter(), rad=raftRadius(), a=rnd(0,6.283), r=rad+rnd(10,300);
    emit(c.x+Math.cos(a)*r, c.y+Math.sin(a)*r*0.55, "plankton", 1);
  }
  // 빗방울 물결
  const w=S.env.weather;
  if((w==="rain"||w==="storm") && every("rip", w==="storm"?22:12, dt)){
    const c=raftCenter(), rad=raftRadius(), a=rnd(0,6.283), r=rad+rnd(-40,380);
    if(r>rad-20) emit(c.x+Math.cos(a)*r, c.y+Math.sin(a)*r*0.55, "ripple", 1);
  }
  // 폭풍 : 뗏목 가장자리에 파도 물보라
  if(w==="storm" && every("spr", 5, dt)){
    const edges=[...S.tiles.values()].filter(t=>!S.tiles.has(KEY(t.x+1,t.y))||!S.tiles.has(KEY(t.x,t.y+1)));
    if(edges.length){ const t=pick(edges), p=iso(t.x,t.y);
      emit(p.x+rnd(10,40), p.y+rnd(10,24), "spray", 8); }
  }
  // 습격 중 : 작살포·대포가 상어를 향해 발사 (시각 효과 + 위협 소폭 감소)
  if(S.raid && S.sharks.length){
    S.tiles.forEach(t=>{
      if(t.b!=="harpoon" && t.b!=="cannon") return;
      const key="rf"+t.x+","+t.y;
      if(!every(key, t.b==="cannon"? 0.7 : 1.1, dt)) return;
      const p=iso(t.x,t.y), sh=nearest(S.sharks,p.x,p.y);
      if(!sh) return;
      sfx(t.b==="cannon"?"cannon":"shoot");
      shoot(p.x,p.y-24, sh.x, sh.y, t.b==="cannon"?"ball":"harpoon", ()=>{
        if(S.raid){ S.raid.threat = Math.max(0, S.raid.threat - (t.b==="cannon"?2:1)); }
      });
    });
  }
}
function nearest(arr,x,y){
  let b=null, bd=1e9;
  arr.forEach(o=>{ const d=Math.hypot(o.x-x,o.y-y); if(d<bd){ bd=d; b=o; } });
  return b;
}

/* ===== 05-sim.js ===== */
/* =====================================================================
   05. 시뮬레이션 : 생산·소비 / 주민 / 날씨 / 습격 / 폭풍 / 원정 / 연구
   ===================================================================== */

/* ---------- 파생 수치 계산 ---------- */
function techEff(){
  const e = { prodMul:{}, capMul:{}, cookMul:0, partsMul:0, scrapMul:0, defMul:0, hull:0,
              happy:0, popMul:0, tileCost:0, expoTime:0, expoRate:0, expoLoot:0, pearlMul:0,
              stormCut:0, sickCut:0, bossMul:0, netMul:0 };
  S.tech.forEach(id=>{
    const t=TECH[id]; if(!t) return;
    const x=t.eff||{};
    if(x.prodMul) for(const k in x.prodMul) e.prodMul[k]=(e.prodMul[k]||0)+x.prodMul[k];
    if(x.capMul) for(const k in x.capMul) e.capMul[k]=(e.capMul[k]||0)+x.capMul[k];
    ["cookMul","partsMul","scrapMul","defMul","hull","happy","popMul","tileCost",
     "expoTime","expoRate","expoLoot","pearlMul","stormCut","sickCut","bossMul","netMul"].forEach(k=>{ if(x[k]) e[k]+=x[k]; });
  });
  return e;
}
function hullMax(){
  let h=100;
  S.tiles.forEach(t=>{ if(t.b==="barricade") h+=BLD.barricade.hull(t.lv); });
  h += techEff().hull;
  h *= 1 + 0.15*perkLv(S,"ironHull");
  h += S.tiles.size*4;
  return Math.floor(h);
}
function isDay(){ return S.env.time>0.25 && S.env.time<0.82; }

/* ---------- 난이도 곡선 ----------
   · 항해 회차마다 적이 15%씩 강해짐(진주 특전으로 상쇄하는 구조)
   · 8일차 이후 위협이 비선형(거듭제곱)으로 가파르게 증가함                */
function diffMul(s){ s=s||S; return 1 + 0.15*(s.voyage||0); }
function threatOf(s){
  s=s||S;
  const d=s.env.day;
  const late = Math.pow(Math.max(0, d-8), 1.35)*4;
  return Math.floor((8 + d*5 + late + s.tiles.size*0.7 + s.people.length*1.2) * diffMul(s) * hx("threat"));
}
/* 다음 습격 위협 표시 : 못 막은 습격이 있으면 그 세기를 그대로 보여 줌 */
function raidThreatShown(c){ return S.raidRetry? S.raidRetry.threat : c.threat; }
function stormPowerOf(s){
  s=s||S;
  const d=s.env.day;
  return Math.floor((10 + d*4.5 + Math.pow(Math.max(0,d-10),1.3)*2) * diffMul(s) * hx("storm"));
}

function computeCache(s){
  s = s||S;
  const e = techEff();
  const c = { popCap:0, happy:50, powerGen:0, powerUse:0, defense:0, attract:0.15, trade:0,
              rare:0, expoBonus:0, boats:0, research:0, tradeRate:1,
              gross:{}, use:{}, net:{}, jobs:{}, slots:{}, stormCut:0, hasLab:false, hasDock:false,
              hasMarket:false };
  RES_KEYS.forEach(k=>{ c.gross[k]=0; c.use[k]=0; });

  /* 1차 패스 : 인구/전력/방어/기타 */
  s.tiles.forEach(t=>{
    if(!t.b) return; const d=BLD[t.b]; if(!d) return;
    if(d.pop) c.popCap += d.pop(t.lv);
    if(d.happy) c.happy += d.happy(t.lv);
    if(d.attract) c.attract += d.attract(t.lv);
    if(d.trade) c.trade += d.trade(t.lv);
    if(d.rare) c.rare += d.rare(t.lv);
    if(d.expoBonus) c.expoBonus += d.expoBonus(t.lv);
    if(d.boats) c.boats = Math.max(c.boats, d.boats(t.lv));
    if(d.research) c.research += d.research(t.lv) * (1 + t.w*0.6);
    if(d.tradeRate) c.tradeRate = Math.max(c.tradeRate, d.tradeRate(t.lv));
    if(d.stormCut) c.stormCut += d.stormCut(t.lv);
    if(d.heal) c.heal = (c.heal||0) + d.heal(t.lv);
    if(d.endure) c.endure = (c.endure||0) + d.endure(t.lv);
    if(d.warn) c.warn = (c.warn||0) + d.warn(t.lv);
    if(d.bossDmg) c.bossDps = (c.bossDps||0) + d.bossDmg(t.lv) * (1 + 0.5*t.w);
    if(d.defense) c.defense += d.defense(t.lv) + (d.defPerWorker? d.defPerWorker(t.lv)*t.w : 0);
    if(t.b==="lab") c.hasLab=true;
    if(t.b==="dock") c.hasDock=true;
    if(t.b==="market") c.hasMarket=true;
    if(d.power){
      let p=d.power(t.lv);
      if(p>0){
        if(d.dayOnly && !isDay()) p=0;
        if(d.stormBoost && s.env.weather==="storm") p*=2;
        c.powerGen += p;
      } else c.powerUse += -p;
    }
    if(d.slots){ c.slots[d.job]=(c.slots[d.job]||0)+d.slots(t.lv); }
  });
  c.popCap = Math.floor(c.popCap * (1+e.popMul));
  c.happy += e.happy;
  c.stormCut += e.stormCut;
  c.bossDps = (c.bossDps||0) * (1 + e.bossMul) * (1 + 0.15*perkLv(s,"ironHull"));
  c.sickCut = e.sickCut;
  c.powerRatio = c.powerUse<=0? 1 : clamp(c.powerGen/c.powerUse, 0, 1);

  /* 행복/사기 : 식량·식수 상태 반영 */
  const pop=s.people.length;
  const avgH = pop? s.people.reduce((a,p)=>a+p.hunger,0)/pop : 100;
  const avgT = pop? s.people.reduce((a,p)=>a+p.thirst,0)/pop : 100;
  c.happy += (avgH-60)*0.35 + (avgT-60)*0.35;
  c.happy -= Math.max(0, pop - c.popCap)*4;
  c.happy = clamp(c.happy, 0, 130);
  c.moodMul = 0.55 + (c.happy/130)*0.65;               // 0.55 ~ 1.20

  /* 2차 패스 : 생산 */
  const prodPerk = 1 + 0.10*perkLv(s,"richSea");
  s.tiles.forEach(t=>{
    if(!t.b) return; const d=BLD[t.b]; if(!d) return;
    const powered = d.power && d.power(t.lv)<0 ? c.powerRatio : 1;
    if(d.prod){
      const p=d.prod(t.lv);
      for(const k in p){
        let v=p[k]*powered;
        if(d.rainBoost && (s.env.weather==="rain")) v*=3;
        if(d.rainBoost && (s.env.weather==="storm")) v*=4;
        v *= (1+(e.prodMul[k]||0)) * prodPerk;
        c.gross[k]+=v;
      }
    }
    if(d.perWorker && t.w>0){
      const skill = workerSkill(s,t);
      const p=d.perWorker(t.lv);
      for(const k in p){
        let v=p[k]*t.w*skill*powered*c.moodMul;
        v *= (1+(e.prodMul[k]||0)) * prodPerk;
        c.gross[k]+=v;
      }
    }
    if(d.convert && t.w>0){
      const cv0=d.convert(t.lv), skill=workerSkill(s,t);
      let mul = t.w*skill*powered*c.moodMul*prodPerk;
      if(t.b==="kitchen") mul *= (1+e.cookMul);
      if(t.b==="workshop") mul *= (1+e.partsMul);
      for(const k in cv0.in) c.use[k]+=cv0.in[k]*mul;
      for(const k in cv0.out) c.gross[k]+=cv0.out[k]*mul;
    }
  });

  /* 소비 : 주민 식량/식수 */
  // 후반 난이도 : 인구 20명을 넘으면 1인당 소비량이 점점 늘어남(도시 유지비)
  const cut = (1 - 0.05*perkLv(s,"survivors")) * (1 + Math.max(0, pop-20)*0.012) * hx("food");
  c.foodNeed = pop*0.020*cut;
  c.waterNeed = pop*0.016*cut;
  c.use.food = (c.use.food||0) + c.foodNeed;
  c.use.water = (c.use.water||0) + c.waterNeed;

  if(s.ch6 && s.ch6.done) RES_KEYS.forEach(k=>{ c.gross[k]=(c.gross[k]||0)*1.1; });   // 6장 보상 : 심장의 축복
  RES_KEYS.forEach(k=>{ c.net[k] = (c.gross[k]||0) - (c.use[k]||0); });
  c.defense = Math.floor(c.defense * (1+e.defMul) * (1+0.15*perkLv(s,"ironHull")));
  c.threat = threatOf(s);
  c.hullMax = hullMax();
  c.jobsIdle = s.people.filter(p=>p.job==="idle").length;
  s.cache = c;
  return c;
}
function workerSkill(s,t){
  let sum=0,n=0;
  // 아픈 주민은 30%(응급 의학 연구 시 65%)의 효율만 냄
  const sickEff = 0.3 + 0.35*((s.cache&&s.cache.sickCut)||0)/0.5;
  s.people.forEach(p=>{ if(p.bid===KEY(t.x,t.y)){ sum+= p.sick>0? p.skill*sickEff : p.skill; n++; } });
  return n? sum/n : 1;
}

/* ---------- 메인 틱 ---------- */
function simulate(dt){
  if(typeof ABYSS!=="undefined" && ABYSS && ABYSS.active){ abyssTick(dt); return; }   // 심연 도전 중 : 바깥 세계 시간 정지
  S.t += dt; S.stats.playTime += dt;
  /* 환경 */
  S.env.time += dt/240;                       // 1일 = 240초
  if(S.env.time>=1){ S.env.time-=1; S.env.day++; onNewDay(); }
  S.env.wLeft -= dt;
  if(S.env.wLeft<=0) rollWeather();

  const c = computeCache(S);

  /* 생산/소비 적용 */
  RES_KEYS.forEach(k=>{
    const g=(c.gross[k]||0)*dt, u=(c.use[k]||0)*dt;
    if(g>0) gain(k,g);
    if(u>0) S.res[k]=Math.max(0, S.res[k]-u);
  });

  /* 주민 상태 */
  const foodOK = S.res.food>0.1, waterOK = S.res.water>0.1;
  const endure = 1 - clamp(c.endure||0, 0, 0.6);          // 의무실 : 굶주림 속도 감소
  const heal = 1 + (c.heal||0);                            // 의무실 : 회복 속도 증가
  S.people.forEach(p=>{
    p.hunger = clamp(p.hunger + (foodOK? 6*dt : -2.2*dt*endure), 0, 100);
    p.thirst = clamp(p.thirst + (waterOK? 6*dt : -2.6*dt*endure), 0, 100);
    if(p.sick>0){ p.sick -= dt*heal; if(p.sick<=0){ p.sick=0; } }
    p.mood = clamp((p.hunger+p.thirst)/2*0.6 + c.happy*0.4 - (p.sick>0?15:0), 0, 100);
    if(p.emote>0) p.emote -= dt;
    else if(chance(dt*0.02)) { p.emote=2.2; p.emoteK = p.sick>0? "sick" : p.mood>75? "heart" : p.mood<35? "sad" : "note"; }
    if(!p.away) movePerson(p, dt);
  });
  /* 아사/탈주 */
  if(S.people.length>0 && (!foodOK||!waterOK)){
    S.leaveTimer = (S.leaveTimer||0) + dt;
    if(S.leaveTimer > 26){
      S.leaveTimer = 0;
      const victim = S.people.slice().sort((a,b)=>(a.hunger+a.thirst)-(b.hunger+b.thirst))[0];
      if(victim && (victim.hunger<8||victim.thirst<8)){
        removePerson(victim.id);
        S.stats.lost++;
        toast(`💀 <b>${victim.name}</b> 님이 뗏목을 떠났음 (${!foodOK?"식량":"식수"} 부족)`, "bad");
      }
    }
  } else S.leaveTimer=0;

  /* 물 위 오브젝트 */
  updFloats(dt);
  updAutoNet(dt);
  updSharks(dt);
  updBoats(dt);

  /* 이벤트 타이머 */
  S.nextRaid -= dt;  if(S.nextRaid<=0 && S.env.day>=2 && !S.raid) startRaid();
  S.nextStorm -= dt; if(S.nextStorm<=0 && S.env.day>=3 && !S.storm) startStorm();
  if(S.ch4&&S.ch4.done) updWhale(dt);
  S.nextTrader -= dt*(S.ch3&&S.ch3.done? 1.5 : 1);if(S.nextTrader<=0 && c.hasMarket && !S.trader) startTrader();
  if(S.raid) updRaid(dt);
  if(S.storm) updStorm(dt);
  if(S.trader) updTrader(dt);
  updCrisis(dt);
  updBoss(dt);

  /* 연구 */
  if(S.research){
    const spd = 1 + c.research*0.5;
    S.research.left -= dt*spd;
    if(S.research.left<=0) finishResearch();
  }
  /* 원정 */
  for(let i=S.expos.length-1;i>=0;i--){
    const ex=S.expos[i]; ex.left -= dt;
    if(ex.left<=0){ resolveExpedition(ex); S.expos.splice(i,1); }
  }

  checkQuest(); checkCh2(); checkAch();
  updFX(dt);
}

function onNewDay(){
  toast(`🌅 <b>${S.env.day}일차</b> 아침이 밝았음`, "good"); sfx("day");
  S.nextSurv = Math.max(6, 18 - S.env.day*0.3);
}

/* ---------- 날씨 ---------- */
function rollWeather(){
  const r=Math.random();
  let w="clear";
  if(r<0.34) w="clear"; else if(r<0.55) w="cloud"; else if(r<0.88) w="rain"; else w="rain";
  S.env.weather = w;
  S.env.wLeft = rnd(50,110);
  if(w==="rain") toast("🌧️ 비가 내리기 시작함 — 빗물 수집 3배");
}

/* ---------- 주민 이동 ---------- */
function movePerson(p, dt){
  const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
  if(d<3){
    p.wait-=dt;
    if(p.wait<=0){
      let dest;
      if(p.bid && S.tiles.has(p.bid)){
        const t=S.tiles.get(p.bid), q=iso(t.x,t.y);
        dest={ x:q.x+rnd(-24,24), y:q.y+rnd(-11,11) };
      } else dest = randTilePos(S);
      p.tx=dest.x; p.ty=dest.y; p.wait=rnd(1.5,5);
    }
  } else {
    const v=p.spd*dt/d;
    p.x += dx*v; p.y += dy*v;
    p.dir = dx>0?1:-1;
  }
}
function removePerson(id){
  const i=S.people.findIndex(p=>p.id===id);
  if(i<0) return;
  const p=S.people[i];
  if(p.bid && S.tiles.has(p.bid)){ const t=S.tiles.get(p.bid); t.w=Math.max(0,t.w-1); }
  S.people.splice(i,1);
}

/* ---------- 화면 보기 설정 : 깔끔 보기 / 건물 이름표 (이 기기에만 저장) ---------- */
const VIEW_KEY="wildocean_view_v1";
const VIEW = (()=>{ const d={ clean:true, labels:false, maxPeople:30, autoNet:true };
  try{ return Object.assign(d, JSON.parse(localStorage.getItem(VIEW_KEY)||"{}")); }catch(e){ return d; } })();
function saveView(){ try{ localStorage.setItem(VIEW_KEY, JSON.stringify(VIEW)); }catch(e){} }
function setView(k,v){ VIEW[k]=v; saveView(); syncViewBtn(); if(PANEL==="more" && MORE_TAB==="set") moreTab("set"); }
/* 오른쪽 보기 버튼 : 기본 → 깔끔 → 깔끔+이름표 순서로 바꿈 */
function cycleView(){
  if(!VIEW.clean){ VIEW.clean=true; VIEW.labels=false; toast("🧹 깔끔 보기 — 주민 일부·하트·레벨 숫자·인구 말풍선을 숨김"); }
  else if(!VIEW.labels){ VIEW.labels=true; toast("🏷️ 건물 이름표 켬"); }
  else { VIEW.clean=false; VIEW.labels=false; toast("👁️ 기본 보기 — 모든 표시를 보여줌"); }
  saveView(); syncViewBtn(); sfx("click");
  if(PANEL==="more" && MORE_TAB==="set") moreTab("set");
}
function syncViewBtn(){ const b=$("#btnView"); if(b) b.textContent = VIEW.labels? "🏷️" : VIEW.clean? "🧹" : "👁️"; }
/* 깔끔 보기 : 배고픈 주민 → 일하는 주민 → 쉬는 주민 순으로 일부만 그림 */
function visiblePeople(){
  const list=S.people.filter(p=>!p.away);
  if(!VIEW.clean || list.length<=VIEW.maxPeople) return list;
  const rank=p=> (p.hunger<35||p.thirst<35)? 0 : p.job!=="idle"? 1 : 2;
  return list.slice().sort((a,b)=>rank(a)-rank(b)||a.id-b.id).slice(0,VIEW.maxPeople);
}
function drawBuildingLabel(t){
  const def=BLD[t.b]; if(!def) return;
  const p=iso(t.x,t.y);
  const txt=`${def.icon} ${def.name}${t.lv>1?" "+t.lv:""}`;
  ctx.save();
  ctx.font="bold 10px sans-serif"; ctx.textAlign="center";
  const w=ctx.measureText(txt).width+12;
  ctx.fillStyle="rgba(10,30,50,.82)"; ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1.2;
  rrect(p.x-w/2,p.y+8,w,16,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#fff"; ctx.fillText(txt,p.x,p.y+20);
  ctx.restore();
}

/* ---------- 떠다니는 자원 ---------- */
function raftRadius(){
  let r=0; S.tiles.forEach(t=>{ const p=iso(t.x,t.y); r=Math.max(r, Math.hypot(p.x,p.y)); });
  return r+60;
}
function raftCenter(){
  let sx=0,sy=0,n=0; S.tiles.forEach(t=>{ const p=iso(t.x,t.y); sx+=p.x;sy+=p.y;n++; });
  return n? {x:sx/n,y:sy/n} : {x:0,y:0};
}
function updFloats(dt){
  const c=S.cache;
  S.nextFloat -= dt;
  const magnet = 1 + 0.2*perkLv(S,"magnet");
  const maxF = Math.min(22, 9 + Math.floor(S.tiles.size/3));
  if(S.nextFloat<=0 && S.floats.length<maxF){
    const early = S.env.day<=2 && S.voyage===0 ? 0.6 : 1;     // 초반 순풍 : 1~2일차 자원 등장 가속
    S.nextFloat = rnd(1.2,3.2)/magnet*early*hx("floatGap");       // 판자 부족 호소로 등장 간격을 줄임
    spawnFloat();
  }
  // 표류자
  S.nextSurv -= dt*(1+(c.attract||0)+0.2*perkLv(S,"rescue"));
  if(S.nextSurv<=0){
    S.nextSurv = rnd(18,42);
    if(S.people.length < (c.popCap||0) && S.floats.filter(f=>f.k==="person").length<3) spawnFloat("person");
  }
  const cen=raftCenter(), rad=raftRadius();
  for(let i=S.floats.length-1;i>=0;i--){
    const f=S.floats[i];
    f.x += Math.cos(f.dr)*f.sp*dt; f.y += Math.sin(f.dr)*f.sp*dt*0.5;
    f.rot += f.rs*dt;
    f.life -= dt;
    const dist=Math.hypot(f.x-cen.x,f.y-cen.y);
    if(f.life<=0 || dist>rad+520) S.floats.splice(i,1);
  }
}
/* 자동 수집 그물 : 뗏목에서 가까운 떠다니는 자원부터 자동으로 주움 */
/* 초당 자동 수집 개수 : 진주 특전(그물) + 자원 그물 건물 */
function autoNetRate(){
  const lv=perkLv(S,"autoNet");
  let r = lv? autoNetPick(lv)/autoNetGap(lv) : 0;
  const nm = 1 + (techEff().netMul||0);                 // 촘촘한 그물코 · 해류 그물망 연구
  S.tiles.forEach(t=>{ if(t.b==="netpost") r += nm/netpostGap(t.lv); });
  return r;
}
function updAutoNet(dt){
  if(S.boss || !VIEW.autoNet){ S.netAcc=0; return; }
  const rate=autoNetRate();
  if(rate<=0){ S.netAcc=0; return; }
  S.netAcc=Math.min(6,(S.netAcc||0)+rate*dt);
  if(S.netAcc<1) return;
  const cen=raftCenter();
  const full = S.people.length >= (S.cache.popCap||0);
  const list=S.floats.filter(f=>f.k!=="person" || !full)
    .sort((a,b)=>Math.hypot(a.x-cen.x,a.y-cen.y)-Math.hypot(b.x-cen.x,b.y-cen.y));
  if(!list.length){ S.netAcc=Math.min(S.netAcc,1); return; }
  const n=Math.min(list.length, Math.floor(S.netAcc));
  S.netAcc-=n;
  list.slice(0,n).forEach(f=>{
    fxRing(f.x,f.y,"#7fe0ff");
    collectFloat(f, true);
  });
}
function spawnFloat(force){
  const cen=raftCenter(), rad=raftRadius();
  const a=rnd(0,6.283), r=rad+rnd(40,260);
  const x=cen.x+Math.cos(a)*r, y=cen.y+Math.sin(a)*r*0.55;
  let k=force;
  if(!k){
    const r2=Math.random();
    const lowWood = (S.res.wood||0) < tileCost().wood;   // 바닥 한 칸 값도 없으면 판자가 더 자주 옴
    const w = lowWood? 0.72 : 0.58;
    if(r2<w) k="wood";
    else if(r2<w+(1-w)*0.6) k="fish";
    else if(r2<w+(1-w)*(0.88 - Math.min(0.2, 0.04*perkLv(S,"treasure")))) k="scrap";
    else k="crate";
    if(k==="scrap" && S.env.day<2) k="wood";
  }
  S.floats.push({ k, x, y, ph:rnd(0,6.283), rot:rnd(0,6.283), rs:rnd(-0.3,0.3),
    dr:Math.atan2(cen.y-y,cen.x-x)+rnd(-0.6,0.6), sp:rnd(3,9), life:rnd(40,90),
    flip:chance(.5) });
}

/* ---------- 상어 / 보트 ---------- */
function updSharks(dt){
  const want = S.raid? S.raid.n : (S.env.day>=2? 1:0);
  while(S.sharks.length<want){
    const cen=raftCenter(), rad=raftRadius(), a=rnd(0,6.283);
    S.sharks.push({ x:cen.x+Math.cos(a)*(rad+rnd(60,200)), y:cen.y+Math.sin(a)*(rad+rnd(60,200))*0.55,
      a:rnd(0,6.283), ph:rnd(0,6.283), sp:rnd(10,22), orbit:a, r:rad+rnd(60,180) });
  }
  while(S.sharks.length>want) S.sharks.pop();
  const cen=raftCenter();
  S.sharks.forEach(s=>{
    s.orbit += dt*0.22*(S.raid?2.2:1);
    if(S.raid) s.r = Math.max(raftRadius()-10, s.r - dt*10);
    s.x = cen.x+Math.cos(s.orbit)*s.r;
    s.y = cen.y+Math.sin(s.orbit)*s.r*0.55;
    s.a = s.orbit;
  });
}
function updBoats(dt){
  for(let i=S.boats.length-1;i>=0;i--){
    const b=S.boats[i];
    b.x += (b.tx-b.x)*dt*0.5; b.y += (b.ty-b.y)*dt*0.5;
    b.life-=dt; if(b.life<=0) S.boats.splice(i,1);
  }
}

/* ---------- 습격 ---------- */
function startRaid(){
  const c=S.cache;
  const retry = S.raidRetry;                   // 지난번에 못 막은 습격이면 같은 세기로 다시 옴
  const pirate = retry? !!retry.pirate : S.env.day>=6 && chance(Math.min(0.7, 0.4 + (S.env.day-6)*0.03));
  const threat = retry? retry.threat : Math.floor(c.threat*(pirate?1.5:1)*rnd(0.85,1.2));
  S.raid = { t:14, n: pirate? 2 : Math.min(6, 1+Math.floor(S.env.day/3)), threat, threat0:threat, pirate, retry:!!retry };
  S.nextRaid = rnd(210,330)*hx("raidGap");
  if(pirate){
    const cen=raftCenter(), rad=raftRadius();
    S.boats.push({ kind:"pirate", x:cen.x+rad+300, y:cen.y-80, tx:cen.x+rad+40, ty:cen.y-40,
      ph:rnd(0,6.28), life:22 });
  }
  toast((pirate? "🏴‍☠️ <b>해적선 접근!</b> 방어를 준비할 것" : "🦈 <b>상어 떼 접근!</b>")
    + (retry? `<br><small>지난번과 같은 세기 (위협 ${threat})</small>` : ""), "bad"); sfx("alarm");
}
function updRaid(dt){
  S.raid.t -= dt;
  if(S.raid.t<=0) resolveRaid();
}
function resolveRaid(){
  const c=computeCache(S), r=S.raid;
  S.raid=null;
  const def=c.defense, th=r.threat;
  if(def>=th){
    S.stats.raidWin++; sfx("raidWin");
    S.raidRetry=null;
    const loot = r.pirate? { scrap: rndi(15,40), coin: rndi(40,120) } : { fish: rndi(10,30) };
    for(const k in loot) gain(k, loot[k]);
    showModal({
      title: r.pirate? "🏴‍☠️ 해적 격퇴!" : "🦈 습격 격퇴!",
      sub: `방어력 ${def} vs 위협 ${th}`,
      body: `<p>뗏목을 무사히 지켜냄. 물러가는 적에게서 전리품을 회수함.</p>`,
      loot,
      btns:[{ t:"좋음", cls:"btn" }]
    });
  } else {
    S.stats.raidLose++; sfx("raidLose");
    S.raidRetry={ threat: r.threat0||th, pirate: !!r.pirate };   // 다음 습격은 이번과 같은 세기로 옴
    const gap = th-def;
    const dmg = Math.floor(gap*1.6+6);
    S.hullDmg = Math.min(c.hullMax, S.hullDmg + dmg);
    const lost = {};
    ["wood","fish","scrap"].forEach(k=>{
      const n=Math.floor((S.res[k]||0)*rnd(0.06,0.16));
      if(n>0){ S.res[k]-=n; lost[k]=n; }
    });
    let hurt=null;
    if(S.people.length>2 && chance(0.3)){
      hurt = pick(S.people);
      hurt.hunger=Math.max(5,hurt.hunger-40); hurt.mood=20;
    }
    showModal({
      title:"💥 뗏목 피해 발생",
      sub:`방어력 ${def} vs 위협 ${th} — 방어 부족`,
      body:`<p>습격을 막지 못해 <b>내구도 ${dmg}</b>의 피해를 입음.</p>`+
           (Object.keys(lost).length? `<p>약탈당한 자원: ${Object.keys(lost).map(k=>RES[k].icon+fmt(lost[k])).join(" ")}</p>`:"")+
           (hurt? `<p><b>${hurt.name}</b> 님이 다침.</p>`:"")+
           `<p>🔁 <b>다음 습격도 이번과 같은 세기(위협 ${r.threat0||th})</b>로 옴. 그 전에 방어력을 ${r.threat0||th} 이상으로 올릴 것.</p>`+
           `<p style="opacity:.8">작살포를 세우고 경비를 배치하면 방어력이 오름. 습격 중 상어를 탭하면 위협이 줄어듦.</p>`,
      btns:[{ t:"확인", cls:"btn red" }]
    });
  }
}

function collapseSomething(){

/* ---------- 원정 ---------- */
function expoTimeOf(isle){
  const e=techEff();
  let t=ISLES[isle].time * (1+e.expoTime) * (1-0.06*perkLv(S,"navigator"));
  return Math.max(20, Math.floor(t));
}
function expoRateOf(isle, crew){
  const e=techEff(), c=S.cache;
  const base = 46 - ISLES[isle].risk*6;
  const guards = S.people.filter(p=>p.job==="guard").length;
  let r = base + crew*11 + (c.expoBonus||0) + e.expoRate + guards*2;
  return clamp(Math.round(r), 12, 96);
}
/* 원정지 해금 조건 : 기술 연구 / 특정 보스 격퇴 / 보스 4종 모두 격퇴 */
function isleLockText(k){
  const i=ISLES[k];
  if(i.unlock && !S.tech.includes(i.unlock)) return `${TECH[i.unlock].name} 연구 필요`;
  if(i.unlockBoss && !(S.stats[BOSSES[i.unlockBoss].statKey]>0)) return `${BOSSES[i.unlockBoss].icon} ${BOSSES[i.unlockBoss].name} 격퇴 필요`;
  if(i.unlockAllBoss){
    const left=BOSS_ORDER.filter(b=>!(S.stats[BOSSES[b].statKey]>0));
    if(left.length) return `보스 4종 격퇴 필요 (남음: ${left.map(b=>BOSSES[b].icon).join(" ")})`;
  }
  return "";
}
function sendExpedition(isle, crewN){
  if(isleLockText(isle)){ toast("아직 갈 수 없는 원정지임","bad"); sfx("error"); return; }
  const c=computeCache(S);
  if(!c.hasDock){ toast("부두가 필요함","bad"); sfx("error"); return; }
  if(S.expos.length>=c.boats){ toast("보트가 모두 나가 있음","bad"); return; }
  // 이미 원정 중이거나 촉수에 붙잡힌 주민(away)은 제외 — 예전엔 원정 나간 탐험가가 다른 보트에 또 뽑혔음
  const idle=S.people.filter(p=>p.job==="idle" && !p.away);
  if(idle.length<crewN){ toast("유휴 주민이 부족함","bad"); sfx("error"); return; }
  const cost={ food: 10*crewN, water: 8*crewN };
  if(!canPay(cost)){ toast("보급(식량·식수)이 부족함","bad"); sfx("error"); return; }
  pay(cost);
  const crew=idle.slice(0,crewN).map(p=>{ p.job="explorer"; p.away=true; return p.id; });
  const total=expoTimeOf(isle);
  S.expos.push({ isle, crew, left:total, total, rate:expoRateOf(isle,crewN) });
  toast(`⛵ <b>${ISLES[isle].name}</b>(으)로 출항! (${fmtTime(total)})`, "good"); sfx("expo");
  openPanel("expo");
}
function resolveExpedition(ex){
  const def=ISLES[ex.isle], e=techEff();
  S.stats.expo++;
  S.expoDone[ex.isle]=(S.expoDone[ex.isle]||0)+1;
  const roll=Math.random()*100;
  const crit = roll < ex.rate*0.35;
  const ok = roll < ex.rate;
  const scale = (def.repeatScale? 1+0.25*(S.expoDone[ex.isle]-1) : 1)
              * (1+(e.expoLoot||0)) * (1+0.12*perkLv(S,"navigator"));
  const loot={};
  if(ok){
    for(const k in def.loot){
      const [a,b]=def.loot[k];
      const n=Math.floor(rnd(a,b)*scale*(crit?1.8:1));
      if(n>0) loot[k]=gain(k,n);
    }
    // 희귀
    if(crit || chance(0.18+(S.cache.rare||0))){
      for(const k in def.rare){
        if(k==="blueprint"){ const n=def.rare[k]||1; S.blueprint+=n; loot.blueprint=(loot.blueprint||0)+n; }
        else { const [a,b]=def.rare[k]; const n=Math.floor(rnd(a,b)*scale); if(n>0) loot[k]=(loot[k]||0)+gain(k,n); }
      }
    }
    // 생존자 합류
    if(chance(def.survivor) && S.people.length<S.cache.popCap){
      addPerson(S); loot.survivor=1; S.stats.rescued++;
    }
  } else {
    // 실패 : 일부 자원만, 부상 위험
    for(const k in def.loot){ const [a,b]=def.loot[k]; const n=Math.floor(rnd(a,b)*0.25*scale); if(n>0) loot[k]=gain(k,n); }
  }
  // 승무원 복귀
  const lostCrew=[];
  ex.crew.forEach(id=>{
    const p=S.people.find(q=>q.id===id); if(!p) return;
    p.away=false; p.job="idle";
    if(!ok && chance(0.12+def.risk*0.02)){ lostCrew.push(p.name); removePerson(id); S.stats.lost++; }
    else { p.hunger=Math.max(20,p.hunger-25); p.skill=Math.min(2.2, p.skill+(crit?0.12:0.05)); }
  });
  sfx(ok? "raidWin" : "raidLose");
  showModal({
    title: crit? `🌟 대성공! ${def.name}` : ok? `⛵ 원정 성공 · ${def.name}` : `🌫️ 원정 실패 · ${def.name}`,
    sub: `성공률 ${ex.rate}% · 탐험가 ${ex.crew.length}명`,
    body: (ok? `<p>탐사대가 무사히 귀환함.${crit?" <b>희귀한 발견</b>이 있었음!":""}</p>`
             : `<p>악천후로 탐사에 실패함. 건진 물자가 적음.</p>`)
        + (lostCrew.length? `<p style="color:#ff9a9a">실종: ${lostCrew.join(", ")}</p>`:"")
        + (loot.survivor? `<p>🧑 생존자 1명이 합류함!</p>`:"")
        + (loot.blueprint? `<p>📜 <b>설계 도면</b> 획득 — 연구 비용 할인에 사용됨</p>`:""),
    loot,
    btns:[{ t:"확인", cls: ok? "btn":"btn red" }]
  });
}

/* ---------- 프레스티지(항해) ---------- */
function canVoyage(){ return S.people.length>=25 && S.tech.length>=12; }
function voyageGain(){
  const e=techEff();
  const pos=(v)=>Math.max(0, v||0);          // 음수·NaN 방어(Math.pow(음수,소수)=NaN)
  const base = Math.floor(Math.pow(pos(S.stats.totWood)/2600,0.52)
             + Math.pow(pos(S.stats.totCoin)/1400,0.52)
             + S.people.length/9 + S.tech.length/4 + pos(S.stats.expo)/6);
  const got = Math.floor(Math.max(1,base)*(1+(e.pearlMul||0)));
  return Number.isFinite(got)? Math.max(1,got) : 1;
}
function doVoyage(){
  if(!canVoyage()){ toast("조건을 아직 채우지 못함","bad"); sfx("error"); return; }
  const got=voyageGain();
  // 실제 보유 진주(S.res.pearl)를 넘김 — 예전에는 S.pearl(진주 상점 구매 때만 갱신)을 써서
  // 보스·업적·원정으로 얻은 진주가 항해 후 사라지는 문제가 있었음
  const carry={ perks:S.perks, pearl:(S.res.pearl||0)+got, voyage:S.voyage, diff:S.diff, abyss:S.abyss };
  S = newState(carry);
  S.pearl = carry.pearl; S.res.pearl = carry.pearl;
  camCenter(true);
  save();
  sfx("victory");
  showModal({ title:"🫧 새로운 해류로 항해함", sub:`진주 +${got} 획득`,
    body:`<p>뗏목을 해체하고 더 풍요로운 바다로 떠남. 기술과 건물은 사라지지만 <b>진주</b>와 특전은 영원히 남음.</p>
          <p>진주는 [기록] 탭 → 진주 상점에서 사용할 수 있음.</p>`,
    btns:[{t:"새 출발", cls:"btn gold"}] });
}
function buyPerk(id){
  const lv=perkLv(S,id), d=PERKS[id];
  if(lv>=d.max){ toast("최대 레벨임","bad"); sfx("error"); return; }
  const cost=d.cost(lv);
  if((S.res.pearl||0)<cost){ toast("진주가 부족함","bad"); sfx("error"); return; }
  S.res.pearl-=cost; S.pearl=S.res.pearl;
  S.perks[id]=lv+1;
  toast(`🫧 <b>${d.name}</b> Lv${lv+1} 구매`, "good"); sfx("upgrade");
  if(id==="autoNet" && lv===0) toast("🕸️ 이제 그물이 떠다니는 자원을 자동으로 주움 (설정에서 끄기 가능)");
  openPanel("more");
}

/* =====================================================================
   탭(클릭) 처리
   ===================================================================== */
let SELTILE = null;
function handleTap(sx,sy){
  const w=s2w(sx,sy);
  // 0) 보스 / 습격 상어 (전투 대상 우선)
  if(tapBoss(w)) return;
  if(tapShark(w)) return;
  // 1) 떠다니는 오브젝트
  let best=null, bd=1e9;
  S.floats.forEach(f=>{
    const d=Math.hypot(f.x-w.x, (f.y-w.y)*1.7);
    if(d<38 && d<bd){ bd=d; best=f; }
  });
  if(best){ collectFloat(best); return; }
  if(S.boss) return;                         // 보스전 중에는 건설 패널을 열지 않음
  // 2) 타일
  const g=unIso(w.x,w.y);
  const gx=Math.round(g.gx), gy=Math.round(g.gy);
  const k=KEY(gx,gy);
  if(S.tiles.has(k)){
    if(PLACE){
      const t=S.tiles.get(k);
      if(t.b){ toast("이미 건물이 있는 바닥임","bad"); sfx("error"); return; }
      const id=PLACE; PLACE=null; buildOn(k,id); return;
    }
    SELTILE=k; openPanel("tile"); return;
  }
  // 3) 인접 확장 가능 위치
  const adj=[[1,0],[-1,0],[0,1],[0,-1]].some(d=>S.tiles.has(KEY(gx+d[0],gy+d[1])));
  if(adj){ buildFloor(gx,gy); return; }
}
function collectFloat(f, auto){
  const i=S.floats.indexOf(f); if(i<0) return;
  const mul = 1 + 0.25*perkLv(S,"bigHands");
  if(!auto) S.stats.tap++;
  if(f.k==="person"){
    const c=computeCache(S);
    if(S.people.length >= c.popCap){
      toast("잠자리가 부족함 — 텐트를 더 지을 것","bad"); sfx("error");
      fxText(f.x,f.y-30,"수용 불가","#ff9a9a");
      return;
    }
    const p=addPerson(S, {hunger:45,thirst:45});
    const q=randTilePos(S); p.x=f.x; p.y=f.y; p.tx=q.x; p.ty=q.y;
    S.stats.rescued++;
    fxText(f.x,f.y-34,"구조!","#8fe08a"); fxRing(f.x,f.y,"#8fe08a");
    emit(f.x,f.y,"drop",14); emit(f.x,f.y-20,"heart",1); p.emote=2.5; p.emoteK="heart";
    toast(`🧑 <b>${p.name}</b> 님을 구조함`, "good"); sfx("rescue");
  } else if(f.k==="crate"){
    const rolls=[["wood",rndi(40,120)],["fish",rndi(20,60)],["scrap",rndi(10,35)],
                 ["coin",rndi(30,110)],["parts",rndi(2,7)]];
    const r=pick(rolls); const got=gain(r[0], Math.floor(r[1]*mul*(1+0.2*perkLv(S,"treasure"))));
    fxText(f.x,f.y-34,`${RES[r[0]].icon}+${fmt(got)}`, RES[r[0]].col);
    fxRing(f.x,f.y,"#ffd257");
    emit(f.x,f.y-10,"star",10); emit(f.x,f.y,"dust",6,{col:"#d9a15c"});
    flyToHud(f.x,f.y,r[0],6); sfx("crate");
  } else {
    const amt={ wood: Math.round((rndi(11,19)+Math.min(15, S.env.day))*hx("wood")), fish: rndi(4,8), scrap: rndi(3,7) }[f.k];   // 날이 갈수록 판자 묶음이 커짐
    const e=techEff();
    let n=amt*mul;
    if(f.k==="scrap") n*=1+(e.scrapMul||0);
    const got=gain(f.k, Math.floor(n));
    if(f.k==="wood") S.stats.tapWood++;
    fxText(f.x,f.y-30,`${RES[f.k].icon}+${got}`, RES[f.k].col);
    fxSplash(f.x,f.y+6);
    emit(f.x,f.y,"drop",9); emit(f.x,f.y+4,"ripple",1);
    if(got>0) flyToHud(f.x,f.y,f.k,3);
    sfx(f.k);
  }
  S.floats.splice(i,1);
}
function buildFloor(gx,gy){
  const cost=tileCost();
  if(!canPay(cost)){
    toast(`판자가 부족함 (필요 ${fmt(cost.wood)})`,"bad"); sfx("error");
    return;
  }
  pay(cost);
  S.tiles.set(KEY(gx,gy), tileNew(gx,gy));
  const p=iso(gx,gy);
  fxRing(p.x,p.y,"#ffd257"); fxText(p.x,p.y-20,"바닥 건설!","#ffd257");
  emit(p.x,p.y,"dust",14,{spread:30}); emit(p.x,p.y,"drop",10); shake(2);
  toast("🟫 뗏목 바닥을 확장함","good"); sfx("floor");
}

/* ---------- 건물 건설 / 업그레이드 / 철거 ---------- */
function buildOn(key, id){
  const t=S.tiles.get(key); if(!t||t.b) return;
  const d=BLD[id];
  if(d.tech && !S.tech.includes(d.tech)){ toast("선행 기술이 필요함","bad"); sfx("error"); return; }
  const cost=d.cost(1);
  if(!canPay(cost)){ toast("자원이 부족함","bad"); sfx("error"); return; }
  pay(cost); t.b=id; t.lv=1; t.w=0;
  const p=iso(t.x,t.y); fxRing(p.x,p.y,"#8fe08a"); fxText(p.x,p.y-30,d.name+" 완성!","#8fe08a");
  emit(p.x,p.y-10,"dust",18,{spread:26}); emit(p.x,p.y-30,"star",12); shake(3);
  toast(`🔨 <b>${d.name}</b> 건설 완료`,"good"); sfx("build");
  openPanel("tile");
}
function upgradeTile(key){
  const t=S.tiles.get(key); if(!t||!t.b) return;
  const d=BLD[t.b];
  if(t.lv>=d.maxLv){ toast("최대 레벨임","bad"); sfx("error"); return; }
  const cost=d.cost(t.lv+1);
  if(!canPay(cost)){ toast("자원이 부족함","bad"); sfx("error"); return; }
  pay(cost); t.lv++;
  const p=iso(t.x,t.y); fxRing(p.x,p.y,"#ffd257"); fxText(p.x,p.y-34,`Lv${t.lv}!`,"#ffd257");
  emit(p.x,p.y-30,"confetti",26); emit(p.x,p.y-20,"star",8);
  toast(`⬆️ <b>${d.name}</b> Lv${t.lv}`,"good"); sfx("upgrade");
  openPanel("tile");
}
function demolish(key){
  const t=S.tiles.get(key); if(!t||!t.b) return;
  const d=BLD[t.b];
  if(d.special){ toast("이야기 건물은 철거할 수 없음","bad"); sfx("error"); return; }
  let back={};
  for(let l=1;l<=t.lv;l++){ const c=d.cost(l); for(const k in c) back[k]=(back[k]||0)+Math.floor(c[k]*0.5); }
  S.people.forEach(p=>{ if(p.bid===key){ p.bid=null; p.job="idle"; } });
  t.b=null; t.lv=0; t.w=0;
  for(const k in back) gain(k,back[k]);
  toast(`🧨 철거함 — 자원 50% 회수`,"good"); sfx("boom");
  openPanel("tile");
}
/* 일꾼 배치 */
function assignWorker(key, delta){
  const t=S.tiles.get(key); if(!t||!t.b) return;
  const d=BLD[t.b]; if(!d.slots) return;
  const max=d.slots(t.lv);
  if(delta>0){
    if(t.w>=max){ toast("자리가 가득 참","bad"); sfx("error"); return; }
    const p=S.people.find(q=>q.job==="idle" && !q.away);
    if(!p){ toast("유휴 주민이 없음","bad"); sfx("error"); return; }
    p.job=d.job; p.bid=key; t.w++; sfx("click");
  } else {
    const p=S.people.find(q=>q.bid===key);
    if(!p) return;
    p.job="idle"; p.bid=null; t.w=Math.max(0,t.w-1);
  }
  if(PANEL==="tile" && SELTILE===key) openPanel("tile");   // 열려 있는 패널만 갱신
  else if(PANEL) refresh();
}

/* =====================================================================
   위기 이벤트 — 8일차부터 주기적으로 발생, 기술·건물로 피해를 줄일 수 있음
   ===================================================================== */
const CRISES = {
  spoil: { name:"식량 부패",   icon:"🦠", desc:"습기로 저장 식량이 상함" },
  sick:  { name:"전염병",      icon:"🤒", desc:"주민 일부가 병에 걸려 일을 제대로 못 함" },
  leak:  { name:"물탱크 누수", icon:"💦", desc:"저장해 둔 식수가 새어 나감" },
  fire:  { name:"화재",        icon:"🔥", desc:"건물에 불이 붙음. 식수 50으로 진화 가능" },
};
function updCrisis(dt){
  if(S.crisis){ S.crisis.t -= dt; if(S.crisis.t<=0) S.crisis=null; }
  if(S.env.day<8 || S.boss) return;
  S.nextCrisis -= dt;
  if(S.nextCrisis>0) return;
  S.nextCrisis = rnd(300,480) / Math.min(1.7, 1+(S.env.day-8)*0.05);
  triggerCrisis(pick(Object.keys(CRISES)));
}
function triggerCrisis(k){
  const has=(id)=>S.tech.includes(id);
  const cr=CRISES[k];
  let msg="", saved="";
  if(k==="spoil"){
    let r=0.25; if(has("smoking")) r=0.12; if(has("coldStorage")) r=0.04;
    const n=Math.floor(S.res.food*r); S.res.food-=n;
    msg=`식량 ${fmt(n)} 손실`; if(r<0.25) saved=has("coldStorage")?"냉장 보관으로 대부분 지켜냄":"훈제 보존법으로 피해 절반";
  } else if(k==="sick"){
    const pool=S.people.filter(p=>!p.away&&!(p.sick>0));
    let n=Math.max(1, Math.floor(pool.length*rnd(0.2,0.35)));
    if(has("medicine")) n=Math.max(1,Math.floor(n/2));
    for(let i=0;i<n&&pool.length;i++){ const p=pool.splice(rndi(0,pool.length-1),1)[0]; p.sick=rnd(60,95); }
    msg=`주민 ${n}명 발병`; if(has("medicine")) saved="응급 의학으로 확산을 절반으로 막음";
    if(S.cache.heal) saved += (saved?" · ":"")+"의무실이 빠르게 치료 중";
  } else if(k==="leak"){
    let r=0.3; if(has("stormProof")) r=0.15;
    const n=Math.floor(S.res.water*r); S.res.water-=n;
    msg=`식수 ${fmt(n)} 손실`; if(r<0.3) saved="폭풍 대비 공법으로 피해 절반";
  } else if(k==="fire"){
    const arr=[...S.tiles.values()].filter(t=>t.b);
    const t=arr.length? pick(arr):null;
    if(t){
      const p=iso(t.x,t.y);
      emit(p.x,p.y-20,"spark",24,{spread:20}); emit(p.x,p.y-20,"smoke",10,{spread:16,col:"#6d747a"});
      if(S.res.water>=50){ S.res.water-=50; msg=`${BLD[t.b].name} 화재 발생`; saved="식수 50으로 진화함"; }
      else if(t.lv>1){ t.lv--; msg=`${BLD[t.b].name} 화재 — 레벨 하락`; }
      else { msg=`${BLD[t.b].name} 화재 — 가까스로 진화`; }
    }
  }
  S.stats.crisis=(S.stats.crisis||0)+1;
  S.crisis={ k, t:10, msg, saved }; sfx("crisis");
  toast(`${cr.icon} <b>위기: ${cr.name}</b> — ${msg}${saved?`<br><small>✅ ${saved}</small>`:""}`, saved?"":"bad");
}

/* =====================================================================
   상어 직접 공격 — 습격 중 상어를 탭하면 작살을 던져 위협을 깎음
   ===================================================================== */
function tapShark(w){
  if(!S.raid) return false;
  const sh=S.sharks.find(s=>Math.hypot(s.x-w.x,(s.y-w.y)*1.6)<42);
  if(!sh) return false;
  const dmg = 3 + perkLv(S,"bigHands");
  S.raid.threat = Math.max(0, S.raid.threat - dmg);
  S.stats.sharkHit=(S.stats.sharkHit||0)+1;
  sh.r += 40;                                    // 맞은 상어는 뒤로 밀려남
  emit(sh.x,sh.y,"spray",12); emit(sh.x,sh.y,"ripple",2);
  fxText(sh.x,sh.y-26,`-${dmg} 위협`,"#ffd257"); sfx("hit"); sfx("splash");
  shake(3);
  return true;
}

/* =====================================================================
   보스 일정
   · 6일차부터 5일 간격 : 대해일 → 거대 문어 → 해적 전함 → 심해 해룡 → (반복)
   · 무전탑이 있으면 예고가 더 빨리 뜸
   · 보스를 쓰러뜨릴수록 다음 보스가 강해짐
   · 난이도(쉬움·보통·어려움)가 체력·공격·시간·보상·탭 피해에 반영됨
   ===================================================================== */
const BOSS_TIME = 0.55;          // 그날 오후(하루의 55% 지점)에 출현
function bossType(n){ return BOSS_ORDER[n % BOSS_ORDER.length]; }
function bossDiff(){ return DIFF[S.diff] || DIFF.normal; }
function bossStr(){
  if(typeof ABYSS!=="undefined" && ABYSS && ABYSS.active) return ABYSS.str;   // 심연 : 층별 세기
  return diffMul(S) * (1 + 0.35*S.bossN) * (1 + S.env.day*0.03) * bossDiff().str * hx("boss"); }
function bossName(t){ return (BOSSES[t]||{}).name || "보스"; }
function bossTapDmg(){
  if(isWeekly()) return 14 * ABYSS.buffs.tapMul;          // 주간 도전 : 특전·기술 무시, 카드·주간 규칙만 반영
  return (14 + 4*perkLv(S,"bigHands")) * (1 + techEff().bossMul) * bossDiff().tap
  * ((typeof ABYSS!=="undefined" && ABYSS && ABYSS.active)? ABYSS.buffs.tapMul : 1); }
/* 보상 배율 적용 + 어려움 추가 진주 + 격퇴 통계 */
function bossReward(loot, type){
  const d=bossDiff(), out={};
  for(const k in loot){ out[k] = k==="pearl"? loot[k] : Math.floor(loot[k]*d.reward); }
  if(d.pearl) out.pearl=(out.pearl||0)+d.pearl;
  if(S.diff==="hard") S.stats.hardClear=(S.stats.hardClear||0)+1;
  const got={}; for(const k in out) got[k]=gain(k,out[k]);
  return got;
}

const BOSS_WARN = {

function updBoss(dt){
  if(S.boss){
    switch(S.boss.type){
      case "tempest": updTempest(dt); break;
      case "kraken":  updKraken(dt); break;
      case "warship": updWarship(dt); break;
      case "serpent": updSerpent(dt); break;
      case "final":   updFinal(dt); break;
    }
    return;
  }
  if(updFinalSchedule()) return;             // 최종 보스 날에는 일반 보스를 쉬게 함
  if(updCh2Schedule()) return;               // 2장 그림자 출현 날에도 일반 보스를 쉬게 함
  if(S.env.day < S.bossDay) return;
  const warnSec = 45 + (S.cache.warn||0);
  const secLeft = (BOSS_TIME - S.env.time)*240;
  if(S.env.day===S.bossDay && secLeft>0 && secLeft<=warnSec && S.bossWarned!==S.bossDay){
    S.bossWarned=S.bossDay;
    const t=bossType(S.bossN), d=bossDiff();
    sfx("bossAlarm");
    showModal({ title:`⚠️ ${BOSSES[t].icon} ${bossName(t)} 접근 경보`, sub:`약 ${Math.ceil(secLeft)}초 후 출현`,
      body: BOSS_WARN[t] +
        `<div class="hintbox" style="margin-top:8px">현재 보스 난이도: <b>${d.icon} ${d.name}</b> — 출현 전까지 바꿀 수 있음
         <div class="tagrow" style="margin:6px 0 0">${Object.keys(DIFF).map(k=>
           `<span class="tag ${S.diff===k?"on":""}" onclick="setDiff('${k}',true)">${DIFF[k].icon} ${DIFF[k].name}</span>`).join("")}</div></div>`,
      btns:[{t:"대비하겠음", cls:"btn red"}], kind:"bossWarn" });
  }
  if((S.env.day>S.bossDay || S.env.time>=BOSS_TIME) && !S.raid && !S.storm) startBoss();
}
function startBoss(){
  const t=bossType(S.bossN);
  closePanel(); PLACE=null;
  if($("#modal").dataset.kind==="bossWarn") closeModal();     // 닫지 않은 경보 창이 전장을 가리지 않도록
  // 전장이 한눈에 들어오도록 카메라를 먼저 뒤로 빼고 앞쪽 바다를 비춤 (보스 배치가 이 시야를 기준으로 함)
  camCenter(); CAM.ty -= 50;
  CAM.z = Math.min(CAM.z, t==="serpent"? 0.72 : t==="warship"? 0.78 : 0.85);
  CAM.x = CAM.tx; CAM.y = CAM.ty;
  switch(t){
    case "tempest": startTempest(); break;
    case "kraken":  startKraken(); break;
    case "warship": startWarship(); break;
    case "serpent": startSerpent(); break;
  }
  toast(`☠️ <b>보스 출현: ${bossName(t)}</b> <small>(${bossDiff().name})</small>`, "bad");
  sfx("bossStart");
  shake(8);
}
/* 난이도 변경 (설정 화면·보스 경보에서 호출) */
function setDiff(k, fromModal){
  if(!DIFF[k]) return;
  if(S.boss){ toast("보스전 중에는 난이도를 바꿀 수 없음","bad"); sfx("error"); return; }
  S.diff=k; save();
  sfx("click");
  toast(`${DIFF[k].icon} 보스 난이도: <b>${DIFF[k].name}</b>`, "good");
  if(fromModal){ $$("#modal .tag").forEach(el=>el.classList.toggle("on", el.textContent.includes(DIFF[k].name))); }
  if(PANEL==="more" && MORE_TAB==="set") moreTab("set");
}
function endBoss(win){
  const b=S.boss; S.boss=null;
  S.bossN++;
  S.bossDay = S.env.day + 5;
  if(b.type==="tempest"){ S.env.weather="rain"; S.env.wLeft=rnd(20,40); }
  // 붙잡힌 주민 처리
  (b.arms||[]).forEach(a=>{ if(a.grab) releaseGrab(a, win); });
  return b;
}

/* =====================================================================
   보스 ① 대해일 — 75초 동안 3단계로 거세지는 폭풍 + 거대 파도 탭 방어
   ===================================================================== */
function startTempest(){
  const str=bossStr();
  S.boss = { type:"tempest", t:75, total:75, str, waves:[], nextWave:3,
             power: stormPowerOf(S)*1.5*(1+0.3*S.bossN)*bossDiff().str, spawned:0, broken:0, hit:0 };
  S.env.weather="storm"; S.env.wLeft=85;
}
/* 폭풍형 피해 상한 (뗏목 최대 내구도 대비 비율)
   · 일반 : 지속 피해 초당 0.6%, 파도 1개 22%
   · 심연 : 층이 오를수록 상한이 커짐 (지속 최대 1.2%/초, 파도 최대 45%)
   예전에는 피해가 보스 누적 격퇴 수에 비례해 끝없이 커져, 3번째 대해일부터 12초 만에 침몰하는 문제가 있었음 */
function stormCaps(){
  if(typeof ABYSS!=="undefined" && ABYSS && ABYSS.active){
    const f=ABYSS.floor;
    return { cont:Math.min(0.012, 0.004+0.0005*f), wave:Math.min(0.45, 0.14+0.02*f) };
  }
  return { cont:0.006, wave:0.22 };
}
function tempestPhase(b){ const r=1-b.t/b.total; return r<0.34?1 : r<0.67?2 : 3; }
function updTempest(dt){
  const b=S.boss, c=S.cache;
  b.t -= dt;
  S.env.weather="storm";
  const cut=clamp(c.stormCut,0,0.75);
  // 지속 피해
  const cap=stormCaps();
  S.hullDmg = Math.min(c.hullMax, S.hullDmg + Math.min(b.power*0.022, c.hullMax*cap.cont)*(1-cut)*dt);
  // 파도 생성 (단계가 오를수록 빠르고 많아짐)
  const ph=tempestPhase(b);
  b.nextWave -= dt;
  if(b.nextWave<=0 && b.t>4){
    b.nextWave = ph===1? 6.5 : ph===2? 4.8 : 3.4;
    const n = ph===3? 2 : 1;
    for(let i=0;i<n;i++) spawnWave(b);
  }
  // 파도 이동 : 생성 지점 → 충돌 지점까지 정해진 시간(dur) 동안 다가옴
  for(let i=b.waves.length-1;i>=0;i--){
    const w=b.waves[i];
    w.t += dt; w.ph += dt;
    const r=clamp(w.t/w.dur,0,1), e=r*r*(1.6-0.6*r);      // 처음엔 느리게, 가까워질수록 빨라짐
    w.x = lerp(w.x0,w.x1,e); w.y = lerp(w.y0,w.y1,e);
    w.size = w.s0*(0.8+0.35*r);
    // 방어 시설이 파도를 조금씩 깎음
    w.hp -= (c.bossDps||0)*0.015*dt;
    if(w.hp<=0){ breakWave(b,i,false); continue; }
    if(r>=1){
      // 충돌
      const dmg = Math.min(b.power*(0.7+0.3*w.hp/w.maxHp), c.hullMax*cap.wave)*(1-cut);
      S.hullDmg = Math.min(c.hullMax, S.hullDmg + dmg);
      b.hit++;
      emit(w.x,w.y,"spray",36,{spread:30}); shake(10); sfx("waveCrash");
      fxText(w.x,w.y-40,`-${Math.round(dmg)} 내구`,"#ff9a9a");
      b.waves.splice(i,1);
      if(S.hullDmg>=c.hullMax*0.98) collapseSomething();
    }
  }
  if(b.t<=0) finishTempest();
}
/* 파도 생성 : 반드시 "지금 보이는 화면" 안의 하단·좌우 가장자리에서 생성해 탭할 시간을 보장함 */
function spawnWave(b){
  const cen=raftCenter(), rad=raftRadius();
  const W=cv.width/DPR, H=cv.height/DPR;
  const top=H*0.5, bottom=H-200, m=Math.min(96, W*0.22);   // HUD(상단)·탭바(하단)를 피하고, 파도 전체가 보이도록 여백 확보
  let sx, sy;
  const side=Math.random();
  if(side<0.5){ sx=rnd(m, W-m); sy=bottom; }         // 아래쪽
  else if(side<0.75){ sx=m; sy=rnd(top,bottom); }    // 왼쪽
  else { sx=W-m; sy=rnd(top,bottom); }                // 오른쪽
  const s=s2w(sx,sy);
  // 충돌 지점 : 뗏목 중심 방향으로, 뗏목 가장자리 근처
  const dx=s.x-cen.x, dy=(s.y-cen.y)/0.55, d=Math.hypot(dx,dy)||1;
  const ux=dx/d, uy=dy/d;
  const x1=cen.x+ux*rad*0.8, y1=cen.y+uy*rad*0.8*0.55;
  // 화면 가장자리가 이미 뗏목에 너무 가까우면 바깥으로 조금 밀어냄(최소 이동 거리 확보)
  let x0=s.x, y0=s.y;
  if(Math.hypot(x0-x1,(y0-y1)/0.55) < 160){ x0=x1+ux*160; y0=y1+uy*160*0.55; }
  const ph=tempestPhase(b);
  const hp = 3 + Math.floor(S.bossN/2) + (ph===3?1:0);
  const s0=rnd(0.85,1.05);
  b.waves.push({ x:x0, y:y0, x0, y0, x1, y1, t:0, dur: (ph===1? 6.8 : ph===2? 5.6 : 4.6)*bossDiff().time*((typeof ABYSS!=="undefined" && ABYSS && ABYSS.active)? ABYSS.waveMul : 1),
                 hp, maxHp:hp, ph:rnd(0,6), s0, size:s0*0.8 });
  b.spawned++;
  emit(x0,y0,"spray",14,{spread:20});
}
function breakWave(b,i,byTap){
  const w=b.waves[i];
  emit(w.x,w.y,"spray",28,{spread:26}); emit(w.x,w.y,"star",6,{col:"#bfe8ff"});
  fxText(w.x,w.y-36, byTap?"파도 분쇄!":"방벽이 막음!","#bfe8ff");
  b.broken++; b.waves.splice(i,1); sfx("waveBreak");
}
function finishTempest(){
  const b=endBoss(true);
  S.stats.tempest=(S.stats.tempest||0)+1;
  const ratio = b.spawned? b.broken/b.spawned : 1;
  const n=S.bossN;
  const loot={ parts: Math.floor((10+5*n)*(0.6+ratio)), coin: Math.floor((220+110*n)*(0.6+ratio)),
               wood: Math.floor(300+120*n) };
  if(ratio>=0.6) loot.pearl = 1 + (n>=4?1:0);
  const got=bossReward(loot,"tempest");
  sfx("victory");
  const c=raftCenter(); emit(c.x,c.y-30,"confetti",60,{spread:60});
  showModal({ title:"🌀 대해일을 견뎌냄!", sub:`파도 ${b.spawned}개 중 ${b.broken}개 분쇄 · 직격 ${b.hit}회`,
    body:`<p>폭풍이 걷히고 바다 위로 햇살이 비침. 떠밀려 온 잔해에서 물자를 건짐.</p>
          ${ratio>=0.6?"":"<p style='opacity:.8'>파도를 60% 이상 부수면 진주를 얻을 수 있음.</p>"}`,
    loot:got, btns:[{t:"수령", cls:"btn gold"}] });
}

/* =====================================================================
   보스 ② 거대 문어 — 촉수 단계 → 본체 단계, 제한 시간 90초
   ===================================================================== */
function startKraken(){
  const str=bossStr();
  const edges=[...S.tiles.values()].filter(t=>
    [[1,0],[-1,0],[0,1],[0,-1]].some(d=>!S.tiles.has(KEY(t.x+d[0],t.y+d[1]))));
  const n=Math.min(6, 3+Math.floor(S.bossN/2));
  const cen=raftCenter(), arms=[];
  // 화면에서 잘 보이도록 뗏목 앞쪽(아래) 가장자리를 우선 사용하고, 각도 순으로 고르게 벌려 배치함
  const angOf=(t)=>{ const p=iso(t.x,t.y); return Math.atan2((p.y-cen.y)/0.55, p.x-cen.x); };
  // 화면에 보이는 가장자리를 우선 사용 (부족하면 앞쪽 → 전체 순으로 넓힘)
  let pool=visibleSpots(78, edges).map(s=>s.t);
  if(pool.length<n) pool=edges.filter(t=>iso(t.x,t.y).y >= cen.y-TH*0.5);
  if(pool.length<n) pool=edges.slice();
  pool.sort((a,b)=>angOf(a)-angOf(b));
  const chosen=[];
  for(let i=0;i<n;i++) chosen.push(pool[Math.floor((i+0.5)*pool.length/n)]);
  for(let i=0;i<n;i++){
    const t=chosen[i];
    const p=iso(t.x,t.y);
    const ang=Math.atan2((p.y-cen.y)/0.55, p.x-cen.x);
    const hp=Math.floor(70*str);
    arms.push({ x:p.x+Math.cos(ang)*78, y:p.y+Math.sin(ang)*42, ang, hp, maxHp:hp,
                atk:rnd(4,8), rise:0, ph:rnd(0,6.28), grab:null, dead:false, hurt:0, slam:0 });
  }
  let front=null; S.tiles.forEach(t=>{ if(!front||(t.x+t.y)>(front.x+front.y)) front=t; });
  const fp=iso(front.x,front.y);
  const hp=Math.floor(260*str);
  const T=90*bossDiff().time;
  S.boss={ type:"kraken", t:T, total:T, str, arms, phase:"arms",
           head:{ x:fp.x, y:fp.y+150, hp, maxHp:hp, rise:0, atk:6, hurt:0 }, dmgDone:0 };
  S.env.weather = S.env.weather==="clear"? "cloud" : S.env.weather;
  emit(cen.x,cen.y+120,"ink",30,{spread:120});
}
function krakenTarget(){
  const b=S.boss; if(!b||b.type!=="kraken") return null;
  if(b.phase==="arms"){
    const alive=b.arms.filter(a=>!a.dead);
    // 주민을 잡은 촉수를 우선 공격
    return alive.find(a=>a.grab) || alive.sort((a,c)=>a.hp-c.hp)[0] || null;
  }
  return b.head;
}
function hitKraken(tg, dmg, byTap){
  const b=S.boss;
  tg.hp -= dmg; tg.hurt=0.25; b.dmgDone+=dmg;
  emit(tg.x, tg.y-40, "ink", byTap?4:2, {spread:12});
  if(byTap){ sfx("hit"); emit(tg.x, tg.y-40, "star", 4, {col:"#ffe07a"}); fxText(tg.x+rnd(-12,12), tg.y-70, `-${Math.round(dmg)}`, "#ffe07a"); shake(2); }
  if(tg.hp<=0){
    if(tg===b.head){ finishKraken(true); return; }
    tg.dead=true; tg.hp=0;
    emit(tg.x,tg.y-30,"spray",30,{spread:24}); emit(tg.x,tg.y-30,"ink",14,{spread:20});
    fxText(tg.x,tg.y-80,"촉수 격파!","#ffd257"); sfx("boom");
    if(tg.grab) releaseGrab(tg, true);
    if(b.arms.every(a=>a.dead)){
      b.phase="head";
      toast("🐙 <b>본체가 떠오름!</b> 눈을 집중 공격할 것","bad");
      shake(10);
    }
  }
}
function releaseGrab(arm, saved){
  const p=S.people.find(q=>q.id===arm.grab);
  arm.grab=null;
  if(!p) return;
  p.grabbed=false;
  if(saved){
    p.away=false; const q=randTilePos(S); p.x=arm.x; p.y=arm.y; p.tx=q.x; p.ty=q.y;
    p.emote=2.5; p.emoteK="heart";
    toast(`🙌 <b>${p.name}</b> 님을 구출함!`,"good");
  } else {
    removePerson(p.id); S.stats.lost++;
    toast(`💀 <b>${p.name}</b> 님이 심해로 끌려감`,"bad");
  }
}
function updKraken(dt){
  const b=S.boss, c=S.cache;
  b.t -= dt;
  const cut=clamp(c.stormCut*0.5,0,0.5);
  // 등장 연출
  b.arms.forEach(a=>{ if(!a.dead) a.rise=Math.min(1,a.rise+dt*0.8); a.hurt=Math.max(0,a.hurt-dt); a.slam=Math.max(0,a.slam-dt); a.ph+=dt; });
  if(b.phase==="head") b.head.rise=Math.min(1,b.head.rise+dt*0.6);
  b.head.hurt=Math.max(0,b.head.hurt-dt);

  // 방어 시설 자동 사격
  const dps=(c.bossDps||0) + guardCount()*1.2;
  const tg=krakenTarget();
  if(tg && dps>0){
    hitKraken(tg, dps*dt, false);
    if(!S.boss) return;
    // 발사체 연출
    S.tiles.forEach(t=>{
      if(t.b!=="harpoon"&&t.b!=="cannon") return;
      if(!every("kr"+t.x+","+t.y, t.b==="cannon"?0.9:1.4, dt)) return;
      const p=iso(t.x,t.y); const target=krakenTarget(); if(!target) return;
      shoot(p.x,p.y-24,target.x+rnd(-10,10),target.y-40,t.b==="cannon"?"ball":"harpoon");
      sfx(t.b==="cannon"?"cannon":"shoot");
    });
  }
  // 촉수 공격
  if(b.phase==="arms"){
    b.arms.forEach(a=>{
      if(a.dead||a.rise<1) return;
      a.atk -= dt;
      if(a.atk>0) return;
      a.atk = rnd(5,8)/Math.min(1.6, b.str*0.8);
      a.slam = 0.5;
      const dmg = 7*b.str*(1-cut);
      S.hullDmg = Math.min(c.hullMax, S.hullDmg + dmg);
      emit(a.x,a.y-10,"spray",18,{spread:14}); shake(6); sfx("boom");
      fxText(a.x,a.y-90,`-${Math.round(dmg)} 내구`,"#ff9a9a");
      if(a.grab){ releaseGrab(a,false); return; }
      if(chance(0.3)){
        const pool=S.people.filter(p=>!p.away);
        if(pool.length>1){
          const p=pick(pool); p.away=true; p.grabbed=true; a.grab=p.id;
          if(p.bid&&S.tiles.has(p.bid)){ const t=S.tiles.get(p.bid); t.w=Math.max(0,t.w-1); }
          p.bid=null; p.job="idle";
          toast(`😱 <b>${p.name}</b> 님이 촉수에 붙잡힘! 그 촉수를 공격할 것`,"bad"); sfx("grab");
        }
      }
    });
  } else {
    const h=b.head;
    h.atk -= dt;
    if(h.atk<=0 && h.rise>=1){
      h.atk = rnd(5,7);
      const dmg = 14*b.str*(1-cut);
      S.hullDmg = Math.min(c.hullMax, S.hullDmg + dmg);
      emit(h.x,h.y-30,"ink",26,{spread:60}); shake(9); sfx("bite");
      fxText(h.x,h.y-120,`먹물 공격 -${Math.round(dmg)}`,"#c9a6ff");
    }
  }
  if(S.hullDmg>=c.hullMax*0.98) collapseSomething();
  if(b.t<=0) finishKraken(false);
}
function finishKraken(win){
  if(S.boss && S.boss.chap){                         // 5장 가시 산호 문어
    const cb=S.boss; S.boss=null;
    cb.arms.forEach(a=>{ if(a.grab) releaseGrab(a, win); });
    return finishCh2Boss(win, cb);
  }
  const b=endBoss(win);
  const n=S.bossN;
  if(win){
    S.stats.kraken=(S.stats.kraken||0)+1;
    const loot={ pearl: 1+Math.floor(n/3), parts: 20+10*n, coin: 400+200*n, scrap: 100+50*n, fish: 150+60*n };
    const got=bossReward(loot,"kraken");
    sfx("victory");
    emit(b.head.x,b.head.y-60,"confetti",70,{spread:50}); emit(b.head.x,b.head.y-60,"ink",30,{spread:50});
    showModal({ title:"🐙 거대 문어 격퇴!", sub:`남은 시간 ${Math.ceil(Math.max(0,b.t))}초`,
      body:`<p>거대 문어가 먹물을 뿜으며 심해로 달아남. 촉수가 휘감고 있던 난파선 보물이 떠오름.</p>`,
      loot:got, btns:[{t:"수령", cls:"btn gold"}] });
  } else {
    const lost={};
    ["wood","fish","parts","scrap"].forEach(k=>{ const q=Math.floor((S.res[k]||0)*0.2); if(q>0){ S.res[k]-=q; lost[k]=q; } });
    sfx("defeat");
    showModal({ title:"🌑 거대 문어가 물러감", sub:"제한 시간 안에 쓰러뜨리지 못함",
      body:`<p>문어가 창고의 물자를 휘감아 심해로 사라짐.</p>
            <p>약탈: ${Object.keys(lost).map(k=>RES[k].icon+fmt(lost[k])).join(" ")||"없음"}</p>
            <p style="opacity:.8">작살포·해상 대포를 늘리고 경비를 배치하면 자동 피해가 커짐.</p>`,
      btns:[{t:"확인", cls:"btn red"}] });
  }
}

/* =====================================================================
   보스 탭 처리 (handleTap 에서 가장 먼저 호출)
   ===================================================================== */
function tapBoss(w){
  const b=S.boss; if(!b) return false;
  if(b.type==="warship") return tapWarship(w);
  if(b.type==="serpent") return tapSerpent(w);
  if(b.type==="final") return tapFinal(w);
  const tapDmg = bossTapDmg();
  if(b.type==="tempest"){
    let bi=-1, bd=1e9;
    b.waves.forEach((wv,i)=>{ const d=Math.hypot(wv.x-w.x,(wv.y-20-w.y)*1.4); if(d<70*wv.size && d<bd){ bd=d; bi=i; } });
    if(bi<0) return false;
    const wv=b.waves[bi];
    wv.hp -= waveTapPow();
    emit(w.x,w.y,"spray",10); shake(2); sfx("splash");
    if(wv.hp<=0) breakWave(b,bi,true);
    else fxText(wv.x,wv.y-50,`${wv.hp}`,"#fff");
    return true;
  }
  // 거대 문어
  if(b.phase==="arms"){
    let best=null, bd=1e9;
    b.arms.forEach(a=>{ if(a.dead) return;
      const d=Math.hypot(a.x-w.x, (a.y-45-w.y)*0.8); if(d<52&&d<bd){ bd=d; best=a; } });
    if(best){ hitKraken(best, tapDmg, true); return true; }
  } else {
    const h=b.head;
    if(Math.hypot(h.x-w.x,(h.y-60-w.y)*0.8)<90){ hitKraken(h, tapDmg*(1.2), true); return true; }
  }
  return false;
}

/* =====================================================================
   보스 그리기
   ===================================================================== */
function drawBossWater(){           // 뗏목보다 먼저 그림(물속)
  const b=S.boss; if(!b) return;
  if(b.type==="warship"){ drawWarshipWater(b); return; }
  if(b.type==="serpent"){ drawSerpentWater(b); return; }
  if(b.type==="final"){ drawFinalWater(b); return; }
  if(b.type==="tempest") b.waves.forEach(drawBigWave);
  else {
    // 뗏목 아래 거대한 그림자
    const c=raftCenter();
    ctx.save(); ctx.globalAlpha=0.22+Math.sin(waveT*1.5)*0.05; ctx.fillStyle="#1a0f2e";
    ctx.beginPath(); ctx.ellipse(c.x, c.y+30, raftRadius()*0.9, raftRadius()*0.45, 0, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}
/* 장 보스 겉모습 : 문어(산호빛)·전함(유령빛)은 색 필터로 바꿈. 표적·포탄(z≥1e9)은 원래 색으로 둠 */
const BOSS_FILTER = { coral:"hue-rotate(110deg) saturate(1.6) brightness(1.15)", ghost:"grayscale(.4) hue-rotate(90deg) saturate(1.9) brightness(1.2)" };
function bossEnts(ents){
  const n0=ents.length;
  bossEntsRaw(ents);
  const b=S.boss, f=b && BOSS_FILTER[b.skin];
  if(!f) return;
  for(let i=n0;i<ents.length;i++){
    const e=ents[i]; if(e.z>=1e9) continue;
    const g=e.f; e.f=()=>{ ctx.save(); ctx.filter=f; if(b.skin==="ghost") ctx.globalAlpha=0.82; g(); ctx.restore(); };
  }
}
function bossEntsRaw(ents){
  const b=S.boss; if(!b) return;
  if(b.type==="warship"){ warshipEnts(b,ents); return; }
  if(b.type==="serpent"){ serpentEnts(b,ents); return; }
  if(b.type==="final"){ finalEnts(b,ents); return; }
  if(b.type!=="kraken") return;
  b.arms.forEach(a=>{ if(!a.dead) ents.push({ z:a.y, d:0, f:()=>drawArm(a) }); });
  if(b.phase==="head") ents.push({ z:b.head.y, d:0, f:()=>drawHead(b.head) });
}
function drawBigWave(w){
  const s=w.size, x=w.x, y=w.y, a=Math.atan2(raftCenter().y-y, raftCenter().x-x);
  ctx.save(); ctx.translate(x,y);
  shadowEllipse(0,8,64*s,20*s,.25);
  // 물마루 본체
  const g=ctx.createLinearGradient(0,-70*s,0,10);
  g.addColorStop(0,"#e8f7ff"); g.addColorStop(.35,"#6fb8ea"); g.addColorStop(1,"#1f5f95");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-70*s,8);
  ctx.bezierCurveTo(-60*s,-30*s, -20*s,-78*s, 22*s,-64*s);
  ctx.bezierCurveTo(46*s,-56*s, 50*s,-34*s, 34*s,-30*s);
  ctx.bezierCurveTo(52*s,-18*s, 64*s,-4*s, 70*s,8);
  ctx.closePath(); ctx.fill();
  // 거품 끝
  ctx.fillStyle="#ffffff";
  for(let i=0;i<6;i++){ const t=i/5;
    ctx.beginPath(); ctx.arc(lerp(-8*s,40*s,t)+Math.sin(waveT*6+i)*2, lerp(-70*s,-40*s,t*t), 6*s*(1-t*0.5), 0, 6.283); ctx.fill(); }
  // 물결 줄무늬
  ctx.strokeStyle="rgba(255,255,255,.45)"; ctx.lineWidth=2;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-54*s+i*10,-4-i*12); ctx.quadraticCurveTo(-10*s,-24*s-i*12, 30*s,-18*s-i*8); ctx.stroke(); }
  // 체력 점
  for(let i=0;i<w.maxHp;i++){
    ctx.fillStyle = i<w.hp? "#ffd257" : "rgba(255,255,255,.25)";
    ctx.beginPath(); ctx.arc(-((w.maxHp-1)*7)/2+i*7, -90*s, 3, 0, 6.283); ctx.fill();
  }
  // 탭 유도 링
  ctx.globalAlpha=.5+Math.sin(waveT*6)*.3; ctx.strokeStyle="#ffd257"; ctx.lineWidth=2.5; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.ellipse(0,-30*s,74*s,58*s,0,0,6.283); ctx.stroke();
  ctx.restore();
}
/* 촉수 : 보라색 몸통 + 연분홍 빨판, 흐느적거리는 곡선 */
function drawArm(a){
  const h=110*a.rise, sw=Math.sin(a.ph*2.2)*18, slam=a.slam>0? Math.sin(a.slam/0.5*Math.PI)*40 : 0;
  const x=a.x, y=a.y;
  const tipX=x+sw+Math.cos(a.ang+Math.PI)*slam*0.6, tipY=y-h+slam;
  ctx.save();
  // 물 튀김 고리
  ctx.globalAlpha=.6; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(x,y,26,9,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  const col = a.hurt>0? "#ff9ad0" : "#8a4fc9", col2="#6a36a3";
  // 몸통(두께가 줄어드는 곡선)
  const seg=14;
  for(let i=seg;i>=0;i--){
    const t=i/seg;
    const px=lerp(x,tipX,t)+Math.sin(t*3+a.ph*3)*10*t;
    const py=lerp(y,tipY,t) - Math.sin(t*Math.PI)*10;
    const r=lerp(17,4,t);
    ctx.fillStyle= i%2? col : col2;
    ctx.beginPath(); ctx.arc(px,py,r,0,6.283); ctx.fill();
    // 빨판
    if(i%2===0 && t<0.9){ ctx.fillStyle="#f6c3e0"; ctx.beginPath(); ctx.arc(px+r*0.45,py,r*0.32,0,6.283); ctx.fill(); }
  }
  // 잡힌 주민
  if(a.grab){
    ctx.fillStyle="#ff6b6b"; rrect(tipX-5,tipY-4,10,10,3); ctx.fill();
    ctx.fillStyle=PAL.skin[0]; ctx.beginPath(); ctx.arc(tipX,tipY-9,5.5,0,6.283); ctx.fill();
    if(Math.sin(waveT*8)>0){ ctx.fillStyle="#fff"; ctx.font="bold 13px sans-serif"; ctx.textAlign="center"; ctx.fillText("HELP!",tipX,tipY-20); }
  }
  // 체력 바
  const w=44;
  ctx.fillStyle="rgba(0,0,0,.55)"; rrect(x-w/2,y-h-26,w,6,3); ctx.fill();
  ctx.fillStyle=a.grab?"#ff7b6b":"#c9a6ff"; rrect(x-w/2,y-h-26,w*(a.hp/a.maxHp),6,3); ctx.fill();
  ctx.restore();
}
/* 본체 : 둥근 머리 + 커다란 한쪽 눈 + 주름 */
function drawHead(h){
  const r=h.rise, x=h.x, y=h.y+ (1-r)*80, bob=Math.sin(waveT*1.4)*4;
  ctx.save();
  ctx.globalAlpha=.55; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(x,h.y+6,96,26,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  ctx.beginPath(); ctx.rect(x-160,y-260,320,h.y+8-(y-260)); ctx.clip();   // 수면 아래는 가림
  const col=h.hurt>0? "#ff9ad0" : "#8a4fc9";
  const g=ctx.createRadialGradient(x-20,y-110+bob,10,x,y-70+bob,110);
  g.addColorStop(0,"#b57ce8"); g.addColorStop(1,col);
  // 수면 가까이에서 말려 올라가는 짧은 다리 4개 (양옆)
  [-1,1].forEach(side=>{
    for(let k=0;k<2;k++){
      const bx=x+side*(62+k*30), by=h.y-6, curl=Math.sin(waveT*2+k+side)*0.4;
      ctx.strokeStyle= k? "#6a36a3" : "#7a44b8"; ctx.lineCap="round";
      ctx.lineWidth=16-k*4;
      ctx.beginPath(); ctx.moveTo(bx-side*18,by);
      ctx.quadraticCurveTo(bx+side*10, by-30-k*8, bx+side*(4+curl*10), by-44-k*6);
      ctx.stroke();
      ctx.fillStyle="#f6c3e0";
      ctx.beginPath(); ctx.arc(bx+side*2,by-22-k*6,3,0,6.283); ctx.fill();
    }
  });
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y-70+bob,88,100,0,0,6.283); ctx.fill();
  // 반점
  ctx.fillStyle="rgba(255,255,255,.14)";
  [[-40,-120,12],[30,-140,9],[50,-90,7],[-55,-70,8]].forEach(o=>{ ctx.beginPath(); ctx.arc(x+o[0],y+o[1]+bob,o[2],0,6.283); ctx.fill(); });
  // 눈
  const blink=(waveT%4)<0.12;
  ctx.fillStyle="#fff7d6"; ctx.beginPath(); ctx.ellipse(x,y-60+bob,30,blink?3:24,0,0,6.283); ctx.fill();
  if(!blink){
    const lx=clamp((CAM.x*-1-x)*0.02,-8,8);
    ctx.fillStyle="#1d1030"; ctx.beginPath(); ctx.ellipse(x+lx,y-60+bob,8,18,0,0,6.283); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x+lx-3,y-68+bob,3,0,6.283); ctx.fill();
  }
  ctx.strokeStyle="#5a2a86"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x-36,y-92+bob); ctx.lineTo(x-10,y-84+bob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+36,y-92+bob); ctx.lineTo(x+10,y-84+bob); ctx.stroke();
  ctx.restore();
  // 체력 바
  const w=120;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.6)"; rrect(x-w/2,y-190,w,9,4); ctx.fill();
  ctx.fillStyle="#ff5a8a"; rrect(x-w/2,y-190,w*(h.hp/h.maxHp),9,4); ctx.fill();
  ctx.restore();
}
