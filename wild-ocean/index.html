/* 뗏목 앞쪽 가장자리 타일 목록 (화면에 잘 보이는 쪽) */
function frontEdgeTiles(){
  const cen=raftCenter();
  const edges=[...S.tiles.values()].filter(t=>
    [[1,0],[-1,0],[0,1],[0,-1]].some(d=>!S.tiles.has(KEY(t.x+d[0],t.y+d[1]))));
  const front=edges.filter(t=>iso(t.x,t.y).y >= cen.y-TH*0.5);
  return front.length? front : edges;
}
/* 타일 바깥쪽(물 쪽) 지점 */
function outward(t, dist){
  const cen=raftCenter(), p=iso(t.x,t.y);
  const a=Math.atan2((p.y-cen.y)/0.55, p.x-cen.x);
  return { x:p.x+Math.cos(a)*dist, y:p.y+Math.sin(a)*dist*0.55, a };
}
function guardCount(){
  if(isWeekly()) return STD_SHIP.guards;                  // 주간 도전 : 표준 뗏목 경비 3명
  return S.people.filter(p=>p.job==="guard"&&!p.away).length; }
/* 파도 한 번 탭의 힘 (주간 도전은 특전 무시) */
function waveTapPow(){ return isWeekly()? 1 : 1 + Math.floor(perkLv(S,"bigHands")/3); }
/* 화면 안(상단 HUD·하단 탭바 제외)에 들어오는 가장자리 지점만 고름
   뗏목이 화면보다 넓어져도 보스가 보이지 않는 곳에서 나타나지 않게 함 */
function visibleSpots(dist, tiles){
  const W=cv.width/DPR, H=cv.height/DPR;
  const spots=(tiles||frontEdgeTiles()).map(t=>({ t, o:outward(t,dist) }));
  const inView=(s)=>{ const p=w2s(s.o.x,s.o.y); return p.x>70 && p.x<W-70 && p.y>H*0.38 && p.y<H-190; };
  const vis=spots.filter(inView);
  if(vis.length) return vis;
  const cx=W/2, cy=H*0.6;
  return spots.sort((a,b)=>{ const pa=w2s(a.o.x,a.o.y), pb=w2s(b.o.x,b.o.y);
    return Math.hypot(pa.x-cx,pa.y-cy)-Math.hypot(pb.x-cx,pb.y-cy); }).slice(0,3);
}

/* =====================================================================
   보스 ③ 해적 전함 — 100초
   · 포격 : 뗏목 타일에 붉은 표적 → 포탄 낙하(탭으로 요격)
   · 상륙정 : 뗏목으로 노 저어 옴(탭으로 격침) → 도착하면 약탈자 2명 상륙
   · 약탈자 : 건물 사이를 돌며 자원을 훔침(탭으로 쫓아내면 되찾음, 경비가 자동 제압)
   · 화약통 : 갑판의 통이 번갈아 빛남 → 탭하면 전함 체력 9% 피해
   ===================================================================== */
function startWarship(){
  const str=bossStr(), d=bossDiff();
  const W=cv.width/DPR, H=cv.height/DPR;
  const pos=s2w(W*0.6, H*0.75);
  const cen=raftCenter(), rad=raftRadius();
  const dx=pos.x-cen.x, dy=(pos.y-cen.y)/0.55, dd=Math.hypot(dx,dy)||1;
  if(dd<rad+110){ pos.x=cen.x+dx/dd*(rad+110); pos.y=cen.y+dy/dd*(rad+110)*0.55; }
  const hp=Math.floor(420*str), T=100*d.time;
  S.boss={ type:"warship", t:T, total:T, str,
    ship:{ x:pos.x, y:pos.y, hp, maxHp:hp, hurt:0, rise:0, flash:0 },
    kegs:[ {ox:-58,oy:-44,glow:0,cd:rnd(1.5,3)}, {ox:-6,oy:-50,glow:0,cd:rnd(3.5,5)}, {ox:48,oy:-44,glow:0,cd:rnd(5.5,7)} ],
    shells:[], boats:[], raiders:[], nextVolley:4, nextBoat:6.5, sunk:0, intercepted:0 };
}
function damageShip(dmg, byTap){
  const b=S.boss, sh=b.ship;
  sh.hp-=dmg; sh.hurt=0.2;
  if(byTap){ fxText(sh.x+rnd(-30,30), sh.y-110, `-${Math.round(dmg)}`, "#ffe07a"); }
  if(sh.hp<=0) finishWarship(true);
}
function updWarship(dt){
  const b=S.boss, c=S.cache, d=bossDiff(), sh=b.ship;
  b.t-=dt;
  sh.rise=Math.min(1, sh.rise+dt*0.55); sh.hurt=Math.max(0,sh.hurt-dt); sh.flash=Math.max(0,sh.flash-dt);
  if(sh.rise<1){ if(b.t<=0) finishWarship(false); return; }
  const cut=clamp(c.stormCut*0.5,0,0.5);
  // 자동 사격
  const dps=c.bossDps||0;
  if(dps>0){
    damageShip(dps*dt,false); if(!S.boss) return;
    S.tiles.forEach(t=>{
      if(t.b!=="harpoon"&&t.b!=="cannon") return;
      if(!every("ws"+t.x+","+t.y, t.b==="cannon"?0.9:1.4, dt)) return;
      const p=iso(t.x,t.y);
      shoot(p.x,p.y-24, sh.x+rnd(-70,70), sh.y-40+rnd(-10,10), t.b==="cannon"?"ball":"harpoon");
      sfx(t.b==="cannon"?"cannon":"shoot");
    });
  }
  // 화약통 점멸
  b.kegs.forEach(k=>{
    if(k.glow>0) k.glow-=dt;
    else { k.cd-=dt; if(k.cd<=0){ k.glow=2.6*d.time; k.cd=rnd(4,6.5); } }
  });
  // 포격
  b.nextVolley-=dt;
  if(b.nextVolley<=0){
    b.nextVolley = rnd(5.5,7.5)/Math.min(1.5, 0.6+b.str*0.3);
    const n = sh.hp<sh.maxHp*0.5? 3 : 2;
    const tiles=[...S.tiles.values()];
    for(let i=0;i<n;i++){
      const t=pick(tiles), p=iso(t.x,t.y);
      const x0=sh.x+rnd(-60,40), y0=sh.y-26;
      b.shells.push({ x0, y0, tx:p.x+rnd(-14,14), ty:p.y+rnd(-6,6), t:-i*0.35, dur:2.6*d.time });
      emit(x0,y0,"smoke",6,{spread:8,col:"#cfd6dc"});
    }
    sh.flash=0.25; shake(3); sfx("cannon");
  }
  for(let i=b.shells.length-1;i>=0;i--){
    const s=b.shells[i]; s.t+=dt;
    if(s.t>=s.dur){
      const dmg=9*b.str*(1-cut);
      S.hullDmg=Math.min(c.hullMax, S.hullDmg+dmg);
      emit(s.tx,s.ty,"dust",14,{spread:14,col:"#7a6a5a"}); emit(s.tx,s.ty,"spark",10); shake(6);
      fxText(s.tx,s.ty-30,`-${Math.round(dmg)} 내구`,"#ff9a9a");
      sfx("boom");
      b.shells.splice(i,1);
      if(S.hullDmg>=c.hullMax*0.98) collapseSomething();
    }
  }
  // 상륙정
  b.nextBoat-=dt;
  if(b.nextBoat<=0 && b.boats.length<3){
    b.nextBoat = rnd(7,10)*d.time/Math.min(1.4, 0.7+b.str*0.25);
    const sp=pick(visibleSpots(46)), t=sp.t, o=sp.o;
    b.boats.push({ x:sh.x-40, y:sh.y, x0:sh.x-40, y0:sh.y+6, x1:o.x, y1:o.y, t:0, dur:4.8*d.time,
                   hp: S.diff==="hard"? 2:1, tile:KEY(t.x,t.y), ph:rnd(0,6) });
    sfx("splash");
  }
  for(let i=b.boats.length-1;i>=0;i--){
    const bt=b.boats[i]; bt.t+=dt; bt.ph+=dt;
    const r=clamp(bt.t/bt.dur,0,1);
    bt.x=lerp(bt.x0,bt.x1,r); bt.y=lerp(bt.y0,bt.y1,r);
    if(r>=1){
      const t=S.tiles.get(bt.tile), p=t? iso(t.x,t.y) : raftCenter();
      for(let k=0;k<2;k++) b.raiders.push({ x:p.x+rnd(-14,14), y:p.y+rnd(-6,6), tx:p.x, ty:p.y, wait:0.6,
        steal:2.2, carry:{}, spd:rnd(26,34), ph:rnd(0,6), dir:1 });
      emit(bt.x,bt.y,"spray",10);
      b.boats.splice(i,1);
      toast("🏴 <b>약탈자 상륙!</b> 탭해서 쫓아낼 것","bad"); sfx("alarmShort");
    }
  }
  // 약탈자
  const g=guardCount();
  for(let i=b.raiders.length-1;i>=0;i--){
    const r=b.raiders[i]; r.ph+=dt;
    const dx=r.tx-r.x, dy=r.ty-r.y, dist=Math.hypot(dx,dy);
    if(dist>3){ const v=r.spd*dt/dist; r.x+=dx*v; r.y+=dy*v; r.dir=dx>0?1:-1; }
    else {
      r.wait-=dt; r.steal-=dt;
      if(r.steal<=0){
        r.steal=2.4;
        const k=pick(["wood","fish","food","scrap","parts"]);
        const n=Math.min(Math.floor((S.res[k]||0)*0.04), Math.ceil(30*b.str));
        if(n>0){ S.res[k]-=n; r.carry[k]=(r.carry[k]||0)+n; fxText(r.x,r.y-40,`${RES[k].icon}-${n}`,"#ff9a9a"); }
      }
      if(r.wait<=0){
        const bt=[...S.tiles.values()].filter(t=>t.b); const t=bt.length? pick(bt) : pick([...S.tiles.values()]);
        const p=iso(t.x,t.y); r.tx=p.x+rnd(-20,20); r.ty=p.y+rnd(-9,9); r.wait=rnd(2.5,4);
      }
    }
    // 경비의 자동 제압
    if(g>0 && chance(dt*0.1*g)){ kickRaider(i,false); }
  }
  if(b.t<=0) finishWarship(false);
}
function kickRaider(i, byTap){
  const b=S.boss, r=b.raiders[i]; if(!r) return;
  for(const k in r.carry) gain(k, r.carry[k]);
  const back=Object.keys(r.carry).map(k=>RES[k].icon+r.carry[k]).join(" ");
  emit(r.x,r.y-10,"star",8,{col:"#ffe07a"}); emit(r.x,r.y,"dust",6);
  fxText(r.x,r.y-44, byTap? (back? `되찾음 ${back}`:"쫓아냄!") : "경비가 제압!", "#8fe08a");
  b.raiders.splice(i,1);
  sfx("hit");
}
function tapWarship(w){
  const b=S.boss, sh=b.ship, d=bossDiff();
  if(sh.rise<1) return true;
  // 1) 약탈자
  for(let i=0;i<b.raiders.length;i++){
    const r=b.raiders[i];
    if(Math.hypot(r.x-w.x,(r.y-18-w.y)*0.9)<26){ kickRaider(i,true); return true; }
  }
  // 2) 상륙정
  for(let i=0;i<b.boats.length;i++){
    const bt=b.boats[i];
    if(Math.hypot(bt.x-w.x,(bt.y-10-w.y)*1.2)<38){
      bt.hp--; emit(bt.x,bt.y,"spray",10); sfx("hit");
      if(bt.hp<=0){ b.boats.splice(i,1); b.sunk++; emit(bt.x,bt.y,"spray",20,{spread:16});
        fxText(bt.x,bt.y-30,"상륙정 격침!","#bfe8ff"); sfx("splash"); }
      return true;
    }
  }
  // 3) 포탄(표적 또는 날아오는 포탄)
  for(let i=0;i<b.shells.length;i++){
    const s=b.shells[i]; if(s.t<0) continue;
    const pos=shellPos(s);
    if(Math.hypot(s.tx-w.x,(s.ty-w.y)*1.3)<44 || Math.hypot(pos.x-w.x,pos.y-w.y)<34){
      emit(pos.x,pos.y,"smoke",10,{spread:10,col:"#b8c0c6"}); emit(pos.x,pos.y,"star",8,{col:"#fff2a8"});
      fxText(pos.x,pos.y-24,"요격!","#bfe8ff");
      b.shells.splice(i,1); b.intercepted++; S.stats.intercept=(S.stats.intercept||0)+1;
      sfx("intercept"); return true;
    }
  }
  // 4) 빛나는 화약통
  for(const k of b.kegs){
    if(k.glow<=0) continue;
    const kx=sh.x+k.ox, ky=sh.y+k.oy;
    if(Math.hypot(kx-w.x,(ky-w.y)*1.1)<30){
      k.glow=0; k.cd=rnd(4,6);
      emit(kx,ky,"spark",26,{spread:12}); emit(kx,ky,"smoke",12,{spread:16,col:"#6d747a"}); shake(8);
      fxText(kx,ky-40,"💥 화약 폭발!","#ffb04a");
      sfx("explode");
      damageShip(sh.maxHp*0.09*d.tap, true);
      return true;
    }
  }
  // 5) 전함 선체
  if(Math.abs(w.x-sh.x)<120 && w.y>sh.y-150 && w.y<sh.y+16){
    damageShip(bossTapDmg()*0.6, true); emit(w.x,w.y,"dust",4,{col:"#8a5a2e"}); sfx("hit");
    return true;
  }
  return false;
}
function shellPos(s){
  const r=clamp(s.t/s.dur,0,1);
  return { x:lerp(s.x0,s.tx,r), y:lerp(s.y0,s.ty,r)-Math.sin(r*Math.PI)*170, r };
}
function finishWarship(win){
  if(S.boss && S.boss.chap){                         // 6장 유령선
    const cb=S.boss; S.boss=null;
    if(win) cb.raiders.forEach(r=>{ for(const k in r.carry) gain(k,r.carry[k]); });
    return finishCh2Boss(win, cb);
  }
  const b=endBoss(win), n=S.bossN;
  if(win){
    S.stats.warship=(S.stats.warship||0)+1;
    b.raiders.forEach(r=>{ for(const k in r.carry) gain(k,r.carry[k]); });
    const loot={ coin:600+250*n, scrap:150+60*n, parts:25+10*n, pearl:1 };
    const got=bossReward(loot,"warship");
    S.blueprint++; got.blueprint=1;
    emit(b.ship.x,b.ship.y-60,"confetti",70,{spread:70}); emit(b.ship.x,b.ship.y,"spray",40,{spread:80});
    sfx("victory");
    showModal({ title:"🏴 해적 전함 격침!", sub:`요격 ${b.intercepted}발 · 상륙정 격침 ${b.sunk}척 · 남은 시간 ${Math.ceil(Math.max(0,b.t))}초`,
      body:`<p>전함이 불길에 휩싸여 가라앉음. 떠오른 약탈품 상자와 대포 설계도를 건짐.</p>
            <p>⚓ 원정지 <b>침몰한 해적 함대</b>가 열림.</p>`,
      loot:got, btns:[{t:"수령",cls:"btn gold"}] });
  } else {
    const lost={};
    b.raiders.forEach(r=>{ for(const k in r.carry) lost[k]=(lost[k]||0)+r.carry[k]; });
    const q=Math.floor(S.res.coin*0.15); if(q>0){ S.res.coin-=q; lost.coin=(lost.coin||0)+q; }
    sfx("defeat");
    showModal({ title:"🌑 해적 전함이 떠나감", sub:"제한 시간 안에 격침하지 못함",
      body:`<p>전함이 약탈품을 싣고 수평선 너머로 사라짐.</p>
            <p>약탈당함: ${Object.keys(lost).map(k=>RES[k].icon+fmt(lost[k])).join(" ")||"없음"}</p>
            <p style="opacity:.8">빛나는 화약통을 노리면 체력을 크게 깎을 수 있음. 경비는 약탈자를 자동으로 제압함.</p>`,
      btns:[{t:"확인",cls:"btn red"}] });
  }
}

/* ---------- 해적 전함 그리기 ---------- */
function drawWarshipWater(b){
  // 전함 뒤 물결 자국
  const sh=b.ship, x=sh.x+(1-sh.rise)*320;
  ctx.save(); ctx.globalAlpha=.3; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=2;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(x+40+i*30,sh.y+8,90+i*20,14+i*4,0,0.2,2.9); ctx.stroke(); }
  ctx.restore();
}
function warshipEnts(b,ents){
  ents.push({ z:b.ship.y, d:0, f:()=>drawShip(b) });
  b.boats.forEach(bt=>ents.push({ z:bt.y, d:0, f:()=>drawRaidBoat(bt) }));
  b.raiders.forEach(r=>ents.push({ z:r.y, d:0, f:()=>drawRaider(r) }));
  ents.push({ z:1e9, d:0, f:()=>b.shells.forEach(drawShell) });     // 표적·포탄은 항상 맨 위
}
function drawShip(b){
  const sh=b.ship, x=sh.x+(1-sh.rise)*320, y=sh.y+Math.sin(waveT*1.4)*3;
  const hurt=sh.hurt>0;
  ctx.save();
  shadowEllipse(x,y+10,150,22,.3);
  ctx.translate(x,y); ctx.rotate(Math.sin(waveT*1.1)*0.025);
  // 선체
  const hull=hurt? "#7a3d2a" : "#3d2a1f";
  ctx.fillStyle=hull;
  ctx.beginPath(); ctx.moveTo(-150,-34); ctx.lineTo(128,-34); ctx.quadraticCurveTo(150,-40,160,-58);
  ctx.lineTo(150,-22); ctx.quadraticCurveTo(120,12,70,14); ctx.lineTo(-110,14); ctx.quadraticCurveTo(-140,6,-150,-34);
  ctx.closePath(); ctx.fill();
  // 금색 띠 · 난간
  ctx.strokeStyle="#c9a24a"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-146,-26); ctx.lineTo(146,-26); ctx.stroke();
  ctx.strokeStyle="#5a4030"; ctx.lineWidth=2;
  for(let i=-140;i<=130;i+=14){ ctx.beginPath(); ctx.moveTo(i,-34); ctx.lineTo(i,-44); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-142,-44); ctx.lineTo(132,-44); ctx.stroke();
  // 포문
  for(let i=0;i<5;i++){
    const px=-110+i*48;
    ctx.fillStyle="#1a120c"; rrect(px-8,-18,16,12,2); ctx.fill();
    ctx.fillStyle="#2b2f33"; rrect(px-18,-15,12,6,2); ctx.fill();
    if(sh.flash>0 && i%2===0){ ctx.fillStyle="#ffcf5a"; ctx.beginPath(); ctx.arc(px-22,-12,7*sh.flash*4,0,6.283); ctx.fill(); }
  }
  // 돛대 · 돛 (교차한 닻 문양)
  [[-50,150],[50,130]].forEach(([mx,mh],i)=>{
    ctx.strokeStyle="#5a4030"; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(mx,-34); ctx.lineTo(mx,-34-mh); ctx.stroke();
    const sw=Math.sin(waveT*2+i)*4;
    ctx.fillStyle="#3a3f47";
    ctx.beginPath(); ctx.moveTo(mx-46,-34-mh+14); ctx.quadraticCurveTo(mx+sw,-34-mh+4,mx+46,-34-mh+14);
    ctx.lineTo(mx+42,-58); ctx.quadraticCurveTo(mx+sw,-48,mx-42,-58); ctx.closePath(); ctx.fill();
    // 닻 두 개를 X자로
    ctx.save(); ctx.translate(mx+sw*0.5,-34-mh*0.52); ctx.strokeStyle="#e8e2d4"; ctx.lineWidth=3;
    [-0.6,0.6].forEach(a=>{ ctx.save(); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(0,14); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,6,9,0.2,Math.PI-0.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-18,3,0,6.283); ctx.stroke(); ctx.restore(); });
    ctx.restore();
    // 깃발
    ctx.fillStyle="#d63d2c";
    ctx.beginPath(); ctx.moveTo(mx,-34-mh); ctx.lineTo(mx+22,-34-mh+5+Math.sin(waveT*7)*2); ctx.lineTo(mx,-34-mh+10); ctx.closePath(); ctx.fill();
  });
  ctx.restore();
  // 화약통 (선체 기울기 무시하고 월드 좌표로)
  b.kegs.forEach(k=>{
    const kx=sh.x+(1-sh.rise)*320+k.ox, ky=y-sh.y+sh.y+k.oy;
    ctx.save();
    if(k.glow>0){
      const pulse=0.5+Math.sin(waveT*12)*0.5;
      ctx.globalAlpha=0.5+pulse*0.4; ctx.drawImage(glowSprite("#ffb04a"),kx-34,ky-34,68,68); ctx.globalAlpha=1;
      ctx.strokeStyle="#ffd257"; ctx.lineWidth=2.5; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.arc(kx,ky,22,0,6.283); ctx.stroke(); ctx.setLineDash([]);
    }
    isoBox(kx,ky+6,16,10,16, k.glow>0?"#ff7a3a":"#b5452e","#7a2a1a","#963626");
    ctx.fillStyle="#2b2f33"; ctx.fillRect(kx-8,ky-4,16,2); ctx.fillRect(kx-8,ky+2,16,2);
    if(k.glow>0){ ctx.fillStyle="#fff"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.fillText("!",kx,ky-18); }
    ctx.restore();
  });
  // 체력 바
  const bw=160, hx=sh.x+(1-sh.rise)*320;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.6)"; rrect(hx-bw/2,y-200,bw,9,4); ctx.fill();
  ctx.fillStyle="#ff7a3a"; rrect(hx-bw/2,y-200,bw*clamp(sh.hp/sh.maxHp,0,1),9,4); ctx.fill();
  ctx.restore();
}
function drawRaidBoat(bt){
  const x=bt.x, y=bt.y+Math.sin(waveT*3+bt.ph)*2;
  ctx.save();
  ctx.globalAlpha=.5; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.ellipse(x,y+4,28,8,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  fillP([[x-24,y-4],[x+24,y-4],[x+16,y+6],[x-16,y+6]],"#6b4523");
  fillP([[x-24,y-4],[x+24,y-4],[x+20,y-8],[x-20,y-8]],"#8a5a2e");
  // 노
  const oar=Math.sin(waveT*5+bt.ph)*0.5;
  ctx.strokeStyle="#c78f50"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-4,y-8); ctx.lineTo(x-20+oar*8,y+10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+8,y-8); ctx.lineTo(x+22+oar*8,y+10); ctx.stroke();
  // 탑승한 약탈자 2명
  [-8,8].forEach((ox,i)=>drawPirateMini(x+ox, y-8, i));
  // 체력 점
  for(let i=0;i<bt.hp;i++){ ctx.fillStyle="#ff7a3a"; ctx.beginPath(); ctx.arc(x-4+i*8,y-40,3,0,6.283); ctx.fill(); }
  // 탭 유도 링
  ctx.globalAlpha=.5+Math.sin(waveT*6)*.3; ctx.strokeStyle="#ff9a7a"; ctx.lineWidth=2; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.arc(x,y-10,34,0,6.283); ctx.stroke();
  ctx.restore();
}
function drawPirateMini(x,y,v){
  ctx.fillStyle= v? "#2a2a2a" : "#f2f2f2"; rrect(x-4,y-9,8,8,2); ctx.fill();
  ctx.fillStyle="#2a2a2a"; ctx.fillRect(x-4,y-7,8,1.5); ctx.fillRect(x-4,y-4,8,1.5);
  ctx.fillStyle=PAL.skin[1+v]; ctx.beginPath(); ctx.arc(x,y-14,5,0,6.283); ctx.fill();
  ctx.fillStyle="#d63d2c"; ctx.beginPath(); ctx.arc(x,y-16,5,Math.PI,0); ctx.fill();
  ctx.fillRect(x+3,y-17,4,2);
}
function drawRaider(r){
  const moving=Math.abs(r.tx-r.x)+Math.abs(r.ty-r.y)>3, sw=moving? Math.sin(waveT*11+r.ph):0;
  const x=r.x, y=r.y-(moving? Math.abs(sw)*1.5 : 0), dir=r.dir;
  const carried=Object.values(r.carry).reduce((a,v)=>a+v,0);
  shadowEllipse(x,r.y+2,8,4,.24);
  ctx.save();
  ctx.fillStyle="#3a3a3a";
  ctx.save(); ctx.translate(x-2.4,y-8); ctx.rotate(sw*0.45); ctx.fillRect(-1.6,0,3.2,8); ctx.restore();
  ctx.save(); ctx.translate(x+2.6,y-8); ctx.rotate(-sw*0.45); ctx.fillRect(-1.6,0,3.2,8); ctx.restore();
  // 줄무늬 셔츠
  ctx.fillStyle="#f2f2f2"; rrect(x-6,y-18,12,11,3.5); ctx.fill();
  ctx.fillStyle="#2a2a2a"; ctx.fillRect(x-6,y-15,12,2); ctx.fillRect(x-6,y-11,12,2);
  // 자루 (훔친 양에 따라 커짐)
  const s=6+Math.min(8,carried/12);
  ctx.fillStyle="#9a7446"; ctx.beginPath(); ctx.ellipse(x-9*dir,y-16,s*0.8,s,0,0,6.283); ctx.fill();
  ctx.strokeStyle="#6b4a2e"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x-9*dir,y-16-s); ctx.lineTo(x-4*dir,y-19); ctx.stroke();
  // 머리 · 빨간 두건 · 안대
  ctx.fillStyle=PAL.skin[2]; ctx.beginPath(); ctx.arc(x,y-24,7,0,6.283); ctx.fill();
  ctx.fillStyle="#d63d2c"; ctx.beginPath(); ctx.arc(x,y-26,7.2,Math.PI,0); ctx.fill();
  ctx.fillRect(x-7*dir-2,y-28,4,6);
  ctx.fillStyle="#2a2a2a"; ctx.beginPath(); ctx.arc(x+2.6*dir,y-23.5,2,0,6.283); ctx.fill();
  ctx.fillRect(x-7,y-25,14,1);
  ctx.beginPath(); ctx.arc(x-2.4*dir,y-23.5,1.1,0,6.283); ctx.fill();
  ctx.restore();
  // 탭 유도
  ctx.save(); ctx.globalAlpha=.55+Math.sin(waveT*7+r.ph)*.3; ctx.strokeStyle="#ff7b6b"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y-16,17,0,6.283); ctx.stroke(); ctx.restore();
}
function drawShell(s){
  if(s.t<0) return;
  const r=clamp(s.t/s.dur,0,1);
  // 표적
  ctx.save();
  const pulse=0.5+Math.sin(waveT*10)*0.5;
  ctx.globalAlpha=0.35+r*0.4; ctx.fillStyle="#ff3b2f";
  ctx.beginPath(); ctx.ellipse(s.tx,s.ty,26*(1.2-r*0.4),13*(1.2-r*0.4),0,0,6.283); ctx.fill();
  ctx.globalAlpha=0.9; ctx.strokeStyle="#fff"; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.ellipse(s.tx,s.ty,30,15,0,-Math.PI/2,-Math.PI/2+6.283*(1-r)); ctx.stroke();
  ctx.strokeStyle=`rgba(255,${Math.floor(90+pulse*120)},80,1)`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(s.tx-10,s.ty); ctx.lineTo(s.tx+10,s.ty); ctx.moveTo(s.tx,s.ty-6); ctx.lineTo(s.tx,s.ty+6); ctx.stroke();
  // 포탄
  const p=shellPos(s);
  shadowEllipse(p.x,s.ty+2,6*r,3*r,.25*r);
  ctx.fillStyle="#2b2f33"; ctx.beginPath(); ctx.arc(p.x,p.y,7,0,6.283); ctx.fill();
  ctx.fillStyle="#ffb04a"; ctx.beginPath(); ctx.arc(p.x+3,p.y-5,2.4,0,6.283); ctx.fill();   // 도화선 불꽃
  ctx.restore();
}

/* =====================================================================
   보스 ④ 심해 해룡 — 100초
   · 뗏목 주위를 헤엄치며 돌다가 가장자리에서 고개를 듦
   · 목의 푸른 약점을 제한 시간 안에 탭 → 큰 피해 + 기절(자동 사격 2배)
   · 놓치면 물어뜯기 : 내구도 피해 + 물고기·식량 약탈
   · 체력 50% 이하 : 회전이 빨라지고 꼬리치기 추가(솟은 꼬리 탭)
   ===================================================================== */
function startSerpent(){
  const str=bossStr(), d=bossDiff();
  const hp=Math.floor(600*str), T=100*d.time;
  S.boss={ type:"serpent", t:T, total:T, str, hp, maxHp:hp, hurt:0,
           ang:0, R:raftRadius()+40, rise:0, head:null, tail:null,
           nextSurf:4, nextTail:7, stun:0, bites:0, hits:0 };
}
function damageSerpent(dmg){
  const b=S.boss; b.hp-=dmg; b.hurt=0.2;
  if(b.hp<=0) finishSerpent(true);
}
function serpentRage(b){ return b.hp < b.maxHp*0.5; }
function headGeom(h){
  const top=110*h.rise;
  const hx=h.x+h.dir*26, hy=h.y-top;
  return { hx, hy, gx:lerp(h.x,hx,0.45)+h.dir*4, gy:lerp(h.y,hy,0.5) };
}
function updSerpent(dt){
  const b=S.boss, c=S.cache, d=bossDiff();
  b.t-=dt; b.rise=Math.min(1,b.rise+dt*0.5); b.hurt=Math.max(0,b.hurt-dt); b.stun=Math.max(0,b.stun-dt);
  b.ang += dt*(serpentRage(b)? 0.55 : 0.35);
  b.R = raftRadius()+40;
  const cut=clamp(c.stormCut*0.5,0,0.5);
  // 자동 사격 : 수면 위에 있을 때 100%, 잠수 중 40%, 기절 중 2배
  const dps=(c.bossDps||0) * (b.head&&!b.head.hit? 1 : 0.4) * (b.stun>0? 2 : 1);
  if(dps>0){
    damageSerpent(dps*dt); if(!S.boss) return;
    S.tiles.forEach(t=>{
      if(t.b!=="harpoon"&&t.b!=="cannon") return;
      if(!every("sp"+t.x+","+t.y, t.b==="cannon"?0.8:1.2, dt)) return;
      const p=iso(t.x,t.y);
      let tx, ty;
      if(b.head){ const g=headGeom(b.head); tx=g.gx; ty=g.gy; }
      else { const a=b.ang-rndi(0,10)*0.3, cen=raftCenter(); tx=cen.x+Math.cos(a)*b.R; ty=cen.y+Math.sin(a)*b.R*0.55; }
      shoot(p.x,p.y-24,tx,ty,t.b==="cannon"?"ball":"harpoon");
      sfx(t.b==="cannon"?"cannon":"shoot");
    });
  }
  if(b.rise<1){ if(b.t<=0) finishSerpent(false); return; }
  // 고개 들기 → 물기
  if(!b.head){
    b.nextSurf-=dt;
    if(b.nextSurf<=0){
      const o=pick(visibleSpots(58)).o;
      const cen=raftCenter();
      b.head={ x:o.x, y:o.y, dir: o.x<cen.x? 1 : -1, t:0, win:2.6*d.time*(serpentRage(b)?0.85:1), rise:0, hit:false, t2:0 };
      emit(o.x,o.y,"spray",20,{spread:16}); sfx("serpentRise");
    }
  } else {
    const h=b.head; h.t+=dt; h.rise=Math.min(1,h.rise+dt*3.5);
    if(h.hit){ h.t2+=dt; h.rise=Math.max(0,1-h.t2*1.6); if(h.t2>0.7){ b.head=null; b.nextSurf=rnd(3.5,5.5)/(serpentRage(b)?1.3:1); } }
    else if(h.t>=h.win){
      const dmg=12*b.str*(1-cut);
      S.hullDmg=Math.min(c.hullMax, S.hullDmg+dmg);
      const stolen=[];
      ["fish","food"].forEach(k=>{ const n=Math.floor((S.res[k]||0)*0.08); if(n>0){ S.res[k]-=n; stolen.push(RES[k].icon+n); } });
      const g=headGeom(h);
      emit(g.hx,g.hy+40,"spray",30,{spread:24}); shake(9);
      fxText(g.hx,g.hy-20,`물어뜯기! -${Math.round(dmg)}${stolen.length? " "+stolen.join(" "):""}`,"#ff9a9a");
      sfx("bite");
      b.bites++; b.head=null; b.nextSurf=rnd(4.5,6.5)/(serpentRage(b)?1.3:1);
      if(S.hullDmg>=c.hullMax*0.98) collapseSomething();
    }
  }
  // 꼬리치기 (분노 단계)
  if(serpentRage(b)){
    if(!b.tail){
      b.nextTail-=dt;
      if(b.nextTail<=0){
        const o=pick(visibleSpots(70)).o;
        b.tail={ x:o.x, y:o.y, t:0, win:2.3*d.time, rise:0, dir:o.x<raftCenter().x?1:-1 };
        emit(o.x,o.y,"spray",14); sfx("splash");
      }
    } else {
      const tl=b.tail; tl.t+=dt; tl.rise=Math.min(1,tl.rise+dt*3);
      if(tl.t>=tl.win){
        const dmg=8*b.str*(1-cut);
        S.hullDmg=Math.min(c.hullMax,S.hullDmg+dmg);
        const blown=Math.floor(S.floats.length/2); S.floats.splice(0,blown);
        emit(tl.x,tl.y,"spray",40,{spread:40}); shake(8);
        fxText(tl.x,tl.y-80,`꼬리치기! -${Math.round(dmg)}`,"#ff9a9a");
        sfx("waveCrash");
        b.tail=null; b.nextTail=rnd(7,10);
      }
    }
  }
  if(b.t<=0) finishSerpent(false);
}
function tapSerpent(w){
  const b=S.boss;
  if(b.head && !b.head.hit && b.head.rise>0.5){
    const g=headGeom(b.head);
    if(Math.hypot(g.gx-w.x,g.gy-w.y)<44 || Math.hypot(g.hx-w.x,g.hy-w.y)<50){
      const dmg=Math.max(bossTapDmg()*4, b.maxHp*0.06*bossDiff().tap);
      b.head.hit=true; b.head.t2=0; b.stun=2; b.hits++;
      emit(g.gx,g.gy,"star",16,{col:"#9fe8ff"}); emit(g.gx,g.gy,"spark",14,{col:"#bfe8ff"}); shake(6);
      fxText(g.gx,g.gy-30,`치명타! -${Math.round(dmg)}`,"#9fe8ff");
      sfx("crit");
      damageSerpent(dmg);
      return true;
    }
  }
  if(b.tail){
    const tl=b.tail;
    if(Math.hypot(tl.x-w.x,(tl.y-50-w.y)*0.8)<56){
      const dmg=Math.max(bossTapDmg()*2, b.maxHp*0.03*bossDiff().tap);
      emit(tl.x,tl.y-50,"star",10,{col:"#ffe07a"}); fxText(tl.x,tl.y-90,`-${Math.round(dmg)}`,"#ffe07a");
      b.tail=null; b.nextTail=rnd(7,10);
      sfx("hit"); damageSerpent(dmg);
      return true;
    }
  }
  // 수면 위 등 혹
  for(const hp of serpentHumps(b)){
    if(hp.h>6 && Math.hypot(hp.x-w.x,(hp.y-hp.h*0.5-w.y))<28){
      const dmg=bossTapDmg()*0.5;
      emit(hp.x,hp.y-hp.h,"spray",6); fxText(hp.x,hp.y-hp.h-16,`-${Math.round(dmg)}`,"#ffe07a");
      sfx("hit"); damageSerpent(dmg);
      return true;
    }
  }
  return false;
}
function serpentHumps(b){
  const cen=raftCenter(), N=18, out=[];
  for(let i=0;i<N;i++){
    const a=b.ang-i*0.3;
    const wv=Math.sin(i*1.15-waveT*3);
    out.push({ x:cen.x+Math.cos(a)*b.R, y:cen.y+Math.sin(a)*b.R*0.55,
               h: Math.max(0,wv)*24*b.rise*(1-i/N*0.45), s:1-i/N*0.5, i });
  }
  return out;
}
function finishSerpent(win){
  if(S.boss && S.boss.chap){ const cb=S.boss; S.boss=null; return finishCh2Boss(win, cb); }   // 4장 먹물 해룡
  const b=endBoss(win), n=S.bossN;
  if(win){
    S.stats.serpent=(S.stats.serpent||0)+1;
    const loot={ pearl:2+Math.floor(n/4), parts:40+12*n, coin:500+220*n, fish:250+80*n };
    const got=bossReward(loot,"serpent");

    sfx("victory");
    showModal({ title:"🐉 심해 해룡 격퇴!", sub:`약점 적중 ${b.hits}회 · 물어뜯기 ${b.bites}회`,
      body:`<p>해룡이 비명을 지르며 심연으로 물러남. 떨어진 비늘은 뛰어난 설계 재료가 됨(도면 +2).</p>
            <p>🐉 원정지 <b>해룡의 둥지</b>가 열림.</p>`,
      loot:got, btns:[{t:"수령",cls:"btn gold"}] });
  } else {
    const lost={};
    ["fish","food"].forEach(k=>{ const q=Math.floor((S.res[k]||0)*0.25); if(q>0){ S.res[k]-=q; lost[k]=q; } });
    sfx("defeat");
    showModal({ title:"🌑 해룡이 물러감", sub:"제한 시간 안에 쓰러뜨리지 못함",
      body:`<p>해룡이 비축 식량을 휩쓸고 심해로 사라짐.</p>
            <p>약탈당함: ${Object.keys(lost).map(k=>RES[k].icon+fmt(lost[k])).join(" ")||"없음"}</p>
            <p style="opacity:.8">해룡이 고개를 들면 목의 푸른 빛을 노릴 것. 맞히면 2초간 기절해 자동 사격이 2배가 됨.</p>`,
      btns:[{t:"확인",cls:"btn red"}] });

/* ---------- 심해 해룡 그리기 ---------- */
function drawSerpentWater(b){
  const cen=raftCenter();
  ctx.save(); ctx.globalAlpha=.16*b.rise; ctx.strokeStyle="#0a2f4f"; ctx.lineWidth=26;
  ctx.setLineDash([60,40]); ctx.lineDashOffset=-waveT*40;
  ctx.beginPath(); ctx.ellipse(cen.x,cen.y+6,b.R,b.R*0.55,0,0,6.283); ctx.stroke();
  ctx.restore();
}
const SERP_SKIN = { ink:"hue-rotate(95deg) saturate(1.5) brightness(.8)" };   // 4장 먹물 해룡 : 보랏빛 먹색 (필터 미지원 기기는 원래 색)
function serpentEnts(b,ents){
  const sk=(f)=> b.skin&&SERP_SKIN[b.skin]? ()=>{ ctx.save(); ctx.filter=SERP_SKIN[b.skin]; f(); ctx.restore(); } : f;
  serpentHumps(b).forEach(hp=>{ if(hp.h>1) ents.push({ z:hp.y, d:0, f:sk(()=>drawHump(hp,b)) }); });
  if(b.head) ents.push({ z:b.head.y, d:0, f:sk(()=>drawSerpentHead(b.head,b)) });
  if(b.tail) ents.push({ z:b.tail.y, d:0, f:sk(()=>drawSerpentTail(b.tail,b)) });
  if(b.skin==="ink") ents.push({ z:-1e9, d:0, f:()=>drawInkPool(b) });
}
function drawInkPool(b){
  const cen=raftCenter();
  ctx.save(); ctx.globalAlpha=.22*b.rise; ctx.fillStyle="#1a0b33";
  for(let i=0;i<7;i++){ const a=i*0.9+waveT*0.15, r=b.R+40;
    ctx.beginPath(); ctx.ellipse(cen.x+Math.cos(a)*r, cen.y+Math.sin(a)*r*0.55, 70, 26, 0, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function drawHump(hp,b){
  const w=26*hp.s, h=hp.h;
  ctx.save();
  ctx.globalAlpha=.5; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.ellipse(hp.x,hp.y,w+6,6,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  ctx.beginPath(); ctx.rect(hp.x-w-4,hp.y-h-20,w*2+8,h+20); ctx.clip();
  ctx.fillStyle= b.hurt>0? "#7fe0d0" : "#2fb3a0";
  ctx.beginPath(); ctx.ellipse(hp.x,hp.y,w,h,0,Math.PI,0); ctx.fill();
  ctx.fillStyle="#1d7f72";
  ctx.beginPath(); ctx.ellipse(hp.x,hp.y,w*0.55,h*0.7,0,Math.PI,0); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.25)"; ctx.beginPath(); ctx.ellipse(hp.x-w*0.3,hp.y-h*0.7,w*0.25,h*0.15,-0.3,0,6.283); ctx.fill();
  // 주황 등지느러미
  ctx.fillStyle="#ff9a3a";
  ctx.beginPath(); ctx.moveTo(hp.x-6*hp.s,hp.y-h+2); ctx.lineTo(hp.x,hp.y-h-10*hp.s); ctx.lineTo(hp.x+6*hp.s,hp.y-h+2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawSerpentHead(h,b){
  const g=headGeom(h), dir=h.dir;
  ctx.save();
  ctx.globalAlpha=.6; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(h.x,h.y,30,9,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  // 목 (굵기가 줄어드는 곡선)
  const col=b.hurt>0? "#7fe0d0" : "#2fb3a0";
  for(let i=10;i>=0;i--){
    const t=i/10, x=lerp(h.x,g.hx,t)+Math.sin(t*Math.PI)*-dir*14, y=lerp(h.y,g.hy+10,t);
    ctx.fillStyle= i%2? col : "#27a090";
    ctx.beginPath(); ctx.arc(x,y,lerp(19,13,t),0,6.283); ctx.fill();
    ctx.fillStyle="#f2e2a8"; ctx.beginPath(); ctx.arc(x+dir*lerp(10,7,t),y,lerp(7,5,t),0,6.283); ctx.fill();   // 배 비늘
  }
  // 머리
  const bite = !h.hit && h.t > h.win*0.65;
  ctx.save(); ctx.translate(g.hx,g.hy); ctx.scale(dir,1);
  // 지느러미 볏
  ctx.fillStyle="#ff9a3a";
  [[-18,-10],[-26,-4],[-30,4]].forEach(([fx,fy],i)=>{ ctx.beginPath(); ctx.moveTo(fx,fy);
    ctx.lineTo(fx-12,fy-14+i*3); ctx.lineTo(fx+6,fy-2); ctx.closePath(); ctx.fill(); });
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.ellipse(0,0,24,15,0,0,6.283); ctx.fill();
  // 주둥이 + 입
  ctx.beginPath(); ctx.moveTo(10,-10); ctx.quadraticCurveTo(38,-6,40, bite? -2:2); ctx.lineTo(12,6); ctx.closePath(); ctx.fill();
  if(bite){
    ctx.fillStyle="#7a1f2a"; ctx.beginPath(); ctx.moveTo(12,2); ctx.lineTo(40,0); ctx.lineTo(34,14); ctx.lineTo(10,12); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#fff"; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(16+i*6,2); ctx.lineTo(19+i*6,7); ctx.lineTo(22+i*6,2); ctx.fill(); }
  }
  // 눈
  ctx.fillStyle="#ffe45a"; ctx.beginPath(); ctx.ellipse(8,-5,6,5,0,0,6.283); ctx.fill();
  ctx.fillStyle="#1a1a1a"; ctx.beginPath(); ctx.ellipse(9,-5,1.6,4.4,0,0,6.283); ctx.fill();
  ctx.restore();
  // 푸른 약점 + 남은 시간 고리
  if(!h.hit){
    const left=1-clamp(h.t/h.win,0,1), pulse=0.5+Math.sin(waveT*14)*0.5;
    ctx.globalAlpha=.6+pulse*.4; ctx.drawImage(glowSprite("#6fe8ff"),g.gx-30,g.gy-30,60,60); ctx.globalAlpha=1;
    ctx.fillStyle="#bff6ff"; ctx.beginPath(); ctx.arc(g.gx,g.gy,7,0,6.283); ctx.fill();
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(g.gx,g.gy,20,-Math.PI/2,-Math.PI/2+6.283*left); ctx.stroke();
    ctx.strokeStyle="#6fe8ff"; ctx.lineWidth=2; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(g.gx,g.gy,28,0,6.283); ctx.stroke();
  }
  ctx.restore();
}
function drawSerpentTail(tl,b){
  const x=tl.x, y=tl.y, top=90*tl.rise, dir=tl.dir, sw=Math.sin(waveT*6)*6;
  ctx.save();
  ctx.globalAlpha=.6; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(x,y,26,8,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  for(let i=8;i>=0;i--){
    const t=i/8;
    ctx.fillStyle= i%2? "#2fb3a0" : "#27a090";
    ctx.beginPath(); ctx.arc(x+Math.sin(t*2)*dir*10+sw*t, y-top*t, lerp(15,7,t), 0, 6.283); ctx.fill();
  }
  // 꼬리지느러미
  const tx=x+Math.sin(2)*dir*10+sw, ty=y-top;
  ctx.fillStyle="#ff9a3a";
  ctx.beginPath(); ctx.moveTo(tx,ty); ctx.quadraticCurveTo(tx-28,ty-20,tx-30,ty-6); ctx.quadraticCurveTo(tx-12,ty-4,tx,ty+4);
  ctx.quadraticCurveTo(tx+12,ty-4,tx+30,ty-6); ctx.quadraticCurveTo(tx+28,ty-20,tx,ty); ctx.fill();
  // 탭 유도 + 남은 시간
  const left=1-clamp(tl.t/tl.win,0,1);
  ctx.strokeStyle="#ffd257"; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(x,y-top*0.55,34,-Math.PI/2,-Math.PI/2+6.283*left); ctx.stroke();
  ctx.restore();
}

   · 3단계 심연의 심장 : 가슴의 조개 심장이 열릴 때 연타, 못 맞히면 심연 파동

const FINAL_PHASES = ["산호 갑옷","심연의 손","심연의 심장"];

/* ---------- 일정 : updBoss 에서 호출, 최종 보스 날이면 true (일반 보스 억제) ---------- */
function updFinalSchedule(){
  if((S.finalStage||0)===0 && (S.expoDone.legend||0)>=1){
    S.finalStage=1; S.finalDay=S.env.day+1;
    if(S.bossDay<=S.finalDay+1) S.bossDay=S.finalDay+3;        // 일반 보스와 겹치지 않게

      body:`<p>탐험대가 가져온 석판에는 이렇게 적혀 있었음.</p>
            <p style="text-align:center;font-weight:800;color:#bff6ff">"네 개의 재앙이 쓰러지면<br>심연의 군주가 깨어나리라."</p>
            <p><b>내일 오후</b>, 바다 밑에서 거대한 존재가 올라올 것임. 뗏목을 수리하고 방어를 최대로 끌어올릴 것.</p>`,
      btns:[{t:"맞서겠음", cls:"btn gold"}], kind:"story", queue:true });

  }
  if(S.finalStage!==1 || S.env.day < S.finalDay) return false;
  // 예고
  const secLeft=(BOSS_TIME-S.env.time)*240, warnSec=45+(S.cache.warn||0);
  if(S.env.day===S.finalDay && secLeft>0 && secLeft<=warnSec && S.finalWarned!==S.finalDay){
    S.finalWarned=S.finalDay; sfx("bossAlarm");

    showModal({ title:"⚠️ 🌑 심연의 군주 접근", sub:`약 ${Math.ceil(secLeft)}초 후 출현 · 최종 보스`,
      body:`<p>바다 전체가 낮게 울리기 시작함. 이번이 마지막 전투임.</p>

            <div class="hintbox" style="margin-top:8px">현재 보스 난이도: <b>${d.icon} ${d.name}</b>
             <div class="tagrow" style="margin:6px 0 0">${Object.keys(DIFF).map(k=>
               `<span class="tag ${S.diff===k?"on":""}" onclick="setDiff('${k}',true)">${DIFF[k].icon} ${DIFF[k].name}</span>`).join("")}</div></div>`,
      btns:[{t:"마지막 전투 준비", cls:"btn red"}], kind:"bossWarn" });
  }
  if((S.env.day>S.finalDay || S.env.time>=BOSS_TIME) && !S.raid && !S.storm) startFinal();

function startFinal(opts){
  opts=opts||{};
  closePanel(); PLACE=null;
  if($("#modal").dataset.kind==="bossWarn") closeModal();
  camCenter(); CAM.ty -= 70; CAM.z=Math.min(CAM.z,0.68); CAM.x=CAM.tx; CAM.y=CAM.ty;
  const d=bossDiff(), str=bossStr()*1.1;
  const W=cv.width/DPR, H=cv.height/DPR, pos=s2w(W*0.5, H*0.83);
  const cen=raftCenter(), rad=raftRadius();
  const dx=pos.x-cen.x, dy=(pos.y-cen.y)/0.55, dd=Math.hypot(dx,dy)||1;
  if(dd<rad+150){ pos.x=cen.x+dx/dd*(rad+150); pos.y=cen.y+dy/dd*(rad+150)*0.55; }
  const pool=(v)=>({ hp:Math.floor(v*str), max:Math.floor(v*str) });
  const T=210*d.time;
  S.boss={ type:"final", t:T, total:T, str, phase:1, x:pos.x, y:pos.y, rise:0, hurt:0, banner:0,
    armor:pool(500), hands:pool(440), core:pool(650),
    plates:[ {ox:-100,oy:-150,glow:0,cd:1.5,crack:0}, {ox:100,oy:-150,glow:0,cd:3.3,crack:0}, {ox:0,oy:-292,glow:0,cd:5.1,crack:0} ],
    hand:null, nextHand:3, coreOpen:0, nextCore:4, coreHitsOpen:0, pulseFx:0,
    waves:[], nextWave:4, spawned:0, broken:0, hit:0, power:stormPowerOf(S)*1.3*d.str,
    shells:[], nextVolley:5, intercepted:0 };
  S.env.weather="storm"; S.env.wLeft=40;
  const CB = opts.chap && CHAPTERS.find(C=>C.key===opts.chap);
  if(CB){                                     // 이야기 장 보스 : 모습과 체력만 다름
    const B=CB.boss;
    S.boss.chap=CB.key; S.boss.skin=B.skin;
    [S.boss.armor,S.boss.hands,S.boss.core].forEach(p=>{ p.max=Math.floor(p.max*B.hp); p.hp=p.max; });
    toast(`${B.icon} <b>${CB.no}장 보스: ${B.name}</b> <small>(${d.name})</small>`,"bad");
  } else
  toast(`🌑 <b>최종 보스: 심연의 군주</b> <small>(${d.name})</small>`,"bad");
  sfx("finalRoar"); shake(14);
}
function finalPool(b){ return b.phase===1? b.armor : b.phase===2? b.hands : b.core; }
function damageFinal(dmg, byTap){
  const b=S.boss, pl=finalPool(b);
  pl.hp-=dmg; b.hurt=0.2;
  if(pl.hp<=0){ pl.hp=0; nextFinalPhase(); }
}
function nextFinalPhase(){
  const b=S.boss;
  if(b.phase===3){ finishFinal(true); return; }
  b.phase++; b.banner=3.2;
  b.waves=[]; b.hand=null; b.shells=[]; b.coreOpen=0; b.nextCore=3.5; b.nextHand=2.5; b.nextVolley=4; b.nextWave=5;
  emit(b.x,b.y-200,"spark",40,{spread:90}); emit(b.x,b.y-120,"ink",24,{spread:80,col:"#1a0b33"});
  shake(14); sfx("phase");
  showPhaseBanner(`${b.phase}단계 · ${FINAL_PHASES[b.phase-1]}`,
    b.phase===2? "솟아오르는 손바닥의 룬을 탭! 포탄 표적도 요격" : "가슴의 심장이 열리면 연타!");
}
function showPhaseBanner(title, sub){
  $$(".phasebanner").forEach(e=>e.remove());          // 단계를 빨리 넘겨도 배너가 겹치지 않게
  const el=document.createElement("div");
  el.className="phasebanner"; el.innerHTML=`<b>${title}</b><small>${sub||""}</small>`;
  $("#app").appendChild(el);
  setTimeout(()=>{ el.style.opacity=0; setTimeout(()=>el.remove(),500); }, 2600);
}
function finalTarget(b){
  if(b.phase===2 && b.hand && !b.hand.hit){ const g=handGeom(b.hand); return { x:g.rx, y:g.ry }; }
  if(b.phase===3) return { x:b.x, y:b.y-120 };
  const p=b.plates.find(p=>p.glow>0)||b.plates[0];
  return { x:b.x+p.ox, y:b.y+p.oy };
}

function updFinal(dt){
  const b=S.boss, c=S.cache, d=bossDiff();
  b.t-=dt; b.rise=Math.min(1,b.rise+dt*0.33); b.hurt=Math.max(0,b.hurt-dt);
  b.banner=Math.max(0,b.banner-dt); b.pulseFx=Math.max(0,b.pulseFx-dt);
  S.env.weather="storm"; S.env.wLeft=30;
  if(b.rise<1){ if(b.t<=0) finishFinal(false); return; }
  const cut=clamp(c.stormCut,0,0.6);
  const cap=stormCaps();
  S.hullDmg=Math.min(c.hullMax, S.hullDmg + Math.min(b.power*0.008, c.hullMax*cap.cont*0.5)*(1-cut)*dt);
  if(b.skin==="storm"){ updStormBolts(b,dt,cut,c); if(!S.boss) return; }   // 해일왕 전용 : 번개 표적
  // 자동 사격 : 단계와 약점 노출 여부에 따라 효율이 달라짐
  const mul = b.phase===1? 0.5 : b.phase===2? (b.hand&&!b.hand.hit? 1 : 0.3) : (b.coreOpen>0? 1.5 : 0.2);
  const dps=(c.bossDps||0)*mul;
  if(dps>0){
    damageFinal(dps*dt,false); if(!S.boss) return;
    S.tiles.forEach(t=>{
      if(t.b!=="harpoon"&&t.b!=="cannon") return;
      if(!every("fn"+t.x+","+t.y, t.b==="cannon"?0.8:1.2, dt)) return;
      const p=iso(t.x,t.y), tg=finalTarget(b);
      shoot(p.x,p.y-24,tg.x+rnd(-12,12),tg.y+rnd(-10,10),t.b==="cannon"?"ball":"harpoon");
      sfx(t.b==="cannon"?"cannon":"shoot");
    });
  }
  // 파도 (1·3단계)
  if(b.phase!==2){
    b.nextWave-=dt;
    if(b.nextWave<=0){ b.nextWave=(b.phase===1? 6.5 : 9)/Math.min(1.4,0.7+b.str*0.12); spawnWave(b); }
  }
  for(let i=b.waves.length-1;i>=0;i--){
    const w=b.waves[i]; w.t+=dt; w.ph+=dt;
    const r=clamp(w.t/w.dur,0,1), e=r*r*(1.6-0.6*r);
    w.x=lerp(w.x0,w.x1,e); w.y=lerp(w.y0,w.y1,e); w.size=w.s0*(0.8+0.35*r);
    if(r>=1){
      const dmg=Math.min(b.power*(0.7+0.3*w.hp/w.maxHp), c.hullMax*cap.wave)*(1-cut);
      S.hullDmg=Math.min(c.hullMax,S.hullDmg+dmg); b.hit++;
      emit(w.x,w.y,"spray",36,{spread:30}); shake(10); sfx("waveCrash");
      fxText(w.x,w.y-40,`-${Math.round(dmg)} 내구`,"#ff9a9a");
      b.waves.splice(i,1);
      if(S.hullDmg>=c.hullMax*0.98) collapseSomething();
    }
  }
  // 1단계 : 산호판 점멸
  if(b.phase===1){
    b.plates.forEach(p=>{ if(p.glow>0) p.glow-=dt; else { p.cd-=dt; if(p.cd<=0){ p.glow=2.4*d.time; p.cd=rnd(4,6); } } });
  }
  // 2단계 : 손 + 포탄
  if(b.phase===2){
    if(!b.hand){
      b.nextHand-=dt;
      if(b.nextHand<=0){
        const o=pick(visibleSpots(72)).o;
        b.hand={ x:o.x, y:o.y, dir:o.x<raftCenter().x?1:-1, t:0, win:2.8*d.time, rise:0, hit:false, t2:0 };
        emit(o.x,o.y,"spray",22,{spread:18}); sfx("serpentRise");
      }
    } else {
      const h=b.hand; h.t+=dt; h.rise=Math.min(1,h.rise+dt*3);
      if(h.hit){ h.t2+=dt; h.rise=Math.max(0,1-h.t2*1.8); if(h.t2>0.6){ b.hand=null; b.nextHand=rnd(2.8,4.2); } }
      else if(h.t>=h.win){
        const dmg=16*b.str*(1-cut);
        S.hullDmg=Math.min(c.hullMax,S.hullDmg+dmg);
        emit(h.x,h.y-20,"spray",36,{spread:30}); emit(h.x,h.y-20,"dust",12,{spread:24,col:"#4a5a7a"}); shake(12);
        fxText(h.x,h.y-120,`내려치기! -${Math.round(dmg)}`,"#ff9a9a"); sfx("boom");
        S.floats.splice(0, Math.floor(S.floats.length/2));
        b.hand=null; b.nextHand=rnd(3.5,5);
        if(S.hullDmg>=c.hullMax*0.98) collapseSomething();
      }
    }
    b.nextVolley-=dt;
    if(b.nextVolley<=0){
      b.nextVolley=rnd(7,9);
      const tiles=[...S.tiles.values()];
      for(let i=0;i<3;i++){
        const t=pick(tiles), p=iso(t.x,t.y), x0=b.x+(i-1)*140, y0=b.y-60;
        b.shells.push({ x0, y0, tx:p.x+rnd(-14,14), ty:p.y+rnd(-6,6), t:-i*0.3, dur:2.7*d.time });
      }
      sfx("cannon"); shake(3);
    }
    for(let i=b.shells.length-1;i>=0;i--){
      const s=b.shells[i]; s.t+=dt;
      if(s.t>=s.dur){
        const dmg=10*b.str*(1-cut);
        S.hullDmg=Math.min(c.hullMax,S.hullDmg+dmg);
        emit(s.tx,s.ty,"ink",10,{spread:12,col:"#2a1640"}); emit(s.tx,s.ty,"spark",8,{col:"#c9a6ff"}); shake(6);
        fxText(s.tx,s.ty-30,`-${Math.round(dmg)} 내구`,"#ff9a9a"); sfx("boom");
        b.shells.splice(i,1);
      }
    }
  }
  // 3단계 : 심장 개폐 → 놓치면 심연 파동
  if(b.phase===3){
    if(b.coreOpen>0){
      b.coreOpen-=dt;
      if(b.coreOpen<=0){
        if(b.coreHitsOpen===0){
          const dmg=22*b.str*(1-cut);
          S.hullDmg=Math.min(c.hullMax,S.hullDmg+dmg);
          b.pulseFx=1.2; shake(16); sfx("pulse");
          fxText(b.x,b.y-330,`심연 파동! -${Math.round(dmg)}`,"#c9a6ff");
          if(S.hullDmg>=c.hullMax*0.98) collapseSomething();
        }
        b.nextCore=rnd(4,5.5);
      }
    } else {
      b.nextCore-=dt;
      if(b.nextCore<=0){ b.coreOpen=2.6*d.time; b.coreHitsOpen=0; sfx("coreOpen"); }
    }
  }
  if(b.t<=0) finishFinal(false);
}

/* ---------- 해일왕 전용 : 번개 표적 ----------
   뗏목 바닥에 노란 표적이 뜨고, 시간이 다 되면 번개가 내리침(내구 피해).
   표적을 탭하면 번개를 해일왕에게 되돌려 피해를 줌(피뢰).
   뗏목에 별빛 등대가 있으면 세 번째 번개마다 등대가 대신 막아 줌. */
function hasStarTower(){ for(const t of S.tiles.values()) if(t.b==="starlight") return true; return false; }
function updStormBolts(b,dt,cut,c){
  b.bolts=b.bolts||[]; b.flashes=b.flashes||[];
  if(b.nextBolt==null) b.nextBolt=3;
  b.nextBolt-=dt;
  if(b.nextBolt<=0){
    b.nextBolt=rnd(4.5,6.5)/(0.85+b.phase*0.15);
    const tiles=[...S.tiles.values()], n=b.phase===3? 2 : 1;
    for(let i=0;i<n;i++){ const t=pick(tiles), p=iso(t.x,t.y); b.bolts.push({ x:p.x, y:p.y, t:0, win:2.8*bossDiff().time }); }
    sfx("alarm");
  }
  for(let i=b.bolts.length-1;i>=0;i--){
    const bo=b.bolts[i]; bo.t+=dt;
    if(bo.t<bo.win) continue;
    b.bolts.splice(i,1);
    b.boltN=(b.boltN||0)+1;
    b.flashes.push({ x:bo.x, y:bo.y, t:0.35 });
    if(hasStarTower() && b.boltN%3===0){
      fxText(bo.x,bo.y-60,"🗼 등대가 번개를 막음!","#fff6a0"); emit(bo.x,bo.y-20,"star",14,{col:"#fff6c2"}); sfx("intercept");
      continue;
    }
    const dmg=12*b.str*(1-cut);
    S.hullDmg=Math.min(c.hullMax,S.hullDmg+dmg);
    emit(bo.x,bo.y,"spark",22,{spread:18,col:"#fff6a0"}); shake(9); sfx("boom");
    fxText(bo.x,bo.y-50,`⚡ 번개! -${Math.round(dmg)}`,"#ff9a9a");
    if(S.hullDmg>=c.hullMax*0.98) collapseSomething();
  }
  for(let i=b.flashes.length-1;i>=0;i--){ b.flashes[i].t-=dt; if(b.flashes[i].t<=0) b.flashes.splice(i,1); }
}
function tapStormBolt(b,w){
  if(!b.bolts) return false;
  for(let i=0;i<b.bolts.length;i++){
    const bo=b.bolts[i];
    if(Math.hypot(bo.x-w.x,(bo.y-w.y)*1.4)<48){
      b.bolts.splice(i,1);
      const dmg=finalPool(b).max*0.05*bossDiff().tap;
      emit(bo.x,bo.y-10,"star",12,{col:"#fff6a0"}); shake(5); sfx("crit");
      fxText(bo.x,bo.y-40,`피뢰! -${Math.round(dmg)}`,"#fff6a0");
      b.flashes.push({ x:b.x, y:b.y-230, t:0.3 });
      damageFinal(dmg,true); return true;
    }
  }
  return false;
}
function drawStormBolts(b){
  (b.bolts||[]).forEach(bo=>{
    const left=1-clamp(bo.t/bo.win,0,1), pulse=0.5+Math.sin(waveT*14)*0.5;
    ctx.save();
    ctx.globalAlpha=.5+pulse*.4; ctx.drawImage(glowSprite("#fff6a0"),bo.x-46,bo.y-30,92,60); ctx.globalAlpha=1;
    ctx.strokeStyle="#fff6a0"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(bo.x,bo.y,30,15,0,0,6.283); ctx.stroke();
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(bo.x,bo.y,38,19,0,-Math.PI/2,-Math.PI/2+6.283*left); ctx.stroke();
    ctx.fillStyle="#ffe14a"; ctx.strokeStyle="#6a4a00"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bo.x+4,bo.y-34); ctx.lineTo(bo.x-8,bo.y-12); ctx.lineTo(bo.x,bo.y-12);
    ctx.lineTo(bo.x-5,bo.y+4); ctx.lineTo(bo.x+9,bo.y-18); ctx.lineTo(bo.x+1,bo.y-18); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  });
  (b.flashes||[]).forEach(f=>{
    ctx.save(); ctx.globalAlpha=clamp(f.t/0.35,0,1); ctx.strokeStyle="#fffbe0"; ctx.lineWidth=5; ctx.lineJoin="round";
    ctx.beginPath(); let yy=f.y-420, xx=f.x; ctx.moveTo(xx,yy);
    while(yy<f.y){ yy+=40; xx=f.x+Math.sin(yy*0.31+f.x)*20; ctx.lineTo(xx,Math.min(yy,f.y)); }
    ctx.stroke(); ctx.drawImage(glowSprite("#fff6a0"),f.x-50,f.y-40,100,80); ctx.restore();
  });
}
function handGeom(h){
  const top=120*h.rise;
  return { rx:h.x+h.dir*6, ry:h.y-top+10, top };
}
function tapFinal(w){
  const b=S.boss, d=bossDiff();
  if(b.rise<1) return true;
  if(b.skin==="storm" && tapStormBolt(b,w)) return true;
  // 파도 (1·3단계)
  if(b.phase!==2){
    let bi=-1, bd=1e9;
    b.waves.forEach((wv,i)=>{ const dd=Math.hypot(wv.x-w.x,(wv.y-20-w.y)*1.4); if(dd<70*wv.size && dd<bd){ bd=dd; bi=i; } });
    if(bi>=0){ const wv=b.waves[bi]; wv.hp -= waveTapPow();
      emit(w.x,w.y,"spray",10); sfx("splash"); if(wv.hp<=0) breakWave(b,bi,true); return true; }
  }
  if(b.phase===1){
    for(const p of b.plates){
      if(p.glow<=0) continue;
      const px=b.x+p.ox, py=b.y+p.oy;
      if(Math.hypot(px-w.x,py-w.y)<46){
        p.glow=0; p.cd=rnd(3.5,5); p.crack++;
        emit(px,py,"spark",20,{spread:16,col:"#ff9ac8"}); emit(px,py,"star",8,{col:"#ffd0e4"}); shake(6);
        const dmg=b.armor.max*0.1*d.tap;
        fxText(px,py-30,`산호 파괴! -${Math.round(dmg)}`,"#ffb0d0"); sfx("crack");
        damageFinal(dmg,true); return true;
      }
    }
  }
  if(b.phase===2){
    const h=b.hand;
    if(h && !h.hit && h.rise>0.5){
      const g=handGeom(h);
      if(Math.hypot(g.rx-w.x,g.ry-w.y)<56){
        h.hit=true; h.t2=0;
        const dmg=b.hands.max*0.2*d.tap;
        emit(g.rx,g.ry,"star",16,{col:"#9fe8ff"}); emit(g.rx,g.ry,"spark",14,{col:"#bfe8ff"}); shake(7);
        fxText(g.rx,g.ry-30,`룬 봉인! -${Math.round(dmg)}`,"#9fe8ff"); sfx("crit");
        damageFinal(dmg,true); return true;
      }
    }
    for(let i=0;i<b.shells.length;i++){
      const s=b.shells[i]; if(s.t<0) continue;
      const pos=shellPos(s);
      if(Math.hypot(s.tx-w.x,(s.ty-w.y)*1.3)<44 || Math.hypot(pos.x-w.x,pos.y-w.y)<34){
        emit(pos.x,pos.y,"smoke",10,{spread:10,col:"#b8a0d6"}); fxText(pos.x,pos.y-24,"요격!","#bfe8ff");
        b.shells.splice(i,1); b.intercepted++; S.stats.intercept=(S.stats.intercept||0)+1; sfx("intercept");
        return true;
      }
    }
  }
  if(b.phase===3 && b.coreOpen>0){
    if(Math.hypot(b.x-w.x,(b.y-120)-w.y)<58){
      const dmg=b.core.max*0.07*d.tap;
      b.coreHitsOpen++;
      emit(b.x,b.y-120,"star",10,{col:"#e0fbff"}); emit(b.x,b.y-120,"spark",10,{col:"#9fe8ff"}); shake(4);
      fxText(b.x+rnd(-20,20),b.y-170,`-${Math.round(dmg)}`,"#e0fbff"); sfx("crit");
      damageFinal(dmg,true); return true;
    }
  }
  // 몸통
  if(Math.abs(w.x-b.x)<190 && w.y>b.y-320 && w.y<b.y+20){
    const m=b.phase===3 && b.coreOpen<=0? 0.2 : 0.4;
    damageFinal(bossTapDmg()*m,true); emit(w.x,w.y,"dust",4,{col:"#4a5a7a"}); sfx("hit");
    fxText(w.x,w.y-20,`-${Math.round(bossTapDmg()*m)}`,"#cfd6e8");
    return true;
  }
  return false;
}

function finishFinal(win){
  const b=S.boss; S.boss=null;
  S.env.weather="rain"; S.env.wLeft=rnd(20,40);
  if(b.chap || b.ch2) return finishCh2Boss(win, b);
  if(win){
    S.finalStage=2;
    if(S.ch2) S.ch2.wait=true;                 // 엔딩 연출이 끝난 뒤에 2장을 시작함
    S.stats.final=(S.stats.final||0)+1;
    if(S.diff==="hard") S.stats.finalHard=(S.stats.finalHard||0)+1;
    const got=bossReward({ pearl:10, coin:5000, parts:200, wood:2000 },"final");
    S.bossDay=Math.max(S.bossDay, S.env.day+5);
    emit(b.x,b.y-200,"confetti",90,{spread:120}); emit(b.x,b.y-200,"star",40,{spread:80,col:"#fff6c2"});
    sfx("victory");
    if(!(typeof ABYSS!=="undefined" && ABYSS && ABYSS.active)){ S.abyss.unlocked=true; save(); setTimeout(()=>startEnding(got), 1400); }
  } else {
    S.stats.finalLose=(S.stats.finalLose||0)+1;
    S.finalDay=S.env.day+3;
    sfx("defeat");
    showModal({ title:"🌑 심연의 군주가 가라앉음", sub:`${FINAL_PHASES[b.phase-1]} 단계에서 시간이 다 됨`,
      body:`<p>군주가 깊은 바다로 돌아갔지만 봉인은 아직 풀려 있음. <b>3일 뒤</b> 다시 떠오를 것임.</p>
            <p style="opacity:.8">대포·작살포를 강화하고 경비를 늘리면 자동 피해가 커짐. 난이도를 [기록 → ⚙️ 설정]에서 조정할 수 있음.</p>`,
      btns:[{t:"다음을 기약함",cls:"btn red"}] });
  }
}

/* ---------- 그리기 ---------- */
/* 거인 보스 겉모습 : 심연의 군주(lord) · 군주의 그림자(shadow, 2장) · 해일왕(storm, 3장)
   약점 표시(룬·빛나는 산호판·심장)는 조작 신호라서 모든 모습에서 같은 방식으로 보이게 둠 */
const TSKIN = {
  lord:  { sA:"#3e5584", sB:"#17213f", hA:"#6a5a9a", hB:"#3a2a5a", arm:"#22305a", arm2:"#2c3e66", brow:"#141b33",
           eye:"#6fe8ff", eye3:"#ff7ad9", beard:"#2f8f5a", coral:["#ff7aa8","#ff9a5a"], cTip:"#ffd0e4", crTip:"#ffe7a8",
           pool:"#120826", ring:"#6a4fb0", sky:"#1a0b33", foam:"#e4f5ff", spot:"rgba(255,255,255,.08)" },
  shadow:{ sA:"#4a2a78", sB:"#0b0616", hA:"#8a5ac8", hB:"#2a1446", arm:"#1a0d30", arm2:"#2a1650", brow:"#05020c",
           eye:"#ffe27a", eye3:"#ffffff", beard:"#6b3fa8", coral:["#b07aff","#7a5cff"], cTip:"#e8d8ff", crTip:"#fff2b0",
           pool:"#05020c", ring:"#b07aff", sky:"#0b0418", foam:"#c9a6ff", spot:"rgba(201,166,255,.12)", smoke:true },
  storm: { sA:"#7f9fb8", sB:"#223444", hA:"#b8d8f0", hB:"#3a5468", arm:"#2c4456", arm2:"#3c5a70", brow:"#1a2630",
           eye:"#fff6a0", eye3:"#ffffff", beard:"#e8f6ff", coral:["#8fe8ff","#e0f8ff"], cTip:"#ffffff", crTip:"#fff6a0",
           pool:"#0e1c28", ring:"#8fe8ff", sky:"#0e1a26", foam:"#ffffff", spot:"rgba(255,255,255,.14)", bolt:true },
};
function tskin(b){ return TSKIN[(b&&b.skin)||"lord"] || TSKIN.lord; }
function drawFinalWater(b){
  // 군주 주위의 어두운 소용돌이
  const rise=b.rise, K=tskin(b);
  ctx.save(); ctx.globalAlpha=0.28*rise; ctx.fillStyle=K.pool;
  ctx.beginPath(); ctx.ellipse(b.x,b.y+10,260,70,0,0,6.283); ctx.fill();
  ctx.globalAlpha=0.35*rise; ctx.strokeStyle=K.ring; ctx.lineWidth=3; ctx.setLineDash([30,24]); ctx.lineDashOffset=waveT*30;
  ctx.beginPath(); ctx.ellipse(b.x,b.y+10,230,58,0,0,6.283); ctx.stroke();
  ctx.restore();
  b.waves.forEach(drawBigWave);
  // 심연 파동 고리
  if(b.pulseFx>0){
    const r=1-b.pulseFx/1.2;
    ctx.save(); ctx.globalAlpha=(1-r)*0.8; ctx.strokeStyle=K.ring==="#6a4fb0"?"#c9a6ff":K.ring; ctx.lineWidth=10*(1-r)+2;
    ctx.beginPath(); ctx.ellipse(b.x,b.y-60,120+r*700,50+r*300,0,0,6.283); ctx.stroke(); ctx.restore();
  }
}
function finalEnts(b,ents){
  ents.push({ z:b.y, d:0, f:()=>drawTitan(b) });
  if(b.hand) ents.push({ z:b.hand.y, d:0, f:()=>drawAbyssHand(b.hand,b) });
  ents.push({ z:1e9, d:0, f:()=>b.shells.forEach(drawShell) });
  if(b.skin==="storm") ents.push({ z:1e9+1, d:0, f:()=>drawStormBolts(b) });
}
function drawTitan(b){
  const x=b.x, base=b.y, sink=(1-b.rise)*300, bob=Math.sin(waveT*0.9)*4;
  const y=base+sink+bob, hurt=b.hurt>0, K=tskin(b);
  ctx.save();
  // 수면 아래는 가림
  ctx.beginPath(); ctx.rect(x-320,base-460,640,460+6); ctx.clip();
  const stone=(yy,r)=>{ const g=ctx.createRadialGradient(x-40,yy-r*0.4,10,x,yy,r*1.3);
    g.addColorStop(0, hurt? K.hA : K.sA); g.addColorStop(1, hurt? K.hB : K.sB); return g; };
  if(K.smoke) ctx.globalAlpha=0.9+Math.sin(waveT*3)*0.06;      // 그림자 : 몸이 살짝 일렁임
  // 팔(1·3단계 : 수면 위에 기대어 있음)
  if(b.phase!==2){
    [-1,1].forEach(s=>{
      ctx.fillStyle=K.arm;
      ctx.beginPath(); ctx.ellipse(x+s*195,y-22,60,34,s*0.25,0,6.283); ctx.fill();
      ctx.fillStyle=K.arm2;
      for(let i=0;i<4;i++){ ctx.beginPath(); ctx.ellipse(x+s*(160+i*16),y-8,9,14,0,0,6.283); ctx.fill(); }
    });
  }
  // 어깨·몸통
  ctx.fillStyle=stone(y-90,170);
  ctx.beginPath(); ctx.ellipse(x,y-80,178,118,0,Math.PI,0); ctx.lineTo(x+178,y+6); ctx.lineTo(x-178,y+6); ctx.closePath(); ctx.fill();
  // 따개비·얼룩
  ctx.fillStyle=K.spot;
  [[-120,-60,10],[-60,-150,7],[70,-120,9],[130,-40,8],[20,-60,6],[-20,-170,5]].forEach(o=>{ ctx.beginPath(); ctx.arc(x+o[0],y+o[1],o[2],0,6.283); ctx.fill(); });
  // 산호판 (1단계 : 온전, 이후 : 부서진 흔적)
  b.plates.forEach((p,i)=>{
    const px=x+p.ox, py=y+p.oy-(i===2? bob*0:0);
    if(i===2) return;          // 왕관판은 머리 그릴 때
    drawCoral(px,py,p,b.phase>1,K);
  });
  // 머리
  const hy=y-232;
  ctx.fillStyle=stone(hy,80);
  ctx.beginPath(); ctx.ellipse(x,hy,82,74,0,0,6.283); ctx.fill();
  ctx.fillStyle=K.brow; ctx.beginPath(); ctx.ellipse(x,hy-8,70,14,0,0,Math.PI); ctx.fill();   // 이마 그늘
  // 눈 (3단계에서 자주색)
  const eyeCol = b.phase===3? K.eye3 : K.eye;
  [-1,1].forEach(s=>{
    ctx.globalAlpha=.7; ctx.drawImage(glowSprite(eyeCol), x+s*30-22, hy-22, 44, 44); ctx.globalAlpha=1;
    ctx.fillStyle=eyeCol; ctx.beginPath(); ctx.ellipse(x+s*30,hy,13,5,s*-0.25,0,6.283); ctx.fill();
  });
  // 해초 수염
  ctx.strokeStyle=K.beard; ctx.lineWidth=K.bolt?8:5; ctx.lineCap="round";
  for(let i=0;i<7;i++){
    const sx=x-42+i*14, sw=Math.sin(waveT*1.6+i)*8;
    ctx.beginPath(); ctx.moveTo(sx,hy+54); ctx.quadraticCurveTo(sx+sw,hy+90,sx-sw*0.5,hy+128+ (i%2)*10); ctx.stroke();
  }
  // 산호 왕관
  drawCrown(x, y+b.plates[2].oy, b.plates[2], b.phase>1, K);
  // 가슴 심장 (조개 꽃잎 4장)
  drawCore(b, x, y-120);
  ctx.restore();
  // 수면 거품
  if(K.smoke) titanSmoke(x,y,b);
  if(K.bolt) titanBolts(x,y,b);
  ctx.save(); ctx.globalAlpha=.6*b.rise; ctx.strokeStyle=K.foam; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(x,base+2,200,26,0,0,6.283); ctx.stroke(); ctx.restore();
  // 체력은 상단 상태 표시줄(3단계 분할 바)에 표시함 — 거인이 커서 월드에 그리면 뗏목을 가림
}
/* 그림자 : 몸 둘레에서 보랏빛 연기가 피어오름 */
function titanSmoke(x,y,b){
  ctx.save();
  for(let i=0;i<14;i++){
    const ph=(waveT*0.35+i*0.137)%1, a=i*2.4;
    const sx=x+Math.cos(a)*(120+i*6)*(0.6+ph*0.4), sy=y-40-ph*260-(i%3)*20;
    ctx.globalAlpha=(1-ph)*0.35*b.rise; ctx.fillStyle=i%2?"#3a1f66":"#1a0b33";
    ctx.beginPath(); ctx.arc(sx,sy,18+ph*26,0,6.283); ctx.fill();
  }
  // 빼앗은 별빛 : 가슴 주위를 도는 금빛 알갱이
  for(let i=0;i<6;i++){
    const a=waveT*1.4+i*1.047;
    ctx.globalAlpha=0.8*b.rise; ctx.fillStyle="#ffe27a";
    ctx.beginPath(); ctx.arc(x+Math.cos(a)*70,y-120+Math.sin(a)*26,3.5,0,6.283); ctx.fill();
  }
  ctx.restore();
}
/* 해일왕 : 머리 위 먹구름과 가끔 치는 번개 */
function titanBolts(x,y,b){
  ctx.save();
  ctx.globalAlpha=0.38*b.rise; ctx.fillStyle="#2a3a4a";
  [[-70,-330,60],[0,-350,74],[70,-330,58],[-130,-300,44],[130,-300,46]].forEach(o=>{
    ctx.beginPath(); ctx.arc(x+o[0]+Math.sin(waveT*0.7+o[0])*6,y+o[1],o[2],0,6.283); ctx.fill(); });
  const f=(waveT*1.3)%2.2;
  if(f<0.18){
    const bx=x+Math.sin(Math.floor(waveT*1.3/2.2)*7.1)*160;
    ctx.globalAlpha=1-f/0.18; ctx.strokeStyle="#fff6a0"; ctx.lineWidth=4; ctx.lineJoin="round";
    ctx.beginPath(); ctx.moveTo(bx,y-320);
    let yy=y-320, xx=bx; while(yy<y-20){ yy+=34; xx+=(Math.sin(yy*0.37+bx)*22); ctx.lineTo(xx,yy); }
    ctx.stroke();
    ctx.globalAlpha*=0.5; ctx.drawImage(glowSprite("#fff6a0"),xx-60,yy-60,120,120);
  }
  ctx.restore();
}
function drawCoral(px,py,p,broken,K){
  K=K||TSKIN.lord;
  ctx.save();
  if(!broken && p.glow>0){
    const pulse=0.5+Math.sin(waveT*12)*0.5;
    ctx.globalAlpha=.55+pulse*.35; ctx.drawImage(glowSprite("#ff8ac0"),px-50,py-50,100,100); ctx.globalAlpha=1;
    ctx.strokeStyle="#fff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(px,py,34,-Math.PI/2,-Math.PI/2+6.283*clamp(p.glow/2.4,0,1)); ctx.stroke();
  }
  const cols = broken? ["#5a3a4a","#4a2f3c"] : K.coral;
  for(let i=0;i<5;i++){
    const a=-2.6+i*0.55, len= broken? 10 : 26+(i%2)*8;
    ctx.strokeStyle=cols[i%2]; ctx.lineWidth=broken?6:8; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(px,py+10); ctx.quadraticCurveTo(px+Math.cos(a)*len*0.6,py+Math.sin(a)*len*0.3,px+Math.cos(a)*len,py+Math.sin(a)*len); ctx.stroke();
    if(!broken){ ctx.fillStyle=K.cTip; ctx.beginPath(); ctx.arc(px+Math.cos(a)*len,py+Math.sin(a)*len,4,0,6.283); ctx.fill(); }
  }
  // 금 간 자국
  ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=1.5;
  for(let i=0;i<Math.min(3,p.crack);i++){ ctx.beginPath(); ctx.moveTo(px-10+i*8,py-6); ctx.lineTo(px-4+i*8,py+4); ctx.lineTo(px-8+i*8,py+12); ctx.stroke(); }
  ctx.restore();
}
function drawCrown(x,py,p,broken,K){
  K=K||TSKIN.lord;
  ctx.save();
  if(!broken && p.glow>0){
    ctx.globalAlpha=.6; ctx.drawImage(glowSprite("#ffb04a"),x-70,py-50,140,100); ctx.globalAlpha=1;
    ctx.strokeStyle="#fff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,py,40,-Math.PI/2,-Math.PI/2+6.283*clamp(p.glow/2.4,0,1)); ctx.stroke();
  }
  for(let i=0;i<5;i++){
    const sx=x-56+i*28, h= broken? 10 : 30+(i===2?18:0)-(Math.abs(i-2))*4;
    ctx.fillStyle= broken? "#5a3a4a" : (i%2? K.coral[1] : K.coral[0]);
    ctx.beginPath(); ctx.moveTo(sx-10,py+14); ctx.lineTo(sx,py+14-h); ctx.lineTo(sx+10,py+14); ctx.closePath(); ctx.fill();
    if(!broken){ ctx.fillStyle=K.crTip; ctx.beginPath(); ctx.arc(sx,py+14-h,3.5,0,6.283); ctx.fill(); }
  }
  ctx.restore();
}
function drawCore(b,cx,cy){
  const open = b.phase===3 && b.coreOpen>0;
  const k = open? clamp((2.6*bossDiff().time - b.coreOpen)*5,0,1) : 0;     // 열리는 정도
  ctx.save();
  if(b.phase===3){
    ctx.globalAlpha=open? 0.9 : 0.35+Math.sin(waveT*4)*0.1;
    ctx.drawImage(glowSprite(open? "#e0fbff" : "#9a6fff"), cx-60, cy-60, 120, 120); ctx.globalAlpha=1;
  }
  ctx.fillStyle= open? "#f2fdff" : "#5a4a8a";
  ctx.beginPath(); ctx.arc(cx,cy,22,0,6.283); ctx.fill();
  // 조개 꽃잎
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+Math.PI/4, off=k*18;
    ctx.save(); ctx.translate(cx+Math.cos(a)*off, cy+Math.sin(a)*off); ctx.rotate(a+Math.PI/2);
    ctx.fillStyle="#c9b8e8"; ctx.strokeStyle="#7a68a8"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-4); ctx.quadraticCurveTo(22,-26,0,-36+k*6); ctx.quadraticCurveTo(-22,-26,0,-4); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if(open){
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,46,-Math.PI/2,-Math.PI/2+6.283*clamp(b.coreOpen/(2.6*bossDiff().time),0,1)); ctx.stroke();
    ctx.strokeStyle="#9fe8ff"; ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.arc(cx,cy,56,0,6.283); ctx.stroke();
  }
  ctx.restore();
}
function drawAbyssHand(h,b){
  const g=handGeom(h), x=h.x, y=h.y;
  ctx.save();
  ctx.globalAlpha=.6; ctx.strokeStyle="#e4f5ff"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(x,y,44,12,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  ctx.beginPath(); ctx.rect(x-120,y-260,240,260+4); ctx.clip();
  const K=tskin(b);
  // 팔뚝
  ctx.fillStyle=K.arm; rrect(x-26,y-g.top+40,52,g.top,18); ctx.fill();
  // 손바닥 + 손가락
  const px=g.rx, py=g.ry;
  ctx.fillStyle= b.hurt>0? K.hA : K.arm2;
  ctx.beginPath(); ctx.ellipse(px,py,40,46,0,0,6.283); ctx.fill();
  for(let i=0;i<4;i++){ const fx=px-27+i*18; ctx.beginPath(); ctx.ellipse(fx,py-50-(i===1||i===2?8:0),8,20,0,0,6.283); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(px+h.dir*-44,py-6,9,18,h.dir*0.7,0,6.283); ctx.fill();
  ctx.restore();
  // 룬 + 남은 시간
  if(!h.hit){
    const left=1-clamp(h.t/h.win,0,1), pulse=0.5+Math.sin(waveT*12)*0.5;
    ctx.save();
    ctx.globalAlpha=.6+pulse*.35; ctx.drawImage(glowSprite("#6fe8ff"),px-40,py-40,80,80); ctx.globalAlpha=1;
    ctx.strokeStyle="#bff6ff"; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(px,py,14,0,6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px,py-14); ctx.lineTo(px,py+14); ctx.moveTo(px-12,py-6); ctx.lineTo(px+12,py+6); ctx.stroke();
    ctx.strokeStyle="#fff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(px,py,30,-Math.PI/2,-Math.PI/2+6.283*left); ctx.stroke();
    ctx.restore();
  }
}

/* ===== 058-ending.js ===== */
/* =====================================================================
   05-8. 엔딩 연출 — 최종 보스 격파 후 재생 (탭하면 건너뛰기)
   ① 0~5초   : 심연의 군주가 빛으로 흩어짐
   ② 5~16초  : 폭풍이 걷히고 해가 떠오름 — 플레이어가 지은 실제 뗏목과 주민이 등장
   ③ 16초~   : 항해 기록 크레딧 (생존 일수·보스 기록·함께한 주민 별명)
   ④ 마지막  : THE END + [계속 플레이] [새로운 해류로 항해]
   ===================================================================== */
let ENDING = null;
const END_T = { light:5, sunrise:16 };

function startEnding(loot, replay){
  closePanel(); closeModal();
  const lines=endingLines();
  // 크레딧 종료 : 마지막 줄이 화면 위로 다 올라간 뒤 (줄당 0.95초 + 보이는 영역 통과 시간)
  const areaSec = window.innerHeight*0.62/30*0.95;
  ENDING={ t:0, loot:loot||null, replay:!!replay, lines, done:false,
           creditEnd: END_T.sunrise + lines.length*0.95 + areaSec*0.55, parts:[], gulls:[] };
  for(let i=0;i<5;i++) ENDING.gulls.push({ x:Math.random(), y:0.12+Math.random()*0.2, s:0.6+Math.random()*0.6, ph:Math.random()*6 });
  if(!replay){ S.stats.endingSeen=(S.stats.endingSeen||0)+1; save(); }
  let el=$("#ending");
  if(!el){
    el=document.createElement("div"); el.id="ending";
    el.innerHTML=`<canvas id="endCv"></canvas><div class="endskip">화면을 탭하면 건너뜀</div><div class="endcard hidden" id="endCard"></div>`;
    $("#app").appendChild(el);
  }
  el.classList.remove("hidden"); $("#endCard").classList.add("hidden"); $(".endskip").classList.remove("hidden");
  el.onclick=(e)=>{ if(ENDING && !ENDING.done && !e.target.closest(".endcard")){
    ENDING.t=Math.max(ENDING.t, ENDING.creditEnd); ENDING.parts.length=0; } };
  BGM.mode=null;                                  // 엔딩 곡으로 즉시 전환
  ENDING.last=performance.now();
  requestAnimationFrame(endLoop);
}

function endingLines(){
  const s=S.stats, names=S.people.map(p=>p.name);
  const L=[
    ["WILD OCEAN","title"], ["뗏목 표류기","sub"], ["",""],
    ["— 항해 기록 —","head"],
    [`버텨 낸 날  ${S.env.day}일`,""], [`함께한 주민  ${S.people.length}명`,""],
    [`뗏목 바닥  ${S.tiles.size}칸`,""], [`연구한 기술  ${S.tech.length} / ${TECH_KEYS.length}`,""],
    [`다녀온 원정  ${s.expo}회`,""], [`구조한 표류자  ${s.rescued}명`,""], [`막아 낸 습격  ${s.raidWin}회`,""],
    ["",""], ["— 물리친 바다의 재앙 —","head"],
    [`🌀 대해일 × ${s.tempest||0}`,""], [`🐙 거대 문어 × ${s.kraken||0}`,""],
    [`🏴 해적 전함 × ${s.warship||0}`,""], [`🐉 심해 해룡 × ${s.serpent||0}`,""],
    [`🌑 심연의 군주 × ${s.final||0}`,"gold"],
    ["",""], [`보스 난이도  ${DIFF[S.diff].icon} ${DIFF[S.diff].name}`,""], [`항해 횟수  ${S.voyage}회`,""],
    ["",""], ["— 함께한 주민들 —","head"],
  ];
  for(let i=0;i<Math.min(names.length,40);i+=2) L.push([names[i]+(names[i+1]? "   ·   "+names[i+1] : ""),"name"]);
  L.push(["",""],["",""],["거친 바다 위에서도","soft"],["끝까지 뗏목을 지켜 낸","soft"],["당신에게","soft"],["",""],["고마워요","gold"]);
  return L;
}

function endLoop(now){
  if(!ENDING) return;
  const dt=Math.min(0.05,(now-ENDING.last)/1000); ENDING.last=now;
  ENDING.t+=dt;
  drawEnding(dt);
  if(!ENDING.done && ENDING.t>=ENDING.creditEnd) showEndCard();
  requestAnimationFrame(endLoop);
}

/* ---------- 장면 그리기 ---------- */
function drawEnding(dt){
  const c=$("#endCv"), R=Math.min(2,window.devicePixelRatio||1);
  const W=window.innerWidth, H=window.innerHeight;
  if(c.width!==Math.floor(W*R)){ c.width=Math.floor(W*R); c.height=Math.floor(H*R); c.style.width=W+"px"; c.style.height=H+"px"; }
  const g=c.getContext("2d"); g.setTransform(R,0,0,R,0,0);
  const t=ENDING.t, horizon=H*0.52;
  waveT+=dt;
  if(t>END_T.light+3 && ENDING.parts.length) ENDING.parts.length=0;   // 시간을 건너뛴 경우 남은 입자 정리

  // 하늘 : 밤(보라) → 새벽(주황) → 아침(하늘색)
  const k=clamp((t-END_T.light)/9,0,1);
  const top=mixCol("#140a2e","#6fb8ff",k), mid=mixCol("#2a1850","#ffb07a",Math.sin(k*Math.PI)*0.9+k*0.1), bot=mixCol("#3a2a6a","#ffe2b0",k);
  let gr=g.createLinearGradient(0,0,0,horizon);
  gr.addColorStop(0,top); gr.addColorStop(0.7,mid); gr.addColorStop(1,bot);
  g.fillStyle=gr; g.fillRect(0,0,W,horizon);
  // 해
  if(t>END_T.light-1){
    const sy=lerp(horizon+60, H*0.2, clamp((t-END_T.light+1)/11,0,1));
    g.save(); g.globalAlpha=0.9; g.drawImage(glowSprite("#ffd98a"),W/2-160,sy-160,320,320);
    g.fillStyle="#fff2c8"; g.beginPath(); g.arc(W/2,sy,34,0,6.283); g.fill(); g.restore();
  }
  // 바다
  gr=g.createLinearGradient(0,horizon,0,H);
  gr.addColorStop(0,mixCol("#1b2a5a","#4aa3e0",k)); gr.addColorStop(1,mixCol("#0a1430","#1f5f95",k));
  g.fillStyle=gr; g.fillRect(0,horizon,W,H-horizon);
  // 햇빛 반사 물결
  g.save(); g.globalAlpha=0.25+0.4*k; g.fillStyle="#fff4d0";
  for(let i=0;i<22;i++){ const yy=horizon+8+i*i*1.2, w=(60-i*1.8)*(0.6+0.4*Math.sin(waveT*2+i));
    g.fillRect(W/2-w/2+Math.sin(waveT+i)*6, yy, Math.max(4,w), 2); }
  g.restore();
  // 갈매기
  if(t>END_T.light+2){
    g.save(); g.strokeStyle="#2a2a3a"; g.lineWidth=2;
    ENDING.gulls.forEach(b=>{ b.x+= dt*0.03*b.s; if(b.x>1.1) b.x=-0.1;
      const x=b.x*W, y=b.y*H+Math.sin(waveT*1.5+b.ph)*6, f=Math.sin(waveT*8+b.ph)*4;
      g.beginPath(); g.moveTo(x-10*b.s,y-f); g.quadraticCurveTo(x-4*b.s,y-6*b.s,x,y); g.quadraticCurveTo(x+4*b.s,y-6*b.s,x+10*b.s,y-f); g.stroke(); });
    g.restore();
  }
  // ① 군주가 빛으로 흩어짐
  if(t<END_T.light+1.5){
    const a=clamp(1-(t-1)/(END_T.light),0,1);
    g.save(); g.globalAlpha=a;
    g.fillStyle="#1d2748";
    g.beginPath(); g.ellipse(W/2,horizon+10,150*a+40,120*a+20,0,Math.PI,0); g.fill();
    g.beginPath(); g.ellipse(W/2,horizon-110*a,60*a+10,55*a+10,0,0,6.283); g.fill();
    g.fillStyle="#6fe8ff"; [-1,1].forEach(s=>{ g.beginPath(); g.ellipse(W/2+s*22*a,horizon-112*a,9*a,3.5*a,0,0,6.283); g.fill(); });
    g.restore();
    // 빛 입자 : 초당 약 70개, 동시에 최대 160개
    ENDING.pAcc=(ENDING.pAcc||0)+dt*70;
    while(t<END_T.light && ENDING.pAcc>=1 && ENDING.parts.length<160){ ENDING.pAcc--;
      ENDING.parts.push({ x:W/2+rnd(-150,150), y:horizon+rnd(-200,10), vy:-rnd(30,90), vx:rnd(-12,12), life:rnd(1.2,2.4), t:0, s:rnd(1.5,3.5) }); }
    if(ENDING.pAcc>1) ENDING.pAcc=1;
    // 흰 섬광
    const fl=clamp(1-t/1.2,0,1); if(fl>0){ g.fillStyle=`rgba(255,255,255,${fl})`; g.fillRect(0,0,W,H); }
  }
  // 빛 입자
  g.save(); g.globalCompositeOperation="lighter";
  for(let i=ENDING.parts.length-1;i>=0;i--){ const p=ENDING.parts[i]; p.t+=dt; if(p.t>p.life){ ENDING.parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; g.globalAlpha=Math.sin(p.t/p.life*Math.PI)*0.9; g.fillStyle="#bff6ff";
    g.beginPath(); g.arc(p.x,p.y,p.s,0,6.283); g.fill(); }
  g.restore();
  // ② 플레이어의 실제 뗏목 (메인 렌더러를 잠시 이 캔버스로 돌려 그림)
  if(t>END_T.light-0.5) drawEndRaft(g, W, H, clamp((t-END_T.light+0.5)/2,0,1));
  // 문구
  const say=(txt,t0,t1,y,size)=>{ if(t<t0||t>t1) return; const a=Math.min(1,(t-t0)/0.8,(t1-t)/0.8);
    g.save(); g.globalAlpha=a; g.fillStyle="#fff"; g.font=`800 ${size||22}px "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
    g.textAlign="center"; g.shadowColor="rgba(0,0,0,.5)"; g.shadowBlur=10; g.fillText(txt,W/2,y); g.restore(); };
  say("심연의 군주가 긴 잠에 들었다", 1.2, END_T.light+0.5, H*0.3, 21);
  say("폭풍은 걷히고", END_T.light+1, END_T.light+5, H*0.3);
  say("바다는 다시 잔잔해졌다", END_T.light+5.5, END_T.sunrise, H*0.3);
  // ③ 크레딧
  if(t>END_T.sunrise){
    // 크레딧은 보이는 영역(화면 위 60%)의 아래 끝에서 바로 올라오기 시작함
    const ct=t-END_T.sunrise, lh=30, area=H*0.62, y0=area-10-ct*lh/0.95;
    g.save();
    const fadeIn=clamp(ct/1.5,0,1);
    gr=g.createLinearGradient(0,0,0,area); gr.addColorStop(0,`rgba(8,20,40,${.55*fadeIn})`);
    gr.addColorStop(0.7,`rgba(8,20,40,${.3*fadeIn})`); gr.addColorStop(1,"rgba(8,20,40,0)");
    g.fillStyle=gr; g.fillRect(0,0,W,area);
    g.textAlign="center";
    ENDING.lines.forEach(([txt,kind],i)=>{
      const y=y0+i*lh; if(y<-30||y>area) return;
      const fade=clamp(Math.min((y+10)/60,(area-y)/40),0,1);
      g.globalAlpha=fade;
      const size={title:30,sub:15,head:14,gold:19,name:14,soft:17}[kind]||16;
      g.fillStyle={title:"#ffd257",head:"#9fe8ff",gold:"#ffd257",name:"#e8f0ff",soft:"#fff"}[kind]||"#fff";
      g.font=`${kind==="name"?600:800} ${size}px "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
      g.fillText(txt,W/2,y);
    });
    g.restore();
  }
}
function drawEndRaft(g, W, H, a){
  const old=ctx, oldCam={...CAM};
  ctx=g;
  const cen=raftCenter(), rad=raftRadius();
  const z=clamp(Math.min(W*0.42/rad, 0.55),0.18,0.55);
  ctx.save();
  ctx.globalAlpha=a;
  ctx.translate(W/2, H*0.74+Math.sin(waveT*1.2)*3); ctx.scale(z,z); ctx.translate(-cen.x,-cen.y);
  const tiles=[...S.tiles.values()].sort((p,q)=>(p.x+p.y)-(q.x+q.y));
  tiles.forEach(t=>{ const p=iso(t.x,t.y); shadowEllipse(p.x,p.y+14,TW*.52,TH*.5,.2); });
  tiles.forEach(t=>drawFoam(t));
  tiles.forEach(t=>drawTile(t));
  const ents=[];
  tiles.forEach(t=>{ if(t.b){ const p=iso(t.x,t.y); ents.push({ z:p.y, f:()=>drawBuilding(t,p) }); } });
  S.people.forEach(p=>{ if(p.away) return; p.emote=2; p.emoteK= p.id%3? "heart" : "note"; ents.push({ z:p.y, f:()=>drawPerson(p) }); });
  ents.sort((p,q)=>p.z-q.z).forEach(e=>e.f());
  ctx.restore();
  ctx=old; Object.assign(CAM,oldCam);
}
function mixCol(a,b,k){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const ch=(s)=>Math.round(lerp((pa>>s)&255,(pb>>s)&255,k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

      ${abyssUnlocked()? `<button class="btn" style="background:linear-gradient(180deg,#8a5cff,#4a2aa8);border-color:#2a1660;box-shadow:0 3px 0 #2a1660" onclick="endContinue();setTimeout(startAbyss,300)">🌀 무한 심연 도전</button>`:""}

    </div>`;

}
function closeEnding(){
  ENDING=null; BGM.mode=null;

  const el=$("#ending"); if(el) el.classList.add("hidden");
  camCenter(true); lastT=0;
}
function endContinue(){
  const replay=ENDING&&ENDING.replay;
  closeEnding();
  if(!replay) toast("📖 <b>2장 · 별빛 등대</b>가 시작됨 — 상단 보라색 임무를 확인할 것","good");
  if(!replay && S.abyss && !S.abyss.unlockSeen){
    S.abyss.unlockSeen=true; save();
    showModal({ title:"🌀 무한 심연 해금!", sub:"끝나지 않는 도전",
      body:`<p>심연의 군주가 잠든 자리에 <b>끝없는 심연</b>으로 이어지는 소용돌이가 열림.</p>

      btns:[{t:"나중에",cls:"btn grey"},{t:"지금 도전",cls:"btn gold",fn:"startAbyss()"}], queue:true });
  }
}

/* 지옥 모드 : 횟수 임무는 1.5배, 재료 임무는 코인 2배 */
function chapPay(m){ if(!HELL||!m.pay) return m.pay; const p=Object.assign({},m.pay); if(p.coin) p.coin*=HELLX.coin; return p; }
function chapGoal(m,st,C){
  if(m.pay) return payGoal(chapPay(m))(S);
  let [cur,need]=m.goal(S, st.base, C);
  if(HELL && !m.boss) need=Math.ceil(need*HELLX.need);
  return [cur,need];
}
function chapDesc(m){ return m.pay? payText(chapPay(m))+" 모으기" : m.d + (HELL&&!m.boss? " (🔥1.5배)" : ""); }
function chapActive(){
  if(!S) return null;
  return CHAPTERS.find(C=>S[C.key] && S[C.key].stage>=1 && !S[C.key].done) || null;
}
function chapCur(C){ return C.list[S[C.key].stage-1]; }
function chapStart(C, stage){
  const st=S[C.key];
  st.stage=stage;
  const m=C.list[stage-1];
  st.base = m && m.base? m.base(S) : 0;
  if(m && m.boss){
    st.bossDay=S.env.day+1; st.warned=0;
    if(S.bossDay<=st.bossDay+1) S.bossDay=st.bossDay+3;   // 일반 보스와 겹치지 않게
  }
}
function chapBusy(){ return (typeof ABYSS!=="undefined" && ABYSS && ABYSS.active) || !!ENDING; }
function chapTip(){
  const C=chapActive(); if(!C) return;
  const m=chapCur(C);
  toast(`${m.icon} <b>${m.t}</b><br><small>${m.tip}</small>`); sfx("click");
}
const ch2Tip = chapTip;           // 이전 버전 onclick 호환
/* 매 틱 : 장 시작·임무 완료 판정 */
function checkCh2(){
  CHAPTERS.forEach(C=>{ if(!S[C.key]) S[C.key]=newChap(); });
  if(chapBusy()) return;
  if(checkCh2.S!==S){ checkCh2.S=S; fixStarTower(); }      // 불러온 저장본마다 한 번 : 별빛 등대 건물 보정
  let C=chapActive();
  if(!C){
    C=CHAPTERS.find(K=>S[K.key].stage===0 && !S[K.key].done && K.ready(S));
    if(!C) return;
    chapStart(C,1);
    showModal({ title:C.intro.title, sub:"새로운 이야기가 시작됨",
      body:C.intro.body+`<div class="hintbox">상단 퀘스트 칸에 <b>${C.no}장 임무</b>가 보라색으로 표시됨. 칸을 탭하면 힌트가 나옴.</div>`,
      btns:[{t:C.intro.btn,cls:"btn gold"}], kind:"story", queue:true });
    save();
    return;
  }
  const st=S[C.key], m=chapCur(C);
  if(!m || m.boss) return;
  const [cur,need]=chapGoal(m, st, C);
  if(cur<need) return;
  const pay=chapPay(m);
  if(pay) for(const k in pay) S.res[k]=Math.max(0,(S.res[k]||0)-pay[k]);
  const got={}; for(const k in m.rw) got[k]=gain(k,m.rw[k]);
  if(m.onDone) m.onDone();
  const done=st.stage;
  chapStart(C, done+1);
  const nx=C.list[done];
  sfx("quest"); fxRing(0,-20,"#c9a6ff");
  toast(`📖 ${C.no}장 임무 완료: <b>${m.t}</b>`, "good");
  showModal({ title:`${m.icon} ${m.shard? m.shard+" 획득!" : m.t}`,
    sub:`${C.title} · ${done}/${C.list.length}${m.shard? ` · 조각 ${Math.min(C.shards,done)}/${C.shards}`:""}`,
    body: m.story + (nx? `<div class="hintbox">다음 임무: ${nx.icon} <b>${nx.t}</b> — ${chapDesc(nx)}</div>` : ""),
    loot:got, btns:[{t:"다음 이야기로",cls:"btn gold"}], kind:"story", queue:true });
  save();
}
/* updBoss 에서 호출 : 장 보스 출현 날이면 true (일반 보스 억제) */
function updCh2Schedule(){
  const C=chapActive();
  if(!C || chapBusy()) return false;
  const st=S[C.key], m=chapCur(C), B=C.boss;
  if(!m.boss) return false;
  if(st.bossDay==null) st.bossDay=S.env.day+1;
  if(S.env.day < st.bossDay) return false;
  const secLeft=(BOSS_TIME-S.env.time)*240, warnSec=45+(S.cache.warn||0);
  if(S.env.day===st.bossDay && secLeft>0 && secLeft<=warnSec && st.warned!==st.bossDay){
    st.warned=st.bossDay; sfx("bossAlarm");
    showModal({ title:`⚠️ ${B.icon} ${B.name} 접근`, sub:`약 ${Math.ceil(secLeft)}초 후 출현 · ${C.no}장 마지막 전투`,
      body: B.warn + (B.how || TITAN_HOW),
      btns:[{t:"맞서자", cls:"btn red"}], kind:"bossWarn" });
  }
  if((S.env.day>st.bossDay || S.env.time>=BOSS_TIME) && !S.raid && !S.storm) startChapBoss(C);
  return true;
}
/* 장 보스 시작 : 거인형(final) 또는 해룡형(serpent) */
function startChapBoss(C){
  const B=C.boss;
  if(!B.type || B.type==="final"){ startFinal({ chap:C.key }); return; }
  closePanel(); PLACE=null;
  if($("#modal").dataset.kind==="bossWarn") closeModal();
  camCenter(); CAM.ty -= 50; CAM.z=Math.min(CAM.z, B.type==="serpent"? 0.72 : B.type==="warship"? 0.78 : 0.85); CAM.x=CAM.tx; CAM.y=CAM.ty;
  ({ serpent:startSerpent, kraken:startKraken, warship:startWarship })[B.type]();
  const b=S.boss, up=(o,hp,mx)=>{ o[mx]=Math.floor(o[mx]*B.hp); o[hp]=o[mx]; };
  b.chap=C.key; b.skin=B.skin;
  if(B.type==="serpent") up(b,"hp","maxHp");
  if(B.type==="kraken"){ b.arms.forEach(a=>up(a,"hp","maxHp")); up(b.head,"hp","maxHp"); }
  if(B.type==="warship") up(b.ship,"hp","maxHp");
  b.total*=1.2; b.t=b.total;                      // 체력이 많은 만큼 시간도 조금 더 줌
  toast(`${B.icon} <b>${C.no}장 보스: ${B.name}</b> <small>(${bossDiff().name})</small>`,"bad");
  sfx("bossStart"); shake(8);
}
function chapOf(b){ return CHAPTERS.find(C=>C.key===(b.chap || (b.ch2? "ch2":null))) || null; }
function finishCh2Boss(win, b){
  const C=chapOf(b), st=S[C.key], B=C.boss;
  if(win){
    st.bossWin=true; st.done=true; st.stage=C.list.length+1; st.doneDay=S.env.day;
    S.stats[C.key+"Boss"]=(S.stats[C.key+"Boss"]||0)+1;
    const got=bossReward(B.reward,"final");
    S.bossDay=Math.max(S.bossDay, S.env.day+5);
    emit(b.x,b.y-200,"confetti",90,{spread:120}); emit(b.x,b.y-200,"star",40,{spread:80,col:"#fff6c2"});
    sfx("victory");
    C.ending.forEach((e,i)=>showModal({ title:e.title, sub:e.sub, body:e.body, loot:e.loot? got : null,
      btns:[{t: i<C.ending.length-1? "계속" : "항해는 계속된다", cls:"btn gold"}], kind:"story", queue:true }));
    save();
  } else {
    st.lose=(st.lose||0)+1;
    st.bossDay=S.env.day+B.retry; st.warned=0;
    sfx("defeat");
    const ga=((B.name.charCodeAt(B.name.length-1)-0xAC00)%28)? "이" : "가";     // 받침 따라 이/가
    showModal({ title:`${B.icon} ${B.name}${ga} 물러남`, sub: b.phase? `${FINAL_PHASES[b.phase-1]} 단계에서 시간이 다 됨` : "제한 시간 안에 쓰러뜨리지 못함",
      body: B.lose + `<p><b>${B.retry}일 뒤 오후</b> 다시 올 것임.</p>
            <p style="opacity:.8">대포·작살포를 강화하고 경비를 늘리면 자동 피해가 커짐. 난이도를 [기록 → ⚙️ 설정]에서 조정할 수 있음.</p>`,
      btns:[{t:"다시 준비함",cls:"btn red"}] });
  }
}

/* ---------- 4장 보상 : 고래 아라가 가끔 판자 묶음을 몰고 옴 ---------- */
function updWhale(dt){
  if(S.whale){ S.whale.t-=dt; if(S.whale.t<=0) S.whale=null; }
  if(S.boss || chapBusy()) return;
  if(S.whaleT==null) S.whaleT=rnd(60,120);
  S.whaleT-=dt;
  if(S.whaleT>0) return;
  S.whaleT=rnd(150,240);
  const cen=raftCenter(), rad=raftRadius(), a=rnd(0,6.283);
  const x=cen.x+Math.cos(a)*(rad+140), y=cen.y+Math.sin(a)*(rad+140)*0.55;
  S.whale={ x, y, t:5 };
  for(let i=0;i<5;i++){
    spawnFloat("wood"); const f=S.floats[S.floats.length-1];
    f.x=x+rnd(-60,60); f.y=y+rnd(-24,24); f.dr=Math.atan2(cen.y-f.y,cen.x-f.x); f.sp=rnd(10,16);
  }
  emit(x,y-10,"spray",30,{spread:26}); fxText(x,y-60,"🐋 아라가 판자를 몰고 옴!","#bff6ff");
  toast("🐋 <b>아라</b>가 판자 묶음을 몰고 옴","good"); sfx("splash");
}
function drawWhale(){
  const w=S.whale; if(!w) return;
  const k=clamp(Math.min(w.t,5-w.t)/0.8,0,1);        // 떠올랐다가 가라앉음
  ctx.save(); ctx.globalAlpha=k;
  ctx.fillStyle="#6f8fb8"; ctx.beginPath(); ctx.ellipse(w.x,w.y,70,18*k+4,0,Math.PI,0); ctx.fill();
  ctx.fillStyle="#d8e6f4"; ctx.beginPath(); ctx.ellipse(w.x,w.y,60,6,0,0,Math.PI); ctx.fill();
  ctx.fillStyle="#1a2a3a"; ctx.beginPath(); ctx.arc(w.x+38,w.y-8*k,3,0,6.283); ctx.fill();
  ctx.strokeStyle="#6f8fb8"; ctx.lineWidth=8; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(w.x-66,w.y-4); ctx.quadraticCurveTo(w.x-90,w.y-20*k,w.x-100,w.y-30*k); ctx.stroke();
  if(w.t>2.5){ ctx.strokeStyle="rgba(230,248,255,.9)"; ctx.lineWidth=3;
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(w.x+20,w.y-18); ctx.quadraticCurveTo(w.x+20+i*12,w.y-60,w.x+20+i*26,w.y-50); ctx.stroke(); } }
  ctx.restore();
}

/* ---------- 별빛 등대 : 2장에서 불을 켜면 뗏목 위에 실제로 세워짐 ---------- */
function placeStarTower(){
  let has=false; S.tiles.forEach(t=>{ if(t.b==="starlight") has=true; });
  if(has) return;
  // 뗏목 가운데에서 가장 가까운 빈 바닥 → 없으면 가장자리에 바닥 한 칸을 새로 붙임
  let cx=0,cy=0,n=0; S.tiles.forEach(t=>{ cx+=t.x; cy+=t.y; n++; }); cx/=n||1; cy/=n||1;
  let best=null, bd=1e9;
  S.tiles.forEach(t=>{ if(t.b) return; const d=Math.hypot(t.x-cx,t.y-cy); if(d<bd){ bd=d; best=t; } });
  if(!best){
    S.tiles.forEach(t=>{ [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const k=KEY(t.x+dx,t.y+dy); if(S.tiles.has(k)) return;
      const d=Math.hypot(t.x+dx-cx,t.y+dy-cy); if(d<bd){ bd=d; best={x:t.x+dx,y:t.y+dy,nw:true}; } }); });
    const nt=tileNew(best.x,best.y); S.tiles.set(KEY(best.x,best.y), nt); best=nt;
  }
  best.b="starlight"; best.lv=1; best.w=0;
  const p=iso(best.x,best.y);
  fxRing(p.x,p.y,"#ffe27a"); emit(p.x,p.y-60,"star",30,{spread:40,col:"#fff6c2"}); shake(4);
}

/* ---------- 주차 · 해시 ---------- */
function weekInfo(d){
  d = d || (WEEK_OVERRIDE? new Date(WEEK_OVERRIDE) : new Date());
  const t=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const wd=(t.getDay()+6)%7;                                  // 월요일=0
  const mon=new Date(t); mon.setDate(t.getDate()-wd);
  const thu=new Date(mon); thu.setDate(mon.getDate()+3);
  const y=thu.getFullYear();
  const jan4=new Date(y,0,4), w1=new Date(jan4); w1.setDate(jan4.getDate()-((jan4.getDay()+6)%7));
  const week=1+Math.round((mon-w1)/604800000);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return { id:`${y}W${String(week).padStart(2,"0")}`, year:y, week,
           label:`${mon.getMonth()+1}/${mon.getDate()}~${sun.getMonth()+1}/${sun.getDate()}`, daysLeft:6-wd };
}
function strHash(s){ let h=2166136261; for(const ch of String(s)){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function weeklyRule(id){ return WEEKLY_RULES[strHash("rule:"+id)%WEEKLY_RULES.length]; }
function rngShuffle(arr, rng){ return arr.map(v=>[rng(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }
