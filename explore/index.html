<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#bfe3f5" />
<meta name="description" content="에너지를 써서 구름에 덮인 땅을 개척하는 탐험 게임" />
<title>다람 탐험대</title>
<style>
/* ══════════════════════════════════════════════════════════
   다람 탐험대 — 화면 스타일
   외부 라이브러리·CDN을 쓰지 않음(학교 망 차단 대비).
   그림은 모두 img/ 폴더의 Canva 생성 이미지 사용.
   ══════════════════════════════════════════════════════════ */
:root{
  --wood:#b8692e; --wood-d:#7a3f16; --wood-l:#e59a4c;
  --paper:#fff4e0; --paper-d:#f1dcb8;
  --ink:#4a2a12;
  --gold:#ffcb2f; --gold-d:#d98a00;
  --blue:#39b6ff; --blue-d:#1466c4;
  --green:#5fd13a; --green-d:#2f8f1c;
  --red:#ff5a4f;
  --pill:rgba(40,40,52,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  background:#cfe8f7; color:var(--ink); touch-action:none;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.hidden{display:none !important}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#game.dragging{cursor:grabbing}

/* ── 상단 HUD ── */
.hud{position:fixed;left:0;right:0;top:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px);
  display:flex;align-items:flex-start;gap:12px}
.hud > *{pointer-events:auto}
.profile{display:flex;align-items:center;gap:6px}
.avatar{width:64px;height:64px;border-radius:14px;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);
  background:#35b6b0 center/cover;position:relative}
.lvwrap{display:flex;align-items:center}
.star{width:48px;height:48px;position:relative;z-index:2;display:grid;place-items:center;
  font-size:20px;color:#7a4a00;font-weight:900;margin-right:-14px}
.star svg{position:absolute;inset:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.star span{position:relative}
.xpbar{width:110px;height:22px;border-radius:11px;background:var(--pill);overflow:hidden;position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe36a,#f5b400);border-radius:11px;width:0;transition:width .4s}
.xpbar b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff;text-shadow:0 1px 2px #000;font-weight:700}

.energy{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bar{display:flex;align-items:center;height:36px;position:relative}
.bar .ico{width:44px;height:44px;object-fit:contain;position:relative;z-index:2;margin-right:-18px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.bar .track{height:28px;border-radius:14px;background:var(--pill);position:relative;overflow:hidden;min-width:150px}
.bar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:14px;transition:width .35s}
.bar .track b{position:relative;display:grid;place-items:center;height:100%;padding:0 34px 0 26px;
  font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);font-weight:800}
.bar .plus{width:30px;height:30px;border-radius:50%;margin-left:-26px;position:relative;z-index:2;
  background:radial-gradient(circle at 35% 30%,#ffe98a,#ffbf1f 60%,#e08b00);color:#7a3f00;font-size:22px;font-weight:900;
  box-shadow:0 2px 0 rgba(0,0,0,.3);display:grid;place-items:center;line-height:1}
#energyTrack{width:230px}
#energyTrack i{background:linear-gradient(#7fd6ff,#1c98f0)}
.timer{white-space:nowrap;margin-top:3px;font-size:12px;color:#fff;background:var(--pill);padding:2px 10px;border-radius:10px}
.money{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.money .track{min-width:130px}
.money .track i{display:none}

/* ── 지역 진행 카드 ── */
.quest{position:fixed;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 86px);
  background:rgba(255,244,224,.94);border:3px solid var(--wood-l);border-radius:14px;padding:8px 12px;
  box-shadow:0 3px 0 rgba(0,0,0,.2);font-size:14px;min-width:160px}
.quest h4{margin:0 0 4px;font-size:15px;color:var(--wood-d)}
.quest .row{display:flex;align-items:center;gap:6px;margin-top:3px}
.quest img{width:24px;height:24px;object-fit:contain}
.quest .pbar{height:8px;border-radius:4px;background:#e6cfa6;overflow:hidden;flex:1}
.quest .pbar i{display:block;height:100%;background:linear-gradient(90deg,#8fd14f,#3fae2a)}

/* ── 하단 버튼 ── */
.dock{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px}
.dock.left{left:calc(env(safe-area-inset-left) + 12px)}
.dock.right{right:calc(env(safe-area-inset-right) + 12px)}
.btn-round{width:78px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.btn-round img{width:70px;height:62px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28));transition:transform .15s}
.btn-round:active img{transform:scale(.9)}
.btn-round span{font-size:13px;color:#fff;background:rgba(74,42,18,.85);padding:1px 9px;border-radius:9px;margin-top:-4px;position:relative}
.btn-round .badge{position:absolute;top:0;right:4px;background:var(--red);color:#fff;border-radius:11px;min-width:22px;height:22px;
  font-size:13px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
.gear{position:fixed;right:calc(env(safe-area-inset-right) + 12px);top:calc(env(safe-area-inset-top) + 100px);
  width:46px;height:46px;border-radius:14px;background:var(--pill);display:grid;place-items:center}
.gear svg{width:28px;height:28px;fill:#fff}
.bagpulse{animation:bagpulse .35s}
@keyframes bagpulse{50%{transform:scale(1.18)}}

/* ── 알림 토스트 ── */
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,0);background:rgba(40,28,18,.88);color:#fff;
  padding:10px 18px;border-radius:14px;font-size:16px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  white-space:nowrap;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,-6px)}

/* ── 팝업(창) ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,40,.55);display:grid;place-items:center;z-index:40;padding:16px}
.panel{width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;position:relative;
  animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.tabs{display:flex;gap:6px;padding:0 26px;position:relative;z-index:1}
.tab{flex:1;max-width:130px;height:52px;border-radius:16px 16px 0 0;background:linear-gradient(#e7b270,#c98845);
  display:grid;place-items:center;font-size:15px;color:#5a2c08;border:3px solid var(--wood-d);border-bottom:0;margin-bottom:-3px}
.tab img{width:30px;height:30px;object-fit:contain}
.tab.on{background:linear-gradient(#ffcf8a,#f0a653);height:58px;margin-top:-6px}
.frame{background:linear-gradient(#e8a45c,#c8792f);border:3px solid var(--wood-d);border-radius:22px;padding:12px;
  box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;min-height:0}
.frame h3{margin:0 0 10px;text-align:center;color:#fff;font-size:22px;text-shadow:0 2px 0 var(--wood-d)}
.sheet{background:var(--paper);border-radius:14px;padding:16px;overflow:auto;min-height:0;box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.close{position:absolute;right:-6px;top:-10px;width:48px;height:48px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 30%,#ff9b7a,#e5452d 65%,#a8200e);color:#fff;font-size:26px;font-weight:900;
  border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.cell{display:flex;flex-direction:column;align-items:center;font-size:20px;color:#7a4a28;position:relative}
.cell img{width:78px;height:72px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.cell small{font-size:12px;color:#a07650}
.cell button{margin-top:4px}
.empty{text-align:center;color:#a07650;padding:30px 0;font-size:16px}
.gbtn{background:linear-gradient(#8ee25a,#3fae2a);color:#fff;border-radius:12px;padding:7px 14px;font-size:15px;
  text-shadow:0 1px 0 rgba(0,0,0,.35);box-shadow:0 3px 0 #237a14;border:2px solid #2b8a1a}
.gbtn.blue{background:linear-gradient(#7fd6ff,#1c98f0);box-shadow:0 3px 0 #0d5aa8;border-color:#0f64b6}
.gbtn.gold{background:linear-gradient(#ffe36a,#f5b400);color:#6b3b00;text-shadow:none;box-shadow:0 3px 0 #b77700;border-color:#c98800}
.gbtn.red{background:linear-gradient(#ff9b7a,#e5452d);box-shadow:0 3px 0 #9c1f0c;border-color:#a8200e}
.gbtn:disabled{filter:grayscale(1) opacity(.6);cursor:default}
.gbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}

/* 주문판·요리 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--paper-d);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h5{margin:0;font-size:16px;color:var(--wood-d);display:flex;align-items:center;gap:6px}
.card h5 img{width:40px;height:40px;object-fit:contain}
.need{display:flex;flex-wrap:wrap;gap:6px}
.need span{display:flex;align-items:center;gap:2px;background:#f6ead4;border-radius:10px;padding:2px 8px 2px 2px;font-size:14px}
.need span.lack{color:#d33;background:#fde3de}
.need img{width:26px;height:26px;object-fit:contain}
.reward{display:flex;gap:10px;align-items:center;font-size:14px;color:#7a4a28}
.reward img{width:22px;height:22px;object-fit:contain;vertical-align:middle}

/* 생산·건물 창 */
.prodhead{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:86px;height:96px;border-radius:14px;background:#fff;border:2px solid var(--paper-d);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:12px;color:#7a4a28;position:relative}
.slot img{width:52px;height:52px;object-fit:contain}
.slot.ready{border-color:#3fae2a;background:#effbe6;animation:readyglow 1.2s ease-in-out infinite alternate}
@keyframes readyglow{to{box-shadow:0 0 0 4px rgba(95,209,58,.35)}}
.empty-slot{color:#c9b08a;border-style:dashed}
.sbar{display:block;width:70px;height:7px;border-radius:4px;background:#eadbc2;overflow:hidden}
.sbar b{display:block;height:100%;background:linear-gradient(90deg,#8fd14f,#3fae2a)}
.prodbtns{display:flex;flex-direction:column;gap:8px}
.bldtop{display:flex;gap:16px;align-items:center}
.bldimg{width:130px;height:120px;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.stars{font-size:26px;letter-spacing:2px;color:#e2d2b4}
.stars .on{color:#ffc21a;text-shadow:0 2px 0 #c98800}
.fxnow,.fxnext{margin:6px 0;font-size:15px}
.subh{margin:14px 0 6px;color:var(--wood-d);font-size:17px}
.chnav{position:absolute;top:1.5%;display:flex;gap:8px;z-index:2}
.chnav.l{left:2%}.chnav.r{right:2%}
.chbtn{width:46px;height:46px;border-radius:50%;background:linear-gradient(#f5d9a6,#dcae6a);border:2px solid #9a6a33;
  font-size:22px;color:#5a3510;display:grid;place-items:center}
.chbtn:disabled{opacity:.35}
.scroll.ch2{background:
    radial-gradient(ellipse at 50% 60%,rgba(80,170,210,.28),transparent 65%),
    repeating-radial-gradient(circle at 40% 50%,rgba(150,110,60,.06) 0 3px,transparent 3px 14px),
    linear-gradient(#f6e6c4,#ecd3a3)}
/* 월드맵 */
.chlock{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(90,53,16,.88);color:#fff;
  padding:8px 16px;border-radius:12px;font-size:clamp(12px,1.6vw,16px);white-space:nowrap}
.worldmap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,24,40,.6);padding:10px}
.scroll{position:relative;width:min(1100px,100%);aspect-ratio:16/8.4;max-height:calc(100vh - 20px);border-radius:10px;
  background:
    radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(ellipse at 70% 70%,rgba(160,110,40,.18),transparent 55%),
    repeating-radial-gradient(circle at 60% 50%,rgba(150,110,60,.06) 0 3px,transparent 3px 14px),
    linear-gradient(#f6e6c4,#ecd3a3);
  border-left:26px solid #d9b77f;border-right:26px solid #d9b77f;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 60px rgba(120,80,30,.35);
  animation:pop .25s}
.scroll:before,.scroll:after{content:"";position:absolute;top:-10px;bottom:-10px;width:34px;border-radius:17px;
  background:linear-gradient(90deg,#b98b4a,#f1d7a4 45%,#a7773a)}
.scroll:before{left:-44px}.scroll:after{right:-44px}
.scroll h2{position:absolute;top:2%;left:0;right:0;text-align:center;margin:0;color:#8a6135;font-size:clamp(16px,2.4vw,26px)}
.scroll svg.paths{position:absolute;inset:0;width:100%;height:100%}
.loc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:15.5%}
.loc .medal{width:100%;aspect-ratio:1;border-radius:50%;background:center/cover;position:relative;
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.3));transition:transform .15s}
.loc:hover .medal{transform:scale(1.05)}
.loc.locked .medal{filter:grayscale(.85) brightness(.85) drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.loc .lock{position:absolute;right:4%;bottom:6%;width:34%;aspect-ratio:1;border-radius:50%;background:#fff3;display:grid;place-items:center}
.loc .lock svg{width:80%;height:80%}
.loc b{margin-top:-6%;background:linear-gradient(#f5d9a6,#dcae6a);border:2px solid #9a6a33;border-radius:10px;padding:2px 10px;
  font-size:clamp(11px,1.5vw,16px);color:#5a3510;white-space:nowrap;position:relative}
.loc small{font-size:clamp(10px,1.2vw,13px);color:#7a5228;margin-top:2px;white-space:nowrap}
.loc .flag{position:absolute;right:6%;top:-8%;width:30%}
.loc.here .medal{outline:4px solid #ffd54a;outline-offset:2px}
.deco{position:absolute;opacity:.55;pointer-events:none}

/* 레벨업 등 큰 알림 */
.celebrate{text-align:center}
.celebrate .big{font-size:64px;line-height:1;margin:6px 0;color:#f5a400;text-shadow:0 3px 0 #b36b00}
.celebrate p{font-size:17px;margin:8px 0}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--paper-d);font-size:16px}
.setrow input[type=number]{width:80px;font-size:16px;padding:4px 6px;border-radius:8px;border:2px solid var(--paper-d);font-family:inherit}
.hint{font-size:13px;color:#a07650}

/* 로딩 */
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(#bfe3f5,#e9f4fb)}
#loading div{text-align:center;color:#3b6b8f;font-size:18px}
#loading img{width:120px;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
#loading .lbar{width:220px;height:14px;border-radius:7px;background:#fff;margin:14px auto 0;overflow:hidden}
#loading .lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd6ff,#1c98f0)}

@media (max-width:700px){
  .avatar{width:48px;height:48px}.star{width:40px;height:40px;font-size:16px}.xpbar{width:70px}
  #energyTrack{width:130px}.money .track{min-width:92px}.bar .track b{font-size:14px;padding:0 30px 0 22px}
  .bar .ico{width:36px;height:36px}.btn-round{width:62px;height:70px}.btn-round img{width:56px;height:50px}
  .quest{top:calc(env(safe-area-inset-top) + 74px);font-size:12px;min-width:130px}
  .gear{top:calc(env(safe-area-inset-top) + 158px)}
  .energy{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 104px);flex:none}
  #energyTrack{width:190px}
  .quest{top:calc(env(safe-area-inset-top) + 158px)}
  .money .track{min-width:84px}
  .frame h3{font-size:18px}
  .scroll{border-left-width:12px;border-right-width:12px;aspect-ratio:auto;height:min(92vh,calc((100vw - 20px)*1.3))}
  .loc{width:30%}
}
</style>
</head>
<body>
<div id="loading"><div><img src="img/avatar.webp" alt=""><p>탐험 준비 중…</p><div class="lbar"><i id="lbar"></i></div></div></div>

<canvas id="game"></canvas>

<!-- 상단 HUD -->
<div class="hud">
  <div class="profile">
    <div class="avatar" style="background-image:url(img/avatar.webp)"></div>
    <div class="lvwrap">
      <div class="star"><svg viewBox="0 0 48 48"><path d="M24 3l6.2 13 14.3 1.8-10.5 9.8 2.7 14.1L24 34.8 11.3 41.7 14 27.6 3.5 17.8 17.8 16z" fill="#ffd23a" stroke="#e59500" stroke-width="2.5" stroke-linejoin="round"/></svg><span id="lv">1</span></div>
      <div class="xpbar"><i id="xpFill"></i><b id="xpText">0/50</b></div>
    </div>
  </div>
  <div class="energy">
    <div class="bar">
      <img class="ico" src="img/i_energy.webp" alt="에너지">
      <div class="track" id="energyTrack"><i id="enFill"></i><b id="enText">100</b></div>
      <button class="plus" id="enPlus" aria-label="에너지 충전">+</button>
    </div>
    <div class="timer" id="enTimer">가득 참</div>
  </div>
  <div class="money">
    <div class="bar"><img class="ico" src="img/i_coin.webp" alt="코인"><div class="track"><b id="coinText">0</b></div><button class="plus" data-shop>+</button></div>
    <div class="bar"><img class="ico" src="img/i_gem.webp" alt="보석"><div class="track"><b id="gemText">0</b></div><button class="plus" data-shop>+</button></div>
  </div>
</div>

<div class="quest" id="quest"></div>
<button class="gear" id="gearBtn" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 000-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 00-1.7-1L14.9 3h-4l-.4 2.9a7.6 7.6 0 00-1.7 1l-2.5-1-2 3.5L6.4 11a7.7 7.7 0 000 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.9h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12.9 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg></button>

<div class="dock left">
  <button class="btn-round" id="bagBtn"><img src="img/chest.webp" alt=""><span>창고</span></button>
  <button class="btn-round" id="orderBtn"><img src="img/board.webp" alt=""><span>주문판</span><em class="badge hidden" id="orderBadge"></em></button>
  <button class="btn-round" id="cookBtn"><img src="img/kitchen.webp" alt=""><span>요리</span></button>
</div>
<div class="dock right">
  <button class="btn-round" id="homeBtn"><img src="img/tent.webp" alt=""><span>캠프</span></button>
  <button class="btn-round" id="mapBtn"><img src="img/m_canyon.webp" alt="" style="border-radius:50%"><span>지도</span></button>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════
   다람 탐험대 — 게임 로직
   · 에너지를 써서 장애물(나무·바위 등)을 치우면 자원을 얻고 구름이 걷힘

let S;

    inv:{}, seen:{wood:1,twig:1,berry:1,stone:1,flower:1}, regions:{}, orders:[], nextOrderId:1,
    where:'home', napTs:0, sound:true, cfg:{}, bld:{}, prod:{}, mapCh:1};
}
function migrate(){   // 예전 저장본에 새 항목 채우기
  S.bld = S.bld || {}; S.prod = S.prod || {}; S.mapCh = S.mapCh || 1;
  for (const [k,b] of Object.entries(BUILDINGS)) if (S.bld[k] == null) S.bld[k] = b.start;
  for (const k of Object.keys(PROD)) S.prod[k] = S.prod[k] || [];

  try { S = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e){ S = null; }
  if (!S || S.v !== 1) S = freshState();
  Object.assign(CONFIG, S.cfg || {});
  migrate();
}
let saveTimer = 0;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (world && world.region) world.region.queue = queue.map(q => q.i);
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){}
  }, 150);
}
const maxEnergy = () => CONFIG.energyBase + (S.level-1)*CONFIG.energyPerLevel + 10*((S.bld.cabin||1)-1);
const regenMs = () => Math.max(0.1, CONFIG.regenMinutes) * 60000;
const xpNeed = l => 40*l + 10*l*l;

function tickEnergy(){
  const now = Date.now(), mx = maxEnergy();
  if (S.energy >= mx){ S.energyTs = now; return; }
  const n = Math.floor((now - S.energyTs) / regenMs());
  if (n > 0){ S.energy = Math.min(mx, S.energy + n); S.energyTs += n*regenMs(); if (S.energy >= mx) S.energyTs = now; save(); }
}
function addEnergy(n){ S.energy = Math.max(0, S.energy + n); if (n > 0 && S.energy >= maxEnergy()) S.energyTs = Date.now(); updateHUD(); save(); }
function addItem(k, n){ S.inv[k] = (S.inv[k]||0) + n; if (n > 0) S.seen[k] = 1; save(); }
const has = (need) => Object.entries(need).every(([k,n]) => (S.inv[k]||0) >= n);

function gainXP(n){
  S.xp += n;
  let ups = 0;
  while (S.xp >= xpNeed(S.level)){ S.xp -= xpNeed(S.level); S.level++; ups++; }
  if (ups){
    S.gems += CONFIG.levelUpGems*ups;
    S.energy = Math.max(S.energy, maxEnergy());
    sfx('level');
    const unlocked = Object.values(REGIONS).filter(r => r.lv > S.level-ups && r.lv <= S.level).map(r => r.name);
    setTimeout(() => showModal('레벨 업!', `<div class="celebrate"><div class="big">★ ${S.level}</div>
      <p>에너지가 가득 찼어요! 최대 에너지 <b>${maxEnergy()}</b></p>
      <p><img src="${src('i_gem')}" style="width:26px;vertical-align:middle"> 보석 +${CONFIG.levelUpGems*ups}</p>
      ${unlocked.length ? `<p>새 지역이 열렸어요: <b>${unlocked.join(', ')}</b></p>` : ''}
      <div class="row-btns"><button class="gbtn" data-close>좋아요!</button></div></div>`), 350);
  }
  updateHUD(); save();
}

/* ══════════ 난수 (지역 지도를 씨앗값으로 똑같이 재생성) ══════════ */
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pickW(mix, r){ const tot = Object.values(mix).reduce((a,b)=>a+b,0); let x = r()*tot;
  for (const [k,w] of Object.entries(mix)){ x -= w; if (x < 0) return k; } return Object.keys(mix)[0]; }

/* ══════════ 지도(월드) 만들기 ══════════ */
const TW = 128, TH = 64;
let world = null;   // {key, N, tiles:[{o, rev}], start:{x,y}, tex, region}

function buildRegion(key){
  const R = REGIONS[key];
  let st = S.regions[key];
  if (!st){ st = S.regions[key] = {seed:(Math.random()*1e9)|0, cleared:[], runes:0, clears:0, queue:[]}; }
  const N = CONFIG.mapSize, r = rng(st.seed);
  const tiles = [];
  const start = {x:Math.floor(N/2), y:N-3};
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const d = Math.hypot(x-start.x, y-start.y);
    let o = null;
    if (d > 1.6 && r() < 0.84) o = pickW(R.mix, r);
    tiles.push({o, rev:false, seed:r()});
  }
  // 멀리 떨어진 곳에 룬 석판·보물 상자 숨기기
  const far = [];
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ const d = Math.hypot(x-start.x, y-start.y); if (d > N*0.45) far.push(y*N+x); }
  const mid = [];
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ const d = Math.hypot(x-start.x, y-start.y); if (d > 5 && d <= N*0.6) mid.push(y*N+x); }
  const take = (arr) => arr.splice(Math.floor(r()*arr.length), 1)[0];
  for (let i=0;i<CONFIG.runesPerRegion;i++) tiles[take(far)].o = 'rune';
  for (let i=0;i<CONFIG.chestsPerRegion;i++){ const t = tiles[take(mid)]; if (t.o !== 'rune') t.o = 'chest'; }
  tiles[start.y*N+start.x-2] && (tiles[(start.y)*N+start.x-2].o = 'tent_camp');
  const w = {key, N, tiles, start, tex:R.tex, tint:R.tint, region:st, home:false};
  for (const i of st.cleared) tiles[i].o = null;
  revealAround(w, start.x, start.y, 3.2);
  for (const i of st.cleared) revealAround(w, i % N, (i / N)|0, 2.3);
  return w;
}
OBJS.tent_camp = {img:'tent', w:1.3, fixed:true};

const HOME_POS = {cabin:[4,3], kitchen:[9,3], board:[2,7], tent:[5,9], sawmill:[9,7], forge:[8,10]};
function buildHome(){
  const N = 13, tiles = [];
  for (let i=0;i<N*N;i++) tiles.push({o:null, rev:true, seed:Math.random()});
  const put = (x,y,o) => tiles[y*N+x].o = o;
  for (const [k,[x,y]] of Object.entries(HOME_POS)) put(x,y,k);
  put(4,6,'husky');
  const r = rng(77);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const edge = x<2 || y<2 || x>N-3 || y>N-3;
    if (edge && !tiles[y*N+x].o && r() < .62) put(x,y, ['deco_spruce','deco_oak','deco_redwood','deco_spruce'][Math.floor(r()*4)]);
    else if (!edge && !tiles[y*N+x].o && r() < .08) put(x,y, r()<.6 ? 'deco_flowers':'deco_bush');
  }
  for (let y=5;y<=7;y++) for (let x=5;x<=7;x++) if (tiles[y*N+x].o && tiles[y*N+x].o.startsWith('deco')) tiles[y*N+x].o = null;
  return {key:'home', N, tiles, start:{x:6, y:6}, tex:'t_grass', tint:'rgba(120,190,60,.12)', region:null, home:true};
}

function revealAround(w, cx, cy, rad){
  const N = w.N, out = [];
  const R = Math.ceil(rad);
  for (let y=cy-R;y<=cy+R;y++) for (let x=cx-R;x<=cx+R;x++){
    if (x<0||y<0||x>=N||y>=N) continue;
    if (Math.hypot(x-cx,y-cy) > rad) continue;
    const t = w.tiles[y*N+x]; if (!t.rev){ t.rev = true; out.push([x,y]); }
  }
  return out;
}

/* ══════════ 화면 좌표 ══════════ */
const iso = (x, y) => ({x:(x-y)*TW/2, y:(x+y)*TH/2});
function unIso(sx, sy){ const a = sx/(TW/2), b = sy/(TH/2); return {x:(a+b)/2, y:(b-a)/2}; }

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = {x:0, y:0, z:1};
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cam.zMin = Math.min(1, Math.max(0.35, W/(TW*9)));
}
addEventListener('resize', resize);

/* ── 바닥·구름 캐시(무거운 그림은 미리 그려 둠) ── */
const CS = 0.6;          // 캐시 해상도 배율
let groundC = null, fogC = null, cacheBox = null;
function worldBox(w){
  const N = w.N, pad = 3;
  const minX = iso(-pad, N-1+pad).x - TW, maxX = iso(N-1+pad, -pad).x + TW;
  const minY = iso(-pad, -pad).y - TH*3, maxY = iso(N-1+pad, N-1+pad).y + TH*3;
  return {x:minX, y:minY, w:maxX-minX, h:maxY-minY};
}
function diamond(c, sx, sy, grow=0){
  c.beginPath();
  c.moveTo(sx, sy - TH/2 - grow); c.lineTo(sx + TW/2 + grow*2, sy);
  c.lineTo(sx, sy + TH/2 + grow); c.lineTo(sx - TW/2 - grow*2, sy); c.closePath();
}
function renderGround(){
  const w = world, b = cacheBox = worldBox(w);
  groundC = document.createElement('canvas');
  groundC.width = Math.ceil(b.w*CS); groundC.height = Math.ceil(b.h*CS);
  const c = groundC.getContext('2d');
  c.setTransform(CS,0,0,CS,-b.x*CS,-b.y*CS);
  const N = w.N;
  // 섬 옆면(흙 절벽)
  const cliff = 70;
  for (let i=0;i<N;i++){
    for (const [x,y,side] of [[N-1,i,'r'],[i,N-1,'l']]){
      const p = iso(x,y);
      c.beginPath();
      if (side === 'r'){ c.moveTo(p.x+TW/2, p.y); c.lineTo(p.x, p.y+TH/2); c.lineTo(p.x, p.y+TH/2+cliff); c.lineTo(p.x+TW/2, p.y+cliff); }
      else { c.moveTo(p.x-TW/2, p.y); c.lineTo(p.x, p.y+TH/2); c.lineTo(p.x, p.y+TH/2+cliff); c.lineTo(p.x-TW/2, p.y+cliff); }
      c.closePath();
      const g = c.createLinearGradient(0, p.y, 0, p.y+TH/2+cliff);
      g.addColorStop(0, side==='r' ? '#8a5a32' : '#a7703f'); g.addColorStop(1, side==='r' ? '#4e3018':'#6a4222');
      c.fillStyle = g; c.fill();
      c.strokeStyle = 'rgba(40,20,5,.25)'; c.lineWidth = 2; c.stroke();
      // 돌멩이 무늬
      c.fillStyle = 'rgba(255,230,190,.12)';
      for (let k=0;k<3;k++){ const t = (i*7+k*13)%10/10; c.beginPath();
        c.ellipse(p.x + (side==='r'?1:-1)*TW/4*(0.4+t), p.y+TH/2*(0.6)+20+k*15, 8, 4, 0, 0, 7); c.fill(); }
    }
  }
  // 윗면 풀밭 텍스처
  const tex = IMG[w.tex], pat = c.createPattern(tex, 'repeat');
  c.save();
  c.beginPath();
  const a = iso(0,0), bb = iso(N-1,0), cc = iso(N-1,N-1), d = iso(0,N-1);
  c.moveTo(a.x, a.y-TH/2); c.lineTo(bb.x+TW/2, bb.y); c.lineTo(cc.x, cc.y+TH/2); c.lineTo(d.x-TW/2, d.y); c.closePath();
  c.clip();
  c.fillStyle = pat; c.fillRect(b.x, b.y, b.w, b.h);
  c.fillStyle = w.tint; c.fillRect(b.x, b.y, b.w, b.h);
  // 타일마다 밝기 살짝 다르게 + 흙길 얼룩
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const t = w.tiles[y*N+x], p = iso(x,y);
    const v = (t.seed - .5);
    diamond(c, p.x, p.y, 1);
    c.fillStyle = v > 0 ? `rgba(255,240,180,${v*0.16})` : `rgba(40,60,10,${-v*0.16})`; c.fill();
    if (t.seed > .86 && !w.home){ c.fillStyle = 'rgba(120,80,30,.16)'; c.beginPath(); c.ellipse(p.x, p.y, TW*.3, TH*.26, 0, 0, 7); c.fill(); }
  }
  // 가장자리 안쪽 그림자
  const sh = c.createLinearGradient(0, a.y-TH/2, 0, cc.y+TH/2);
  sh.addColorStop(0,'rgba(255,255,255,.08)'); sh.addColorStop(1,'rgba(0,0,0,.10)');
  c.fillStyle = sh; c.fillRect(b.x,b.y,b.w,b.h);
  c.restore();
  if (w.home){ // 캠프 돌길: 가운데에서 건물마다 이어지는 징검돌
    const rr = rng(5);
    for (const [bx,by] of Object.values(HOME_POS)){
      const len = Math.hypot(bx-6, by-6), n = Math.floor(len/0.55);
      for (let k=1;k<n-1;k++){ const t = k/n, p = iso(6+(bx-6)*t, 6+(by-6)*t);
        c.beginPath(); c.ellipse(p.x+(rr()-.5)*26, p.y+(rr()-.5)*12, 12+rr()*6, 6+rr()*3, 0, 0, 7);
        c.fillStyle = `rgba(${170+rr()*30|0},${165+rr()*25|0},${150+rr()*20|0},.95)`; c.fill();
        c.strokeStyle='rgba(80,70,50,.35)'; c.lineWidth=1.5; c.stroke(); }
    }
  }
}
function renderFog(){
  const w = world, b = cacheBox;
  fogC = document.createElement('canvas');
  fogC.width = Math.ceil(b.w*CS); fogC.height = Math.ceil(b.h*CS);
  const c = fogC.getContext('2d');
  c.setTransform(CS,0,0,CS,-b.x*CS,-b.y*CS);
  const N = w.N, cloud = IMG.cloud, pad = 3;
  const list = [];
  for (let y=-pad;y<N+pad;y++) for (let x=-pad;x<N+pad;x++){
    const inside = x>=0&&y>=0&&x<N&&y<N;
    if (inside && w.tiles[y*N+x].rev) continue;
    list.push([x,y]);
  }
  list.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));
  // 1) 바탕 안개(빈틈 없게)
  c.fillStyle = '#eef1fb';
  for (const [x,y] of list){ const p = iso(x,y); diamond(c, p.x, p.y-6, 10); c.fill(); }
  // 2) 뭉게구름
  for (const [x,y] of list){
    const p = iso(x,y), h = ((x*73856093) ^ (y*19349663)) >>> 0, j = (h%1000)/1000, k = ((h>>10)%1000)/1000;
    const cw = TW*(1.35 + j*.5), ch = cw * cloud.height / cloud.width;
    c.drawImage(cloud, p.x - cw/2 + (k-.5)*30, p.y - ch*.72 + (j-.5)*14, cw, ch);
  }
}

/* ══════════ 오브젝트 스프라이트 크기 ══════════ */
function spriteRect(o, x, y, extra=0){
  const d = OBJS[o], im = IMG[d.img], p = iso(x,y);
  const w = TW*d.w, h = w * im.height / im.width;
  return {x:p.x - w/2, y:p.y + TH*0.28 - h + extra, w, h};
}

/* ══════════ 플레이어 ══════════ */
const player = {x:0, y:0, path:[], face:1, work:0, workT:0, target:null};
let queue = [];       // [{i, cost}]
let reach = new Set();
function walkable(w, x, y){ if (x<0||y<0||x>=w.N||y>=w.N) return false; const t = w.tiles[y*w.N+x]; return t.rev && !t.o; }
function computeReach(){
  const w = world, N = w.N, seen = new Set();
  const sx = Math.round(player.x), sy = Math.round(player.y);
  const q = [[sx,sy]]; seen.add(sy*N+sx);
  while (q.length){ const [x,y] = q.shift();
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy, k=ny*N+nx;
      if (!seen.has(k) && walkable(w,nx,ny)){ seen.add(k); q.push([nx,ny]); } } }
  reach = seen;
}
function findPath(w, fx, fy, goalSet){
  const N = w.N, prev = new Map(), start = fy*N+fx; prev.set(start, -1);
  const q = [start];
  while (q.length){ const k = q.shift();
    if (goalSet.has(k)){ const path = []; let c = k; while (c !== -1){ path.push([c%N, (c/N)|0]); c = prev.get(c); } return path.reverse().slice(1); }
    const x = k%N, y = (k/N)|0;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy, nk=ny*N+nx;
      if (!prev.has(nk) && walkable(w,nx,ny)){ prev.set(nk,k); q.push(nk); } } }
  return null;
}
function standSpots(i){
  const w = world, N = w.N, x = i%N, y = (i/N)|0, set = new Set();
  for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if (reach.has(ny*N+nx)) set.add(ny*N+nx); }
  return set;
}

/* ══════════ 효과(파티클·떠오르는 글자) ══════════ */
const fx = [];
function burst(x, y, color, n=14){
  const p = iso(x,y);
  for (let i=0;i<n;i++) fx.push({t:'p', x:p.x, y:p.y-30, vx:(Math.random()-.5)*260, vy:-120-Math.random()*220, life:.8+Math.random()*.4, age:0, c:color, s:3+Math.random()*5});
}
function floatText(x, y, text, color='#fff'){ const p = iso(x,y); fx.push({t:'txt', x:p.x, y:p.y-90, text, color, age:0, life:1.3}); }
function flyToBag(x, y, img, n){
  const p = iso(x,y);
  for (let i=0;i<Math.min(n,4);i++) fx.push({t:'fly', wx:p.x+(Math.random()-.5)*40, wy:p.y-50, img, age:-i*.08, life:1.0, jx:(Math.random()-.5)*80});
}
function fogPuffs(cells){
  for (const [x,y] of cells){ const p = iso(x,y); fx.push({t:'puff', x:p.x, y:p.y-30, age:0, life:.9, s:1+Math.random()*.4}); }
}

/* ══════════ 효과음(WebAudio, 파일 없음) ══════════ */
let AC = null;
function sfx(kind){
  if (!S.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  const set = {chop:['triangle',180,90,.12,.18], pop:['sine',520,880,.1,.12], coin:['square',880,1320,.08,.12],
               level:['sine',523,1046,.5,.2], no:['sawtooth',160,110,.18,.08], step:['sine',300,260,.05,.03]}[kind] || ['sine',440,440,.1,.1];
  o.type = set[0]; o.frequency.setValueAtTime(set[1], t); o.frequency.exponentialRampToValueAtTime(set[2], t+set[3]);
  g.gain.setValueAtTime(set[4], t); g.gain.exponentialRampToValueAtTime(0.001, t+set[3]+.05);
  o.start(t); o.stop(t+set[3]+.08);
}

/* ══════════ 장면 전환 ══════════ */
function enter(key){
  queue = []; fx.length = 0;
  world = key === 'home' ? buildHome() : buildRegion(key);
  S.where = key;
  player.x = world.start.x; player.y = world.start.y; player.path = []; player.work = 0; player.target = null;
  renderGround(); renderFog(); computeReach();
  const p = iso(player.x, player.y); cam.x = p.x; cam.y = p.y - (world.home ? 20 : 60); cam.z = Math.max(cam.zMin || .35, Math.min(1, world.home ? (W < 700 ? W/900 : Math.min(H/1000, W/1500)) : (W < 700 ? W/680 : W/1100)));
  // 저장된 작업 줄 복구(에너지는 이미 사용됨)
  if (world.region && world.region.queue){ for (const i of world.region.queue){ const t = world.tiles[i]; if (t && t.o) queue.push({i, cost:OBJS[t.o].cost}); } }
  document.getElementById('homeBtn').classList.toggle('hidden', world.home);
  document.getElementById('mapBtn').querySelector('img').src = src(world.home ? 'm_canyon' : REGIONS[key].img);
  updateQuest(); updateHUD(); save();
}

/* ══════════ 탭 처리 ══════════ */
function pickObject(wx, wy){
  const w = world, N = w.N, hits = [];
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const t = w.tiles[y*N+x]; if (!t.o || !t.rev) continue;
    const r = spriteRect(t.o, x, y);
    const mx = r.w*.14, my = r.h*.08;
    if (wx > r.x+mx && wx < r.x+r.w-mx && wy > r.y+my && wy < r.y+r.h) hits.push({i:y*N+x, d:x+y});
  }
  if (!hits.length){ const g = unIso(wx, wy); const x = Math.round(g.x), y = Math.round(g.y);
    if (x>=0&&y>=0&&x<N&&y<N) return {i:y*N+x, tile:true}; return null; }
  hits.sort((a,b)=>b.d-a.d); return hits[0];
}
function onTap(sx, sy){
  const wx = (sx - W/2)/cam.z + cam.x, wy = (sy - H/2)/cam.z + cam.y;
  const hit = pickObject(wx, wy); if (!hit) return;
  const w = world, t = w.tiles[hit.i], x = hit.i % w.N, y = (hit.i / w.N)|0;
  if (!t.rev){ toast('구름 너머는 아직 알 수 없어요'); return; }
  if (!t.o){ // 빈 땅: 걸어가기
    if (reach.has(hit.i) && !player.work && !queue.length){ const p = findPath(w, Math.round(player.x), Math.round(player.y), new Set([hit.i])); if (p) player.path = p; }
    return;
  }
  const d = OBJS[t.o];
  if (d.fixed){
    if (d.act){ const spots = standSpots(hit.i); const p = spots.size ? findPath(w, Math.round(player.x), Math.round(player.y), spots) : null;
      if (p && p.length){ player.path = p; player.after = d.act; player.face = x > player.x ? 1 : -1; } else doAct(d.act); }
    return;
  }
  if (queue.some(q => q.i === hit.i)){ toast('이미 작업 순서에 있어요'); return; }
  if (!standSpots(hit.i).size){ sfx('no'); toast('가까운 곳부터 차례로 치워야 해요'); return; }
  if (S.energy < d.cost){ sfx('no'); openShop(true); return; }
  addEnergy(-d.cost); gainXP(d.cost * CONFIG.xpPerEnergy);
  queue.push({i:hit.i, cost:d.cost}); sfx('pop'); save();
}
function doAct(a){
  if (a === 'cabin' || a === 'tent') openBuilding(a);
  else if (PROD[a]) prodTap(a);
  else if (a === 'order') openOrders();
  else if (a === 'pet'){ const t = world.tiles.findIndex(t=>t.o==='husky'); burst(t%world.N, (t/world.N)|0, '#ff7aa8', 10); floatText(t%world.N,(t/world.N)|0,'♥','#ff5a8a'); sfx('pop'); }
}

/* ══════════ 작업 진행 ══════════ */
function updatePlayer(dt){
  const w = world;
  if (player.path.length){
    const [tx,ty] = player.path[0], dx = tx-player.x, dy = ty-player.y, dist = Math.hypot(dx,dy), sp = 4.2*dt;
    if (Math.abs(dx - dy) > 0.01) player.face = (dx - dy) > 0 ? 1 : -1;
    if (dist <= sp){ player.x = tx; player.y = ty; player.path.shift();
      if (!player.path.length && player.after){ const a = player.after; player.after = null; doAct(a); } }
    else { player.x += dx/dist*sp; player.y += dy/dist*sp; }
    return;
  }
  if (player.work){
    player.workT += dt;
    if (Math.floor(player.workT*5) !== Math.floor((player.workT-dt)*5)){ const x = player.target%w.N, y=(player.target/w.N)|0; burst(x, y, OBJS[w.tiles[player.target].o].fx, 4); sfx('chop'); }
    if (player.workT >= player.work){ finishWork(); }
    return;
  }
  if (queue.length){
    const q = queue[0], spots = standSpots(q.i);
    if (!spots.size){ queue.shift(); addEnergy(q.cost); return; }   // 막히면 에너지 돌려줌
    const here = Math.round(player.y)*w.N + Math.round(player.x);
    if (spots.has(here)){
      const d = OBJS[w.tiles[q.i].o];
      player.target = q.i; player.workT = 0; player.work = .45 + d.cost*.09;
      player.face = (q.i % w.N) - (((q.i / w.N)|0)) > player.x - player.y ? 1 : -1;
    } else {
      const p = findPath(w, Math.round(player.x), Math.round(player.y), spots);
      if (p) player.path = p; else { queue.shift(); addEnergy(q.cost); }
    }
  }
}
function finishWork(){
  const w = world, i = player.target, t = w.tiles[i], d = OBJS[t.o], x = i % w.N, y = (i / w.N)|0;
  queue.shift(); player.work = 0; player.target = null;
  burst(x, y, d.fx, 18); sfx('pop');
  let lines = [];
  for (const [k,n] of Object.entries(d.drops)){ addItem(k, n); flyToBag(x, y, k==='flower'?'flowers':ITEMS[k].img, n); lines.push(`+${n} ${ITEMS[k].name}`); }
  if (d.chest){
    const r = Math.random(), coins = 40 + (Math.random()*80|0);
    S.coins += coins; lines.push(`+${coins} 코인`); flyToBag(x,y,'i_coin',3);
    if (r < .45){ S.gems += 2; lines.push('+2 보석'); }
    if (r > .5){ addEnergy(10); lines.push('+10 에너지'); }
    sfx('coin');
  }
  floatText(x, y, lines.join('  '), d.rune ? '#ffd54a' : '#fff');
  t.o = null;
  w.region.cleared.push(i);
  const cells = revealAround(w, x, y, 2.3);
  if (cells.length){ renderFog(); fogPuffs(cells); }
  computeReach();
  if (d.rune){
    w.region.runes++;
    if (w.region.runes >= CONFIG.runesPerRegion) setTimeout(regionComplete, 700);
    else toast(`룬 석판 발견! (${w.region.runes}/${CONFIG.runesPerRegion})`);
  }
  updateQuest(); updateHUD(); save();
}
function regionComplete(){
  const R = REGIONS[world.key];
  world.region.clears++;
  S.gems += CONFIG.regionClearGems; S.coins += CONFIG.regionClearCoins;
  updateHUD(); save(); sfx('level');
  showModal('탐험 완료!', `<div class="celebrate"><img src="${src(R.img)}" style="width:150px">
    <p><b>${R.name}</b>의 룬 석판 ${CONFIG.runesPerRegion}개를 모두 찾았어요!</p>
    <p><img src="${src('i_gem')}" style="width:26px;vertical-align:middle"> +${CONFIG.regionClearGems}

const napLeft = () => S.napTs + napHoursOf(S.bld.tent)*3600e3 - Date.now();

const prodMs = (k, r) => r.min * 60000 * Math.max(0.05, CONFIG.prodSpeed) * (1 - 0.1*((S.bld[k]||1)-1));
const jobsDone = k => (S.prod[k]||[]).filter(j => j.end <= Date.now());
function startJob(k, id){
  const r = PROD[k].find(r => r.id === id), jobs = S.prod[k];
  if (!r || !has(r.need) || jobs.length >= slotsOf(S.bld[k])) return false;
  for (const [i,n] of Object.entries(r.need)) S.inv[i] -= n;
  const lastEnd = jobs.length ? Math.max(...jobs.map(j=>j.end)) : 0;
  const start = Math.max(Date.now(), lastEnd);          // 한 줄로 차례차례 만들어짐
  jobs.push({id, end:start + prodMs(k, r)});
  sfx('pop'); save(); return true;
}
function collect(k){
  const done = jobsDone(k); if (!done.length) return 0;
  S.prod[k] = S.prod[k].filter(j => !done.includes(j));
  let xp = 0;
  for (const j of done){ addItem(j.id, 1); xp += PROD[k].find(r=>r.id===j.id).xp; }
  if (world.home){ const [x,y] = HOME_POS[k]; for (const j of done) flyToBag(x, y, ITEMS[j.id].img, 1);
    floatText(x, y, done.map(j=>'+1 '+ITEMS[j.id].name).join('  '), '#fff'); }
  sfx('coin'); gainXP(xp); updateHUD(); save();
  return done.length;
}
function prodTap(k){
  if (!S.bld[k]) { openBuilding(k); return; }
  if (collect(k)) return;
  openProd(k);
}

  const items = [];

      ctx.beginPath(); ctx.ellipse(p.x, p.y, TW*.42, TH*.4, 0, 0, 7); ctx.fill(); ctx.restore(); }
    if (d.fixed && it.o === 'husky'){ r = {...r, y:r.y + Math.sin(T*2)*1.5}; }
    const hov = hoverI === it.i && !d.fixed, ghost = d.bld && !S.bld[d.bld];

    ctx.drawImage(im, r.x + ox + r.w*(1-sc)/2, r.y + r.h*(1-sc), r.w*sc, r.h*sc);
    if (hov || ghost) ctx.restore();
    if (d.label && world.home){

function drawPlayer(T){

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawFx(dt){
  const bag = document.getElementById('bagBtn').getBoundingClientRect();

    const f = fx[k]; f.age += dt;
    if (f.age > f.life){ if (f.t === 'fly') bagPulse(); fx.splice(k,1); continue; }
    if (f.age < 0) continue;
    const a = f.age / f.life;
    if (f.t === 'p'){ f.vy += 600*dt; f.x += f.vx*dt; f.y += f.vy*dt;
      ctx.globalAlpha = 1-a; ctx.fillStyle = f.c; ctx.fillRect(f.x, f.y, f.s, f.s); ctx.globalAlpha = 1; }

const ptrs = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1) drag = {sx:e.clientX, sy:e.clientY, cx:cam.x, cy:cam.y, moved:false};
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), z:cam.z}; drag = null; }
});
cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && ptrs.size === 2){ const [a,b] = [...ptrs.values()]; setZoom(pinch.z * Math.hypot(a.x-b.x,a.y-b.y)/pinch.d); return; }
  if (drag){ const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if (Math.hypot(dx,dy) > 8){ drag.moved = true; cv.classList.add('dragging'); }
    if (drag.moved){ cam.x = drag.cx - dx/cam.z; cam.y = drag.cy - dy/cam.z; clampCam(); } }
  else if (e.pointerType === 'mouse' && world){
    const wx = (e.clientX - W/2)/cam.z + cam.x, wy = (e.clientY - H/2)/cam.z + cam.y;
    const h = pickObject(wx, wy); hoverI = h && !h.tile ? h.i : -1;
  }
});
function endPtr(e){
  const wasDrag = drag; ptrs.delete(e.pointerId); cv.classList.remove('dragging');
  if (ptrs.size < 2) pinch = null;
  if (wasDrag && !wasDrag.moved && e.type === 'pointerup' && ptrs.size === 0) onTap(e.clientX, e.clientY);
  if (ptrs.size === 0) drag = null;
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(cam.z * (e.deltaY < 0 ? 1.1 : 1/1.1)); }, {passive:false});
function setZoom(z){ cam.z = Math.max(cam.zMin || .35, Math.min(1.6, z)); clampCam(); }
function clampCam(){ if (!cacheBox) return; const b = cacheBox;
  cam.x = Math.max(b.x + TW*2, Math.min(b.x + b.w - TW*2, cam.x)); cam.y = Math.max(b.y + TH*3, Math.min(b.y + b.h - TH*3, cam.y)); }

const PROD_NAME = {kitchen:'캠프 부엌', sawmill:'제재소', forge:'대장간'};

  const lv = S.bld[k], jobs = S.prod[k].slice().sort((a,b)=>a.end-b.end), cap = slotsOf(lv), now = Date.now();
  const slots = [];

    const r = PROD[k].find(r=>r.id===j.id), total = prodMs(k, r), left = j.end - now;
    const running = left > 0 && (i === 0 || jobs[i-1].end <= now);
    slots.push(`<div class="slot ${left<=0?'ready':''}"><img src="${src(ITEMS[j.id].img)}"><small>${left<=0 ? '완성!' : running ? fmtTime(left) : '대기 중'}</small>
      ${running ? `<i class="sbar"><b style="width:${Math.max(0,100-left/total*100)}%"></b></i>` : ''}</div>`); }
  const body = `<div class="prodhead"><div class="slots">${slots.join('')}</div>
      <div class="prodbtns"><button class="gbtn gold" id="collectAll" ${jobsDone(k).length?'':'disabled'}>완성품 받기</button>
      <button class="gbtn blue" id="upBtn">★ Lv${lv} 업그레이드</button></div></div>
    <div class="cards">${PROD[k].map(r => { const it = ITEMS[r.id];
      return `<div class="card"><h5><img src="${src(it.img)}">${it.name} <small class="hint">(가진 것 ${S.inv[r.id]||0})</small></h5>
        ${needHtml(r.need)}<div class="reward">${it.eat ? `먹으면 <img src="${src('i_energy')}"> +${it.eat}` : `건물 업그레이드 재료`} · ⏱ ${fmtTime(prodMs(k, r))}</div>
        <button class="gbtn" data-make="${r.id}" ${has(r.need) && jobs.length < cap ? '' : 'disabled'}>${jobs.length >= cap ? '칸이 가득 찼어요' : '만들기'}</button></div>`; }).join('')}</div>
    <p class="hint" style="margin-top:12px">한 번에 하나씩 차례로 만들어져요. 다 되면 캠프 건물 위에 표시가 떠요. 음식은 창고 → 음식 칸에서 먹어요.</p>`;
  showModal(PROD_NAME[k] + ` <small style="font-size:15px">Lv${lv}</small>`, body, {tabs:tabHtml});
  root.querySelectorAll('[data-ptab]').forEach(b => b.onclick = () => openProd(b.dataset.ptab));
  root.querySelectorAll('[data-make]').forEach(b => b.onclick = () => { if (startJob(k, b.dataset.make)) openProd(k); });
  document.getElementById('collectAll').onclick = () => { collect(k); openProd(k); };
  document.getElementById('upBtn').onclick = () => openBuilding(k);
  clearInterval(prodTimer);
  prodTimer = setInterval(() => { if (!document.querySelector('.slots')){ clearInterval(prodTimer); return; }
    const sh = document.getElementById('sheet'), y = sh ? sh.scrollTop : 0; modalRefresh = true; openProd(k); modalRefresh = false;
    const sh2 = document.getElementById('sheet'); if (sh2) sh2.scrollTop = y; }, 1000);
}

/* 건물 정보·건설·업그레이드 */
function costHtml(c){ return `<div class="need">${Object.entries(c).map(([k,n]) => {
  const have = k === 'coins' ? S.coins : (S.inv[k]||0), img = k === 'coins' ? 'i_coin' : ITEMS[k].img;
  return `<span class="${have < n ? 'lack':''}"><img src="${src(img)}">${have}/${n}</span>`; }).join('')}</div>`; }
const canPay = c => Object.entries(c).every(([k,n]) => (k === 'coins' ? S.coins : (S.inv[k]||0)) >= n);
function pay(c){ for (const [k,n] of Object.entries(c)){ if (k === 'coins') S.coins -= n; else S.inv[k] -= n; } }
function openBuilding(k){
  const B = BUILDINGS[k], O = OBJS[k], lv = S.bld[k] || 0, max = CONFIG.buildingMaxLevel;
  let body = `<div class="bldtop"><img src="${src(O.img)}" class="bldimg"><div>
    <div class="stars">${Array.from({length:max}, (_,i) => `<span class="${i < lv ? 'on':''}">★</span>`).join('')}</div>
    <p class="fxnow">${lv ? '지금: <b>' + B.fx(lv) + '</b>' : '아직 짓지 않은 건물이에요.'}</p></div></div>`;
  if (!lv){
    const ok = S.level >= B.unlock;
    body += `<h4 class="subh">건설하기</h4>${ok ? '' : `<p class="hint">탐험가 레벨 ${B.unlock}이 되면 지을 수 있어요.</p>`}${costHtml(B.build)}
      <div class="row-btns"><button class="gbtn" id="doBuild" ${ok && canPay(B.build) ? '' : 'disabled'}>짓기</button></div>`;
  } else if (lv < max){
    const c = B.cost(lv), need = upgradeNeedLevel(lv), ok = S.level >= need;
    body += `<h4 class="subh">Lv${lv+1} 업그레이드</h4><p class="fxnext">다음: <b>${B.fx(lv+1)}</b></p>
      ${ok ? '' : `<p class="hint">탐험가 레벨 ${need}이 되면 업그레이드할 수 있어요.</p>`}${costHtml(c)}
      <div class="row-btns"><button class="gbtn blue" id="doUp" ${ok && canPay(c) ? '' : 'disabled'}>업그레이드</button></div>
      <p class="hint">판자는 제재소, 철 주괴는 대장간에서 만들어요.</p>`;
  } else body += `<p class="fxnext"><b>최고 레벨이에요!</b></p>`;
  if (k === 'cabin') body += `<div class="row-btns"><button class="gbtn gold" id="goBag">창고 열기</button></div>`;
  if (k === 'tent'){ const left = napLeft();
    body += `<div class="row-btns"><button class="gbtn gold" id="doNap" ${left > 0 ? 'disabled':''}>${left > 0 ? '낮잠까지 ' + fmtTime(left) : '낮잠 자기 +' + napEnergy(lv) + '⚡'}</button></div>`; }
  if (PROD[k] && lv) body += `<div class="row-btns"><button class="gbtn gold" id="goProd">${PROD_NAME[k]} 열기</button></div>`;
  if (k === 'board') body += `<div class="row-btns"><button class="gbtn gold" id="goOrd">주문판 열기</button></div>`;
  showModal(O.name, body);
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on('doBuild', () => { if (!canPay(B.build)) return; pay(B.build); S.bld[k] = 1; sfx('level'); gainXP(20);
    toast(`${O.name} 완성!`); if (world.home) { const [x,y] = HOME_POS[k]; burst(x, y, '#ffd23a', 24); } save(); openBuilding(k); });
  on('doUp', () => { const c = B.cost(lv); if (!canPay(c)) return; pay(c); S.bld[k] = lv+1; sfx('level'); gainXP(15*lv);
    if (k === 'cabin') S.energy = Math.min(maxEnergy(), S.energy + 10);
    toast(`${O.name} Lv${lv+1}!`); if (world.home){ const [x,y] = HOME_POS[k]; burst(x, y, '#ffd23a', 24); } updateHUD(); save(); openBuilding(k); });
  on('goBag', openBag); on('goProd', () => openProd(k)); on('goOrd', openOrders);
  on('doNap', () => { if (nap()) openBuilding('tent'); });
}

/* 주문판 */
function makeOrder(){
  const pool = Object.keys(ITEMS).filter(k => ITEMS[k].value && S.seen[k]);
  const r = Math.random, need = {}, kinds = 1 + (r() < .55 ? 1 : 0) + (S.level >= 4 && r() < .3 ? 1 : 0);
  for (let i=0;i<kinds;i++){ const k = pool[Math.floor(r()*pool.length)]; need[k] = (need[k]||0) + Math.max(2, Math.round((3 + S.level*1.5) * (8/ITEMS[k].value) * (.7 + r()*.6))); }
  let val = 0; for (const [k,n] of Object.entries(need)) val += n*ITEMS[k].value;
  return {id:S.nextOrderId++, need, coins:Math.round(val*1.4*(1 + .15*((S.bld.board||1)-1))/5)*5, xp:Math.round(val/3), who:['썰매견 눈송이','대장장이 곰돌','요리사 토끼','지도 제작자 부엉'][Math.floor(r()*4)]};
}
function openOrders(){
  const bl = S.bld.board || 1;
  while (S.orders.length < 3 + Math.floor((bl-1)/2)) S.orders.push(makeOrder());
  save();
  const body = `<div class="cards">${S.orders.map(o => `<div class="card"><h5><img src="${src('board')}">${o.who}의 부탁</h5>
      ${needHtml(o.need)}<div class="reward"><span><img src="${src('i_coin')}"> ${o.coins}</span><span>★ ${o.xp} 경험치</span></div>
      <div style="display:flex;gap:6px"><button class="gbtn" style="flex:1" data-ord="${o.id}" ${has(o.need)?'':'disabled'}>보내기</button>
      <button class="gbtn red" data-skip="${o.id}" title="다른 부탁으로 바꾸기">↻</button></div></div>`).join('')}</div>
    <p class="hint" style="margin-top:12px">탐험에서 모은 자원으로 부탁을 들어주면 코인과 경험치를 받아요. ↻ 버튼은 부탁을 바꿔요.</p>
    <div class="row-btns"><button class="gbtn blue" id="upBoard">★ 주문판 Lv${bl} 업그레이드</button></div>`;
  showModal('주문판', body);
  document.getElementById('upBoard').onclick = () => openBuilding('board');
  root.querySelectorAll('[data-ord]').forEach(b => b.onclick = () => { const o = S.orders.find(o=>o.id==b.dataset.ord); if (!o || !has(o.need)) return;
    for (const [k,n] of Object.entries(o.need)) S.inv[k] -= n;
    S.coins += o.coins; S.orders = S.orders.filter(x=>x!==o); sfx('coin'); toast(`부탁 완료! +${o.coins} 코인`); gainXP(o.xp); openOrders(); });
  root.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { S.orders = S.orders.filter(x=>x.id!=b.dataset.skip); openOrders(); });
}

/* 에너지 상점 */
function openShop(lack){
  const offers = [
    {id:'g5',  price:['gems',5],   energy:30},
    {id:'g12', price:['gems',12],  energy:'full'},
    {id:'c300',price:['coins',300],energy:20},
  ];
  const food = Object.entries(ITEMS).filter(([k,d]) => d.eat && S.inv[k] > 0);
  const body = `${lack ? `<p style="text-align:center;margin:0 0 12px;color:#c33">에너지가 부족해요!</p>` : ''}
    <div class="cards">${offers.map(o => `<div class="card" style="align-items:center;text-align:center">
      <img src="${src('i_energy')}" style="height:56px"><b style="font-size:20px">${o.energy==='full'?'가득 채우기':'+'+o.energy}</b>
      <button class="gbtn ${o.price[0]==='gems'?'':'gold'}" data-buy="${o.id}" ${S[o.price[0]]>=o.price[1]?'':'disabled'}>
        <img src="${src(o.price[0]==='gems'?'i_gem':'i_coin')}" style="width:20px;vertical-align:middle"> ${o.price[1]}</button></div>`).join('')}</div>
    ${food.length ? `<h4 style="margin:14px 0 6px;color:#7a3f16">창고의 음식 먹기</h4><div class="grid">${food.map(([k,d]) =>
      `<div class="cell"><img src="${src(d.img)}"><b>${S.inv[k]}</b><button class="gbtn blue" data-eat="${k}">+${d.eat}⚡</button></div>`).join('')}</div>` : ''}
    <p class="hint" style="margin-top:12px">에너지는 ${CONFIG.regenMinutes}분마다 1씩 저절로 차요. 캠프 텐트에서 낮잠을 자도 돼요.</p>`;
  showModal('에너지 충전', body);
  root.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { const o = offers.find(o=>o.id===b.dataset.buy);
    if (S[o.price[0]] < o.price[1]) return; S[o.price[0]] -= o.price[1];
    addEnergy(o.energy === 'full' ? Math.max(0, maxEnergy()-S.energy) : o.energy); sfx('coin'); openShop(false); });
  root.querySelectorAll('[data-eat]').forEach(b => b.onclick = () => { const k = b.dataset.eat; if (!S.inv[k]) return;
    S.inv[k]--; addEnergy(ITEMS[k].eat); sfx('pop'); openShop(false); });
}

/* 월드맵 */
const MAP_CH = {
  1:{title:'1장. 구름 너머의 땅', order:['home','canyon','nest','windmill','snow'],
     pos:{home:[13,70], canyon:[33,36], nest:[53,66], windmill:[66,30], snow:[86,58]},
     mob:{home:[28,86], canyon:[70,68], nest:[30,50], windmill:[70,32], snow:[32,18]},
     deco:[['spruce',84,52,6],['spruce',89,58,5],['oak',6,14,7],['icerock',86,12,6],['boulder',62,78,7],['cloud',40,4,12]]},
  2:{title:'2장. 바다 건너 섬들', order:['home','beach','swamp','desert','volcano'],
     pos:{home:[11,74], beach:[30,40], swamp:[50,70], desert:[68,32], volcano:[88,62]},
     mob:{home:[28,87], beach:[70,70], swamp:[30,52], desert:[70,34], volcano:[32,17]},
     deco:[['palm',4,20,6],['shells',40,84,6],['cactus',80,10,5],['mushrooms',58,44,6],['obsidian',92,30,6],['cloud',44,6,11]]},
};
function openMap(ch){
  ch = ch || S.mapCh || 1; S.mapCh = ch;
  const M = MAP_CH[ch], pos = innerWidth <= 700 ? M.mob : M.pos;
  const ch2Open = S.level >= CONFIG.chapter2Level;
  const locs = [['home','m_home','탐험 캠프',1], ...Object.entries(REGIONS).filter(([k,r]) => r.ch === ch).map(([k,r]) => [k, r.img, r.name, r.lv])];
  const pathD = 'M' + M.order.map(k => `${pos[k][0]} ${pos[k][1]}`).join(' L');
  root.innerHTML = `<div class="worldmap"><div class="scroll ${ch===2?'ch2':''}">
    <button class="close" data-close style="right:-30px;top:-14px">×</button>
    <h2>${M.title}</h2>
    <div class="chnav l"><button class="chbtn" data-ch="1" ${ch===1?'disabled':''} aria-label="1장">◀</button></div>
    <div class="chnav r"><button class="chbtn" data-ch="2" ${ch===2?'disabled':''} aria-label="2장">▶</button></div>
    <svg class="paths" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${pathD}" stroke="#9c7443" stroke-width="3" vector-effect="non-scaling-stroke" stroke-dasharray="10 8" fill="none" opacity=".7"/></svg>
    ${M.deco.map(([im,x,y,w]) => `<img class="deco" src="${src(im)}" style="left:${x}%;top:${y}%;width:${w}%">`).join('')}
    ${locs.map(([k,img,name,lv]) => { const st = S.regions[k], locked = S.level < lv, here = S.where === k;
      const sub = k==='home' ? '요리 · 제작 · 주문' : locked ? `레벨 ${lv}에 열려요` : st ? `룬 ${Math.min(st.runes,CONFIG.runesPerRegion)}/${CONFIG.runesPerRegion}${st.clears?` · 완료 ${st.clears}회`:''}` : '새로운 탐험!';
      return `<button class="loc ${locked?'locked':''} ${here?'here':''}" data-go="${k}" style="left:${pos[k][0]}%;top:${pos[k][1]}%">
        <div class="medal" style="background-image:url(${src(img)})">${locked?`<div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="3" fill="#3a3a3a"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#3a3a3a" stroke-width="2.6" fill="none"/><circle cx="12" cy="16" r="2" fill="#ffd23a"/></svg></div>`:''}</div>
        <b>${name}</b><small>${sub}</small>
        ${here?`<svg class="flag" viewBox="0 0 30 40"><line x1="4" y1="4" x2="4" y2="38" stroke="#7a4a20" stroke-width="3"/><path d="M5 5 L28 10 L5 18z" fill="#e0402a"/><circle cx="4" cy="4" r="3" fill="#ffb000"/></svg>`:''}</button>`; }).join('')}
    ${ch===2 && !ch2Open ? `<div class="chlock"><b>레벨 ${CONFIG.chapter2Level}부터 배를 타고 건너갈 수 있어요</b></div>` : ''}
  </div></div>`;
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  root.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => openMap(+b.dataset.ch));
  root.querySelector('.worldmap').addEventListener('pointerdown', e => { if (e.target.classList.contains('worldmap')) closeModal(); });
  root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const k = b.dataset.go;
    if (k !== 'home' && S.level < REGIONS[k].lv){ toast(`레벨 ${REGIONS[k].lv}이 되면 갈 수 있어요`); return; }
    closeModal(); if (S.where !== k) enter(k); });
}

/* 설정 */
function openSettings(){
  const body = `
    <div class="setrow"><span>효과음</span><button class="gbtn ${S.sound?'':'red'}" id="sndBtn">${S.sound?'켜짐':'꺼짐'}</button></div>
    <div class="setrow"><span>에너지 1 충전 시간(분)<br><span class="hint">수업 시간에 맞게 조절하세요</span></span><input type="number" id="cfgRegen" min="0.1" step="0.5" value="${CONFIG.regenMinutes}"></div>
    <div class="setrow"><span>1레벨 최대 에너지</span><input type="number" id="cfgBase" min="10" step="10" value="${CONFIG.energyBase}"></div>
    <div class="setrow"><span>낮잠 에너지 / 대기 시간(시간)</span><span><input type="number" id="cfgNap" min="0" value="${CONFIG.napEnergy}"> <input type="number" id="cfgNapH" min="0" step="0.5" value="${CONFIG.napHours}"></span></div>
    <div class="setrow"><span>요리·제작 시간 배율<br><span class="hint">0.5 = 두 배 빠름 · 1 = 기본</span></span><input type="number" id="cfgProd" min="0.05" step="0.1" value="${CONFIG.prodSpeed}"></div>
    <div class="row-btns"><button class="gbtn" id="saveCfg">설정 저장</button><button class="gbtn red" id="resetAll">처음부터 다시</button></div>
    <p class="hint" style="margin-top:14px">진행 상황은 이 기기 브라우저에만 저장돼요. 이름·사진 같은 개인정보는 저장하지 않아요.<br>그림: Canva AI 이미지 생성으로 제작.</p>`;
  showModal('설정', body);
  document.getElementById('sndBtn').onclick = () => { S.sound = !S.sound; save(); openSettings(); };
  document.getElementById('saveCfg').onclick = () => {
    const num = (id, min) => Math.max(min, parseFloat(document.getElementById(id).value) || min);
    S.cfg = {regenMinutes:num('cfgRegen',.1), energyBase:num('cfgBase',10), napEnergy:num('cfgNap',0), napHours:num('cfgNapH',0), prodSpeed:num('cfgProd',.05)};
    Object.assign(CONFIG, S.cfg); save(); updateTimer(); toast('설정을 저장했어요'); closeModal(); };
  const rb = document.getElementById('resetAll');   // confirm() 대신 두 번 누르기로 확인
  rb.onclick = () => { if (!rb.dataset.sure){ rb.dataset.sure = 1; rb.textContent = '정말 지워요? 한 번 더 누르기'; return; }
    try { localStorage.removeItem(SAVE_KEY); } catch(e){} S = freshState(); closeModal(); enter('home'); };
}

document.getElementById('orderBtn').onclick = openOrders;

addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  load(); resize();
  await loadImages();
  tickEnergy();
  enter(S.where && (S.where === 'home' || REGIONS[S.where]) ? S.where : 'home');
  document.getElementById('loading').remove();

      <div class="row-btns"><button class="gbtn blue" id="goFirst">첫 탐험 떠나기</button><button class="gbtn" data-close>캠프 둘러보기</button></div></div>`);

  }
})();
