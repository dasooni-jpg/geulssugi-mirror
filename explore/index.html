<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#bfe3f5" />
<meta name="description" content="에너지를 써서 구름에 덮인 땅을 개척하는 탐험 게임" />
<title>다람 탐험대</title>
<style>
/* ══════════════════════════════════════════════════════════
   다람 탐험대 — 화면 스타일
   외부 라이브러리·CDN을 쓰지 않음(학교 망 차단 대비).
   그림은 모두 img/ 폴더의 Canva 생성 이미지 사용.
   ══════════════════════════════════════════════════════════ */
:root{
  --wood:#b8692e; --wood-d:#7a3f16; --wood-l:#e59a4c;
  --paper:#fff4e0; --paper-d:#f1dcb8;
  --ink:#4a2a12;
  --gold:#ffcb2f; --gold-d:#d98a00;
  --blue:#39b6ff; --blue-d:#1466c4;
  --green:#5fd13a; --green-d:#2f8f1c;
  --red:#ff5a4f;
  --pill:rgba(40,40,52,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  background:#cfe8f7; color:var(--ink); touch-action:none;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.hidden{display:none !important}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#game.dragging{cursor:grabbing}

/* ── 상단 HUD ── */
.hud{position:fixed;left:0;right:0;top:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px);
  display:flex;align-items:flex-start;gap:12px}
.hud > *{pointer-events:auto}
.profile{display:flex;align-items:center;gap:6px}
.avatar{width:64px;height:64px;border-radius:14px;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);
  background:#35b6b0 center/cover;position:relative}
.lvwrap{display:flex;align-items:center}
.star{width:48px;height:48px;position:relative;z-index:2;display:grid;place-items:center;
  font-size:20px;color:#7a4a00;font-weight:900;margin-right:-14px}
.star svg{position:absolute;inset:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.star span{position:relative}
.xpbar{width:110px;height:22px;border-radius:11px;background:var(--pill);overflow:hidden;position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe36a,#f5b400);border-radius:11px;width:0;transition:width .4s}
.xpbar b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff;text-shadow:0 1px 2px #000;font-weight:700}

.energy{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bar{display:flex;align-items:center;height:36px;position:relative}
.bar .ico{width:44px;height:44px;object-fit:contain;position:relative;z-index:2;margin-right:-18px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.bar .track{height:28px;border-radius:14px;background:var(--pill);position:relative;overflow:hidden;min-width:150px}
.bar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:14px;transition:width .35s}
.bar .track b{position:relative;display:grid;place-items:center;height:100%;padding:0 34px 0 26px;
  font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);font-weight:800}
.bar .plus{width:30px;height:30px;border-radius:50%;margin-left:-26px;position:relative;z-index:2;
  background:radial-gradient(circle at 35% 30%,#ffe98a,#ffbf1f 60%,#e08b00);color:#7a3f00;font-size:22px;font-weight:900;
  box-shadow:0 2px 0 rgba(0,0,0,.3);display:grid;place-items:center;line-height:1}
#energyTrack{width:230px}
#energyTrack i{background:linear-gradient(#7fd6ff,#1c98f0)}
.timer{white-space:nowrap;margin-top:3px;font-size:12px;color:#fff;background:var(--pill);padding:2px 10px;border-radius:10px}
.money{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.money .track{min-width:130px}
.money .track i{display:none}

/* ── 지역 진행 카드(오른쪽) ── */
.quest{position:fixed;right:calc(env(safe-area-inset-right) + 12px);top:calc(env(safe-area-inset-top) + 156px);
  background:rgba(255,244,224,.94);border:3px solid var(--wood-l);border-radius:14px;padding:8px 12px;
  box-shadow:0 3px 0 rgba(0,0,0,.2);font-size:14px;min-width:160px}
.quest h4{margin:0 0 4px;font-size:15px;color:var(--wood-d)}
.quest .row{display:flex;align-items:center;gap:6px;margin-top:3px}
.quest img{width:24px;height:24px;object-fit:contain}
.quest .pbar{height:8px;border-radius:4px;background:#e6cfa6;overflow:hidden;flex:1}
.quest .pbar i{display:block;height:100%;background:linear-gradient(90deg,#8fd14f,#3fae2a)}

/* ── 하단 버튼 ── */
.dock{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px}
.dock.left{left:calc(env(safe-area-inset-left) + 12px)}
.dock.right{right:calc(env(safe-area-inset-right) + 12px)}
.btn-round{width:78px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.btn-round img{width:70px;height:62px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28));transition:transform .15s}
.btn-round:active img{transform:scale(.9)}
.btn-round span{font-size:13px;color:#fff;background:rgba(74,42,18,.85);padding:1px 9px;border-radius:9px;margin-top:-4px;position:relative}
.btn-round .badge{position:absolute;top:0;right:4px;background:var(--red);color:#fff;border-radius:11px;min-width:22px;height:22px;
  font-size:13px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
.gear{position:fixed;right:calc(env(safe-area-inset-right) + 12px);top:calc(env(safe-area-inset-top) + 100px);
  width:46px;height:46px;border-radius:14px;background:var(--pill);display:grid;place-items:center}
.gear svg{width:28px;height:28px;fill:#fff}
.bagpulse{animation:bagpulse .35s}
@keyframes bagpulse{50%{transform:scale(1.18)}}

/* ── 이벤트 줄(왼쪽 위) ── */
.events{position:fixed;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 82px);display:flex;gap:6px;
  background:rgba(40,40,52,.55);border-radius:16px;padding:6px 8px}
.ev{width:64px;display:flex;flex-direction:column;align-items:center;position:relative}
.ev img{width:52px;height:46px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.ev span{font-size:11px;color:#fff;background:rgba(30,30,40,.85);border-radius:8px;padding:0 6px;margin-top:-4px;white-space:nowrap}
.ev .dot{position:absolute;top:-2px;right:2px;background:#ffd23a;color:#6b3b00;width:20px;height:20px;border-radius:50%;
  font-size:13px;font-weight:900;display:grid;place-items:center;border:2px solid #fff;font-style:normal}
.btn-round .plusb{position:absolute;right:2px;bottom:22px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9ef07a,#3fae2a);
  color:#fff;font-weight:900;font-size:20px;display:grid;place-items:center;border:2px solid #fff;font-style:normal;line-height:1}
.xpbar i{background:linear-gradient(#d07bff,#9b3fe0) !important}

/* ── 생산 화면(원작 구성: 제목·화살표 / 작업 칸 / 즉시 완성 / 재료 카드 / 제품 카드) ── */
.pv{position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(ellipse 30% 34% at 50% 52%, rgba(10,14,30,0) 0%, rgba(10,14,30,0) 55%, rgba(10,14,30,.72) 100%);
  animation:fadein .2s}
.pv > *{pointer-events:auto}
body.pv-open .hud, body.pv-open .events, body.pv-open .quest, body.pv-open .dock, body.pv-open .gear, body.pv-open .qbtns{display:none}
@keyframes fadein{from{opacity:0}}
.pv-top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:26px}
.pv-top h2{margin:0;font-size:clamp(28px,4vw,44px);color:#ffd84a;-webkit-text-stroke:1.5px #6a3300;paint-order:stroke fill;
  text-shadow:0 3px 0 #6a3300,0 0 18px rgba(0,0,0,.6);min-width:6em;text-align:center;font-weight:900}
.pv-arrow{width:44px;height:52px;font-size:0;position:relative}
.pv-arrow:before{content:"";position:absolute;inset:6px;background:linear-gradient(#ffd23a,#f5a400);clip-path:polygon(100% 0,100% 100%,0 50%);filter:drop-shadow(0 2px 0 #7a3f00)}
.pv-arrow.r:before{clip-path:polygon(0 0,0 100%,100% 50%)}
.pv-x{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 18px);font-size:44px;color:#fff;font-weight:900;text-shadow:0 2px 0 #000}
.pv-cap{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);background:rgba(20,20,30,.8);color:#fff;
  border-radius:16px;padding:3px 16px 3px 4px;display:flex;align-items:center;gap:8px;font-size:18px}
.pv-cap img{width:30px;height:30px;border-radius:50%;background:#fff;object-fit:contain}
.pv-slots{position:absolute;top:calc(env(safe-area-inset-top) + 112px);left:50%;transform:translateX(-50%);display:flex;gap:10px}
.pslot{width:96px;height:96px;border-radius:16px;background:rgba(40,28,18,.85);border:3px solid #f0a64a;display:grid;place-items:center;position:relative}
.pslot img{width:72px;height:72px;object-fit:contain}
.pslot.wait img{opacity:.75}
.pslot.empty{border-style:dashed;border-color:#c49a62;background:rgba(40,28,18,.5)}
.pslot.ready{border-color:#7fe04a;box-shadow:0 0 0 3px rgba(127,224,74,.5)}
.pslot b{position:absolute;bottom:4px;left:0;right:0;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 2px #000}
.pslot .ok{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:#3fae2a;color:#fff;display:grid;place-items:center;border:2px solid #fff;font-size:15px}
.pv-speed{position:absolute;top:calc(env(safe-area-inset-top) + 218px);background:linear-gradient(#6fc8ff,#1c7fe0);border:3px solid #0d4fa0;
  border-radius:16px;color:#fff;font-size:22px;padding:4px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 #0a3d7a}
.pv-speed img{width:30px;height:30px}
.pv-need{position:absolute;left:calc(env(safe-area-inset-left) + 4%);bottom:calc(env(safe-area-inset-bottom) + 120px);display:flex;gap:10px}
.ncard{width:118px;height:132px;border-radius:18px;background:#fff1d6;border:4px solid #3a2414;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
.ncard img{width:82px;height:82px;object-fit:contain}
.ncard b{font-size:22px;color:#5a3510;align-self:flex-end;margin-right:12px}
.ncard b.lack{color:#d33}
.pv-info{position:absolute;right:calc(env(safe-area-inset-right) + 4%);bottom:calc(env(safe-area-inset-bottom) + 120px);width:min(400px,44vw);
  background:rgba(25,20,18,.86);border-radius:22px;padding:14px;display:flex;gap:14px;align-items:center;color:#fff}
.pv-info .pimg{width:120px;height:120px;border-radius:16px;background:#fff1d6;display:grid;place-items:center;flex:none}
.pv-info .pimg img{width:92px;height:92px;object-fit:contain}
.pv-info h3{margin:0 0 6px;font-size:26px}
.pv-info .tm{font-size:20px;color:#ffe08a;border-top:2px dotted rgba(255,255,255,.35);padding-top:8px;margin-top:8px}
.pv-info .own{position:absolute;top:-16px;right:20px;background:linear-gradient(#ffb34d,#e07a12);border-radius:12px;padding:2px 12px;font-size:18px;border:2px solid #7a3f00}
.pv-info .gbtn{margin-top:10px;font-size:18px}
.pv-recipes{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;
  background:rgba(25,20,18,.7);border-radius:20px;padding:8px 12px;max-width:calc(100vw - 24px);overflow-x:auto}
.rtile{width:78px;height:78px;border-radius:16px;background:#fff1d6;border:3px solid #c49a62;display:grid;place-items:center;flex:none;position:relative}
.rtile img{width:60px;height:60px;object-fit:contain}
.rtile.on{border-color:#ffd23a;box-shadow:0 0 0 3px #ffd23a}
.rtile.no img{filter:grayscale(.6) opacity(.7)}
.pv-foot{position:absolute;left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px}
@media (max-width:700px){
  .events{top:calc(env(safe-area-inset-top) + 150px)}
  .ev{width:52px}.ev img{width:42px;height:38px}
  .pv-slots{top:calc(env(safe-area-inset-top) + 108px);gap:6px}.pslot{width:70px;height:70px}.pslot img{width:50px;height:50px}
  .pv-speed{top:calc(env(safe-area-inset-top) + 188px)}
  .pv-need{left:12px;bottom:calc(env(safe-area-inset-bottom) + 300px)}.ncard{width:84px;height:96px}.ncard img{width:56px;height:56px}.ncard b{font-size:16px}
  .pv-info{left:12px;right:12px;width:auto;bottom:calc(env(safe-area-inset-bottom) + 112px)}
  .pv-info .pimg{width:84px;height:84px}.pv-info .pimg img{width:64px;height:64px}.pv-info h3{font-size:20px}
  .pv-foot{bottom:calc(env(safe-area-inset-bottom) + 412px)}
  .pv-x{top:calc(env(safe-area-inset-top) + 66px);font-size:34px}
  .pv-top{gap:10px}
  .dock{gap:2px}.dock.left{left:6px}.dock.right{right:6px}
  .btn-round{width:58px;height:66px}.btn-round img{width:50px;height:46px}.btn-round span{font-size:12px;padding:1px 6px}
  .btn-round .plusb{width:22px;height:22px;font-size:16px;bottom:18px}
}

/* ── 이야기 미션 화면(원작 '후속 조치'·'구멍' 화면 구성) ── */
.qv{position:fixed;inset:0;z-index:40;background:rgba(10,14,30,.66);animation:fadein .2s;overflow:auto}
.qv-top{text-align:center;padding-top:calc(env(safe-area-inset-top) + 16px)}
.qv-top h2{margin:0;font-size:clamp(26px,4vw,40px);color:#ffd84a;-webkit-text-stroke:1.5px #6a3300;paint-order:stroke fill;text-shadow:0 3px 0 #6a3300}
.qv-top small{color:#ffe9b8;font-size:15px}
.qv-talk{display:flex;align-items:center;max-width:900px;margin:14px auto 0;padding:0 16px}
.portrait{width:150px;height:150px;flex:none;border-radius:50%;border:6px solid #d98a3a;background:#fff4e0 center 18%/cover no-repeat;
  box-shadow:0 4px 0 rgba(0,0,0,.35);position:relative;z-index:2}
.portrait.big{width:190px;height:190px}
.bubble{background:rgba(20,18,24,.85);color:#fff;border-radius:0 22px 22px 0;padding:14px 22px 14px 40px;margin-left:-26px;flex:1;font-size:clamp(15px,2vw,20px);line-height:1.5}
.bubble b{color:#ffd84a;font-size:15px}.bubble p{margin:4px 0 0}
.qv-reward{display:flex;justify-content:center;align-items:center;gap:16px;margin:12px 0;color:#fff;font-size:22px;flex-wrap:wrap}
.qv-reward em{color:#ffd84a;font-style:normal;font-size:18px}
.qv-reward span{display:flex;align-items:center;gap:4px}.qv-reward img{width:36px;height:36px;object-fit:contain}
.qv-objs{display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto;padding:0 16px}
.qobj{display:flex;align-items:center;gap:14px;background:linear-gradient(#fff4e0,#f6e2bf);border-radius:16px;padding:10px 18px;box-shadow:0 4px 0 rgba(0,0,0,.3);position:relative;min-height:74px}
.qobj img{width:64px;height:56px;object-fit:contain}
.qobj span{flex:1;font-size:clamp(15px,2vw,20px);color:#6a3a12}
.qobj .cnt{color:#e5452d;font-size:17px}
.chk{font-style:normal;font-size:38px;color:#3fae2a;font-weight:900;text-shadow:0 2px 0 #1d6b10}
.seek{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fd8ff,#1c7fe0);border:3px solid #fff;font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.qv-ok{display:block;margin:18px auto calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(#6ee04a,#2f9a1c);color:#fff;font-size:28px;font-weight:900;
  border:3px solid #1f6e10;border-radius:18px;padding:8px 60px;text-shadow:0 2px 0 #1d5a0d;box-shadow:0 4px 0 #1d5a0d}
.qv-ok:disabled{filter:grayscale(1) opacity(.6)}
.rv-head{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:10px}
.stage{color:#fff;font-size:24px}
.rv-cards{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding:0 16px}
.rcard{width:220px;background:linear-gradient(#fff6e4,#f6e2bf);border-radius:20px;padding:12px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:6px}
.rcard h4{margin:0;font-size:20px;color:#6a3a12;font-weight:500}
.rcard img{width:90px;height:76px;object-fit:contain}
.rcard b{font-size:24px;color:#6a3a12}.rcard b.lack{color:#e5452d}
.rcard .gbtn{font-size:20px;padding:6px 34px}
/* 왼쪽 미션 단추 */
.qbtns{position:fixed;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 168px);display:flex;flex-direction:column;gap:10px}
.qbtn{position:relative;width:70px;display:flex;flex-direction:column;align-items:center}
.qbtn .portrait{width:64px;height:64px;border-width:4px}
.qbtn small{margin-top:-8px;background:rgba(30,30,40,.85);color:#fff;border-radius:8px;padding:0 8px;font-size:12px;position:relative;z-index:3}
.qbtn em{position:absolute;top:-4px;right:0;background:#ffd23a;color:#6b3b00;width:24px;height:24px;border-radius:50%;font-style:normal;font-weight:900;
  display:grid;place-items:center;border:2px solid #fff;z-index:3;animation:bagpulse 1s infinite}
.loc .done{position:absolute;right:2%;bottom:4%;width:40%;aspect-ratio:1;z-index:2}
@media (max-width:700px){
  .portrait{width:96px;height:96px;border-width:4px}.portrait.big{width:110px;height:110px}
  .bubble{padding:10px 14px 10px 30px;margin-left:-20px}
  .qobj{padding:8px 10px;gap:8px;min-height:60px}.qobj img{width:44px;height:40px}
  .rcard{width:150px}.rcard .gbtn{padding:4px 18px}
  .qbtns{top:calc(env(safe-area-inset-top) + 222px)}
  .qbtn .portrait{width:52px;height:52px}
  .qv .pv-x{top:calc(env(safe-area-inset-top) + 8px);right:10px}
  .qv-top{padding-top:calc(env(safe-area-inset-top) + 40px)}
}

/* 축제·꾸미기 */
.evloc{position:absolute;right:3%;bottom:3%;width:15%;display:flex;flex-direction:column;align-items:center}
.evloc .medal{width:100%;aspect-ratio:1;border-radius:50%;background:center/cover;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.evloc b{margin-top:-8%;background:linear-gradient(#a0632e,#7a4318);color:#fff;border-radius:10px;padding:3px 14px;font-size:clamp(12px,1.6vw,18px);border:2px solid #4a2a0e;position:relative}
.evloc small{margin-top:3px;background:#3a2a1a;color:#ffd84a;border-radius:10px;padding:1px 10px;font-size:clamp(10px,1.2vw,14px)}
.evhead{display:flex;gap:16px;align-items:center}
.evmedal{width:120px;height:120px;border-radius:50%;object-fit:cover;flex:none}
.evtime{display:inline-block;background:#3a2a1a;color:#ffd84a;border-radius:10px;padding:2px 12px;margin:4px 0}
.evbar{position:relative;height:30px;border-radius:15px;background:#e8d6b4;overflow:hidden;margin-top:6px}
.evbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffd84a,#e89a00)}
.evbar b{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:100%;color:#5a3510}
.evbar img{width:24px;height:24px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.troph{background:#fff;border:2px solid var(--paper-d);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.troph.can{border-color:#ffb800;box-shadow:0 0 0 3px rgba(255,200,0,.35)}.troph.got{opacity:.7}
.troph .tn{font-size:18px;color:#7a4a28}
.placebar{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:8px;
  background:rgba(30,24,18,.9);color:#fff;border-radius:16px;padding:8px 14px;font-size:15px;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
.placebar img{width:34px;height:34px;object-fit:contain}
body.placing .placebar{display:flex}
body.placing .hud, body.placing .events, body.placing .qbtns, body.placing .quest{display:none}
@media (max-width:700px){ .evloc{width:28%;right:2%;bottom:2%} .evmedal{width:80px;height:80px} }

/* 시장·과제·도감 */
.mk-row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--paper-d);border-radius:14px;padding:8px 12px}
.mk-row img{width:48px;height:48px;object-fit:contain}
.mk-row .nm{flex:1;font-size:16px}.mk-row .nm small{display:block;color:#a07650;font-size:13px}
.mk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.task{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--paper-d);border-radius:14px;padding:10px 14px}
.task.done{border-color:#7fd34a;background:#f1fbe8}
.task img{width:52px;height:52px;object-fit:contain}
.task{flex-wrap:wrap}.task .tx{flex:1 1 140px}.task .tx b{font-size:16px}
.tbar{height:12px;border-radius:6px;background:#eadbc2;overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#8fd14f,#3fae2a)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.album div{background:#fff;border-radius:12px;padding:6px;text-align:center;font-size:12px;border:2px solid var(--paper-d)}
.album img{width:56px;height:56px;object-fit:contain}
.album .no img{filter:brightness(0) opacity(.25)}

/* ── 알림 토스트 ── */
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,0);background:rgba(40,28,18,.88);color:#fff;
  padding:10px 18px;border-radius:14px;font-size:16px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  white-space:nowrap;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,-6px)}
body.pv-open #toast{top:auto;bottom:calc(env(safe-area-inset-bottom) + 260px)}

/* ── 팝업(창) ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,40,.55);display:grid;place-items:center;z-index:40;padding:16px}
.panel{width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;position:relative;
  animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.tabs{display:flex;gap:6px;padding:0 26px;position:relative;z-index:1}
.tab{flex:1;max-width:130px;height:52px;border-radius:16px 16px 0 0;background:linear-gradient(#e7b270,#c98845);
  display:grid;place-items:center;font-size:15px;color:#5a2c08;border:3px solid var(--wood-d);border-bottom:0;margin-bottom:-3px}
.tab img{width:30px;height:30px;object-fit:contain}
.tab.on{background:linear-gradient(#ffcf8a,#f0a653);height:58px;margin-top:-6px}
.frame{background:linear-gradient(#e8a45c,#c8792f);border:3px solid var(--wood-d);border-radius:22px;padding:12px;
  box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;min-height:0}
.frame h3{margin:0 0 10px;text-align:center;color:#fff;font-size:22px;text-shadow:0 2px 0 var(--wood-d)}
.sheet{background:var(--paper);border-radius:14px;padding:16px;overflow:auto;min-height:0;box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.close{position:absolute;right:-6px;top:-10px;width:48px;height:48px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 30%,#ff9b7a,#e5452d 65%,#a8200e);color:#fff;font-size:26px;font-weight:900;
  border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.cell{display:flex;flex-direction:column;align-items:center;font-size:20px;color:#7a4a28;position:relative}
.cell img{width:78px;height:72px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.cell small{font-size:12px;color:#a07650}
.cell button{margin-top:4px}
.empty{text-align:center;color:#a07650;padding:30px 0;font-size:16px}
.gbtn{background:linear-gradient(#8ee25a,#3fae2a);color:#fff;border-radius:12px;padding:7px 14px;font-size:15px;
  text-shadow:0 1px 0 rgba(0,0,0,.35);box-shadow:0 3px 0 #237a14;border:2px solid #2b8a1a}
.gbtn.blue{background:linear-gradient(#7fd6ff,#1c98f0);box-shadow:0 3px 0 #0d5aa8;border-color:#0f64b6}
.gbtn.gold{background:linear-gradient(#ffe36a,#f5b400);color:#6b3b00;text-shadow:none;box-shadow:0 3px 0 #b77700;border-color:#c98800}
.gbtn.red{background:linear-gradient(#ff9b7a,#e5452d);box-shadow:0 3px 0 #9c1f0c;border-color:#a8200e}
.gbtn:disabled{filter:grayscale(1) opacity(.6);cursor:default}
.gbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}

/* 주문판·요리 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--paper-d);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h5{margin:0;font-size:16px;color:var(--wood-d);display:flex;align-items:center;gap:6px}
.card h5 img{width:40px;height:40px;object-fit:contain}
.need{display:flex;flex-wrap:wrap;gap:6px}
.need span{display:flex;align-items:center;gap:2px;background:#f6ead4;border-radius:10px;padding:2px 8px 2px 2px;font-size:14px}
.need span.lack{color:#d33;background:#fde3de}
.need img{width:26px;height:26px;object-fit:contain}
.reward{display:flex;gap:10px;align-items:center;font-size:14px;color:#7a4a28}
.reward img{width:22px;height:22px;object-fit:contain;vertical-align:middle}

/* 생산·건물 창 */
.prodhead{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:86px;height:96px;border-radius:14px;background:#fff;border:2px solid var(--paper-d);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:12px;color:#7a4a28;position:relative}
.slot img{width:52px;height:52px;object-fit:contain}
.slot.ready{border-color:#3fae2a;background:#effbe6;animation:readyglow 1.2s ease-in-out infinite alternate}
@keyframes readyglow{to{box-shadow:0 0 0 4px rgba(95,209,58,.35)}}
.empty-slot{color:#c9b08a;border-style:dashed}
.sbar{display:block;width:70px;height:7px;border-radius:4px;background:#eadbc2;overflow:hidden}
.sbar b{display:block;height:100%;background:linear-gradient(90deg,#8fd14f,#3fae2a)}
.prodbtns{display:flex;flex-direction:column;gap:8px}
.bldtop{display:flex;gap:16px;align-items:center}
.bldimg{width:130px;height:120px;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.stars{font-size:26px;letter-spacing:2px;color:#e2d2b4}
.stars .on{color:#ffc21a;text-shadow:0 2px 0 #c98800}
.fxnow,.fxnext{margin:6px 0;font-size:15px}
.subh{margin:14px 0 6px;color:var(--wood-d);font-size:17px}
.chnav{position:absolute;top:1.5%;display:flex;gap:8px;z-index:2}
.chnav.l{left:2%}.chnav.r{right:2%}
.chbtn{width:46px;height:46px;border-radius:50%;background:linear-gradient(#f5d9a6,#dcae6a);border:2px solid #9a6a33;
  font-size:22px;color:#5a3510;display:grid;place-items:center}
.chbtn:disabled{opacity:.35}
.scroll.ch4{background:
    radial-gradient(ellipse at 30% 30%,rgba(170,210,255,.35),transparent 55%),
    radial-gradient(ellipse at 75% 70%,rgba(150,120,230,.22),transparent 55%),
    repeating-radial-gradient(circle at 60% 50%,rgba(150,110,60,.05) 0 3px,transparent 3px 14px),
    linear-gradient(#eef0f8,#dcd6ee)}
.scroll.ch3{background:
    radial-gradient(ellipse at 30% 40%,rgba(90,190,120,.22),transparent 55%),
    radial-gradient(ellipse at 80% 35%,rgba(230,130,40,.22),transparent 55%),
    repeating-radial-gradient(circle at 60% 50%,rgba(150,110,60,.06) 0 3px,transparent 3px 14px),
    linear-gradient(#f3e7cc,#e6cfa2)}
.scroll.ch2{background:
    radial-gradient(ellipse at 50% 60%,rgba(80,170,210,.28),transparent 65%),
    repeating-radial-gradient(circle at 40% 50%,rgba(150,110,60,.06) 0 3px,transparent 3px 14px),
    linear-gradient(#f6e6c4,#ecd3a3)}
/* 월드맵 */
.chlock{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(90,53,16,.88);color:#fff;
  padding:8px 16px;border-radius:12px;font-size:clamp(12px,1.6vw,16px);white-space:nowrap}
.worldmap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,24,40,.6);padding:10px}
.scroll{position:relative;width:min(1100px,100%);aspect-ratio:16/8.4;max-height:calc(100vh - 20px);border-radius:10px;
  background:
    radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(ellipse at 70% 70%,rgba(160,110,40,.18),transparent 55%),
    repeating-radial-gradient(circle at 60% 50%,rgba(150,110,60,.06) 0 3px,transparent 3px 14px),
    linear-gradient(#f6e6c4,#ecd3a3);
  border-left:26px solid #d9b77f;border-right:26px solid #d9b77f;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 60px rgba(120,80,30,.35);
  animation:pop .25s}
.scroll:before,.scroll:after{content:"";position:absolute;top:-10px;bottom:-10px;width:34px;border-radius:17px;
  background:linear-gradient(90deg,#b98b4a,#f1d7a4 45%,#a7773a)}
.scroll:before{left:-44px}.scroll:after{right:-44px}
.scroll h2{position:absolute;top:2%;left:0;right:0;text-align:center;margin:0;color:#8a6135;font-size:clamp(16px,2.4vw,26px)}
.scroll svg.paths{position:absolute;inset:0;width:100%;height:100%}
.loc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:15.5%}
.loc .medal{width:100%;aspect-ratio:1;border-radius:50%;background:center/cover;position:relative;
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.3));transition:transform .15s}
.loc:hover .medal{transform:scale(1.05)}
.loc.locked .medal{filter:grayscale(.85) brightness(.85) drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.loc .lock{position:absolute;right:4%;bottom:6%;width:34%;aspect-ratio:1;border-radius:50%;background:#fff3;display:grid;place-items:center}
.loc .lock svg{width:80%;height:80%}
.loc b{margin-top:-6%;background:linear-gradient(#f5d9a6,#dcae6a);border:2px solid #9a6a33;border-radius:10px;padding:2px 10px;
  font-size:clamp(11px,1.5vw,16px);color:#5a3510;white-space:nowrap;position:relative}
.loc small{font-size:clamp(10px,1.2vw,13px);color:#7a5228;margin-top:2px;white-space:nowrap}
.loc .flag{position:absolute;right:6%;top:-8%;width:30%}
.loc.here .medal{outline:4px solid #ffd54a;outline-offset:2px}
.deco{position:absolute;opacity:.55;pointer-events:none}

/* 레벨업 등 큰 알림 */
.celebrate{text-align:center}
.celebrate .big{font-size:64px;line-height:1;margin:6px 0;color:#f5a400;text-shadow:0 3px 0 #b36b00}
.celebrate p{font-size:17px;margin:8px 0}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--paper-d);font-size:16px}
.setrow input[type=number]{width:80px;font-size:16px;padding:4px 6px;border-radius:8px;border:2px solid var(--paper-d);font-family:inherit}
.hint{font-size:13px;color:#a07650}

/* 로딩 */
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(#bfe3f5,#e9f4fb)}
#loading div{text-align:center;color:#3b6b8f;font-size:18px}
#loading img{width:120px;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
#loading .lbar{width:220px;height:14px;border-radius:7px;background:#fff;margin:14px auto 0;overflow:hidden}
#loading .lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd6ff,#1c98f0)}

@media (max-width:700px){
  .avatar{width:48px;height:48px}.star{width:40px;height:40px;font-size:16px}.xpbar{width:70px}
  #energyTrack{width:130px}.money .track{min-width:92px}.bar .track b{font-size:14px;padding:0 30px 0 22px}
  .bar .ico{width:36px;height:36px}.btn-round{width:62px;height:70px}.btn-round img{width:56px;height:50px}
  .quest{top:calc(env(safe-area-inset-top) + 74px);font-size:12px;min-width:130px}
  .gear{top:calc(env(safe-area-inset-top) + 158px)}
  .energy{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 104px);flex:none}
  #energyTrack{width:190px}
  .quest{top:calc(env(safe-area-inset-top) + 214px)}
  .money .track{min-width:84px}
  .frame h3{font-size:18px}
  .scroll{border-left-width:12px;border-right-width:12px;aspect-ratio:auto;height:min(92vh,calc((100vw - 20px)*1.3))}
  .loc{width:30%}
}
</style>
</head>
<body>
<div id="loading"><div><img data-img="avatar" alt=""><p>탐험 준비 중…</p><div class="lbar"><i id="lbar"></i></div></div></div>

<canvas id="game"></canvas>

<!-- 상단 HUD -->
<div class="hud">
  <div class="profile">
    <div class="avatar" data-bg="avatar"></div>
    <div class="lvwrap">
      <div class="star"><svg viewBox="0 0 48 48"><path d="M24 3l6.2 13 14.3 1.8-10.5 9.8 2.7 14.1L24 34.8 11.3 41.7 14 27.6 3.5 17.8 17.8 16z" fill="#ffd23a" stroke="#e59500" stroke-width="2.5" stroke-linejoin="round"/></svg><span id="lv">1</span></div>
      <div class="xpbar"><i id="xpFill"></i><b id="xpText">0/50</b></div>
    </div>
  </div>
  <div class="energy">
    <div class="bar">
      <img class="ico" data-img="i_energy" alt="에너지">
      <div class="track" id="energyTrack"><i id="enFill"></i><b id="enText">100</b></div>
      <button class="plus" id="enPlus" aria-label="에너지 충전">+</button>
    </div>
    <div class="timer" id="enTimer">가득 참</div>
  </div>
  <div class="money">
    <div class="bar"><img class="ico" data-img="i_coin" alt="코인"><div class="track"><b id="coinText">0</b></div><button class="plus" data-shop>+</button></div>
    <div class="bar"><img class="ico" data-img="i_gem" alt="보석"><div class="track"><b id="gemText">0</b></div><button class="plus" data-shop>+</button></div>
  </div>
</div>

<div class="events" id="events">
  <button class="ev" id="evAlbum"><img data-img="u_camera" alt=""><span id="evAlbumT">도감</span></button>
  <button class="ev" id="evShop"><img data-img="u_shop" alt=""><span>상점</span></button>
  <button class="ev" id="evGift"><img data-img="u_gift" alt=""><span id="evGiftT">선물</span><em class="dot hidden" id="giftDot">!</em></button>
  <button class="ev" id="evFest"><img data-img="u_trophy" alt=""><span id="evFestT">축제</span></button>
  <button class="ev" id="evDecor"><img data-img="dec_flowerbed" alt=""><span>꾸미기</span></button>
</div>
<div class="qbtns" id="qbtns"></div>
<div class="quest" id="quest"></div>
<button class="gear" id="gearBtn" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 000-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 00-1.7-1L14.9 3h-4l-.4 2.9a7.6 7.6 0 00-1.7 1l-2.5-1-2 3.5L6.4 11a7.7 7.7 0 000 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.9h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12.9 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg></button>

<div class="dock left">
  <button class="btn-round" id="marketBtn"><img data-img="u_register" alt=""><span>시장</span></button>
  <button class="btn-round" id="taskBtn"><img data-img="u_notebook" alt=""><span>과제</span><em class="badge hidden" id="taskBadge"></em></button>
  <button class="btn-round" id="orderBtn"><img data-img="board" alt=""><span>주문</span><em class="badge hidden" id="orderBadge"></em></button>
</div>
<div class="dock right">
  <button class="btn-round" id="dynBtn"><img data-img="i_dynamite" alt=""><span id="dynText">0</span><em class="plusb">+</em></button>
  <button class="btn-round" id="bagBtn"><img data-img="u_bag" alt=""><span>창고</span></button>
  <button class="btn-round" id="mapBtn"><img data-img="u_map" alt=""><span>지도</span></button>
</div>

<div id="placeBar" class="placebar"></div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════
   다람 탐험대 — 게임 로직
   · 에너지를 써서 장애물(나무·바위 등)을 치우면 자원을 얻고 구름이 걷힘
   · 지역마다 숨은 '룬 석판' 3개를 찾으면 탐험 완료
   · 캠프에서 요리(에너지 음식)와 주문(코인·경험치) 처리
   · 저장: 이 기기 브라우저(localStorage)에만 저장, 개인정보 없음
   ══════════════════════════════════════════════════════════ */

/* ── 선생님·운영자 설정값 (게임 안 설정 창에서도 바꿀 수 있음) ── */
const CONFIG = {
  energyBase: 100,        // 1레벨 최대 에너지
  energyPerLevel: 5,      // 레벨마다 늘어나는 최대 에너지
  regenMinutes: 2,        // 에너지 1 충전에 걸리는 시간(분)
  napEnergy: 30,          // 텐트 낮잠 보상
  napHours: 4,            // 텐트 낮잠 대기 시간(시간)
  xpPerEnergy: 1,         // 에너지 1 사용당 경험치
  levelUpGems: 3,         // 레벨업 보석 보상
  regionClearGems: 15,    // 지역 탐험 완료 보석
  regionClearCoins: 300,  // 지역 탐험 완료 코인
  runesPerRegion: 3,
  chestsPerRegion: 5,
  mapSize: 22,
  prodSpeed: 1,           // 요리·제작 시간 배율(0.5면 두 배 빠름)
  chapter2Level: 10,      // 2장 지도가 열리는 레벨
  chapter3Level: 20,      // 3장 지도가 열리는 레벨
  chapter4Level: 30,      // 4장 지도가 열리는 레벨
  buildingMaxLevel: 5,
  giftHours: 20,          // 일일 선물 간격(시간)
  dynamiteGems: 3,        // 다이너마이트 1개 보석 가격
  speedUpMinPerGem: 3,    // 즉시 완성: 보석 1개당 줄여 주는 시간(분)
  eventDays: 7,           // 축제 섬 이벤트 한 회 기간(일). 끝나면 새 섬·새 기록으로 다시 시작

    const fin = () => { done++; document.getElementById('lbar').style.width = (done/IMG_LIST.length*100)+'%'; res(); };

const hashKey = k => [...k].reduce((h,c) => (h*31 + c.charCodeAt(0)) >>> 0, 7);
function line(ax, ay, bx, by){ const out = []; let dx = Math.abs(bx-ax), sx = ax<bx?1:-1, dy = -Math.abs(by-ay), sy = ay<by?1:-1, e = dx+dy;
  for (;;){ out.push([ax,ay]); if (ax===bx && ay===by) break; const e2 = 2*e; if (e2 >= dy){ e += dy; ax += sx; } if (e2 <= dx){ e += dx; ay += sy; } } return out; }

const LAYOUT_V = 2;   // 지도 설계가 바뀌면 올림(예전 진행은 그 지역만 처음부터)
function buildRegion(key){
  const R = REGIONS[key], M = MAPS[key];
  let st = S.regions[key];
  if (key === 'fest') return buildFestival();
  if (!st || st.layout !== LAYOUT_V){ st = S.regions[key] = {layout:LAYOUT_V, cleared:[], runes:0, clears:(st && st.clears) || 0, queue:[]}; }
  const N = CONFIG.mapSize, r = rng(hashKey(key));        // 모든 학생에게 같은 지도
  const tiles = [], start = {x:11, y:19};
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const d = Math.hypot(x-start.x, y-start.y);
    tiles.push({o: d > 1.6 && r() < 0.84 ? pickW(R.mix, r) : null, rev:false, seed:r()});
  }
  const T = (x,y) => tiles[y*N+x];
  // 강(지나갈 수 없음)
  for (let k=1;k<M.river.pts.length;k++){ const [a,b] = [M.river.pts[k-1], M.river.pts[k]];
    for (const [x,y] of line(a[0],a[1],b[0],b[1])){ const t = T(x,y); t.water = M.river.kind; t.o = M.river.kind === 'hedge' ? 'hedge' : '_water'; t.path = false; } }
  // 흙길(대부분 빈칸, 가끔 가벼운 장애물)
  const light = ['twigpile','flowers', null, null, null, null, null, null];
  for (let k=1;k<M.path.length;k++){ let [x,y] = M.path[k-1]; const [bx,by] = M.path[k];
    while (x !== bx || y !== by){ if (x !== bx && (y === by || (x+y+k) % 2)) x += Math.sign(bx-x); else y += Math.sign(by-y);
      const t = T(x,y); if (t.water) continue; t.path = true; t.o = light[Math.floor(r()*light.length)]; } }
  for (const [x,y] of M.runes) T(x,y).o = 'rune';
  for (const [x,y] of M.chests) T(x,y).o = 'chest';
  for (const [x,y] of M.rocks) T(x,y).o = 'bigrock';
  T(9,19).o = 'tent_camp';
  for (let y=start.y-1;y<=start.y+1;y++) for (let x=start.x-1;x<=start.x+1;x++) if (T(x,y) && T(x,y).o !== 'tent_camp') T(x,y).o = null;
  const w = {key, N, tiles, start, tex:R.tex, tint:R.tint, region:st, home:false, spots:[]};
  M.spots.forEach(([x,y], k) => { const t = T(x,y); t.o = 'fix_' + STORY[key].repairs[k].kind; t.spot = k; t.water = t.water || null; w.spots[k] = y*N+x; });
  st.fixed = st.fixed || {};
  for (const [s2, done] of Object.entries(st.fixed)) if (done && w.spots[s2] != null) tiles[w.spots[s2]].o = 'done_' + STORY[key].repairs[s2].kind;
  for (const i of st.cleared) if (!OBJS[tiles[i].o] || !OBJS[tiles[i].o].fixed) tiles[i].o = null;
  revealAround(w, start.x, start.y, 3.2);
  for (const i of st.cleared) revealAround(w, i % N, (i / N)|0, 2.3);
  return w;
}

const HOME_N = 18;
const HOME_POS = {cabin:[2,2], kitchen:[5,2], bakery:[8,2], dairy:[11,2], sawmill:[14,2],

const HOME_START = {x:8, y:8};
const fpOf = o => (OBJS[o] && OBJS[o].fp) || 1;
function placeObj(w, x, y, o, extra){
  const N = w.N, i = y*N+x, f = fpOf(o);
  w.tiles[i].o = o; Object.assign(w.tiles[i], extra||{});
  for (let dy=0;dy<f;dy++) for (let dx=0;dx<f;dx++) if (dx||dy){ const t = w.tiles[(y+dy)*N+x+dx]; t.o = '_blk'; t.ref = i; }
}
// 2×2 물체의 화면 중심(앞쪽 모서리 기준)
const objCenter = (o, x, y) => fpOf(o) === 2 ? iso(x+.5, y+.5) : iso(x, y);
const objPos = k => { const [x,y] = HOME_POS[k]; return fpOf(k) === 2 ? [x+.5, y+.5] : [x, y]; };
function buildHome(){
  const N = HOME_N, tiles = [];
  for (let i=0;i<N*N;i++) tiles.push({o:null, rev:true, seed:Math.random()});
  const w = {key:'home', N, tiles, start:{...HOME_START}, tex:'t_grass', tint:'rgba(120,190,60,.12)', region:null, home:true};
  for (const [k,[x,y]] of Object.entries(HOME_POS)) placeObj(w, x, y, k);
  FIELD_POS.forEach(([x,y], n) => placeObj(w, x, y, 'field', {fid:n}));
  tiles[12*N+12].o = 'husky';
  S.decor = S.decor.filter(([k,x,y,f]) => { const t = tiles[y*N+x]; if (!DECOR[k]) return false;
    if (!t || t.o){ S.decorInv[k] = (S.decorInv[k]||0) + 1; return false; }   // 자리를 빼앗기면 보관함으로
    t.o = 'dec_' + k; t.flip = !!f; return true; });
  const r = rng(77);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const edge = x<1 || y<1 || x>N-2 || y>N-2;
    if (edge && !tiles[y*N+x].o && r() < .75) tiles[y*N+x].o = ['deco_spruce','deco_oak','deco_redwood','deco_spruce'][Math.floor(r()*4)];
    else if (!edge && !tiles[y*N+x].o && r() < .05 && x > 11 && y > 13) tiles[y*N+x].o = r()<.6 ? 'deco_flowers':'deco_bush';
  }
  return w;
}

function revealAround(w, cx, cy, rad){
  const N = w.N, out = [];
  const R = Math.ceil(rad);
  for (let y=cy-R;y<=cy+R;y++) for (let x=cx-R;x<=cx+R;x++){
    if (x<0||y<0||x>=N||y>=N) continue;
    const wob = ((((x*92821) ^ (y*68917)) >>> 0) % 100 / 100 - .5) * .9;   // 가장자리를 조금씩 들쭉날쭉하게(칸마다 고정)
    if (Math.hypot(x-cx,y-cy) > rad + wob) continue;
    const t = w.tiles[y*N+x]; if (!t.rev){ t.rev = true; out.push([x,y]); }
  }
  return out;
}

/* ── 바닥·구름 캐시(무거운 그림은 미리 그려 둠) ── */
const CS = 0.6;          // 캐시 해상도 배율
let groundC = null, fogC = null, cacheBox = null;
function worldBox(w){
  const N = w.N, pad = 3;
  const minX = iso(-pad, N-1+pad).x - TW, maxX = iso(N-1+pad, -pad).x + TW;
  const minY = iso(-pad, -pad).y - TH*3, maxY = iso(N-1+pad, N-1+pad).y + TH*3;
  return {x:minX, y:minY, w:maxX-minX, h:maxY-minY};
}
function diamond(c, sx, sy, grow=0){
  c.beginPath();
  c.moveTo(sx, sy - TH/2 - grow); c.lineTo(sx + TW/2 + grow*2, sy);
  c.lineTo(sx, sy + TH/2 + grow); c.lineTo(sx - TW/2 - grow*2, sy); c.closePath();
}
function renderGround(){
  const w = world, b = cacheBox = worldBox(w);
  groundC = document.createElement('canvas');
  groundC.width = Math.ceil(b.w*CS); groundC.height = Math.ceil(b.h*CS);
  const c = groundC.getContext('2d');
  c.setTransform(CS,0,0,CS,-b.x*CS,-b.y*CS);
  const N = w.N;
  // 섬 옆면(흙 절벽)
  const cliff = 70;
  for (let i=0;i<N;i++){
    for (const [x,y,side] of [[N-1,i,'r'],[i,N-1,'l']]){
      const p = iso(x,y);
      c.beginPath();
      if (side === 'r'){ c.moveTo(p.x+TW/2, p.y); c.lineTo(p.x, p.y+TH/2); c.lineTo(p.x, p.y+TH/2+cliff); c.lineTo(p.x+TW/2, p.y+cliff); }
      else { c.moveTo(p.x-TW/2, p.y); c.lineTo(p.x, p.y+TH/2); c.lineTo(p.x, p.y+TH/2+cliff); c.lineTo(p.x-TW/2, p.y+cliff); }
      c.closePath();
      const g = c.createLinearGradient(0, p.y, 0, p.y+TH/2+cliff);
      g.addColorStop(0, side==='r' ? '#8a5a32' : '#a7703f'); g.addColorStop(1, side==='r' ? '#4e3018':'#6a4222');
      c.fillStyle = g; c.fill();
      c.strokeStyle = 'rgba(40,20,5,.25)'; c.lineWidth = 2; c.stroke();
      // 돌멩이 무늬
      c.fillStyle = 'rgba(255,230,190,.12)';
      for (let k=0;k<3;k++){ const t = (i*7+k*13)%10/10; c.beginPath();
        c.ellipse(p.x + (side==='r'?1:-1)*TW/4*(0.4+t), p.y+TH/2*(0.6)+20+k*15, 8, 4, 0, 0, 7); c.fill(); }
    }
  }
  // 윗면 풀밭 텍스처
  const tex = IMG[w.tex], pat = c.createPattern(tex, 'repeat');
  c.save();
  c.beginPath();
  const a = iso(0,0), bb = iso(N-1,0), cc = iso(N-1,N-1), d = iso(0,N-1);
  c.moveTo(a.x, a.y-TH/2); c.lineTo(bb.x+TW/2, bb.y); c.lineTo(cc.x, cc.y+TH/2); c.lineTo(d.x-TW/2, d.y); c.closePath();
  c.clip();
  c.fillStyle = pat; c.fillRect(b.x, b.y, b.w, b.h);
  c.fillStyle = w.tint; c.fillRect(b.x, b.y, b.w, b.h);
  // 타일마다 밝기 살짝 다르게 + 흙길 얼룩
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const t = w.tiles[y*N+x], p = iso(x,y);
    const v = (t.seed - .5);
    diamond(c, p.x, p.y, 1);
    c.fillStyle = v > 0 ? `rgba(255,240,180,${v*0.16})` : `rgba(40,60,10,${-v*0.16})`; c.fill();
    if (t.seed > .86 && !w.home && !t.path){ c.fillStyle = 'rgba(120,80,30,.16)'; c.beginPath(); c.ellipse(p.x, p.y, TW*.3, TH*.26, 0, 0, 7); c.fill(); }
  }
  // 강·용암·낭떠러지(설계된 지도)
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ const t = w.tiles[y*N+x]; if (!t.water || t.water === 'hedge') continue; const p = iso(x,y), col = RIVER_COL[t.water];
    diamond(c, p.x, p.y, 7); c.fillStyle = col[0]; c.fill(); }
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ const t = w.tiles[y*N+x]; if (!t.water || t.water === 'hedge') continue; const p = iso(x,y), col = RIVER_COL[t.water];
    diamond(c, p.x, p.y, 2); c.fillStyle = col[1]; c.fill();
    c.strokeStyle = col[2]; c.lineWidth = 3; c.globalAlpha = .7;
    for (let k=0;k<2;k++){ const ox = ((x*37+y*11+k*23)%40)-20, oy = ((x*13+y*29+k*7)%14)-7; c.beginPath(); c.moveTo(p.x+ox-10, p.y+oy); c.quadraticCurveTo(p.x+ox, p.y+oy-5, p.x+ox+10, p.y+oy); c.stroke(); }
    c.globalAlpha = 1; }
  // 흙길(원작처럼 지역을 가로지르는 길)
  const pathCol = w.tex === 't_snow' ? 'rgba(170,190,215,.75)' : w.tex === 't_ash' ? 'rgba(70,60,58,.7)' : w.tex === 't_sand' ? 'rgba(190,140,80,.6)' : 'rgba(156,112,60,.72)';
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ const t = w.tiles[y*N+x]; if (!t.path) continue; const p = iso(x,y);
    diamond(c, p.x, p.y, 3); c.fillStyle = pathCol; c.fill(); }
  const pr = rng(9);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ const t = w.tiles[y*N+x]; if (!t.path) continue; const p = iso(x,y);
    for (let k=0;k<4;k++){ c.beginPath(); c.ellipse(p.x+(pr()-.5)*TW*.6, p.y+(pr()-.5)*TH*.5, 4+pr()*5, 2.5+pr()*2.5, 0, 0, 7);
      c.fillStyle = `rgba(${200+pr()*40|0},${185+pr()*30|0},${160+pr()*30|0},.8)`; c.fill(); }
    // 길 가장자리 풀
    c.strokeStyle = 'rgba(70,110,30,.35)'; c.lineWidth = 2;
    for (let k=0;k<3;k++){ const ex = p.x + (pr()<.5?-1:1)*TW*.38, ey = p.y + (pr()-.5)*TH*.3; c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex+2, ey-8); c.stroke(); }
  }
  // 가장자리 안쪽 그림자
  const sh = c.createLinearGradient(0, a.y-TH/2, 0, cc.y+TH/2);
  sh.addColorStop(0,'rgba(255,255,255,.08)'); sh.addColorStop(1,'rgba(0,0,0,.10)');
  c.fillStyle = sh; c.fillRect(b.x,b.y,b.w,b.h);
  c.restore();
  if (w.home){ // 캠프 돌길: 가운데에서 건물마다 이어지는 징검돌
    const rr = rng(5);
    const S0 = HOME_START;
    // 밭 사이 십자 흙길
    for (let k=0;k<HOME_N;k++) for (const [x,y] of [[8,k],[k,8],[5,k],[k,5],[13,k],[k,11],[k,14]]){
      if (x<1||y<1||x>HOME_N-2||y>HOME_N-2) continue; const p = iso(x,y);
      diamond(c, p.x, p.y, -6); c.fillStyle = 'rgba(150,110,60,.22)'; c.fill(); }
    for (const k of Object.keys(HOME_POS)){ const [bx,by] = objPos(k);
      const len = Math.hypot(bx-S0.x, by-S0.y), n = Math.floor(len/0.6);
      for (let k2=1;k2<n-1;k2++){ const t = k2/n, p = iso(S0.x+(bx-S0.x)*t, S0.y+(by-S0.y)*t);
        c.beginPath(); c.ellipse(p.x+(rr()-.5)*26, p.y+(rr()-.5)*12, 12+rr()*6, 6+rr()*3, 0, 0, 7);
        c.fillStyle = `rgba(${170+rr()*30|0},${165+rr()*25|0},${150+rr()*20|0},.95)`; c.fill();
        c.strokeStyle='rgba(80,70,50,.35)'; c.lineWidth=1.5; c.stroke(); }
    }
  }
}
function renderFog(){
  const w = world, b = cacheBox;
  fogC = document.createElement('canvas');
  fogC.width = Math.ceil(b.w*CS); fogC.height = Math.ceil(b.h*CS);
  const c = fogC.getContext('2d');
  c.setTransform(CS,0,0,CS,-b.x*CS,-b.y*CS);
  const N = w.N, cloud = IMG.cloud, pad = 3;
  const list = [];
  for (let y=-pad;y<N+pad;y++) for (let x=-pad;x<N+pad;x++){
    const inside = x>=0&&y>=0&&x<N&&y<N;
    if (inside && w.tiles[y*N+x].rev) continue;
    list.push([x,y]);
  }
  list.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));
  // 1) 바탕 안개(빈틈 없게)
  c.fillStyle = '#eef1fb';
  for (const [x,y] of list){ const p = iso(x,y); diamond(c, p.x, p.y-6, 10); c.fill(); }
  // 2) 뭉게구름
  for (const [x,y] of list){ const r = cloudRect(x, y); c.drawImage(cloud, r.x, r.y, r.w, r.h); }
}
// 칸마다 정해진 뭉게구름 위치·크기(늘 같은 모양)
function cloudRect(x, y){
  const cloud = IMG.cloud, p = iso(x,y), h = ((x*73856093) ^ (y*19349663)) >>> 0, j = (h%1000)/1000, k = ((h>>10)%1000)/1000;
  const cw = TW*(1.35 + j*.5), ch = cw * cloud.height / cloud.width;
  return {x:p.x - cw/2 + (k-.5)*30, y:p.y - ch*.72 + (j-.5)*14, w:cw, h:ch};
}

/* ══════════ 오브젝트 스프라이트 크기 ══════════ */
function spriteRect(o, x, y, extra=0){
  const d = OBJS[o], im = IMG[imgOf(o, x, y)], p = objCenter(o, x, y), big = fpOf(o) === 2;
  const w = TW*d.w, h = w * im.height / im.width;
  if (d.flat) return {x:p.x - w/2, y:p.y - h/2 - 6, w, h};
  return {x:p.x - w/2, y:p.y + TH*(big ? .82 : .28) - h + extra, w, h};
}
// 상태에 따라 바뀌는 그림(밭)
function imgOf(o, x, y){
  if (o !== 'field' || !world) return OBJS[o].img;
  const f = fieldAt(x, y); if (!f) return 'f_empty';
  if (f.locked) return 'f_empty';
  if (!f.crop) return 'f_empty';
  return f.end <= Date.now() ? CROPS[f.crop].img : 'f_sprout';
}

/* ══════════ 플레이어 ══════════ */
const player = {x:0, y:0, path:[], face:1, work:0, workT:0, target:null};
let queue = [];       // [{i, cost}]
let reach = new Set();
function walkable(w, x, y){ if (x<0||y<0||x>=w.N||y>=w.N) return false; const t = w.tiles[y*w.N+x]; return t.rev && (!t.o || !!OBJS[t.o].walk); }
function computeReach(){
  const w = world, N = w.N, seen = new Set();
  const sx = Math.round(player.x), sy = Math.round(player.y);
  const q = [[sx,sy]]; seen.add(sy*N+sx);
  while (q.length){ const [x,y] = q.shift();
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy, k=ny*N+nx;
      if (!seen.has(k) && walkable(w,nx,ny)){ seen.add(k); q.push([nx,ny]); } } }
  reach = seen;
}
function findPath(w, fx, fy, goalSet){
  const N = w.N, prev = new Map(), start = fy*N+fx; prev.set(start, -1);
  const q = [start];
  while (q.length){ const k = q.shift();
    if (goalSet.has(k)){ const path = []; let c = k; while (c !== -1){ path.push([c%N, (c/N)|0]); c = prev.get(c); } return path.reverse().slice(1); }
    const x = k%N, y = (k/N)|0;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy, nk=ny*N+nx;
      if (!prev.has(nk) && walkable(w,nx,ny)){ prev.set(nk,k); q.push(nk); } } }
  return null;
}
function standSpots(i){
  const w = world, N = w.N, x0 = i%N, y0 = (i/N)|0, set = new Set(), f = fpOf(w.tiles[i].o);
  for (let fy=0;fy<f;fy++) for (let fx2=0;fx2<f;fx2++){ const x = x0+fx2, y = y0+fy;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if (nx>=0&&ny>=0&&nx<N&&ny<N&&reach.has(ny*N+nx)) set.add(ny*N+nx); } }
  return set;
}

/* ══════════ 효과(파티클·떠오르는 글자) ══════════ */
const fx = [];
function burst(x, y, color, n=14){
  const p = iso(x,y);
  for (let i=0;i<n;i++) fx.push({t:'p', x:p.x, y:p.y-30, vx:(Math.random()-.5)*260, vy:-120-Math.random()*220, life:.8+Math.random()*.4, age:0, c:color, s:3+Math.random()*5});
}
function floatText(x, y, text, color='#fff'){ const p = iso(x,y); fx.push({t:'txt', x:p.x, y:p.y-90, text, color, age:0, life:1.3}); }
function flyToBag(x, y, img, n){
  const p = iso(x,y);
  for (let i=0;i<Math.min(n,4);i++) fx.push({t:'fly', wx:p.x+(Math.random()-.5)*40, wy:p.y-50, img, age:-i*.08, life:1.0, jx:(Math.random()-.5)*80});
}
let fogFx = [];   // 걷히는 중인 구름(안개 그림 위에 따로 그림)
function fogPuffs(cells, cx, cy){
  if (cx == null){ cx = cells.reduce((a,c) => a + c[0], 0) / cells.length; cy = cells.reduce((a,c) => a + c[1], 0) / cells.length; }
  const c0 = iso(cx, cy);
  for (const [x,y] of cells){
    const r = cloudRect(x, y), p = iso(x, y), dx = p.x - c0.x, dy = p.y - c0.y, d = Math.hypot(dx, dy) || 1;
    fogFx.push({x, y, r, p, ux:dx/d, uy:dy/d, delay: Math.hypot(x-cx, y-cy) * .09, age:0, life:1.1});
  }
  fogFx.sort((a,b) => (a.x+a.y) - (b.x+b.y));
}
function drawFogFx(dt){
  if (!fogFx.length) return;
  const cloud = IMG.cloud;
  for (const f of fogFx) f.age += dt;
  fogFx = fogFx.filter(f => f.age < f.delay + f.life);
  // 1) 바탕 안개: 구름보다 먼저 옅어짐
  ctx.fillStyle = '#eef1fb';
  for (const f of fogFx){ const a = Math.max(0, Math.min(1, (f.age - f.delay) / (f.life*.45)));
    if (a >= 1) continue; ctx.globalAlpha = 1 - a; diamond(ctx, f.p.x, f.p.y-6, 10); ctx.fill(); }
  // 2) 뭉게구름: 제자리에서 기다렸다가 → 바깥으로 밀려나며 부풀고 사라짐(부드러운 감속)
  for (const f of fogFx){ const t = Math.max(0, (f.age - f.delay) / f.life), e = 1 - Math.pow(1 - t, 3);
    const push = 70 * e, sc = 1 + .35*e, w = f.r.w*sc, h = f.r.h*sc, cxp = f.r.x + f.r.w/2 + f.ux*push, cyp = f.r.y + f.r.h/2 + f.uy*push*.6 - 26*e;
    ctx.globalAlpha = Math.max(0, 1 - t*t*1.1); ctx.drawImage(cloud, cxp - w/2, cyp - h/2, w, h); }
  ctx.globalAlpha = 1;
}

/* ══════════ 소리: 효과음 + 배경음악 (WebAudio로 즉석 합성, 소리 파일 없음) ══════════ */
let AC = null, MASTER = null, SFXBUS = null, BGMBUS = null, NOISE = null;
function audio(){
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  MASTER = AC.createGain(); MASTER.connect(AC.destination);
  SFXBUS = AC.createGain(); SFXBUS.connect(MASTER); BGMBUS = AC.createGain(); BGMBUS.connect(MASTER);
  const len = AC.sampleRate * .5, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1; NOISE = buf;
  setVolume(); return AC;
}
function setVolume(){ if (!AC) return; const v = S.vol == null ? .7 : S.vol;
  MASTER.gain.value = v; SFXBUS.gain.value = S.sound ? 1 : 0; BGMBUS.gain.value = S.music ? .55 : 0; }
// 음 하나: 주파수(f → f2로 미끄러짐), 길이, 파형, 크기, 시작 지연
function tone(f, dur, type='sine', vol=.12, at=0, f2=null, bus=SFXBUS){
  const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .05);
}
// 잡음(나무 찍기·바위·물): 필터 종류와 주파수로 질감을 바꿈
function noise(dur, ftype='lowpass', freq=800, vol=.15, at=0, bus=SFXBUS){
  const t = AC.currentTime + at, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = NOISE; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(bus); src.start(t); src.stop(t + dur + .02);
}
const SFX = {

  coin:  () => { tone(988, .08, 'square', .06); tone(1319, .18, 'square', .06, .07); },
  chop:  () => { noise(.07, 'bandpass', 1400, .22); tone(140, .08, 'triangle', .14, 0, 90); },          // 도끼질
  wood:  () => { noise(.18, 'lowpass', 900, .2); tone(110, .2, 'triangle', .16, 0, 60); },             // 나무가 쓰러짐
  rock:  () => { noise(.22, 'lowpass', 500, .3); tone(90, .18, 'sine', .14, 0, 50); },                 // 돌 깨짐
  leaf:  () => { noise(.15, 'highpass', 3000, .08); tone(660, .12, 'sine', .07, .03, 990); },          // 덤불·꽃
  ice:   () => { [1568, 2093, 2637].forEach((f, k) => tone(f, .25, 'sine', .05, k*.04)); noise(.12, 'highpass', 5000, .06); },
  boom:  () => { noise(.6, 'lowpass', 300, .5); tone(80, .5, 'sawtooth', .18, 0, 30); },
  chest: () => { [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, .22, 'triangle', .08, k*.06)); },
  rune:  () => { [392, 587, 784, 1175].forEach((f, k) => tone(f, .5, 'sine', .09, k*.09)); noise(.5, 'highpass', 6000, .03, .1); },
  harvest:() => { tone(440, .1, 'triangle', .09, 0, 660); tone(660, .14, 'triangle', .09, .08, 990); noise(.12, 'highpass', 2500, .06); },
  build: () => { [0, .16, .32].forEach(at => { noise(.06, 'bandpass', 2200, .25, at); tone(300, .06, 'square', .05, at); }); tone(784, .3, 'sine', .08, .5); tone(1047, .4, 'sine', .08, .6); },
  quest: () => { [[523,0],[659,.1],[784,.2],[1047,.32],[784,.46],[1047,.56]].forEach(([f, at]) => tone(f, .22, 'square', .05, at)); },
  level: () => { [523, 659, 784, 1047].forEach((f, k) => tone(f, .3, 'sine', .12, k*.09)); tone(1568, .6, 'sine', .06, .4); },
  splash:() => { noise(.3, 'bandpass', 1200, .18); tone(500, .2, 'sine', .05, 0, 200); },
};
function sfx(kind){
  if (!S.sound || !audio()) return;
  if (AC.state === 'suspended') AC.resume();
  (SFX[kind] || SFX.pop)();
}
// 치운 물체에 어울리는 소리
function sfxFor(d){
  if (d.tool) return 'boom'; if (d.rune) return 'rune'; if (d.chest) return 'chest';
  const k = Object.keys(d.drops || {});
  if (k.includes('ice') || k.includes('crystal')) return 'ice';
  if (k.some(i => ['stone','coal','ore','gold','obsidian','sandstone','fire','clay'].includes(i))) return 'rock';
  if (k.includes('wood') || k.includes('bamboo') || k.includes('vine')) return 'wood';
  return 'leaf';
}

/* 배경음악: 장면마다 다른 분위기의 짧은 곡을 즉석 연주(반복). 화음 진행 + 베이스 + 멜로디 + 가벼운 박자 */
const N2F = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = {
  camp:   {bpm:92,  scale:[0,2,4,7,9],  root:60, chords:[[0,4,7],[9,12,16],[5,9,12],[7,11,14]], lead:'triangle', drum:.5},  // 평화로운 캠프(장조)
  ch1:    {bpm:108, scale:[0,2,4,7,9],  root:62, chords:[[0,4,7],[7,11,14],[9,12,16],[5,9,12]], lead:'square',   drum:1},   // 숲 탐험
  ch2:    {bpm:116, scale:[0,2,4,7,9],  root:65, chords:[[0,4,7],[5,9,12],[7,11,14],[0,4,7]],  lead:'square',   drum:1},   // 바다·섬
  ch4:    {bpm:96,  scale:[0,2,4,7,11], root:64, chords:[[0,4,7,11],[5,9,12,16],[9,12,16],[7,11,14]], lead:'sine', drum:.6},   // 신비의 섬(몽글몽글)
  ch3:    {bpm:100, scale:[0,2,3,7,9],  root:57, chords:[[0,3,7],[5,8,12],[10,14,17],[7,10,14]], lead:'triangle', drum:.8}, // 산맥(단조 느낌)
  fest:   {bpm:128, scale:[0,2,4,7,9],  root:67, chords:[[0,4,7],[5,9,12],[0,4,7],[7,11,14]],  lead:'square',   drum:1.2}, // 축제
};
let BGM = {name:null, timer:0, step:0, next:0, seed:1};
function songFor(key){ if (key === 'home') return 'camp'; if (key === 'fest') return 'fest'; const r = REGIONS[key]; return r ? 'ch' + Math.min(4, r.ch || 1) : 'camp'; }
function playMusic(name){
  if (!S.music || !audio()) { stopMusic(); return; }
  if (BGM.name === name && BGM.timer) return;
  stopMusic(); BGM = {name, timer:0, step:0, next:AC.currentTime + .1, seed:hashKey(name)};
  BGM.timer = setInterval(bgmTick, 100);
}
function stopMusic(){ if (BGM.timer) clearInterval(BGM.timer); BGM.timer = 0; BGM.name = null; }
function bgmTick(){
  if (!AC || AC.state !== 'running') { if (AC && AC.state === 'suspended' && !document.hidden) AC.resume(); return; }
  const sg = SONGS[BGM.name], spb = 60 / sg.bpm / 2;          // 8분음표 길이
  while (BGM.next < AC.currentTime + .3){
    const st = BGM.step, bar = Math.floor(st / 8) % 4, beat = st % 8, at = BGM.next - AC.currentTime, ch = sg.chords[bar];
    if (beat === 0) ch.forEach(n => tone(N2F(sg.root + n - 12), spb*7.5, 'triangle', .035, at, null, BGMBUS));   // 화음 깔기
    if (beat % 4 === 0) tone(N2F(sg.root + ch[0] - 24), spb*3, 'sine', .09, at, null, BGMBUS);                     // 베이스
    // 멜로디: 곡마다 정해진 무늬(매번 같은 곡으로 반복)
    const r = rng((BGM.seed + st % 32 * 97) >>> 0);
    if (r() < .62){ const deg = Math.floor(r() * sg.scale.length), oct = r() < .25 ? 12 : 0;
      tone(N2F(sg.root + sg.scale[deg] + oct), spb * (r() < .3 ? 1.8 : .9), sg.lead, .028, at, null, BGMBUS); }
    if (sg.drum && beat % 2 === 0) noise(.04, 'highpass', 7000, .025 * sg.drum, at, BGMBUS);      // 찰랑
    if (sg.drum && beat === 4) noise(.08, 'bandpass', 1800, .04 * sg.drum, at, BGMBUS);           // 딱
    BGM.step++; BGM.next += spb;
  }
}
// 브라우저는 사용자가 한 번 누른 뒤에야 소리를 낼 수 있음 → 첫 터치에서 음악 시작
addEventListener('pointerdown', () => { if (S && S.music && audio()){ if (AC.state === 'suspended') AC.resume(); playMusic(songFor(S.where)); } }, {once:true});
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.gbtn, .tab, .chbtn, .qbtn')) sfx('click'); }, true);

/* ══════════ 장면 전환 ══════════ */
function enter(key){

  // 저장된 작업 줄 복구(에너지는 이미 사용됨)

/* ══════════ 탭 처리 ══════════ */
function pickObject(wx, wy){
  const w = world, N = w.N, hits = [];
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const t = w.tiles[y*N+x]; if (!t.o || !t.rev || OBJS[t.o].hidden) continue;
    const r = spriteRect(t.o, x, y);
    const mx = r.w*.14, my = r.h*.08;
    if (wx > r.x+mx && wx < r.x+r.w-mx && wy > r.y+my && wy < r.y+r.h) hits.push({i:y*N+x, d:x+y+(fpOf(t.o)-1)*2});
  }
  if (!hits.length){ const g = unIso(wx, wy); const x = Math.round(g.x), y = Math.round(g.y);
    if (x>=0&&y>=0&&x<N&&y<N){ const t = w.tiles[y*N+x]; return t.o === '_blk' ? {i:t.ref} : {i:y*N+x, tile:true}; } return null; }
  hits.sort((a,b)=>b.d-a.d); return hits[0];
}
function onTap(sx, sy){
  const wx = (sx - W/2)/cam.z + cam.x, wy = (sy - H/2)/cam.z + cam.y;
  if (placing){ const g = unIso(wx, wy), x = Math.round(g.x), y = Math.round(g.y); placeDecor(x, y); return; }
  if (editMode){ editTap(wx, wy); return; }
  const hit = pickObject(wx, wy); if (!hit) return;
  const w = world, t = w.tiles[hit.i], x = hit.i % w.N, y = (hit.i / w.N)|0;
  if (!t.rev){ toast('구름 너머는 아직 알 수 없어요'); return; }
  if (!t.o){ // 빈 땅: 걸어가기
    if (reach.has(hit.i) && !player.work && !queue.length){ const p = findPath(w, Math.round(player.x), Math.round(player.y), new Set([hit.i])); if (p) player.path = p; }
    return;
  }
  const d = OBJS[t.o];
  if (d.fixed){
    if (d.act){ const spots = standSpots(hit.i); const p = spots.size && !queue.length ? findPath(w, Math.round(player.x), Math.round(player.y), spots) : null;
      if (p && p.length){ player.path = p; player.face = x > player.x ? 1 : -1; }
      doAct(d.act, hit.i); }
    return;
  }
  if (queue.some(q => q.i === hit.i)){ toast('이미 작업 순서에 있어요'); return; }
  if (!standSpots(hit.i).size){ sfx('no'); toast('가까운 곳부터 차례로 치워야 해요'); return; }
  if (d.tool && (S.inv[d.tool]||0) < 1){ sfx('no'); openDynamite(true); return; }
  if (S.energy < d.cost){ sfx('no'); openShop(true); return; }
  if (d.tool){ S.inv[d.tool]--; toast(`${ITEMS[d.tool].name} 1개 사용!`); }
  addEnergy(-d.cost); gainXP(d.cost * CONFIG.xpPerEnergy); stat('energy', d.cost);
  queue.push({i:hit.i, cost:d.cost}); sfx('pop'); save();
}
function doAct(a, i){
  if (a === 'field') fieldTap(world.tiles[i].fid);
  else if (a === 'decor') openDecorItem(i);
  else if (a === 'repair') openRepair(world.tiles[i].spot);
  else if (a === 'cabin' || a === 'tent') openBuilding(a);
  else if (PROD[a]) prodTap(a);
  else if (a === 'order') openOrders();
  else if (a === 'pet'){ const t = world.tiles.findIndex(t=>t.o==='husky'); burst(t%world.N, (t/world.N)|0, '#ff7aa8', 10); floatText(t%world.N,(t/world.N)|0,'♥','#ff5a8a'); sfx('pop'); }
}

/* ══════════ 작업 진행 ══════════ */
function updatePlayer(dt){
  const w = world;
  if (player.path.length){
    const [tx,ty] = player.path[0], dx = tx-player.x, dy = ty-player.y, dist = Math.hypot(dx,dy), sp = 4.2*dt;
    if (Math.abs(dx - dy) > 0.01) player.face = (dx - dy) > 0 ? 1 : -1;
    if (dist <= sp){ player.x = tx; player.y = ty; player.path.shift();
    }
    else { player.x += dx/dist*sp; player.y += dy/dist*sp; }
    return;
  }
  if (player.work){
    player.workT += dt;
    if (Math.floor(player.workT*5) !== Math.floor((player.workT-dt)*5)){ const x = player.target%w.N, y=(player.target/w.N)|0; burst(x, y, OBJS[w.tiles[player.target].o].fx, 4); sfx('chop'); }
    if (player.workT >= player.work){ finishWork(); }
    return;
  }
  if (queue.length){
    const q = queue[0], spots = standSpots(q.i);
    if (!spots.size){ queue.shift(); addEnergy(q.cost); return; }   // 막히면 에너지 돌려줌
    const here = Math.round(player.y)*w.N + Math.round(player.x);
    if (spots.has(here)){
      const d = OBJS[w.tiles[q.i].o];
      player.target = q.i; player.workT = 0; player.work = .45 + d.cost*.09;
      player.face = (q.i % w.N) - (((q.i / w.N)|0)) > player.x - player.y ? 1 : -1;
    } else {
      const p = findPath(w, Math.round(player.x), Math.round(player.y), spots);
      if (p) player.path = p; else { queue.shift(); addEnergy(q.cost); }
    }
  }
}
function finishWork(){
  const w = world, i = player.target, t = w.tiles[i], d = OBJS[t.o], x = i % w.N, y = (i / w.N)|0;
  queue.shift(); player.work = 0; player.target = null; stat('cleared'); S.stats.clearedBy[t.o] = (S.stats.clearedBy[t.o]||0) + 1;
  burst(x, y, d.fx, 18); sfx(sfxFor(d));
  let lines = [];
  for (const [k,n] of Object.entries(d.drops)){ if (k === 'medal'){ evCheck(); S.event.medals += n; S.seen.medal = 1; S.stats.got.medal = (S.stats.got.medal||0) + n; } else addItem(k, n);
    flyToBag(x, y, k==='flower'?'flowers':ITEMS[k].img, n); lines.push(`+${n} ${ITEMS[k].name}`); }
  if (d.chest){
    const r = Math.random(), coins = 40 + (Math.random()*80|0);
    const cc = mulC(coins); S.coins += cc; lines.push(`+${cc} 코인`); flyToBag(x,y,'i_coin',3);
    if (r < .45){ S.gems += 2; lines.push('+2 보석'); }
    if (r > .5){ addEnergy(10); lines.push('+10 에너지'); }
    sfx('coin');
  }
  floatText(x, y, lines.join('  '), d.rune ? '#ffd54a' : '#fff');
  t.o = null;
  w.region.cleared.push(i);
  const cells = revealAround(w, x, y, 2.3);
  if (cells.length){ renderFog(); fogPuffs(cells, x, y); }
  computeReach();
  if (d.rune){
    w.region.runes++;
    toast(`룬 석판 발견! (${Math.min(w.region.runes, CONFIG.runesPerRegion)}/${CONFIG.runesPerRegion})`);
  }
  checkQuestReady();
  updateQuest(); updateHUD(); save();
}
function regionComplete(){
  const R = REGIONS[world.key];
  world.region.clears++;
  S.gems += CONFIG.regionClearGems; S.coins += CONFIG.regionClearCoins;
  updateHUD(); save(); sfx('level');
  showModal('탐험 완료!', `<div class="celebrate"><img src="${src(R.img)}" style="width:150px">
    <p><b>${R.name}</b>의 룬 석판 ${CONFIG.runesPerRegion}개를 모두 찾았어요!</p>
    <p><img src="${src('i_gem')}" style="width:26px;vertical-align:middle"> +${CONFIG.regionClearGems}
       &nbsp; <img src="${src('i_coin')}" style="width:26px;vertical-align:middle"> +${CONFIG.regionClearCoins}</p>
    <p class="hint">계속 남은 곳을 치워도 되고, 새로운 모습의 지역으로 다시 탐험할 수도 있어요.</p>
    <div class="row-btns"><button class="gbtn" data-close>계속 둘러보기</button><button class="gbtn blue" id="reroll">새 탐험 시작</button></div></div>`);
  document.getElementById('reroll').onclick = () => { const k = world.key; const c = S.regions[k].clears;
    S.regions[k] = {seed:(Math.random()*1e9)|0, cleared:[], runes:0, clears:c, queue:[]}; closeModal(); enter(k); };

const napLeft = () => S.napTs + napHoursOf(S.bld.tent)*3600e3 - Date.now();
function nap(){
  const left = napLeft();
  if (left > 0){ const m = Math.ceil(left/60000); toast(`아직 졸리지 않아요 · ${Math.floor(m/60)}시간 ${m%60}분 뒤 낮잠 가능`); return false; }
  const e = napEnergy(S.bld.tent);
  S.napTs = Date.now(); addEnergy(e); sfx('level');
  if (world.home){ const [x,y] = objPos('tent'); floatText(x, y, `낮잠 zZ +${e} 에너지`, '#bfe9ff'); }
  return true;
}

/* ══════════ 생산(요리·제재·대장간) ══════════ */
const prodMs = (k, r) => r.min * 60000 * Math.max(0.05, CONFIG.prodSpeed) * (1 - 0.1*((S.bld[k]||1)-1));
const jobsDone = k => (S.prod[k]||[]).filter(j => j.end <= Date.now());
function startJob(k, id, quiet){
  const r = PROD[k].find(r => r.id === id), jobs = S.prod[k];
  if (!r || !has(r.need) || jobs.length >= capOf(k)) return false;
  for (const [i,n] of Object.entries(r.need)) S.inv[i] -= n;
  const lastEnd = jobs.length ? Math.max(...jobs.map(j=>j.end)) : 0;
  const start = isAnimal(k) ? Date.now() : Math.max(Date.now(), lastEnd);   // 건물은 한 줄로 차례차례, 동물은 동시에
  jobs.push({id, end:start + prodMs(k, r)});
  if (!quiet) sfx('pop'); save(); return true;
}
// 즉시 완성: 진행 중인 첫 작업을 보석으로 끝냄
function speedCost(k){
  const now = Date.now(), run = (S.prod[k]||[]).filter(j => j.end > now).sort((a,b)=>a.end-b.end)[0];
  if (!run) return null;
  const ahead = isAnimal(k) ? run.end - now : run.end - now;
  return {job:run, left:ahead, gems:Math.max(1, Math.ceil(ahead / (CONFIG.speedUpMinPerGem*60000)))};
}
function speedUp(k){
  const c = speedCost(k); if (!c) return;
  if (S.gems < c.gems){ sfx('no'); toast('보석이 부족해요'); return; }
  S.gems -= c.gems;
  if (isAnimal(k)) c.job.end = Date.now();
  else for (const j of S.prod[k]) if (j.end >= c.job.end) j.end -= c.left;   // 뒤에 기다리던 것도 당겨짐
  sfx('coin'); updateHUD(); save();
}
function collect(k){
  const done = jobsDone(k); if (!done.length) return 0;
  S.prod[k] = S.prod[k].filter(j => !done.includes(j));
  let xp = 0;
  for (const j of done){ addItem(j.id, 1); xp += PROD[k].find(r=>r.id===j.id).xp; S.stats.made[j.id] = (S.stats.made[j.id]||0) + 1; }
  if (world.home){ const [x,y] = objPos(k); for (const j of done) flyToBag(x, y, ITEMS[j.id].img, 1);
    floatText(x, y, done.map(j=>'+1 '+ITEMS[j.id].name).join('  '), '#fff'); }
  sfx('coin'); gainXP(xp); updateHUD(); save();
  return done.length;
}
function prodTap(k){
  if (!S.bld[k]) { openBuilding(k); return; }
  if (collect(k)) return;
  openProd(k);
}

/* ══════════ 밭 ══════════ */
function fieldState(fid){ const f = S.fields[fid] || (S.fields[fid] = {crop:null, end:0}); f.locked = fid >= S.fieldsOpen; return f; }
function fieldAt(x, y){ const t = world.tiles[y*world.N + x]; return t && t.fid != null ? fieldState(t.fid) : null; }
function fieldTap(fid){
  const f = fieldState(fid), [fx0, fy0] = FIELD_POS[fid], cx = fx0+.5, cy = fy0+.5;
  if (f.locked){ openFieldBuy(fid); return; }
  if (!f.crop){ openPlant(fid); return; }
  if (f.end > Date.now()){ openFieldWait(fid); return; }
  const c = CROPS[f.crop];   // 수확
  addItem(f.crop, c.yield); S.stats.harvest[f.crop] = (S.stats.harvest[f.crop]||0) + c.yield;
  flyToBag(cx, cy, ITEMS[f.crop].img, c.yield); floatText(cx, cy, `+${c.yield} ${ITEMS[f.crop].name}`);
  burst(cx, cy, c.tint, 16); sfx('harvest'); gainXP(c.yield);
  f.crop = null; f.end = 0; save();
}
function plant(fid, crop, quiet){
  const f = fieldState(fid), c = CROPS[crop];
  if (f.locked || f.crop || S.level < c.lv || S.coins < c.cost) return false;
  S.coins -= c.cost; f.crop = crop; f.end = Date.now() + c.min*60000*Math.max(.05, CONFIG.prodSpeed);
  if (!quiet){ const [x,y] = FIELD_POS[fid]; burst(x+.5, y+.5, '#7a5a2a', 10); sfx('pop'); }
  updateHUD(); save(); return true;
}

/* ══════════ 그리기 ══════════ */
let hoverI = -1, last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (world){ updatePlayer(dt);
    if (camGo){ const k = Math.min(1, dt*6); cam.x += (camGo.x - cam.x)*k; cam.y += (camGo.y - cam.y)*k;
      if (Math.hypot(camGo.x - cam.x, camGo.y - cam.y) < 2) camGo = null; }
    draw(dt); }
  requestAnimationFrame(frame);
}
function draw(dt){
  const w = world, N = w.N, T = performance.now()/1000;
  LATER = [];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sky = ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#aad8f2'); sky.addColorStop(1,'#e6f2fb');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z, DPR*(W/2 - cam.x*cam.z), DPR*(H/2 - cam.y*cam.z));
  const b = cacheBox;
  ctx.drawImage(groundC, b.x, b.y, b.w, b.h);

  // 화면에 보이는 범위만
  const vx0 = cam.x - W/2/cam.z - TW*1.5, vx1 = cam.x + W/2/cam.z + TW*1.5, vy0 = cam.y - H/2/cam.z - TH*6, vy1 = cam.y + H/2/cam.z + TH*3;
  const items = [];
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const t = w.tiles[y*N+x]; if (!t.o || !t.rev || OBJS[t.o].hidden) continue;
    const p = iso(x,y); if (p.x < vx0 || p.x > vx1 || p.y < vy0 || p.y > vy1) continue;
    const big = fpOf(t.o) === 2, flat = OBJS[t.o].flat;
    items.push({d:flat ? -1 + .001*(x+y) : x+y+(big?2:0)+.001*x, x, y, i:y*N+x, o:t.o});
  }
  items.push({d:player.x+player.y+.5, pl:true});
  items.sort((a,b)=>a.d-b.d);
  if ((placing || carry) && w.home) for (let y=1;y<N-1;y++) for (let x=1;x<N-1;x++) if (canPlace(x,y)){ const p = iso(x,y);
    ctx.beginPath(); ctx.moveTo(p.x, p.y-TH/2+4); ctx.lineTo(p.x+TW/2-8, p.y); ctx.lineTo(p.x, p.y+TH/2-4); ctx.lineTo(p.x-TW/2+8, p.y); ctx.closePath();
    ctx.fillStyle = 'rgba(110,224,74,.28)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke(); }
  const qIdx = new Map(queue.map((q,n)=>[q.i,n]));
  for (const it of items){
    if (it.pl){ drawPlayer(T); continue; }
    const d = OBJS[it.o], big = fpOf(it.o) === 2;
    if (it.o === 'field'){ drawField(it, T); continue; }
    const im = IMG[imgOf(it.o, it.x, it.y)];
    let r = spriteRect(it.o, it.x, it.y);

/* ══════════ 이야기 미션 ══════════ */
const objVal = (key, st, o) => o.t === 'clear' ? (S.stats.clearedBy[o.o]||0) : o.t === 'get' ? (S.stats.got[o.i]||0)
  : o.t === 'fix' ? ((st.fixed||{})[o.s] ? 1 : 0) : Math.min(st.runes, CONFIG.runesPerRegion);
const objNeed = o => o.t === 'fix' ? 1 : o.n;
function ensureQuest(key){
  const st = S.regions[key], story = STORY[key]; if (!st || !story) return null;
  if (st.qi == null){ st.qi = 0; st.qb = story.quests[0].objs.map(o => objVal(key, st, o)); }
  return st;
}
function curQuest(key){ const st = ensureQuest(key); if (!st || st.qdone) return null; return STORY[key].quests[st.qi]; }
function objProg(key, o, k){
  const st = S.regions[key], v = objVal(key, st, o);
  const base = (o.t === 'clear' || o.t === 'get') ? (st.qb[k]||0) : 0;
  return Math.max(0, Math.min(objNeed(o), v - base));
}
const questReady = key => { const q = curQuest(key); return !!q && q.objs.every((o,k) => objProg(key, o, k) >= objNeed(o)); };
let readyTold = {};
function checkQuestReady(){
  for (const key of Object.keys(STORY)) if (S.regions[key] && questReady(key) && !readyTold[key+S.regions[key].qi]){
    readyTold[key+S.regions[key].qi] = 1; toast('미션 완료! 왼쪽 미션 단추에서 보상을 받아요'); sfx('level'); }
  renderQuestBtns();
}
function objText(o, key){
  if (o.t === 'clear') return `${OBJS[o.o].name}${josa(OBJS[o.o].name,'을/를')} 치우세요`;
  if (o.t === 'get')   return `${ITEMS[o.i].name}${josa(ITEMS[o.i].name,'을/를')} 모으세요`;
  if (o.t === 'fix')   return `${STORY[key].repairs[o.s].name}${josa(STORY[key].repairs[o.s].name,'을/를')} 고치세요`;
  return '룬 석판을 찾으세요';
}
function objIcon(o, key){ return o.t === 'clear' ? OBJS[o.o].img : o.t === 'get' ? ITEMS[o.i].img : o.t === 'fix' ? 'fix_' + STORY[key].repairs[o.s].kind : 'rune'; }
function josa(w, pair){ const c = w.charCodeAt(w.length-1) - 0xAC00; const [a,b] = pair.split('/'); return c >= 0 && c <= 11171 && c % 28 ? a : b; }
function rewardHtml(rw){
  return [rw.xp && `<span><img src="${src('i_energy')}" style="filter:hue-rotate(200deg)">★${rw.xp}</span>`, rw.coins && `<span><img src="${src('i_coin')}">${mulC(rw.coins)}</span>`,
    rw.gems && `<span><img src="${src('i_gem')}">${rw.gems}</span>`, rw.dynamite && `<span><img src="${src('i_dynamite')}">${rw.dynamite}</span>`,
    rw.decor && `<span><img src="${src(DECOR[rw.decor].img)}">${DECOR[rw.decor].name}</span>`].filter(Boolean).join('');
}
// 원작 '후속 조치' 화면 구성: 제목 / 초상화 + 말풍선 / 리워드 / 목표 줄(✓ 또는 진행·돋보기)
function openQuest(key){
  const st = ensureQuest(key), story = STORY[key]; if (!st) return;
  if (st.qdone){ toast('이 지역의 미션을 모두 끝냈어요!'); return; }
  const q = story.quests[st.qi], npc = NPCS[q.npc], ready = questReady(key);
  document.body.classList.add('pv-open');
  root.innerHTML = `<div class="qv">
    <div class="qv-top"><h2>${q.title}</h2><small>${REGIONS[key].name} · 미션 ${st.qi+1}/${story.quests.length}</small></div>
    <button class="pv-x" data-close aria-label="닫기">✕</button>
    <div class="qv-talk"><div class="portrait" style="background-image:url(${src(npc.img)})"></div>
      <div class="bubble"><b>${npc.name}</b><p>${q.text}</p></div></div>
    <div class="qv-reward"><em>리워드:</em>${rewardHtml(q.reward)}</div>
    <div class="qv-objs">${q.objs.map((o,k) => { const pr = objProg(key, o, k), need = objNeed(o), done = pr >= need;
      return `<div class="qobj"><img src="${src(objIcon(o, key))}" alt=""><span>${objText(o, key)}</span>
        ${need > 1 && !done ? `<b class="cnt">${pr}/${need}</b>` : ''}
        ${done ? '<i class="chk">✓</i>' : `<button class="seek" data-seek="${k}" aria-label="찾아보기">🔍</button>`}</div>`; }).join('')}</div>
    ${ready ? `<button class="qv-ok" id="qClaim">보상 받기!</button>` : ''}
  </div>`;
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  root.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { const o = q.objs[+b.dataset.seek]; closeModal(); seekObj(key, o); });
  const c = document.getElementById('qClaim'); if (c) c.onclick = () => claimQuest(key);
}
function claimQuest(key){
  const st = S.regions[key], story = STORY[key], q = story.quests[st.qi]; if (!questReady(key)) return;
  const rw = q.reward;
  if (rw.coins) S.coins += mulC(rw.coins); if (rw.gems) S.gems += rw.gems; if (rw.dynamite) addItem('dynamite', rw.dynamite);
  if (rw.decor) S.decorInv[rw.decor] = (S.decorInv[rw.decor]||0) + 1;
  sfx('quest'); toast(`미션 완료! 「${q.title}」`);
  st.qi++;
  if (st.qi >= story.quests.length){ st.qdone = 1; closeModal(); if (rw.xp) gainXP(rw.xp); save(); renderQuestBtns();
    if (key === 'fest') festComplete(rw); else if (world.key === key) regionComplete(); else toast(`${REGIONS[key].name} 탐험 완료!`); return; }
  st.qb = story.quests[st.qi].objs.map(o => objVal(key, st, o));
  if (rw.xp) gainXP(rw.xp);
  save(); renderQuestBtns(); setTimeout(() => openQuest(key), 250);   // 다음 미션 이야기 바로 보여 주기
}

/* 돋보기·보기: 해당 목표가 있는 곳으로 화면을 옮기고 화살표 표시 */
let camGo = null, HL = null;
function focusTile(i){ const N = world.N, p = iso(i%N, (i/N)|0); camGo = {x:p.x, y:p.y - 40}; HL = {i, until:performance.now() + 4000}; }
function nearestTile(pred){ let best = -1, bd = 1e9; const N = world.N;
  world.tiles.forEach((t,i) => { if (!t.rev || !pred(t)) return; const d = Math.hypot(i%N - player.x, (i/N|0) - player.y); if (d < bd){ bd = d; best = i; } });
  return best; }
function seekObj(key, o){
  const here = world && !world.home && world.key === key;
  if (o.t === 'get'){
    const prod = Object.keys(PROD).find(k => PROD[k].some(r => r.id === o.i));
    const crop = CROPS[o.i];
    if (here){ const types = Object.keys(OBJS).filter(k => OBJS[k].drops && OBJS[k].drops[o.i]);
      const i = types.length ? nearestTile(t => types.includes(t.o)) : -1;
      if (i >= 0){ focusTile(i); toast(`${OBJS[world.tiles[i].o].name}에서 ${ITEMS[o.i].name}${josa(ITEMS[o.i].name,'을/를')} 얻어요`); return; } }
    if (prod){ if (world.home) openProd(prod); else toast(`${ITEMS[o.i].name}${josa(ITEMS[o.i].name,'은/는')} 캠프의 ${PROD_NAME[prod]}에서 만들어요`); return; }

    toast(here ? '구름을 더 걷어 내면 찾을 수 있어요' : `${REGIONS[key].name}에서 찾아보세요`); return;

function buildFestival(){
  evCheck();

  let st = S.regions.fest;
  if (!st || st.wk !== wk) st = S.regions.fest = {wk, cleared:[], runes:0, clears:0, queue:[]};
  const N = CONFIG.mapSize, r = rng((wk * 7919 + 13) >>> 0), tiles = [], start = {x:11, y:19};
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ const d = Math.hypot(x-start.x, y-start.y);
    tiles.push({o: d > 1.6 && r() < 0.86 ? pickW(R.mix, r) : null, rev:false, seed:r()}); }
  tiles[19*N+9].o = 'tent_camp';

  const light = ['lantern','flowers', null, null, null, null, null];
  for (let y=start.y-2; y>=FEST_STAGE[1]+1; y--){ const t = tiles[y*N+start.x]; t.path = true; t.o = light[Math.floor(r()*light.length)]; }
  const si = FEST_STAGE[1]*N + FEST_STAGE[0]; tiles[si].o = (st.fixed||{})[0] ? 'done_stage' : 'fix_stage'; tiles[si].spot = 0; w.spots[0] = si;
