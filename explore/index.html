/* 과제 수첩 */
function taskProgress(t){
  const v = t.kind === 'harvest' ? (S.stats.harvest[t.key]||0) : t.kind === 'make' ? (S.stats.made[t.key]||0) : (S.stats[t.kind]||0);
  return Math.min(t.n, v - t.base);
}
function makeTask(){
  const lv = S.level, opts = [];
  const add = (kind, key, n, text, img) => { if (!S.tasks.some(t => t.kind === kind && t.key === key)) opts.push({kind, key, n, text, img}); };
  add('cleared', '', 8 + lv*2, `장애물 ${8+lv*2}개 치우기`, 'boulder');
  add('energy', '', 40 + lv*10, `에너지 ${40+lv*10} 쓰기`, 'i_energy');
  add('harvest', 'wheat', 9 + lv*2, `밀 ${9+lv*2}개 수확하기`, 'i_wheat');
  if (lv >= 3) add('harvest', 'corn', 6 + lv, `옥수수 ${6+lv}개 수확하기`, 'i_corn');
  // 만들기 과제: 지어 둔 건물 + 재료를 본 적 있는 제품만
  for (const k of prodList()) for (const r of PROD[k]) { if (!Object.keys(r.need).every(i => S.seen[i])) continue;
    const n = 2 + Math.floor(lv/4); add('make', r.id, n, `${ITEMS[r.id].name} ${n}개 만들기`, ITEMS[r.id].img); }
  add('orders', '', 2, '주문 2개 들어주기', 'board');
  add('sold', '', 10, '시장에서 물건 10개 팔기', 'u_register');
  // 종류를 먼저 고르고(골고루), 그 안에서 하나
  const kinds = [...new Set(opts.map(o => o.kind))], kind = kinds[Math.floor(Math.random()*kinds.length)];
  const pool = opts.filter(o => o.kind === kind), t = pool[Math.floor(Math.random()*pool.length)];
  t.id = S.nextTaskId++;
  t.base = t.kind === 'harvest' ? (S.stats.harvest[t.key]||0) : t.kind === 'make' ? (S.stats.made[t.key]||0) : (S.stats[t.kind]||0);
  t.coins = mulC(40 + lv*15); t.xp = 15 + lv*5; const r = Math.random(); t.gems = r < .3 ? 1 : 0; t.dyn = r > .8 ? 1 : 0;
  return t;
}
function openTasks(){
  while (S.tasks.length < 3) S.tasks.push(makeTask());
  save();
  const body = `<div style="display:flex;flex-direction:column;gap:10px">${S.tasks.map(t => { const pr = taskProgress(t), done = pr >= t.n;
    return `<div class="task ${done?'done':''}"><img src="${src(t.img)}"><div class="tx"><b>${t.text}</b>
      <div class="tbar"><i style="width:${pr/t.n*100}%"></i></div><small>${pr} / ${t.n}</small></div>
      <div class="reward" style="flex-direction:column;align-items:flex-end;gap:2px"><span><img src="${src('i_coin')}"> ${t.coins}</span><span>★ ${t.xp}</span>
      ${t.gems ? `<span><img src="${src('i_gem')}"> ${t.gems}</span>` : ''}${t.dyn ? `<span><img src="${src('i_dynamite')}"> 1</span>` : ''}</div>
      <button class="gbtn" data-claim="${t.id}" ${done ? '' : 'disabled'}>받기</button></div>`; }).join('')}</div>
    <p class="hint" style="margin-top:12px">과제를 끝내고 보상을 받으면 새 과제가 나와요.</p>`;
  showModal('과제 수첩', body);
  root.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => { const t = S.tasks.find(t => t.id == b.dataset.claim); if (!t || taskProgress(t) < t.n) return;
    S.coins += t.coins; S.gems += t.gems; if (t.dyn) addItem('dynamite', 1); S.tasks = S.tasks.filter(x => x !== t);
    sfx('coin'); toast(`과제 완료! +${t.coins} 코인`); gainXP(t.xp); openTasks(); });
}

  if (k === 'board') body += `<div class="row-btns"><button class="gbtn gold" id="goOrd">주문판 열기</button></div>`;

  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on('doBuild', () => { if (!canPay(B.build)) return; pay(B.build); S.bld[k] = 1; sfx('build'); gainXP(20);
    toast(`${O.name} 완성!`); if (world.home) { const [x,y] = objPos(k); burst(x, y, '#ffd23a', 24); } save(); openBuilding(k); });
  on('doUp', () => { const c = B.cost(lv); if (!canPay(c)) return; pay(c); S.bld[k] = lv+1; sfx('build'); gainXP(15*lv);

/* 주문판 */
function makeOrder(){
  const pool = Object.keys(ITEMS).filter(k => ITEMS[k].value && S.seen[k]);
  const r = Math.random, need = {}, kinds = 1 + (r() < .55 ? 1 : 0) + (S.level >= 4 && r() < .3 ? 1 : 0);
  for (let i=0;i<kinds;i++){ const k = pool[Math.floor(r()*pool.length)]; need[k] = (need[k]||0) + Math.max(2, Math.round((3 + S.level*1.5) * (8/ITEMS[k].value) * (.7 + r()*.6))); }
  let val = 0; for (const [k,n] of Object.entries(need)) val += n*ITEMS[k].value;
  return {id:S.nextOrderId++, need, coins:Math.round(mulC(val*1.4*(1 + .15*((S.bld.board||1)-1)))/5)*5, xp:Math.round(val/3), who:['썰매견 눈송이','대장장이 곰돌','요리사 토끼','지도 제작자 부엉'][Math.floor(r()*4)]};
}
function openOrders(){
  const bl = S.bld.board || 1;
  while (S.orders.length < 3 + Math.floor((bl-1)/2)) S.orders.push(makeOrder());
  save();
  const body = `<div class="cards">${S.orders.map(o => `<div class="card"><h5><img src="${src('board')}">${o.who}의 부탁</h5>
      ${needHtml(o.need)}<div class="reward"><span><img src="${src('i_coin')}"> ${o.coins}</span><span>★ ${o.xp} 경험치</span></div>
      <div style="display:flex;gap:6px"><button class="gbtn" style="flex:1" data-ord="${o.id}" ${has(o.need)?'':'disabled'}>보내기</button>
      <button class="gbtn red" data-skip="${o.id}" title="다른 부탁으로 바꾸기">↻</button></div></div>`).join('')}</div>
    <p class="hint" style="margin-top:12px">탐험에서 모은 자원으로 부탁을 들어주면 코인과 경험치를 받아요. ↻ 버튼은 부탁을 바꿔요.</p>
    <div class="row-btns"><button class="gbtn blue" id="upBoard">★ 주문판 Lv${bl} 업그레이드</button></div>`;
  showModal('주문판', body);
  document.getElementById('upBoard').onclick = () => openBuilding('board');
  root.querySelectorAll('[data-ord]').forEach(b => b.onclick = () => { const o = S.orders.find(o=>o.id==b.dataset.ord); if (!o || !has(o.need)) return;
    for (const [k,n] of Object.entries(o.need)) S.inv[k] -= n;
    S.coins += o.coins; S.orders = S.orders.filter(x=>x!==o); stat('orders'); sfx('coin'); toast(`부탁 완료! +${o.coins} 코인`); gainXP(o.xp); openOrders(); });
  root.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { S.orders = S.orders.filter(x=>x.id!=b.dataset.skip); openOrders(); });
}

  const pathD = 'M' + M.order.map(k => `${pos[k][0]} ${pos[k][1]}`).join(' L');
  root.innerHTML = `<div class="worldmap"><div class="scroll ${ch>1?'ch'+ch:''}">
    <button class="close" data-close style="right:-30px;top:-14px">×</button>
    <h2>${M.title}</h2>
    <div class="chnav l"><button class="chbtn" data-ch="${ch-1}" ${ch<=1?'disabled':''} aria-label="이전 장">◀</button></div>
    <div class="chnav r"><button class="chbtn" data-ch="${ch+1}" ${ch>=CH_MAX?'disabled':''} aria-label="다음 장">▶</button></div>
    <svg class="paths" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${pathD}" stroke="#9c7443" stroke-width="3" vector-effect="non-scaling-stroke" stroke-dasharray="10 8" fill="none" opacity=".7"/></svg>
    ${M.deco.map(([im,x,y,w]) => `<img class="deco" src="${src(im)}" style="left:${x}%;top:${y}%;width:${w}%">`).join('')}
    ${locs.map(([k,img,name,lv]) => { const st = S.regions[k], locked = S.level < lv, here = S.where === k;
      const sub = k==='home' ? '농장 · 생산 · 주문' : locked ? `레벨 ${lv}에 열려요` : st ? (st.qdone ? `완료!${st.clears>1?` (${st.clears}회)`:''}` : `미션 ${(st.qi||0)+1}/3`) : '새로운 탐험!';
      return `<button class="loc ${locked?'locked':''} ${here?'here':''}" data-go="${k}" style="left:${pos[k][0]}%;top:${pos[k][1]}%">
        <div class="medal" style="background-image:url(${src(img)})">${st && (st.qdone || st.clears) ? `<svg class="done" viewBox="0 0 40 40"><path d="M5 21l10 10L36 8" stroke="#1d6b10" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 21l10 10L36 8" stroke="#6ee04a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}${locked?`<div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="3" fill="#3a3a3a"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#3a3a3a" stroke-width="2.6" fill="none"/><circle cx="12" cy="16" r="2" fill="#ffd23a"/></svg></div>`:''}</div>
        <b>${name}</b><small>${sub}</small>
        ${here?`<svg class="flag" viewBox="0 0 30 40"><line x1="4" y1="4" x2="4" y2="38" stroke="#7a4a20" stroke-width="3"/><path d="M5 5 L28 10 L5 18z" fill="#e0402a"/><circle cx="4" cy="4" r="3" fill="#ffb000"/></svg>`:''}</button>`; }).join('')}
    <button class="evloc" data-fest><div class="medal" style="background-image:url(${src(festTheme().img)})"></div><b>${festTheme().name}</b><small>⏰ ${fmtDays(evLeft())}</small></button>
    ${!chOpen ? `<div class="chlock"><b>레벨 ${CH_LV(ch)}부터 ${ch === 2 ? '배를 타고 건너갈' : ch === 3 ? '산맥을 넘어갈' : '하늘 배를 타고 갈'} 수 있어요</b></div>` : ''}
  </div></div>`;
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  root.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => openMap(+b.dataset.ch));
  root.querySelector('[data-fest]').onclick = () => { closeModal(); openEvent(); };
  root.querySelector('.worldmap').addEventListener('pointerdown', e => { if (e.target.classList.contains('worldmap')) closeModal(); });
  root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const k = b.dataset.go;
    if (k !== 'home' && S.level < REGIONS[k].lv){ toast(`레벨 ${REGIONS[k].lv}이 되면 갈 수 있어요`); return; }
    closeModal(); if (S.where !== k) enter(k); });
}

/* 설정: 소리(누구나) + 교사 설정(비밀번호로 잠금 가능) */
const CFG_FIELDS = [
  ['수업 속도', [['regenMinutes','에너지 1 충전 시간(분)',.1,.5], ['energyBase','1레벨 최대 에너지',10,10], ['energyPerLevel','레벨마다 늘어나는 최대 에너지',0,1],
    ['napEnergy','텐트 낮잠 에너지',0,5], ['napHours','낮잠 대기 시간(시간)',0,.5], ['prodSpeed','요리·제작 시간 배율 (0.5 = 두 배 빠름)',.05,.1]]],
  ['보상', [['coinMul','코인 보상 배율 (미션·주문·과제·상자)',0,.1], ['xpMul','경험치 배율',0,.1], ['levelUpGems','레벨업 보석',0,1],
    ['regionClearGems','지역 완료 보석',0,1], ['regionClearCoins','지역 완료 코인',0,50], ['giftHours','일일 선물 간격(시간)',1,1]]],
  ['지역·축제', [['chapter2Level','2장 개방 레벨',1,1], ['chapter3Level','3장 개방 레벨',1,1], ['chapter4Level','4장 개방 레벨',1,1], ['eventLevel','축제 참가 레벨',1,1], ['eventDays','축제 한 회 기간(일)',1,1]]],
];
const CFG_KEYS = CFG_FIELDS.flatMap(([, f]) => f.map(x => x[0]));
let teacherOpen = false;   // 이번 접속에서 비밀번호를 맞혔는지
const pinHash = pin => hashKey('daram-pin:' + pin);
const cfgCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(Object.fromEntries(CFG_KEYS.filter(k => CONFIG[k] !== CONFIG_DEFAULT[k]).map(k => [k, CONFIG[k]]))))));
function readCfgCode(code){
  try { const o = JSON.parse(decodeURIComponent(escape(atob(code.trim())))), out = {};
    for (const k of CFG_KEYS) if (typeof o[k] === 'number' && isFinite(o[k])) out[k] = o[k];
    return out; } catch(e){ return null; }
}
function applyCfg(obj){ S.cfg = {...S.cfg, ...obj}; Object.assign(CONFIG, CONFIG_DEFAULT, S.cfg); applyChapterLevels(); save(); updateTimer(); updateHUD(); }
// 학급 링크(주소 끝 #cfg=코드)로 들어오면 선생님 설정을 적용
function applyClassLink(){
  const m = (location.hash || '').match(/cfg=([A-Za-z0-9+/=%]+)/); if (!m) return;
  const o = readCfgCode(decodeURIComponent(m[1])); if (!o) return;
  S.cfg = {...S.cfg, ...o}; Object.assign(CONFIG, S.cfg); setTimeout(() => toast('선생님이 정한 학급 설정을 적용했어요'), 1500);
}
function openSettings(){
  const vol = Math.round((S.vol == null ? .7 : S.vol) * 100);
  const sound = `<h3 class="subh">🔊 소리</h3>
    <div class="setrow"><span>효과음</span><button class="gbtn ${S.sound?'':'red'}" id="sndBtn">${S.sound?'켜짐':'꺼짐'}</button></div>
    <div class="setrow"><span>배경음악<br><span class="hint">캠프·지역·축제마다 곡이 달라요</span></span><button class="gbtn ${S.music?'':'red'}" id="bgmBtn">${S.music?'켜짐':'꺼짐'}</button></div>
    <div class="setrow"><span>음량 <b id="volV">${vol}</b></span><input type="range" id="volR" min="0" max="100" step="5" value="${vol}" style="width:150px"></div>`;
  const locked = S.pinHash && !teacherOpen;
  const teacher = locked
    ? `<h3 class="subh">🔒 교사 설정</h3><div class="setrow"><span>교사 비밀번호</span><span><input type="password" id="pinIn" inputmode="numeric" maxlength="8" style="width:90px;font-size:16px;padding:4px 6px;border-radius:8px;border:2px solid var(--paper-d)"> <button class="gbtn" id="pinOk">열기</button></span></div>`
    : `<h3 class="subh">🧑‍🏫 교사 설정</h3>` + CFG_FIELDS.map(([title, f]) => `<div class="hint" style="margin-top:8px;font-weight:bold">${title}</div>` +
        f.map(([k, label, min, step]) => `<div class="setrow"><span>${label}${CONFIG[k] !== CONFIG_DEFAULT[k] ? ' <em style="color:#c0392b;font-style:normal">●</em>' : ''}</span>
          <input type="number" data-cfg="${k}" min="${min}" step="${step}" value="${CONFIG[k]}"></div>`).join('')).join('') + `
      <div class="row-btns"><button class="gbtn" id="saveCfg">설정 저장</button><button class="gbtn blue" id="defCfg">기본값으로</button></div>
      <h3 class="subh">📋 학급에 같은 설정 나누기</h3>
      <p class="hint">아래 <b>설정 코드</b>를 복사해 학생 기기의 이 칸에 붙여 넣거나, <b>학급 링크</b>로 접속하게 하면 같은 설정이 적용돼요. (진행 기록은 옮겨지지 않아요)</p>
      <div class="setrow"><input id="codeBox" value="${cfgCode()}" style="flex:1;font-size:13px;padding:6px;border-radius:8px;border:2px solid var(--paper-d)"><button class="gbtn" id="codeCopy">복사</button></div>
      <div class="row-btns"><button class="gbtn blue" id="codeApply">붙여 넣은 코드 적용</button><button class="gbtn" id="linkCopy">학급 링크 복사</button></div>
      <h3 class="subh">🔑 교사 비밀번호</h3>
      <div class="setrow"><span>${S.pinHash ? '비밀번호가 걸려 있어요' : '비밀번호를 걸면 학생이 교사 설정을 바꿀 수 없어요'}</span>
        <span><input type="password" id="pinNew" inputmode="numeric" maxlength="8" placeholder="숫자 4~8자리" style="width:110px;font-size:15px;padding:4px 6px;border-radius:8px;border:2px solid var(--paper-d)"> <button class="gbtn" id="pinSet">${S.pinHash ? '바꾸기' : '걸기'}</button>${S.pinHash ? ' <button class="gbtn red" id="pinDel">풀기</button>' : ''}</span></div>`;
  const body = sound + teacher + `
    <div class="row-btns" style="margin-top:14px"><button class="gbtn red" id="resetAll">처음부터 다시</button></div>
    <p class="hint" style="margin-top:14px">진행 상황은 이 기기 브라우저에만 저장돼요. 이름·사진 같은 개인정보는 저장하지 않아요. '처음부터 다시'를 해도 교사 설정과 비밀번호는 남아요.<br>그림: Canva AI 이미지 생성으로 제작. 소리: 브라우저에서 즉석 합성.</p>`;
  showModal('설정', body);
  const $ = id => document.getElementById(id), on = (id, f) => { const b = $(id); if (b) b.onclick = f; };
  on('sndBtn', () => { S.sound = !S.sound; audio(); setVolume(); save(); openSettings(); });
  on('bgmBtn', () => { S.music = !S.music; audio(); setVolume(); if (S.music) playMusic(songFor(S.where)); else stopMusic(); save(); openSettings(); });
  $('volR').oninput = e => { S.vol = e.target.value / 100; $('volV').textContent = e.target.value; audio(); setVolume(); save(); };
  on('pinOk', () => { if (pinHash($('pinIn').value) === S.pinHash){ teacherOpen = true; openSettings(); } else { sfx('no'); toast('비밀번호가 달라요'); } });
  on('saveCfg', () => { const o = {};
    root.querySelectorAll('[data-cfg]').forEach(i => { const f = CFG_FIELDS.flatMap(([, f]) => f).find(x => x[0] === i.dataset.cfg);
      o[i.dataset.cfg] = Math.max(f[2], parseFloat(i.value) || f[2]); });
    applyCfg(o); toast('설정을 저장했어요'); openSettings(); });
  on('defCfg', () => { S.cfg = {}; Object.assign(CONFIG, CONFIG_DEFAULT); applyChapterLevels(); save(); updateTimer(); updateHUD(); toast('기본값으로 되돌렸어요'); openSettings(); });
  const copy = (text, msg) => { const done = () => toast(msg);
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => { $('codeBox').value = text; $('codeBox').select(); toast('복사가 막혀 있어요. 칸의 글자를 직접 복사하세요'); });
    else { $('codeBox').value = text; $('codeBox').select(); toast('칸의 글자를 직접 복사하세요'); } };
  on('codeCopy', () => copy($('codeBox').value, '설정 코드를 복사했어요'));
  on('linkCopy', () => copy(location.href.split('#')[0] + '#cfg=' + encodeURIComponent(cfgCode()), '학급 링크를 복사했어요'));
  on('codeApply', () => { const o = readCfgCode($('codeBox').value); if (!o){ sfx('no'); toast('코드가 올바르지 않아요'); return; }
    S.cfg = {}; applyCfg(o); toast('설정 코드를 적용했어요'); openSettings(); });
  on('pinSet', () => { const v = $('pinNew').value; if (!/^\d{4,8}$/.test(v)){ sfx('no'); toast('숫자 4~8자리로 정해 주세요'); return; }
    S.pinHash = pinHash(v); teacherOpen = false; save(); toast('교사 비밀번호를 걸었어요'); openSettings(); });
  on('pinDel', () => { delete S.pinHash; save(); toast('비밀번호를 풀었어요'); openSettings(); });
  const rb = $('resetAll');   // confirm() 대신 두 번 누르기로 확인
  rb.onclick = () => { if (!rb.dataset.sure){ rb.dataset.sure = 1; rb.textContent = '정말 지워요? 한 번 더 누르기'; return; }
    const keep = {cfg:S.cfg, pinHash:S.pinHash, sound:S.sound, music:S.music, vol:S.vol};
    try { localStorage.removeItem(SAVE_KEY); } catch(e){} S = Object.assign(freshState(), keep); migrate(); closeModal(); enter('home'); };
}

/* ══════════ 버튼 연결·시작 ══════════ */
document.getElementById('bagBtn').onclick = openBag;
document.getElementById('orderBtn').onclick = openOrders;
document.getElementById('marketBtn').onclick = openMarket;
document.getElementById('taskBtn').onclick = openTasks;
document.getElementById('dynBtn').onclick = () => openDynamite(false);
document.getElementById('evAlbum').onclick = openAlbum;
document.getElementById('evShop').onclick = () => openShop(false);
document.getElementById('evGift').onclick = openGift;
document.getElementById('evFest').onclick = openEvent;
document.getElementById('evDecor').onclick = openDecor;
document.getElementById('mapBtn').onclick = () => openMap();
document.getElementById('enPlus').onclick = () => openShop(false);
document.querySelectorAll('[data-shop]').forEach(b => b.onclick = () => openShop(false));
document.getElementById('gearBtn').onclick = openSettings;
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden){ updateTimer(); if (AC) AC.resume(); } else { save(); if (AC) AC.suspend(); } });

(async function start(){
  load(); evCheck(); resize();
  await loadImages();
  tickEnergy();
  enter(S.where && (S.where === 'home' || REGIONS[S.where]) ? S.where : 'home');
  document.getElementById('loading').remove();
  setInterval(updateTimer, 1000); updateTimer();
  requestAnimationFrame(frame);
  let seenIntro = false; try { seenIntro = !!localStorage.getItem(SAVE_KEY + '-intro'); localStorage.setItem(SAVE_KEY + '-intro', '1'); } catch(e){}
  if (!seenIntro){
    showModal('다람 탐험대에 온 것을 환영해요!', `<div class="celebrate"><img src="${src('explorer')}" style="height:150px">
      <p>구름에 덮인 땅을 탐험해요. 나무·바위를 누르면 <b>에너지</b>를 써서 치우고 자원을 얻어요.</p>
      <p>치운 자리 주변의 <b>구름이 걷히며</b> 새 길이 열려요. 숨은 <b>룬 석판 3개</b>를 찾아보세요!</p>
      <p>캠프에서는 <b>밭에 밀을 심고</b>, 닭·소를 키우고, 빵집·대장간에서 물건을 만들어요.</p>
      <p class="hint">화면 끌기: 이동 · 휠/두 손가락: 확대·축소 · 여러 개를 연달아 누르면 순서대로 작업해요</p>
      <div class="row-btns"><button class="gbtn blue" id="goFirst">첫 탐험 떠나기</button><button class="gbtn" data-close>캠프 둘러보기</button></div></div>`);
    document.getElementById('goFirst').onclick = () => { closeModal(); enter('canyon'); };
  }
})();
</script>
