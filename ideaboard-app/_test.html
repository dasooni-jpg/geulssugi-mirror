// ── 가짜 D1 (board_state 버전 잠금 + board_files 테이블 재현) ──
class FakeD1 {
  constructor() { this.row = null; this.files = new Map(); }
  prepare(sql) {
    const self = this;
    const isFiles = sql.includes("board_files");
    return {
      _args: [],
      bind(...a) { this._args = a; return this; },
      async run() {
        if (sql.startsWith("CREATE")) return { meta: {} };
        if (isFiles) {
          if (sql.startsWith("INSERT")) {
            const [id, name, mime, data] = this._args;
            self.files.set(id, { name, mime, data });
            return { meta: { changes: 1 } };
          }
          if (sql.startsWith("DELETE")) {
            const had = self.files.delete(this._args[0]);
            return { meta: { changes: had ? 1 : 0 } };
          }
          throw new Error("unknown files sql: " + sql);
        }
        if (sql.startsWith("INSERT")) {
          if (self.row) throw new Error("UNIQUE constraint failed");
          self.row = { version: 1, data: this._args[0] };
          return { meta: { changes: 1 } };
        }
        if (sql.startsWith("UPDATE")) {
          const [data, version] = this._args;
          if (self.row && self.row.version === version) {
            self.row = { version: version + 1, data };
            return { meta: { changes: 1 } };
          }
          return { meta: { changes: 0 } };
        }
        throw new Error("unknown sql: " + sql);
      },
      async first() {
        if (!sql.startsWith("SELECT")) throw new Error("unknown sql: " + sql);
        if (isFiles) {
          const f = self.files.get(this._args[0]);
          return f ? { name: f.name, mime: f.mime, data: f.data } : null;
        }
        return self.row ? { version: self.row.version, data: self.row.data } : null;
      },
    };
  }
}

const env = { DB: new FakeD1() };
let pass = 0, fail = 0;
const log = document.getElementById("log");
function check(name, cond) {
  if (cond) { pass++; log.insertAdjacentHTML("beforeend", `<div class="p">[PASS] ${name}</div>`); }
  else { fail++; log.insertAdjacentHTML("beforeend", `<div class="f">[FAIL] ${name}</div>`); }
}
async function post(path, body) {
  const r = await worker.fetch(new Request("https://ib.test" + path, { method: "POST", body: JSON.stringify(body || {}), headers: { "Content-Type": "application/json" } }), env);
  return await r.json();
}
async function get(path) {
  const r = await worker.fetch(new Request("https://ib.test" + path), env);
  return { status: r.status, text: await r.text(), headers: r.headers };
}

  check("포트폴리오 조회", r.ok && r.student.name === "민준");
  check("올린 글 모음(P1 포함)", r.posts.some(p => p.text.includes("작품이에요")));
  check("글에 게시판 이름 포함", r.posts.every(p => typeof p.boardTitle === "string"));
  check("받은 좋아요 합계 집계", r.stats.likeTotal >= 1);
  check("통계 개수 일치", r.stats.postCount === r.posts.length && r.stats.commentCount === r.comments.length);

  // 13.8 글 수정
  r = await post("/api/post/update", { auth: S2, postId: P1, text: "남의 글 수정 시도" });
  check("남의 글 수정 거부", !r.ok);
  r = await post("/api/post/update", { auth: S1, postId: P1, text: "수정된 내 작품!" });
  check("자기 글 수정", r.ok && r.post.text === "수정된 내 작품!" && !!r.post.editedAt);
  r = await post("/api/post/update", { auth: T, postId: P1, text: "교사가 고친 글" });
  check("교사는 아무 글이나 수정", r.ok && r.post.text === "교사가 고친 글");
  r = await post("/api/post/create", { auth: S1, boardId: B1, text: "첨부글", files: [{ name: "a.png", data: PNG }, { name: "b.png", data: PNG }] });
  const PE = r.post.id, FE0 = r.post.files[0].id, FE1 = r.post.files[1].id;
  r = await post("/api/post/update", { auth: S1, postId: PE, text: "첨부 하나만 남김", keepFileIds: [FE0] });
  check("수정 시 첨부 일부만 남김", r.ok && r.post.files.length === 1 && r.post.files[0].id === FE0);
  g = await get("/api/file/" + FE1);
  check("제거된 첨부는 삭제됨", g.status === 404);
  g = await get("/api/file/" + FE0);
  check("남긴 첨부는 유지됨", g.status === 200);

  // 13.9 게시판별 좋아요/댓글 켜고 끄기
  r = await post("/api/teacher/board/create", { auth: T, title: "조용한 게시판", allowLikes: false, allowComments: false });
  const B3 = r.board.id;
  r = await post("/api/board", { auth: S1, boardId: B3 });
  check("게시판 플래그 전달", r.board.allowLikes === false && r.board.allowComments === false);
  r = await post("/api/post/create", { auth: S1, boardId: B3, text: "조용한 글" });
  const PQ = r.post.id;
  r = await post("/api/like/toggle", { auth: S1, postId: PQ });
  check("좋아요 끈 게시판은 좋아요 거부", !r.ok);
  r = await post("/api/comment/create", { auth: S1, postId: PQ, text: "댓글" });
  check("댓글 끈 게시판은 댓글 거부", !r.ok);
  r = await post("/api/teacher/board/update", { auth: T, boardId: B3, title: "조용한 게시판", allowLikes: true, allowComments: true });
  check("게시판 수정으로 다시 켜기", r.ok);
  r = await post("/api/like/toggle", { auth: S1, postId: PQ });
  check("다시 켜니 좋아요 됨", r.ok && r.likeCount === 1);

  // 13.10 교사 글엔 좋아요 못 누름 + 교사가 좋아요 수 가감
  r = await post("/api/post/create", { auth: T, boardId: B1, text: "교사 글이에요" });
  const TP = r.post.id;
  r = await post("/api/like/toggle", { auth: S1, postId: TP });
  check("교사 글엔 좋아요 못 누름", !r.ok);
  r = await post("/api/like/adjust", { auth: S1, postId: TP, delta: 1 });
  check("학생은 좋아요 가감 못 함", !r.ok);
  r = await post("/api/like/adjust", { auth: T, postId: TP, delta: 1 });
  check("교사 좋아요 +1", r.ok && r.likeCount === 1);
  r = await post("/api/like/adjust", { auth: T, postId: TP, delta: 1 });
  check("교사 좋아요 +1 또", r.ok && r.likeCount === 2);
  r = await post("/api/like/adjust", { auth: T, postId: TP, delta: -1 });
  check("교사 좋아요 -1", r.ok && r.likeCount === 1);
  await post("/api/like/adjust", { auth: T, postId: TP, delta: -1 });
  r = await post("/api/like/adjust", { auth: T, postId: TP, delta: -1 });
  check("좋아요는 0 밑으로 안 내려감", r.likeCount === 0);
  r = await post("/api/board", { auth: S1, boardId: B1 });
  check("교사 글은 canEdit=학생은 false", r.posts.find(p => p.id === TP).canEdit === false);
  check("교사 글 좋아요수 0 표시", r.posts.find(p => p.id === TP).likeCount === 0);

  // 14. 설정 바꾸기 (마지막에 실행 — 이후 인증이 바뀜)
  r = await post("/api/teacher/settings/save", { auth: T, className: "6학년 1반 아이디어", classCode: "7-1", newPw: "abcd" });
  check("설정 저장(내 비번 변경)", r.ok);
  r = await post("/api/home", { auth: S1 });
  check("옛 학급코드 로그인 무효", !r.ok);
  r = await post("/api/home", { auth: { role: "student", classCode: "7-1", number: 1, pin: "1111" } });
  check("새 학급코드로 접속", r.ok && r.className === "6학년 1반 아이디어");
  r = await post("/api/home", { auth: T });
  check("옛 교사 비번 무효", !r.ok);
  r = await post("/api/home", { auth: { role: "teacher", id: "teacher", pw: "abcd" } });
  check("바뀐 내 비번으로 접속", r.ok);
  r = await post("/api/home", { auth: K });
  check("다른 선생님 비번은 그대로 유효", r.ok && r.me.name === "김쌤");

  // 15. 여러 반(공간) 분리 — 선생님을 새로 만들면 완전히 독립된 반이 생겨야 함
  T.pw = "abcd"; // 14번에서 T(교사)의 비밀번호를 바꿨으므로 이후 요청에 반영
  const spaceStudentsBefore = (await post("/api/home", { auth: T })).students.length;

  r = await post("/api/teacher/register", { name: "박선생", loginId: "park", pw: "park1", mode: "new", className: "9반 아이디어 보드", classCode: "9-9" });
  check("새 반 만들기 등록", r.ok && r.classCode === "9-9" && !!r.inviteCode);
  const X = { role: "teacher", id: "park", pw: "park1" };
  const inviteX = r.inviteCode;

  r = await post("/api/teacher/register", { name: "다른사람", loginId: "park", pw: "xxxx", mode: "new", classCode: "1-1" });
  check("아이디 전체 중복 거부", !r.ok);
  r = await post("/api/teacher/register", { name: "또다른", loginId: "park2", pw: "yyyy", mode: "new", classCode: "9-9" });
  check("학급 코드 전체 중복 거부", !r.ok);
  r = await post("/api/teacher/register", { name: "짧은비번", loginId: "shortpw", pw: "12", mode: "new", classCode: "5-5" });
  check("비번 4자 미만 거부", !r.ok);

  r = await post("/api/home", { auth: X });
  check("새 반은 게시판 0개(분리됨)", r.ok && r.boards.length === 0);
  check("새 반은 학생 0명(분리됨)", r.students.length === 0);
  check("새 반 이름 반영", r.className === "9반 아이디어 보드");

  r = await post("/api/teacher/board/create", { auth: X, title: "9반 게시판" });
  const BX = r.board.id;
  r = await post("/api/teacher/students/save", { auth: X, students: [{ number: 1, name: "하늘", pin: "9191" }] });
  check("새 반 학생 등록", r.ok && r.count === 1);
  const SXhome = await post("/api/home", { auth: X });
  const idHaneul = SXhome.students[0].id;

  r = await post("/api/home", { auth: T });
  check("원래 반은 새 반 게시판이 안 보임", !r.boards.some(b => b.id === BX));
  check("원래 반 학생 수는 그대로", r.students.length === spaceStudentsBefore);
  r = await post("/api/board", { auth: T, boardId: BX });
  check("원래 반 교사가 남의 반 게시판 접근 차단", !r.ok);
  r = await post("/api/board", { auth: X, boardId: B1 });
  check("새 반 교사가 원래 반 게시판 접근 차단", !r.ok);
  r = await post("/api/teacher/portfolio", { auth: T, studentId: idHaneul });
  check("다른 반 학생 포트폴리오 조회 차단", !r.ok);
  r = await post("/api/teacher/portfolio", { auth: X, studentId: idMinjun });
  check("다른 반(원래 반) 학생도 마찬가지로 차단", !r.ok);

  r = await post("/api/login", { role: "student", classCode: "9-9", number: 1, pin: "9191" });
  check("새 반 학생 로그인", r.ok && r.name === "하늘");
  const HX = { role: "student", classCode: "9-9", number: 1, pin: "9191" };
  r = await post("/api/post/create", { auth: HX, boardId: B1, text: "몰래 원래 반에 쓰기 시도" });
  check("다른 반 게시판엔 글 못 씀", !r.ok);
  r = await post("/api/post/create", { auth: HX, boardId: BX, text: "우리반 글" });
  check("자기 반 게시판엔 정상적으로 씀", r.ok);

  r = await post("/api/msg/send", { auth: X, to: "all", text: "9반 공지" });
  check("새 반 전체쪽지 발송", r.ok);
  r = await post("/api/poll", { auth: T });
  check("다른 반 교사는 못 받음", !r.messages.some(m => m.text.includes("9반 공지")));
  r = await post("/api/msg/send", { auth: T, to: String(idHaneul), text: "다른 반 학생에게 몰래" });
  check("다른 반 학생에게 쪽지 발송 차단", !r.ok);

  // 참여 코드로 같은 반에 합류(담임+전담처럼 협업하고 싶을 때)
  r = await post("/api/teacher/register", { name: "이전담", loginId: "lee", pw: "lee12", mode: "join", inviteCode: "nope0000" });
  check("잘못된 참여 코드 거부", !r.ok);
  r = await post("/api/teacher/register", { name: "이전담", loginId: "lee", pw: "lee12", mode: "join", inviteCode: inviteX.toLowerCase() });
  check("참여 코드로 합류(소문자 입력도 허용)", r.ok);
  const L = { role: "teacher", id: "lee", pw: "lee12" };
  r = await post("/api/home", { auth: L });
  check("합류한 선생님은 같은 반 게시판을 봄", r.boards.some(b => b.id === BX));
  check("합류한 선생님 명단에 둘 다 표시", r.teachers.length === 2 && r.teachers.some(t => t.loginId === "park") && r.teachers.some(t => t.loginId === "lee"));
  r = await post("/api/home", { auth: T });
  check("원래 반 선생님 명단엔 영향 없음", r.teachers.every(t => t.loginId !== "park" && t.loginId !== "lee"));

  // ── 게시판 고정 / 순서 바꾸기 (선생님만) ──
  const SNOW = { role: "student", classCode: "7-1", number: 1, pin: "1111" };  // 14번에서 학급 코드가 7-1로 바뀌었음
  r = await post("/api/teacher/board/create", { auth: T, title: "순서-가" });
  const O1 = r.board.id;
  r = await post("/api/teacher/board/create", { auth: T, title: "순서-나" });
  const O2 = r.board.id;
  r = await post("/api/teacher/board/create", { auth: T, title: "순서-다" });
  const O3 = r.board.id;
  r = await post("/api/home", { auth: T });
  const order0 = r.boards.map(b => b.id);
  check("새 게시판은 목록 맨 뒤에 붙음", order0.slice(-3).join() === [O1, O2, O3].join());
  check("처음에는 고정된 게시판이 없음", r.boards.every(b => b.pinned === false));

  const rest = order0.filter(id => id !== O1 && id !== O2 && id !== O3);
  r = await post("/api/teacher/board/reorder", { auth: T, orderedIds: [O3, O2, O1].concat(rest) });
  check("게시판 순서 바꾸기", r.ok);
  r = await post("/api/home", { auth: T });
  check("바꾼 순서대로 보임", r.boards.map(b => b.id).slice(0, 3).join() === [O3, O2, O1].join());
  r = await post("/api/home", { auth: SNOW });
  check("학생 홈에도 같은 순서로 보임", r.boards.map(b => b.id).slice(0, 3).join() === [O3, O2, O1].join());
  r = await post("/api/teacher/board/reorder", { auth: SNOW, orderedIds: [O1] });
  check("학생은 순서를 못 바꿈", !r.ok);
  r = await post("/api/teacher/board/reorder", { auth: T, orderedIds: [O1, O1] });
  check("같은 게시판이 두 번 오면 거부", !r.ok);
  r = await post("/api/teacher/board/reorder", { auth: T, orderedIds: [BX] });
  check("다른 반 게시판 순서는 못 건드림", !r.ok);
  // 일부만 보내도(다른 선생님이 방금 만든 게시판 등) 나머지는 뒤로 밀려 남아 있어야 함
  r = await post("/api/teacher/board/reorder", { auth: T, orderedIds: [O2] });
  check("일부만 보내도 게시판이 사라지지 않음", r.ok);
  r = await post("/api/home", { auth: T });
  check("일부만 보내면 그 게시판이 맨 앞", r.boards[0].id === O2 && r.boards.length === order0.length);

  r = await post("/api/teacher/board/pin", { auth: T, boardId: O1, pinned: true });
  check("게시판 고정하기", r.ok && r.pinned === true);
  r = await post("/api/home", { auth: SNOW });
  check("고정한 게시판이 맨 앞(학생 화면)", r.boards[0].id === O1 && r.boards[0].pinned === true);
  r = await post("/api/teacher/board/pin", { auth: T, boardId: O3, pinned: true });
  r = await post("/api/home", { auth: T });
  check("나중에 고정한 게시판이 더 앞", r.boards.map(b => b.id).slice(0, 2).join() === [O3, O1].join());
  r = await post("/api/teacher/board/pin", { auth: SNOW, boardId: O1, pinned: true });
  check("학생은 고정 못 함", !r.ok);
  r = await post("/api/teacher/board/pin", { auth: T, boardId: BX, pinned: true });
  check("다른 반 게시판은 고정 못 함", !r.ok);
  r = await post("/api/teacher/board/pin", { auth: T, boardId: O1, pinned: false });
  check("고정 풀기", r.ok && r.pinned === false);
  r = await post("/api/home", { auth: T });
  check("고정 풀면 고정 목록에서 빠짐", r.boards[0].id === O3 && r.boards[1].id === O1);

  // ── 실시간 새로고침 신호 (/api/ping) ──
  r = await post("/api/ping", { auth: X });
  check("ping: 버전과 안 읽은 쪽지 수를 돌려줌", r.ok && typeof r.v === "number" && typeof r.unread === "number");
  const V0 = r.v;
  r = await post("/api/board", { auth: X, boardId: BX });
  r = await post("/api/ping", { auth: X });
  check("ping: 보기만 하면 버전 그대로", r.v === V0);
  r = await post("/api/post/create", { auth: HX, boardId: BX, text: "실시간으로 보일 새 아이디어" });
  check("ping: 학생이 새 글을 올림", r.ok);
  r = await post("/api/ping", { auth: X });
  check("ping: 새 글이 올라오면 버전이 올라감", r.v > V0);
  const V1 = r.v;
  r = await post("/api/comment/create", { auth: X, postId: 999999, text: "없는 글에 댓글" });
  check("ping: 없는 글 댓글은 실패", !r.ok);
  r = await post("/api/ping", { auth: X });
  check("ping: 실패한 요청으로는 버전이 안 바뀜", r.v === V1);
  const homeX = await post("/api/home", { auth: X });
  const tidX = homeX.teachers.find(t => t.loginId === "park").id;
  r = await post("/api/msg/send", { auth: HX, to: String(tidX), text: "선생님 질문 있어요" });
  check("ping: 학생이 쪽지를 보냄", r.ok);
  r = await post("/api/ping", { auth: X });
  check("ping: 새 쪽지도 함께 알려 줌", r.unread >= 1 && r.messages.some(m => m.text.includes("질문")));
  r = await post("/api/ping", {});
  check("ping: 로그인 안 하면 거부", !r.ok);

  document.getElementById("summary").textContent =
    `완료: ${pass} PASS / ${fail} FAIL` + (fail === 0 ? " 🎉" : " ⚠️");
} catch (e) {
  document.getElementById("summary").textContent = "오류: " + e.message;
  console.error(e);
}
})();
</script>
</body>
</html>
