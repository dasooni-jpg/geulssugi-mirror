// ── 가짜 D1 (vocab_days / vocab_students2 / vocab_codes 재현) ──
class FakeD1 {
  constructor() { this.days = new Map(); this.students = new Map(); this.codes = new Map(); }
  prepare(sql) {
    const self = this;
    return {
      _args: [],
      bind(...a) { this._args = a; return this; },
      async run() {
        if (sql.startsWith("CREATE")) return { meta: {} };
        if (sql.includes("vocab_days")) {
          if (sql.startsWith("INSERT")) {
            const [day, section, data] = this._args;
            const k = day + "|" + section;
            if (self.days.has(k)) throw new Error("UNIQUE constraint failed");
            self.days.set(k, data);
            return { meta: { changes: 1 } };
          }
          throw new Error("unknown days sql: " + sql);
        }
        if (sql.includes("vocab_codes")) {
          if (sql.startsWith("INSERT")) {
            const [code, section, id] = this._args;
            if (self.codes.has(code)) throw new Error("UNIQUE constraint failed");
            self.codes.set(code, { section, id });
            return { meta: { changes: 1 } };
          }
          if (sql.startsWith("UPDATE")) {
            const [section, code] = this._args;
            const row = self.codes.get(code);
            if (row) row.section = section;
            return { meta: { changes: row ? 1 : 0 } };
          }
          throw new Error("unknown codes sql: " + sql);
        }
        if (sql.includes("vocab_students")) {
          if (sql.startsWith("INSERT OR REPLACE")) {
            const [section, id, data] = this._args;
            self.students.set(section + "|" + id, data);
            return { meta: { changes: 1 } };
          }
          if (sql.startsWith("DELETE")) {
            const [section, id] = this._args;
            const existed = self.students.delete(section + "|" + id);
            return { meta: { changes: existed ? 1 : 0 } };
          }
          throw new Error("unknown students sql: " + sql);
        }
        throw new Error("unknown sql: " + sql);
      },
      async first() {
        if (!sql.startsWith("SELECT")) throw new Error("unknown sql: " + sql);
        if (sql.includes("vocab_days")) {
          const [day, section] = this._args;
          const d = self.days.get(day + "|" + section);
          return d ? { data: d } : null;
        }
        if (sql.includes("vocab_codes")) {
          const [code] = this._args;
          const row = self.codes.get(code);
          return row ? { section: row.section, id: row.id } : null;
        }
        if (sql.includes("vocab_students")) {
          const [section, id] = this._args;
          const d = self.students.get(section + "|" + id);
          return d ? { data: d } : null;
        }
        throw new Error("unknown sql: " + sql);
      },
      async all() {
        if (sql.includes("vocab_days")) {
          const [section, limit] = this._args;
          const rows = [];
          for (const [k, data] of self.days) {
            const [day, sec] = k.split("|");
            if (sec === section) rows.push({ day, data });
          }
          rows.sort((a, b) => (a.day < b.day ? 1 : -1));
          return { results: rows.slice(0, limit) };
        }
        throw new Error("unknown all sql: " + sql);
      },
    };
  }
}

// ── 가짜 Gemini API (학생이 아니라 Worker 만 AI를 호출하는지도 여기서 검증됨) ──
let aiMode = "ok";        // ok | refusal | few | badjson | http500
let aiCalls = 0;          // 호출 횟수
let aiLastUrl = null;     // 마지막 요청 주소(모델명 확인용)
let aiLastBody = null;    // 마지막 요청 본문
let aiSeq = 0;            // 겹치지 않는 가짜 단어 생성용
function fakeWords(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    aiSeq++;
    const w = "word" + aiSeq;
    out.push({ word: w, pronunciation: "wɜːd" + aiSeq, meaning: w + "의 뜻풀이입니다", example: "This sentence has " + w + " in it.", synonym: "syn" + aiSeq, antonym: "ant" + aiSeq });
  }
  return out;
}
const realFetch = globalThis.fetch.bind(globalThis);
globalThis.fetch = async (url, opt) => {
  if (typeof url === "string" && url.includes("generativelanguage.googleapis.com")) {
    aiCalls++;
    aiLastUrl = url;
    aiLastBody = JSON.parse(opt.body);
    if (aiMode === "location")
      return new Response(JSON.stringify({ error: { message: "User location is not supported for the API use." } }), { status: 400 });
    if (aiMode === "http500")
      return new Response(JSON.stringify({ error: { message: "boom" } }), { status: 500 });
    if (aiMode === "refusal")
      return new Response(JSON.stringify({ candidates: [], promptFeedback: { blockReason: "SAFETY" } }), { status: 200 });
    if (aiMode === "badjson")
      return new Response(JSON.stringify({ candidates: [{ content: { parts: [{ text: "이건 JSON이 아님" }] }, finishReason: "STOP" }] }), { status: 200 });
    const n = aiMode === "few" ? 10 : aiMode === "tiny" ? 3 : 24;
    return new Response(JSON.stringify({
      candidates: [{ content: { parts: [{ text: JSON.stringify({ words: fakeWords(n) }) }] }, finishReason: "STOP" }],
    }), { status: 200 });
  }
  return realFetch(url, opt);
};

let pass = 0, fail = 0;
const log = document.getElementById("log");
function check(name, cond) {
  if (cond) { pass++; log.insertAdjacentHTML("beforeend", `<div class="p">[PASS] ${name}</div>`); }
  else { fail++; log.insertAdjacentHTML("beforeend", `<div class="f">[FAIL] ${name}</div>`); }
}
function makeEnv(withKey) {
  return withKey ? { DB: new FakeD1(), GEMINI_API_KEY: "test-key" } : { DB: new FakeD1() };
}
// 가짜 Durable Object 바인딩 — 워커가 AI 호출을 이쪽으로 넘기는지(그리고 어느 지역을 찍는지) 본다.
let proxyCalls = 0, proxyHint = "", proxyEndpoint = "";
function fakeAiProxy() {
  return {
    idFromName(name) { return { name }; },
    get(id, opt) {
      proxyHint = (opt && opt.locationHint) || "";
      return {
        async fetch(url, init) {
          proxyCalls++;
          const call = JSON.parse(init.body);
          proxyEndpoint = call.endpoint;
          // 진짜 DO 처럼, 객체 안에서 Google 을 부른다
          const inst = new AIProxy({}, { GEMINI_API_KEY: "test-key" });
          return inst.fetch(new Request("https://ai-proxy.internal/call", { method: "POST", body: init.body }));
        },
      };
    },
  };
}
let env = makeEnv(true);
async function post(path, body, useEnv) {
  const r = await worker.fetch(new Request("https://v.test" + path, { method: "POST", body: JSON.stringify(body || {}), headers: { "Content-Type": "application/json" } }), useEnv || env);
  return await r.json();
}
async function get(path) {
  const r = await worker.fetch(new Request("https://v.test" + path), env);
  return { status: r.status, text: await r.text() };
}

  // 5-1. 단어 게임 완주 보상 (하루 1번, 서버가 준다)
  r = await post("/api/student/join", { section: "g3", id: DEV1 });
  const coinsBeforeGame = r.data.coins;
  const gdata = r.data;
  gdata.days[today] = Object.assign({}, gdata.days[today], { gamePlayed: true });
  r = await post("/api/student/save", { section: "g3", id: DEV1, data: gdata });
  check("게임 완주 보상 코인 20 지급", r.ok && r.data.coins === coinsBeforeGame + 20);
  r = await post("/api/student/save", { section: "g3", id: DEV1, data: gdata });
  check("같은 날 두 번째 게임은 보상 없음", r.ok && r.data.coins === coinsBeforeGame + 20);

  // 6. 친구: 초대 · 오늘 공부했는지 확인 · 응원
  r = await post("/api/student/join", { section: "g3", id: DEV1 });
  const inviteCode = r.data.code;
  check("내 초대 코드 발급됨", /^[A-Z0-9]{6}$/.test(inviteCode || ""));
  const DEVF = "device-uuid-friend";
  r = await post("/api/student/join", { section: "g1", id: DEVF, nickname: "노란별", dailyGoal: 10 });
  const friendCode = r.data.code;
  check("친구 계정 준비", r.ok && !!friendCode);

  r = await post("/api/friend/add", { section: "g3", id: DEV1, code: inviteCode });
  check("내 코드로는 친구 추가 거부", !r.ok);
  r = await post("/api/friend/add", { section: "g3", id: DEV1, code: "ZZZZZZ" });
  check("없는 코드로 친구 추가 거부", !r.ok);
  r = await post("/api/friend/add", { section: "g3", id: DEV1, code: friendCode });
  check("친구 추가", r.ok && r.nickname === "노란별");
  r = await post("/api/friend/add", { section: "g3", id: DEV1, code: friendCode });
  check("이미 친구면 다시 추가 거부", !r.ok);

  r = await post("/api/friend/list", { section: "g3", id: DEV1 });
  check("친구 목록", r.ok && r.friends.length === 1 && r.friends[0].nickname === "노란별");
  check("친구의 오늘 상태(아직 안 함)", r.friends[0].todayDone === false && r.friends[0].todaySets === 0);
  check("아직 응원 안 한 상태", r.friends[0].cheeredByMe === false);
  check("내 코드도 함께 내려줌", r.myCode === inviteCode);
  check("친구 목록에 남의 단어·오답은 안 내려감", !("wrong" in r.friends[0]) && !("days" in r.friends[0]));

  r = await post("/api/friend/list", { section: "g1", id: DEVF });
  check("서로 친구가 됨(상대 목록에도 나타남)", r.ok && r.friends.length === 1 && r.friends[0].nickname === "파란고래");
  check("상대가 보는 내 오늘 진행(2세트)", r.friends[0].todaySets === 2);

  r = await post("/api/friend/cheer", { section: "g3", id: DEV1, toSection: "g1", toId: DEVF });
  check("응원 보내기", r.ok && r.nickname === "노란별");
  r = await post("/api/friend/cheer", { section: "g3", id: DEV1, toSection: "g1", toId: DEVF });
  check("하루에 두 번 응원은 거부", !r.ok);
  r = await post("/api/friend/list", { section: "g3", id: DEV1 });
  check("응원 뒤 '응원함'으로 바뀜", r.friends[0].cheeredByMe === true);
  r = await post("/api/friend/list", { section: "g1", id: DEVF });
  check("친구가 받은 응원 확인", (r.cheersToday || []).length === 1 && r.cheersToday[0].fromNick === "파란고래");
  r = await post("/api/friend/cheer", { section: "g3", id: DEV1, toSection: "g1", toId: "device-uuid-9999" });
  check("친구가 아닌 사람에게는 응원 거부", !r.ok);

  // 진행 저장이 친구·응원을 지우지 않아야 한다 (친구가 써 준 값이라 서버가 지켜야 함)
  r = await post("/api/student/join", { section: "g1", id: DEVF });
  const fdata = r.data;
  fdata.friends = []; fdata.cheers = [];   // 옛 사본을 들고 있는 기기 흉내
  await post("/api/student/save", { section: "g1", id: DEVF, data: fdata });
  r = await post("/api/friend/list", { section: "g1", id: DEVF });
  check("진행 저장 뒤에도 친구·응원 유지", r.ok && r.friends.length === 1 && (r.cheersToday || []).length === 1);

  // 6b. 친구: 쪽지 보내기
  r = await post("/api/friend/message/send", { section: "g3", id: DEV1, toSection: "g1", toId: DEVF, text: "  오늘도 화이팅!  " });
  check("쪽지 보내기(앞뒤 공백 정리)", r.ok && r.nickname === "노란별");
  r = await post("/api/friend/message/send", { section: "g3", id: DEV1, toSection: "g1", toId: "device-uuid-9999", text: "안녕" });
  check("친구 아닌 사람에게 쪽지 거부", !r.ok);
  r = await post("/api/friend/message/send", { section: "g3", id: DEV1, toSection: "g1", toId: DEVF, text: "   " });
  check("빈 쪽지 거부", !r.ok);
  r = await post("/api/friend/message/send", { section: "g3", id: DEV1, toSection: "g1", toId: DEVF, text: "가".repeat(200) });
  check("긴 쪽지는 60자로 잘림", r.ok);

  r = await post("/api/friend/list", { section: "g1", id: DEVF });
  check("받은 쪽지 목록(최신 순)", r.ok && r.messages.length === 2 && r.messages[0].text.length === 60);
  check("쪽지 내용·보낸이 확인", r.messages[1].text === "오늘도 화이팅!" && r.messages[1].fromNick === "파란고래");
  check("친구 목록에는 쪽지가 안 섞임", !("messages" in r.friends[0]));

  for (let i = 0; i < 3; i++) await post("/api/friend/message/send", { section: "g3", id: DEV1, toSection: "g1", toId: DEVF, text: "쪽지" + i });
  r = await post("/api/friend/message/send", { section: "g3", id: DEV1, toSection: "g1", toId: DEVF, text: "한통더" });
  check("같은 친구에게 하루 5통 넘으면 거부(도배 방지)", !r.ok);

  r = await post("/api/friend/list", { section: "g1", id: DEVF });
  const toDelete = r.messages[r.messages.length - 1].id; // 가장 오래된 쪽지
  r = await post("/api/friend/message/delete", { section: "g1", id: DEVF, messageId: toDelete });
  check("쪽지 삭제", r.ok);
  r = await post("/api/friend/list", { section: "g1", id: DEVF });
  check("삭제 후 개수 확인", r.messages.length === 4 && !r.messages.some(m => m.id === toDelete));

  // 진행 저장이 쪽지도 지우지 않아야 한다
  r = await post("/api/student/join", { section: "g1", id: DEVF });
  const fdata2 = r.data;
  fdata2.messages = [];   // 옛 사본을 들고 있는 기기 흉내
  await post("/api/student/save", { section: "g1", id: DEVF, data: fdata2 });
  r = await post("/api/friend/list", { section: "g1", id: DEVF });
  check("진행 저장 뒤에도 쪽지 유지", r.messages.length === 4);

  r = await post("/api/friend/remove", { section: "g3", id: DEV1, toSection: "g1", toId: DEVF });
  check("친구 삭제", r.ok);
  r = await post("/api/friend/list", { section: "g3", id: DEV1 });
  check("삭제 후 내 목록 비움", r.friends.length === 0);
  r = await post("/api/friend/list", { section: "g1", id: DEVF });
  check("삭제 후 상대 목록에서도 사라짐", r.friends.length === 0);

  // 2-2. 단계(레벨) 다시 선택 — "나의 기록"에서 단계를 바꿔도 코인·기록·친구 관계가 유지되는지
  const DEVX = "device-uuid-movesec";
  const DEVY = "device-uuid-movesec-friend";
  r = await post("/api/student/join", { section: "g2", id: DEVX, nickname: "이동학생" });
  const movedCode = r.data.code;
  // 코인·스티커도 실제로 변경 없이 그대로 옮겨지는지 보려면 기본값(300코인) 말고 다른 값으로 심어야 한다.
  (function seed() {
    const obj = JSON.parse(env.DB.students.get("g2|" + DEVX));
    obj.coins = 777;
    obj.stickerBook.stickers.animal_01 = 3;
    env.DB.students.set("g2|" + DEVX, JSON.stringify(obj));
  })();
  r = await post("/api/student/join", { section: "g1", id: DEVY, nickname: "옆친구" });
  const devyCode = r.data.code;
  r = await post("/api/friend/add", { section: "g2", id: DEVX, code: devyCode });
  check("단계 이동 전 친구 맺기", r.ok);

  r = await post("/api/student/changeSection", { section: "g2", id: DEVX, newSection: "g2" });
  check("같은 단계로는 이동 거부", !r.ok);
  r = await post("/api/student/changeSection", { section: "g2", id: DEVX, newSection: "college" });
  check("없는 단계로 이동 거부", !r.ok);
  r = await post("/api/student/changeSection", { section: "g2", id: "device-uuid-없음", newSection: "g4" });
  check("등록 안 된 학생의 단계 이동 거부", !r.ok);

  r = await post("/api/student/changeSection", { section: "g2", id: DEVX, newSection: "g4" });
  check("단계 이동 성공", r.ok && r.section === "g4" && r.sectionName === "4학년");
  check("이동 후에도 별명·코인·스티커 유지", r.data.nickname === "이동학생" && r.data.coins === 777 && r.data.stickerBook.stickers.animal_01 === 3);
  check("이동 후에도 코드 유지", r.data.code === movedCode);

  r = await post("/api/student/join", { section: "g2", id: DEVX, nickname: "새로시작" });
  check("예전 단계에서는 완전히 새 학생으로 시작(예전 기록이 남아있지 않음)", r.ok && r.data.nickname === "새로시작" && r.data.coins === 300);

  r = await post("/api/parent/view", { code: movedCode });
  check("코드로 열람해도 새 단계로 보임", r.ok && r.sectionName === "4학년");

  r = await post("/api/friend/list", { section: "g1", id: DEVY });
  const movedFriend = r.friends.find(f => f.id === DEVX);
  check("친구 목록에서도 옮긴 새 단계로 보이고 계속 조회됨", !!movedFriend && movedFriend.section === "g4" && movedFriend.sectionName === "4학년");

  r = await post("/api/student/join", { section: "g5", id: DEVX, nickname: "다른자리" });
  check("g5 자리에도 같은 기기로 별개 등록", r.ok);
  r = await post("/api/student/changeSection", { section: "g4", id: DEVX, newSection: "g5" });
  check("이미 존재하는 단계로는 이동 거부(자리 충돌)", !r.ok);

  // 6-1. 스티커 · 골드티켓
  const DEVS = "device-uuid-sticker";
  // 스티커 보유 상태는 서버가 주인이라 API 로는 심을 수 없다 → 가짜 D1 에 직접 넣는다.
  function seedStudent(section, sid, mutate) {
    const k = section + "|" + sid;
    const obj = JSON.parse(env.DB.students.get(k));
    mutate(obj);
    env.DB.students.set(k, JSON.stringify(obj));
  }
  r = await post("/api/student/join", { section: "g5", id: DEVS, nickname: "스티커왕" });
  check("스티커 학생 등록", r.ok && r.data.stickerBook && r.data.stickerBook.goldTickets === 0);

  r = await post("/api/sticker/book", { section: "g5", id: DEVS });
  check("도감 조회(36종)", r.ok && r.stickers.length === 36 && r.stickers.every(x => !x.is_unlocked));

  r = await post("/api/sticker/buy", { section: "g5", id: DEVS, stickerId: "animal_01" });
  check("스티커 구매(60코인)", r.ok && r.data.coins === 240 && r.data.stickerBook.stickers.animal_01 === 1);
  r = await post("/api/sticker/buy", { section: "g5", id: DEVS, stickerId: "animal_01" });
  check("이미 가진 스티커 재구매 거부", !r.ok);

  // 골드티켓: 같은 스티커 10장 → 티켓 1장 (도감 보관용 1장은 남는다)
  seedStudent("g5", DEVS, o => { o.stickerBook.stickers.animal_01 = 9; });
  r = await post("/api/sticker/ticket/make", { section: "g5", id: DEVS, stickerId: "animal_01" });
  check("9장으로는 골드티켓 교환 거부", !r.ok);
  seedStudent("g5", DEVS, o => { o.stickerBook.stickers.animal_01 = 10; });
  r = await post("/api/sticker/ticket/make", { section: "g5", id: DEVS, stickerId: "animal_01" });
  check("10장 → 골드티켓 1장(도감용 1장 남음)", r.ok && r.data.stickerBook.goldTickets === 1 && r.data.stickerBook.stickers.animal_01 === 1);
  r = await post("/api/sticker/ticket/make", { section: "g5", id: DEVS, stickerId: "존재하지않음" });
  check("없는 스티커 교환 거부", !r.ok);

  r = await post("/api/sticker/ticket/use", { section: "g5", id: DEVS, stickerId: "animal_01" });
  check("이미 가진 스티커에 골드티켓 사용 거부", !r.ok);
  r = await post("/api/sticker/ticket/use", { section: "g5", id: DEVS, stickerId: "ocean_12" });
  check("골드티켓으로 가장 비싼 스티커도 코인 없이 획득", r.ok && r.data.stickerBook.stickers.ocean_12 === 1 && r.data.stickerBook.goldTickets === 0 && r.data.coins === 240);
  r = await post("/api/sticker/ticket/use", { section: "g5", id: DEVS, stickerId: "ocean_11" });
  check("티켓 없으면 사용 거부", !r.ok);

  // 티켓으로 페이지를 완성하면 완성 보상도 나온다
  seedStudent("g5", DEVS, o => {
    for (let i = 1; i <= 11; i++) o.stickerBook.stickers["ocean_" + String(i).padStart(2, "0")] = 1;
    delete o.stickerBook.stickers.ocean_12;
    o.stickerBook.goldTickets = 1;
  });
  r = await post("/api/sticker/ticket/use", { section: "g5", id: DEVS, stickerId: "ocean_12" });
  check("티켓으로 도감 완성 시 500코인 보상", r.ok && r.pageRewards.length === 1 && r.data.coins === 740);

  // 진행 저장(학생 기기 사본)으로는 티켓/스티커를 조작할 수 없다
  r = await post("/api/student/join", { section: "g5", id: DEVS });
  const sdata = r.data;
  sdata.stickerBook = { stickers: {}, mileage: 0, goldTickets: 99, badges: [], completedPages: {} };
  await post("/api/student/save", { section: "g5", id: DEVS, data: sdata });
  r = await post("/api/sticker/book", { section: "g5", id: DEVS });
  check("진행 저장으로 골드티켓 조작 불가", r.ok && r.data.stickerBook.goldTickets === 0 && r.data.stickerBook.stickers.ocean_12 === 1);

  // 7. 없는 주소
  r = await post("/api/what", {});
  check("없는 API 주소 404", !r.ok);

} catch (e) {
  fail++;
  log.insertAdjacentHTML("beforeend", `<div class="f">[ERROR] ${e && e.stack || e}</div>`);
}
const s = document.getElementById("summary");
s.textContent = `PASS ${pass} / FAIL ${fail}` + (fail === 0 ? " — 전부 통과 ✅" : " ❌");
s.style.color = fail === 0 ? "green" : "red";
})();
</script>
</body>
</html>
